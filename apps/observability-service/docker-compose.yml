# Observability Stack - Alice Enterprise Platform
# 
# Stack SEPARADO e INDEPENDENTE para garantir monitoramento
# mesmo se o sistema principal travar.
#
# Componentes:
# - Prometheus 3.0: Coleta de métricas (Apache 2.0)
# - Grafana OSS: Dashboards e alertas (AGPL 3.0)
# - Jaeger: Distributed tracing (Apache 2.0)
# - OpenTelemetry Collector: Instrumentação (Apache 2.0)
# - Langfuse: Métricas LLM específicas (MIT)
#
# Documentação PT-BR (Regra 10 CLAUDE.md)

version: '3.8'

services:
  # ============================================================================
  # PROMETHEUS - Coleta de métricas
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: alice-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # GRAFANA - Portal Unificado de Observabilidade (Single Pane of Glass)
  # URL única: https://observabilidade.yesyoudeserve.duckdns.org
  # ============================================================================
  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: alice-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-alice2025}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://observabilidade.yesyoudeserve.duckdns.org
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/00-home.json
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel,yesoreyeram-infinity-datasource
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_FEATURE_TOGGLES_ENABLE=tempoSearch,traceQLStreaming,correlations
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # ALERTMANAGER - Notificações de alertas
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alice-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alertmanager.yesyoudeserve.duckdns.org'
      - '--cluster.listen-address='
    environment:
      - SMTP_HOST=${SMTP_HOST:-smtp.resend.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=${SMTP_FROM:-alertas@alice.yesyoudeserve.duckdns.org}
      - SMTP_USERNAME=${SMTP_USERNAME:-resend}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALERT_EMAIL=${ALERT_EMAIL:-ops@yesyoudeserve.duckdns.org}
      - CRITICAL_EMAIL=${CRITICAL_EMAIL:-critical@yesyoudeserve.duckdns.org}
      - ONCALL_EMAIL=${ONCALL_EMAIL:-oncall@yesyoudeserve.duckdns.org}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_WEBHOOK_TOKEN=${SLACK_WEBHOOK_TOKEN}
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # JAEGER - Distributed tracing
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: alice-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14268:14268"   # Collector HTTP
      - "6831:6831/udp" # Thrift UDP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # OPENTELEMETRY COLLECTOR - Instrumentação unificada
  # ============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: alice-otel-collector
    restart: unless-stopped
    ports:
      - "4319:4317"     # OTLP gRPC (apps -> collector)
      - "4320:4318"     # OTLP HTTP (apps -> collector)
      - "8888:8888"     # Prometheus metrics exposed by collector
      - "8889:8889"     # Prometheus exporter metrics
    volumes:
      - ./config/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks:
      - observability
    depends_on:
      - jaeger
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # LANGFUSE - Métricas específicas para LLM
  # ============================================================================
  langfuse-db:
    image: postgres:16-alpine
    container_name: alice-langfuse-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:-langfuse2025}
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    networks:
      - observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  langfuse:
    image: langfuse/langfuse:2
    container_name: alice-langfuse
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse2025}@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_AUTH_SECRET:-alice-langfuse-secret-2025}
      - NEXTAUTH_URL=https://llm-metrics.yesyoudeserve.duckdns.org
      - SALT=${LANGFUSE_SALT:-alice-langfuse-salt-2025}
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
    networks:
      - observability
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # NODE EXPORTER - Métricas de infraestrutura (CPU, memória, disco, rede)
  # Host networking para Hetzner Cloud - coleta métricas reais do host
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: alice-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
      - '--collector.netclass.ignored-devices=^(veth.*|docker.*|br-.*)$$'
      - '--collector.netdev.device-exclude=^(veth.*|docker.*|br-.*)$$'
      - '--web.listen-address=:9100'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================================
  # CADVISOR - Métricas de containers Docker
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: alice-cadvisor
    restart: unless-stopped
    ports:
      - "9101:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # HEALTH CHECK SERVICE - API para status do stack
  # ============================================================================
  health-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alice-observability-health
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - LOG_LEVEL=info
      # URLs internas (dentro do docker network)
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - JAEGER_URL=http://jaeger:16686
      - LANGFUSE_URL=http://langfuse:3000
      # URLs externas (para resposta da API /urls)
      - PROMETHEUS_EXTERNAL_URL=${PROMETHEUS_EXTERNAL_URL:-https://prometheus.yesyoudeserve.duckdns.org}
      - GRAFANA_EXTERNAL_URL=${GRAFANA_EXTERNAL_URL:-https://observability.yesyoudeserve.duckdns.org}
      - JAEGER_EXTERNAL_URL=${JAEGER_EXTERNAL_URL:-https://tracing.yesyoudeserve.duckdns.org}
      - LANGFUSE_EXTERNAL_URL=${LANGFUSE_EXTERNAL_URL:-https://llm-metrics.yesyoudeserve.duckdns.org}
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      langfuse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  observability:
    driver: bridge
    name: alice-observability

volumes:
  prometheus_data:
    name: alice-prometheus-data
  grafana_data:
    name: alice-grafana-data
  jaeger_data:
    name: alice-jaeger-data
  langfuse_db_data:
    name: alice-langfuse-db-data
  alertmanager_data:
    name: alice-alertmanager-data
