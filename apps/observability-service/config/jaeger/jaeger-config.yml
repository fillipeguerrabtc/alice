# =============================================================================
# Jaeger v2 Configuration - Alice Enterprise Platform
# =============================================================================
# 
# Configuração YAML para Jaeger v2.13.0 com Badger storage persistente
# 
# ENTERPRISE 28/12/2025: Migração de environment variables (v1) para YAML (v2)
# - Jaeger v2 usa arquitetura OpenTelemetry Collector
# - Badger storage requer configuração via YAML (environment variables não suportadas)
# - Persistência garantida: ephemeral=false + diretórios dedicados
# 
# Ref: https://www.jaegertracing.io/docs/2.13/deployment/
# Ref: https://www.jaegertracing.io/docs/2.13/configuration/
# 
# Autor: Fillipe Guerra
# Data: 28 de Dezembro de 2025
# =============================================================================

# ===========================================================================
# SERVICE - Configuração principal do pipeline
# ===========================================================================
service:
  extensions: [healthcheckv2, jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

# ===========================================================================
# EXTENSIONS - Storage e Query
# ===========================================================================
extensions:
  # Health check v2 (porta 13133 - padrão OTel Collector)
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133

  # Jaeger Storage - Badger (persistência local)
  # ENTERPRISE: ephemeral=false garante persistência após restart
  jaeger_storage:
    backends:
      badger_main:
        badger:
          directories:
            # Diretórios persistidos via volume Docker
            keys: /badger/key
            values: /badger/data
          ephemeral: false
          # Retenção é gerenciada externamente; Badger v2 não aceita TTL/index_cache_size
          read_only: false

  # Jaeger Query - UI e API de consulta
  jaeger_query:
    storage:
      traces: badger_main
      traces_archive: ""

# ===========================================================================
# RECEIVERS - Entrada de dados (OTLP habilitado por padrão em v2)
# ===========================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Configurações enterprise para alta carga
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

# ===========================================================================
# PROCESSORS - Processamento de spans
# ===========================================================================
processors:
  # Batch processor para melhor performance e eficiência
  batch:
    send_batch_size: 10000
    timeout: 1s
    send_batch_max_size: 10000

# ===========================================================================
# EXPORTERS - Saída para storage
# ===========================================================================
exporters:
  # Exporter para Badger storage
  jaeger_storage_exporter:
    trace_storage: badger_main
