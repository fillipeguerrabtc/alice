# Prometheus Configuration - Alice Enterprise Platform
#
# Configuração de scrape para todos os microserviços Alice.
# Métricas específicas para LLM incluídas.
#
# Documentação PT-BR (Regra 10 CLAUDE.md)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'alice-production'
    env: 'production'

# Regras de alerta - MANTIDAS para consulta de métricas
# NOTA 01/01/2026: Alertmanager REMOVIDO - Grafana Alerting assumiu 100%
# Prometheus ainda avalia regras (para recording rules e métricas derivadas)
# mas notificações são gerenciadas pelo Grafana Alerting
rule_files:
  - /etc/prometheus/rules/*.yml

# REMOVIDO 01/01/2026: Alertmanager substituído por Grafana Alerting
# Grafana Alerting oferece UI completa para configuração de alertas
# sem necessidade de container adicional. Ver docs/ARQUITETURA.md
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # ============================================================================
  # PROMETHEUS SELF-MONITORING
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ============================================================================
  # OPENTELEMETRY COLLECTOR
  # ============================================================================
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    metrics_path: /metrics

  # ============================================================================
  # ALICE MICROSERVICES
  # ============================================================================
  - job_name: 'alice-auth-service'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'alice-chat-service'
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: /metrics
    scrape_interval: 15s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'llm_.*'
        action: keep

  - job_name: 'alice-rag-service'
    static_configs:
      - targets: ['host.docker.internal:3003']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'alice-training-service'
    static_configs:
      - targets: ['host.docker.internal:3004']
    metrics_path: /metrics
    scrape_interval: 60s

  - job_name: 'alice-integrations-service'
    static_configs:
      - targets: ['host.docker.internal:3005']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'alice-gpu-manager-service'
    static_configs:
      - targets: ['host.docker.internal:3010']
    metrics_path: /metrics
    scrape_interval: 15s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(alice_circuit_breaker_.*|alice_llm_.*|alice_rag_.*|alice_http_.*)'
        action: keep

  # ============================================================================
  # GPU SERVICES (FastAPI - Arquitetura v4.0.0)
  # NOTA 13/01/2026: Métricas PyTorch/vLLM expostas via /metrics endpoint
  # ============================================================================
  - job_name: 'gpu-qwen-vl'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'qwen-vl'
          gpu_service: 'llm'
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'gpu-embeddings'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'embeddings'
          gpu_service: 'rag'
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'gpu-asr'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          service: 'asr'
          gpu_service: 'transcription'
    metrics_path: /metrics
    scrape_interval: 60s

  # ============================================================================
  # CADDY API GATEWAY (MIGRAÇÃO 02/01/2026)
  # ============================================================================
  - job_name: 'caddy'
    static_configs:
      - targets: ['host.docker.internal:2019']
    metrics_path: /metrics
    scrape_interval: 15s

  # ============================================================================
  # JAEGER - ATUALIZADO 28/12/2025 para v2 (métricas na porta 8888)
  # Ref: https://www.jaegertracing.io/docs/2.13/operations/monitoring/
  # ============================================================================
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:8888']
    metrics_path: /metrics

  # ============================================================================
  # NOTA: Langfuse não expõe endpoint /metrics nativo.
  # Métricas LLM são coletadas via SDK Langfuse nos microserviços Alice.
  # O health-checker expõe métricas de disponibilidade do stack.
  # ============================================================================
  - job_name: 'observability-health'
    static_configs:
      - targets: ['health-checker:3007']
    metrics_path: /metrics
    scrape_interval: 30s

  # ============================================================================
  # ALERTMANAGER REMOVIDO (01/01/2026)
  # Substituído por Grafana Alerting - não há mais container alertmanager
  # ============================================================================

  # ============================================================================
  # NODE EXPORTER - Métricas de infraestrutura (CPU, memória, disco, rede)
  # Exporta: node_cpu_seconds_total, node_memory_*, node_filesystem_*, node_network_*
  # Nota: node_exporter usa host networking para métricas reais do host Hetzner
  # extra_hosts no Prometheus resolve host.docker.internal -> IP do host
  # ============================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'hetzner-primary'
          environment: 'production'
    metrics_path: /metrics
    scrape_interval: 15s

  # ============================================================================
  # CADVISOR - Métricas de containers Docker
  # Exporta: container_cpu_usage_seconds_total, container_memory_usage_bytes
  # ============================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scrape_interval: 15s
