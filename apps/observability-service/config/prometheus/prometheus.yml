# Prometheus Configuration - Alice Enterprise Platform
#
# Configuração de scrape para todos os microserviços Alice.
# Métricas específicas para LLM incluídas.
#
# Documentação PT-BR (Regra 10 CLAUDE.md)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'alice-production'
    env: 'production'

# Regras de alerta - MANTIDAS para consulta de métricas
# NOTA 01/01/2026: Alertmanager REMOVIDO - Grafana Alerting assumiu 100%
# Prometheus ainda avalia regras (para recording rules e métricas derivadas)
# mas notificações são gerenciadas pelo Grafana Alerting
rule_files:
  - /etc/prometheus/rules/*.yml

# REMOVIDO 01/01/2026: Alertmanager substituído por Grafana Alerting
# Grafana Alerting oferece UI completa para configuração de alertas
# sem necessidade de container adicional. Ver docs/ARQUITETURA.md
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # ============================================================================
  # PROMETHEUS SELF-MONITORING
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ============================================================================
  # OPENTELEMETRY COLLECTOR
  # ============================================================================
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    metrics_path: /metrics

  # ============================================================================
  # ALICE MICROSERVICES
  # ============================================================================
  - job_name: 'alice-services'
    static_configs:
      - targets: ['alice-auth:3001']
        labels:
          service: 'auth-service'
          instance: 'alice-prod'
          environment: 'production'
      - targets: ['alice-chat:3002']
        labels:
          service: 'chat-service'
          instance: 'alice-prod'
          environment: 'production'
      - targets: ['alice-rag:3003']
        labels:
          service: 'rag-service'
          instance: 'alice-prod'
          environment: 'production'
      - targets: ['alice-training:3004']
        labels:
          service: 'training-service'
          instance: 'alice-prod'
          environment: 'production'
      - targets: ['alice-integrations:3005']
        labels:
          service: 'integrations-service'
          instance: 'alice-prod'
          environment: 'production'
      - targets: ['alice-gpu-manager:3010']
        labels:
          service: 'gpu-manager-service'
          instance: 'alice-prod'
          environment: 'production'
      - targets: ['alice-biometrics:3011']
        labels:
          service: 'biometrics-service'
          instance: 'alice-prod'
          environment: 'production'
      - targets: ['alice-llm-gateway:3011']
        labels:
          service: 'llm-gateway-service'
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # ============================================================================
  # GPU SERVICES (FastAPI - Gate 2: LLM separado + Embeddings)
  # NOTA 13/01/2026: Métricas PyTorch/vLLM expostas via /metrics endpoint
  # ============================================================================
  - job_name: 'gpu-llm'
    static_configs:
      - targets: ['gpu-llm:8000']
        labels:
          service: 'llm'
          gpu_service: 'llm'
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'gpu-embeddings'
    static_configs:
      - targets: ['gpu-embeddings:8000']
        labels:
          service: 'embeddings'
          gpu_service: 'rag'
    metrics_path: /metrics
    scrape_interval: 30s

  # ============================================================================
  # CADDY API GATEWAY (MIGRAÇÃO 02/01/2026)
  # ============================================================================
  - job_name: 'caddy'
    static_configs:
      - targets: ['alice-caddy:2019']
    metrics_path: /metrics
    scrape_interval: 15s

  # ============================================================================
  # QDRANT - Vetorial texto
  # ============================================================================
  - job_name: 'qdrant'
    static_configs:
      - targets: ['alice-qdrant:6333']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/qdrant_api_key

  # ============================================================================
  # JAEGER - ATUALIZADO 28/12/2025 para v2 (métricas na porta 8888)
  # Ref: https://www.jaegertracing.io/docs/2.13/operations/monitoring/
  # ============================================================================
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:8888']
    metrics_path: /metrics

  - job_name: 'vector'
    static_configs:
      - targets: ['alice-vector:9598']
    metrics_path: '/metrics'

  # ============================================================================
  # NOTA: Langfuse não expõe endpoint /metrics nativo.
  # Métricas LLM são coletadas via SDK Langfuse nos microserviços Alice.
  # O health-checker expõe métricas de disponibilidade do stack.
  # ============================================================================
  - job_name: 'observability-health'
    static_configs:
      - targets: ['health-checker:3007']
    metrics_path: /metrics
    scrape_interval: 30s

  # ============================================================================
  # ALERTMANAGER REMOVIDO (01/01/2026)
  # Substituído por Grafana Alerting - não há mais container alertmanager
  # ============================================================================

  # ============================================================================
  # NODE EXPORTER - Métricas de infraestrutura (CPU, memória, disco, rede)
  # Exporta: node_cpu_seconds_total, node_memory_*, node_filesystem_*, node_network_*
  # Nota: node_exporter usa bind mounts do host (bridge network)
  # ============================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['alice-node-exporter:9100']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: /metrics
    scrape_interval: 15s

  # ============================================================================
  # CADVISOR - Métricas de containers Docker
  # Exporta: container_cpu_usage_seconds_total, container_memory_usage_bytes
  # ============================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['alice-cadvisor:8080']
    metrics_path: /metrics
    scrape_interval: 15s
