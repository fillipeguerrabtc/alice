# Alertmanager Configuration - Alice Enterprise Platform
#
# Configuração de notificações de alertas.
# Integração com email, Slack, PagerDuty.
#
# NOTA: As variáveis ${VAR} são expandidas no entrypoint via envsubst antes de carregar a config.
#
# Documentação PT-BR (Regra 10 CLAUDE.md)

global:
  resolve_timeout: 5m
  # REGRA 6: envsubst não suporta ${VAR:-default} - usar apenas ${VAR}
  # Variáveis devem estar definidas no .env.prod ou ter defaults no environment: do docker-compose
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USERNAME}'
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-receiver'
      repeat_interval: 4h
    - match:
        alertname: CircuitBreakerOpen
      receiver: 'oncall-receiver'
      group_wait: 0s
      repeat_interval: 30m

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          subject: '[Alice] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        html: |
          {{ range .Alerts }}
          <h3>{{ .Labels.alertname }} - {{ .Labels.severity }}</h3>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .EndsAt }}<p><strong>Resolved:</strong> {{ .EndsAt }}</p>{{ end }}
          <hr>
          {{ end }}

  - name: 'critical-receiver'
    email_configs:
      - to: '${CRITICAL_EMAIL}'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .CommonLabels.alertname }} - Ação Imediata Necessária'
        require_tls: true

  - name: 'warning-receiver'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .CommonLabels.alertname }}'

  - name: 'oncall-receiver'
    email_configs:
      - to: '${ONCALL_EMAIL}'
        send_resolved: true
        headers:
          subject: '[ONCALL] Circuit Breaker Aberto - {{ .CommonLabels.name }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

templates: []
