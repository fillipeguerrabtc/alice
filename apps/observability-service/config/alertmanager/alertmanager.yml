# Alertmanager Configuration - Alice Enterprise Platform
#
# Configuração de notificações de alertas via email.
# Usa Gmail SMTP gratuito com App Password para enviar alertas.
#
# INTEGRAÇÃO GMAIL SMTP (30/12/2025):
# - Host SMTP: smtp.gmail.com:587
# - Username: ${SMTP_USER} (email Gmail completo)
# - Password: App Password de 16 caracteres (arquivo /run/secrets/smtp_password)
# - Sender: ${SMTP_FROM} (mesmo email Gmail)
#
# VANTAGENS vs Resend gratuito:
# - Pode enviar para QUALQUER email (clientes, equipe, etc.)
# - 500 emails/dia (conta pessoal) ou 2000/dia (Google Workspace)
# - Remetente é seu próprio email (não "onboarding@resend.dev")
#
# NOTA: As variáveis ${VAR} são expandidas no entrypoint via envsubst antes de carregar.
#
# Ref: https://support.google.com/accounts/answer/185833
# Documentação PT-BR (Regra 10 CLAUDE.md)

global:
  resolve_timeout: 5m
  # Gmail SMTP - username é o email completo, password é App Password
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${SMTP_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning-receiver'
      repeat_interval: 4h
    - match:
        alertname: CircuitBreakerOpen
      receiver: 'oncall-receiver'
      group_wait: 0s
      repeat_interval: 30m

receivers:
  # NOTA: Todos os receivers usam ${ALERT_EMAIL} porque com Resend em modo de
  # desenvolvimento (sem domínio verificado), só podemos enviar para o email
  # verificado na conta Resend (ADMIN_EMAIL). O subject diferencia a severidade.
  - name: 'default-receiver'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          subject: '[Alice] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        html: |
          {{ range .Alerts }}
          <h3>{{ .Labels.alertname }} - {{ .Labels.severity }}</h3>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .EndsAt }}<p><strong>Resolved:</strong> {{ .EndsAt }}</p>{{ end }}
          <hr>
          {{ end }}

  - name: 'critical-receiver'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .CommonLabels.alertname }} - Ação Imediata Necessária'
        require_tls: true
        html: |
          <div style="background:#ff4444;color:white;padding:10px;font-weight:bold;">⚠️ ALERTA CRÍTICO - AÇÃO IMEDIATA NECESSÁRIA</div>
          {{ range .Alerts }}
          <h3 style="color:#cc0000;">{{ .Labels.alertname }} - {{ .Labels.severity }}</h3>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .EndsAt }}<p><strong>Resolved:</strong> {{ .EndsAt }}</p>{{ end }}
          <hr>
          {{ end }}

  - name: 'warning-receiver'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .CommonLabels.alertname }}'
        html: |
          {{ range .Alerts }}
          <h3 style="color:#ff9900;">{{ .Labels.alertname }} - {{ .Labels.severity }}</h3>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .EndsAt }}<p><strong>Resolved:</strong> {{ .EndsAt }}</p>{{ end }}
          <hr>
          {{ end }}

  - name: 'oncall-receiver'
    email_configs:
      - to: '${ALERT_EMAIL}'
        send_resolved: true
        headers:
          subject: '[ONCALL] Circuit Breaker Aberto - {{ .CommonLabels.name }}'
        html: |
          <div style="background:#0066cc;color:white;padding:10px;font-weight:bold;">🔔 ONCALL - Circuit Breaker</div>
          {{ range .Alerts }}
          <h3>{{ .Labels.alertname }} - {{ .Labels.name }}</h3>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .EndsAt }}<p><strong>Resolved:</strong> {{ .EndsAt }}</p>{{ end }}
          <hr>
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

templates: []
