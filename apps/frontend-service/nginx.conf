# Nginx Security Configuration - Alice Enterprise Platform
# Documentação em PT-BR (Regra 10 CLAUDE.md)
# Referência: Nginx 2025 + OWASP Security Headers

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SEGURANÇA: Limite de tamanho de requisição (OWASP Input Validation)
    client_max_body_size 10m;
    
    # SEGURANÇA: Timeouts (prevenir slowloris)
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;

    # SEGURANÇA: Headers de segurança globais (OWASP Secure Headers)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # SEGURANÇA: HSTS (apenas se SSL/TLS termina antes do nginx)
    # Em produção com Traefik terminando SSL, nginx recebe HTTP interno
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # SEGURANÇA: CSP - Content Security Policy
    # NOTA: 'unsafe-inline' em script-src é necessário para React hydration e styled-components
    # Ref: https://vitejs.dev/guide/features.html#content-security-policy-csp
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # SEGURANÇA: Esconder versão do Nginx
    server_tokens off;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # NOTA: Em produção, requisições /api são roteadas pelo Traefik diretamente para os microsserviços.
    # Este bloco existe apenas para desenvolvimento local ou acesso direto ao container.
    # Em produção via Caddy, este location NÃO é atingido.
    # Referência: infra/docker/stacks/docker-compose.alice.yml (Caddy reverse proxy)
    location /api {
        # Retorna 403 Forbidden se acessado diretamente (rejeição intencional - RFC 9110)
        # Caddy roteia /api/* diretamente para alice-auth, alice-chat, etc.
        # NOTA: 403 é semanticamente correto para rejeição intencional (não 502 que indica falha de upstream)
        default_type application/json;
        return 403 '{"error": "Acesso direto à API não permitido. Use o gateway Caddy.", "hint": "Requisições /api devem passar pelo Caddy em produção."}';
    }

    # WebSocket também é roteado pelo Caddy em produção
    location /ws {
        # 403 Forbidden - rejeição intencional conforme RFC 9110 (HTTP Semantics 2025)
        default_type application/json;
        return 403 '{"error": "WebSocket deve ser acessado via Caddy.", "hint": "Requisições /ws devem passar pelo Caddy em produção."}';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    error_page 404 /index.html;
}
