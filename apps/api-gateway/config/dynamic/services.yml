http:
  routers:
    auth-router:
      rule: "PathPrefix(`/api/auth`)"
      service: auth-service
      entryPoints:
        - websecure
      middlewares:
        - rate-limit
        - security-headers
      tls: {}

    chat-router:
      rule: "PathPrefix(`/api/chat`)"
      service: chat-service
      entryPoints:
        - websecure
      middlewares:
        - rate-limit
        - security-headers
        - auth-forward
      tls: {}

    chat-ws-router:
      rule: "PathPrefix(`/ws/chat`)"
      service: chat-service
      entryPoints:
        - websecure
      middlewares:
        - auth-forward
      tls: {}

    rag-router:
      rule: "PathPrefix(`/api/rag`)"
      service: rag-service
      entryPoints:
        - websecure
      middlewares:
        - rate-limit
        - security-headers
        - auth-forward
      tls: {}

    training-router:
      rule: "PathPrefix(`/api/training`)"
      service: training-service
      entryPoints:
        - websecure
      middlewares:
        - rate-limit
        - security-headers
        - auth-forward
      tls: {}

    integrations-router:
      rule: "PathPrefix(`/api/integrations`)"
      service: integrations-service
      entryPoints:
        - websecure
      middlewares:
        - rate-limit
        - security-headers
        - auth-forward
      tls: {}

    integrations-webhook-router:
      rule: "PathPrefix(`/api/integrations/stripe/webhook`)"
      service: integrations-service
      entryPoints:
        - websecure
      middlewares:
        - security-headers
      tls: {}
      priority: 100

    observability-router:
      rule: "PathPrefix(`/api/observability`)"
      service: observability-service
      entryPoints:
        - websecure
      middlewares:
        - rate-limit
        - security-headers
        - auth-forward
      tls: {}

    frontend-router:
      rule: "PathPrefix(`/`)"
      service: frontend-service
      entryPoints:
        - websecure
      middlewares:
        - security-headers
        - compress
      tls: {}
      priority: 1

    health-router:
      rule: "Path(`/health`) || Path(`/api/health`)"
      service: auth-service
      entryPoints:
        - web
        - websecure
      tls: {}

  services:
    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:3001"
        healthCheck:
          path: /api/auth/health
          interval: "30s"
          timeout: "10s"

    chat-service:
      loadBalancer:
        servers:
          - url: "http://chat-service:3002"
        healthCheck:
          path: /api/chat/health
          interval: "30s"
          timeout: "10s"

    rag-service:
      loadBalancer:
        servers:
          - url: "http://rag-service:3003"
        healthCheck:
          path: /api/rag/health
          interval: "30s"
          timeout: "10s"

    training-service:
      loadBalancer:
        servers:
          - url: "http://training-service:3004"
        healthCheck:
          path: /api/training/health
          interval: "30s"
          timeout: "10s"

    integrations-service:
      loadBalancer:
        servers:
          - url: "http://integrations-service:3005"
        healthCheck:
          path: /api/integrations/health
          interval: "30s"
          timeout: "10s"

    observability-service:
      loadBalancer:
        servers:
          - url: "http://observability-health:3007"
        healthCheck:
          path: /health
          interval: "30s"
          timeout: "10s"

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://frontend:8080"

  middlewares:
    # SEGURANÇA: Rate limiting (OWASP API4 - Unrestricted Resource Consumption)
    # IMPORTANTE: Usa IP real do cliente via ipStrategy, NÃO confia em headers spoofáveis
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0  # Usa IP direto da conexão (mais seguro)

    # SEGURANÇA: Headers de segurança enterprise (Traefik v3 + OWASP)
    # NOTA CSP: React/Vite requerem 'unsafe-inline' para styled-components e HMR.
    # Em produção, considerar implementar nonces CSP no build.
    # Ref: https://vitejs.dev/guide/features.html#content-security-policy-csp
    security-headers:
      headers:
        # XSS e Content Type
        browserXssFilter: true
        contentTypeNosniff: true
        # HSTS
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        # Frame Options
        customFrameOptionsValue: "DENY"
        # Referrer Policy
        referrerPolicy: "strict-origin-when-cross-origin"
        # Content Security Policy (CSP) - OWASP
        # NOTA: 'unsafe-inline' em script-src é necessário para React hydration e styled-components
        # 'unsafe-eval' pode ser removido após build otimizado (sem HMR)
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
        # Permissions Policy
        permissionsPolicy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        # Custom Response Headers
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          X-XSS-Protection: "1; mode=block"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Permissions-Policy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    # SEGURANÇA: Auth forward com headers seguros
    auth-forward:
      forwardAuth:
        address: "http://auth-service:3001/api/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - X-User-Id
          - X-User-Role
          - X-Tenant-Id

    compress:
      compress:
        excludedContentTypes:
          - "text/event-stream"

    # SEGURANÇA: CORS restrito (não ['*'] em produção) - OWASP API7
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - X-API-Key
          - X-User-Id
          - X-Tenant-Id
        accessControlAllowOriginList:
          - "https://alice.yesyoudeserve.duckdns.org"
          - "https://api.yesyoudeserve.duckdns.org"
          - "https://erp.yesyoudeserve.duckdns.org"
        accessControlMaxAge: 600
        addVaryHeader: true
        accessControlAllowCredentials: true
