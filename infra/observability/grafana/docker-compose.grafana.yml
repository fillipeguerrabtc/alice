# =============================================================================
# Alice Enterprise Platform - Grafana OSS com SSO via Alice IdP
# =============================================================================
# Documentação: https://grafana.com/docs/grafana/latest/setup-grafana/
#
# Variáveis de Ambiente Obrigatórias:
# - GF_SECURITY_ADMIN_PASSWORD: Senha do admin inicial
# - GF_SECURITY_SECRET_KEY: Secret key para cookies
# - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: Secret do cliente OAuth (banco oauth_clients)
# - GF_DATABASE_PASSWORD: Senha do PostgreSQL para Grafana
# - ALICE_OIDC_ISSUER: URL do issuer Alice (ex: https://yesyoudeserve.duckdns.org)
#
# Uso:
#   docker-compose -f docker-compose.grafana.yml up -d
# =============================================================================

version: "3.8"

services:
  grafana:
    image: grafana/grafana-oss:12.3.1
    container_name: alice-grafana
    restart: unless-stopped
    networks:
      - alice-network
    ports:
      - "3000:3000"
    volumes:
      - ./grafana.ini:/etc/grafana/grafana.ini:ro
      - ./provisioning:/etc/grafana/provisioning:ro
      - ../grafana-dashboard.json:/var/lib/grafana/dashboards/alice-overview.json:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Server
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN:-grafana.yesyoudeserve.duckdns.org}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-https://grafana.yesyoudeserve.duckdns.org}
      
      # Security
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      - GF_SECURITY_SECRET_KEY=${GF_SECURITY_SECRET_KEY:?GF_SECURITY_SECRET_KEY is required}
      
      # Database (PostgreSQL)
      - GF_DATABASE_HOST=${GF_DATABASE_HOST:-postgres:5432}
      - GF_DATABASE_NAME=${GF_DATABASE_NAME:-grafana}
      - GF_DATABASE_USER=${GF_DATABASE_USER:-grafana}
      - GF_DATABASE_PASSWORD=${GF_DATABASE_PASSWORD:?GF_DATABASE_PASSWORD is required}
      - GF_DATABASE_SSL_MODE=${GF_DATABASE_SSL_MODE:-prefer}
      
      # OAuth - Alice IdP
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GF_AUTH_GENERIC_OAUTH_CLIENT_ID:-grafana-sso}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:?GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET is required}
      - ALICE_OIDC_ISSUER=${ALICE_OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}
      
      # SMTP via Gmail para Grafana Alerting (01/01/2026: Alertmanager removido)
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-true}
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GMAIL_USER:-}
      - GF_SMTP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - GF_SMTP_FROM=${GMAIL_USER:-}
      
      # Instalação de plugins
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      # Traefik labels para routing
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  alice-network:
    external: true

volumes:
  grafana-data:
    driver: local
