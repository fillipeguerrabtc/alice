#################################### ALICE ENTERPRISE PLATFORM ####################################
# Configuração Grafana OSS 11.3 com SSO via Alice IdP
# Documentação: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
#
# Variáveis de Ambiente Obrigatórias:
# - GF_SECURITY_ADMIN_PASSWORD: Senha do admin inicial
# - GF_SERVER_ROOT_URL: URL pública do Grafana (ex: https://grafana.yesyoudeserve.duckdns.org)
# - GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana-sso
# - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: (obtido do banco oauth_clients)
# - ALICE_OIDC_ISSUER: URL do issuer Alice (ex: https://yesyoudeserve.duckdns.org)
################################################################################################

#################################### Server ####################################
[server]
# Protocolo (http ou https - TLS é terminado no Traefik)
protocol = http

# Endereço de binding
http_addr = 0.0.0.0

# Porta HTTP
http_port = 3000

# Domínio público
domain = ${GF_SERVER_DOMAIN:-grafana.yesyoudeserve.duckdns.org}

# URL raiz (obrigatório para OAuth callbacks)
root_url = ${GF_SERVER_ROOT_URL:-https://grafana.yesyoudeserve.duckdns.org}

# Enforce domain (segurança)
enforce_domain = false

# Serve from subpath (se necessário)
serve_from_sub_path = false

#################################### Security ####################################
[security]
# Desabilitar criação de admin no primeiro acesso (usamos SSO)
disable_initial_admin_creation = false

# Senha do admin (usar variável de ambiente)
admin_password = ${GF_SECURITY_ADMIN_PASSWORD:-admin}

# Secret key para cookies (usar variável de ambiente)
secret_key = ${GF_SECURITY_SECRET_KEY:-SW2YcwTIb9zpO1H9omAh}

# Cookie seguro (HTTPS em produção)
cookie_secure = true

# Cookie SameSite
cookie_samesite = lax

# CSP - Content Security Policy
content_security_policy = true

# Strict transport security
strict_transport_security = true

# Bloquear embedding (segurança)
allow_embedding = false

# Desabilitar Gravatar (privacidade)
disable_gravatar = true

#################################### Users ####################################
[users]
# Permitir sign up (desabilitado - apenas SSO)
allow_sign_up = false

# Permitir que organizações sejam criadas
allow_org_create = false

# Auto-assign org (primeira organização)
auto_assign_org = true

# Role padrão para novos usuários
auto_assign_org_role = Viewer

# Verificar email (não necessário com SSO)
verify_email_enabled = false

# Login hint
login_hint = Use seu login Alice Enterprise

#################################### Auth ####################################
[auth]
# Desabilitar login form padrão (apenas SSO)
disable_login_form = false

# Desabilitar login signout
disable_signout_menu = false

# OAuth auto login
oauth_auto_login = false

# OAuth allow insecure (não em produção)
oauth_allow_insecure_email_lookup = false

# Sincronizar role do OAuth a cada login
oauth_skip_org_role_update_sync = false

#################################### Auth: Alice SSO (Generic OAuth) ####################################
[auth.generic_oauth]
# Habilitar OAuth
enabled = true

# Nome exibido no botão de login
name = Alice Enterprise

# ID do cliente OAuth (cadastrado no banco oauth_clients)
client_id = ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID:-grafana-sso}

# Secret do cliente OAuth (cadastrado no banco oauth_clients)
client_secret = ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}

# Escopos solicitados
scopes = openid email profile groups roles

# URL de autorização (Alice OIDC Provider)
auth_url = ${ALICE_OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/authorize

# URL de token (Alice OIDC Provider)
token_url = ${ALICE_OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/token

# URL de userinfo (Alice OIDC Provider)
api_url = ${ALICE_OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/userinfo

# TLS: Verificar certificado (sempre true em produção)
tls_skip_verify_insecure = false

# Permitir sign up via OAuth (criar novos usuários)
allow_sign_up = true

# Auto-login (redirecionar direto para OAuth)
auto_login = false

# Role mapping via JMESPath
# Alice roles: super_admin, admin, manager, operator, viewer, guest
# Grafana roles: Admin, Editor, Viewer
role_attribute_path = contains(role[*], 'super_admin') && 'Admin' || contains(role[*], 'admin') && 'Admin' || contains(role[*], 'manager') && 'Editor' || contains(role[*], 'operator') && 'Editor' || 'Viewer'

# Sincronizar role a cada login
role_attribute_strict = false

# Permitir atribuir role de Admin via OAuth
allow_assign_grafana_admin = true

# Skip org role sync (false = sincronizar roles)
skip_org_role_sync = false

# Atributo de email
email_attribute_path = email

# Atributo de login
login_attribute_path = email

# Atributo de nome
name_attribute_path = name

# Grupos (se disponíveis)
groups_attribute_path = groups

# Domínios permitidos (vazio = todos)
allowed_domains =

# Organizações permitidas (vazio = todas)
allowed_organizations =

# Usar PKCE (recomendado para segurança)
use_pkce = true

# Usar refresh token
use_refresh_token = true

# Tempo de vida do access token (segundos)
# access_token_ttl = 3600

#################################### Auth.Proxy (desabilitado) ####################################
[auth.proxy]
enabled = false

#################################### Auth.Basic (desabilitado em produção) ####################################
[auth.basic]
enabled = false

#################################### Auth.Anonymous (desabilitado) ####################################
[auth.anonymous]
enabled = false

#################################### Logging ####################################
[log]
# Modo de log
mode = console

# Nível de log
level = info

# Filtros de log
filters =

#################################### Log Console ####################################
[log.console]
level = info
format = json

#################################### Database ####################################
[database]
# Tipo de banco (usamos PostgreSQL)
type = postgres

# Host do banco (container ou serviço)
host = ${GF_DATABASE_HOST:-postgres}

# Nome do banco
name = ${GF_DATABASE_NAME:-grafana}

# Usuário do banco
user = ${GF_DATABASE_USER:-grafana}

# Senha do banco
password = ${GF_DATABASE_PASSWORD}

# SSL mode
ssl_mode = ${GF_DATABASE_SSL_MODE:-prefer}

#################################### Session ####################################
[session]
# Provider de sessão (database para cluster)
provider = database

# Cookie name
cookie_name = grafana_session

# Lifetime em segundos (7 dias)
cookie_secure = true

# Session max lifetime (7 dias)
session_life_time = 604800

#################################### Analytics (desabilitado) ####################################
[analytics]
# Desabilitar reporting (privacidade)
reporting_enabled = false

# Desabilitar check de updates
check_for_updates = false

# Desabilitar check de plugins
check_for_plugin_updates = false

# Feedback links
feedback_links_enabled = false

#################################### Dashboards ####################################
[dashboards]
# Versões mínimas
versions_to_keep = 20

# Tamanho mínimo do intervalo de refresh
min_refresh_interval = 5s

#################################### Alerting ####################################
[alerting]
# Habilitar alerting unificado
enabled = true

# Executar alertas
execute_alerts = true

#################################### Unified Alerting ####################################
[unified_alerting]
# Habilitar unified alerting
enabled = true

# Intervalo de avaliação mínimo
min_interval = 10s

#################################### SMTP via Gmail (para alertas) ####################################
# NOTA 01/01/2026: Alertmanager REMOVIDO - Grafana Alerting agora envia alertas
# SMTP habilitado via variáveis GF_SMTP_* no docker-compose.prod.yml
# Ref: https://support.google.com/accounts/answer/185833
[smtp]
enabled = ${GF_SMTP_ENABLED:-false}
host = smtp.gmail.com:587
user = ${GMAIL_USER:-}
password = ${GMAIL_APP_PASSWORD:-}
from_address = ${GMAIL_USER:-fillipe.backup@gmail.com}
from_name = Alice Grafana
skip_verify = false
starttls_policy = MandatoryStartTLS

#################################### Feature Toggles ####################################
[feature_toggles]
# Habilitar RBAC
enable = accessControlOnCall topnav

#################################### RBAC ####################################
[rbac]
# Habilitar Role-Based Access Control
permission_cache = true
