# =============================================================================
# Alice Enterprise Platform - Grafana Dashboard Provisioning
# =============================================================================
# Configuração automática de dashboards
# Documentação: https://grafana.com/docs/grafana/latest/dashboards/provisioning/
# =============================================================================

apiVersion: 1

providers:
  - name: 'Alice Enterprise Dashboards'
    orgId: 1
    folder: 'Alice Platform'
    folderUid: 'alice-platform'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
