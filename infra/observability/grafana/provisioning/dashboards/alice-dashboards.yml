# =============================================================================
# Alice Enterprise Platform - Grafana Dashboard Provisioning
# =============================================================================
# Configuração automática de dashboards
# Documentação: https://grafana.com/docs/grafana/latest/dashboards/provisioning/
#
# CORREÇÃO 03/01/2026: Path corrigido para diretório montado via volume
# PROBLEMA: "/var/lib/grafana/dashboards" não existia - diretório não montado.
# SOLUÇÃO: Usar path dentro de /etc/grafana/provisioning (montado via volume)
# Volume: ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
#
# Author: Fillipe Guerra
# Data: 03 de Janeiro de 2026
# =============================================================================

apiVersion: 1

providers:
  # ============================================================================
  # Alice Enterprise Platform - Dashboards por Domínio (Folders)
  # ============================================================================
  # Objetivo: Separar dashboards por tema (Trading, Chat/LLM, RAG, GPU, Infra...)
  # para reduzir ruído, melhorar navegação e suportar personas (SRE/Dev/Business).
  #
  # Documentação (Grafana): https://grafana.com/docs/grafana/latest/dashboards/provisioning/
  #
  # Author: Fillipe Guerra
  # Data: 15 de Janeiro de 2026
  # ============================================================================

  - name: 'Alice - Portal'
    orgId: 1
    folder: 'Alice/Portal'
    folderUid: 'alice-portal'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Mantemos o overview legado em dashboards/json para evitar duplicação.
      path: /etc/grafana/provisioning/dashboards/json

  - name: 'Alice - Chat & LLM'
    orgId: 1
    folder: 'Alice/Chat & LLM'
