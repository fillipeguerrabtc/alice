# =============================================================================
# Alice Enterprise Platform - Grafana Datasources
# =============================================================================
# Configuração automática de TODOS os datasources para Grafana.
# Conecta Prometheus (métricas), Loki (logs) e Jaeger (traces).
#
# CORREÇÃO PR#101 (09/01/2026):
#   Arquivos individuais (prometheus.yml, loki.yml, jaeger.yml) REMOVIDOS
#   porque Grafana carrega TODOS os .yml na pasta de provisioning,
#   causando erro: "Only one datasource per organization can be marked as default"
#
#   Este é o ÚNICO arquivo de datasources - não criar arquivos adicionais!
#
# Documentação PT-BR (Regra 10 CLAUDE.md)
# Author: Fillipe Guerra
# =============================================================================

apiVersion: 1

# Remover datasources existentes para evitar duplicatas
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Jaeger
    orgId: 1

datasources:
  # ===========================================================================
  # PROMETHEUS - Métricas
  # ===========================================================================
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "3.0.1"
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      disableRecordingRules: false
      cacheLevel: 'High'
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    secureJsonFields: {}

  # ===========================================================================
  # LOKI - Logs Agregados
  # ===========================================================================
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          name: TraceID
          url: '$${__value.raw}'
    secureJsonFields: {}

  # ===========================================================================
  # JAEGER - Distributed Tracing
  # ===========================================================================
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      nodeGraph:
        enabled: true
    secureJsonFields: {}
