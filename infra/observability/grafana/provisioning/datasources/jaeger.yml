# =============================================================================
# Alice Enterprise Platform - Grafana Datasource: Jaeger
# =============================================================================
# Configuração automática de datasource Jaeger
# Documentação: https://grafana.com/docs/grafana/latest/datasources/jaeger/
# =============================================================================

apiVersion: 1

deleteDatasources:
  - name: Jaeger
    orgId: 1

datasources:
  # =================================================================
  # CORREÇÃO 03/01/2026: URL hardcoded para Jaeger
  # =================================================================
  # Grafana provisioning NÃO expande variáveis de ambiente em YAML.
  # Containers estão na mesma rede Docker (alice-network).
  # =================================================================
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      nodeGraph:
        enabled: true
    secureJsonFields: {}
