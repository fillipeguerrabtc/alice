# =============================================================================
# Alice Enterprise Platform - Grafana Datasource: Loki
# =============================================================================
# Configuração automática de datasource Loki
# Documentação: https://grafana.com/docs/grafana/latest/datasources/loki/
# =============================================================================

apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: ${LOKI_URL:-http://loki:3100}
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          name: TraceID
          url: '$${__value.raw}'
    secureJsonFields: {}
