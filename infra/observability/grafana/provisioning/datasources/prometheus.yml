# =============================================================================
# Alice Enterprise Platform - Grafana Datasource: Prometheus
# =============================================================================
# Configuração automática de datasource Prometheus
# Documentação: https://grafana.com/docs/grafana/latest/datasources/prometheus/
# =============================================================================

apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  # =================================================================
  # CORREÇÃO 03/01/2026: URL hardcoded para Prometheus
  # =================================================================
  # PROBLEMA: Grafana provisioning NÃO expande variáveis de ambiente
  # em arquivos YAML automaticamente. O erro "parse '': empty url"
  # ocorre porque ${PROMETHEUS_URL:-...} é tratado como string literal.
  # SOLUÇÃO: Usar URL direta - containers estão na mesma rede Docker.
  # Ref: https://github.com/grafana/grafana/issues/48543
  # =================================================================
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "3.0.1"
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      disableRecordingRules: false
      cacheLevel: 'High'
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    secureJsonFields: {}
