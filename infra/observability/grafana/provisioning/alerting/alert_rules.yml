# Grafana Alerting - Alert Rules
#
# Regras de alerta migradas do Prometheus/Alertmanager para Grafana Unified Alerting.
# MIGRAÇÃO 01/01/2026: 15 regras migradas do llm-alerts.yml (12 LLM + 3 Infrastructure)
#
# Ref: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
#
# Author: Fillipe Guerra
# Data: 24 de Janeiro de 2026
# Atualização 24/01/2026: Filtro de buckets antes do histogram_quantile para evitar NaN/NoData.
# Documentação PT-BR (Regra 10 CLAUDE.md)

apiVersion: 1

# =============================================================================
# ALERT RULES - Regras de Alerta
# =============================================================================
# Migradas das seguintes fontes:
# - apps/observability-service/config/prometheus/rules/llm-alerts.yml
# - Grupos: llm_alerts (12 regras) + infrastructure_alerts (3 regras) = 15 total
# =============================================================================

groups:
  # ===========================================================================
  # LLM ALERTS - Alertas específicos para Large Language Models
  # ===========================================================================
  - orgId: 1
    name: LLM Alerts
    folder: Alice Enterprise
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # LATÊNCIA LLM
      # -----------------------------------------------------------------------
      - uid: llm-high-latency
        title: LLM Alta Latência (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(alice_llm_inference_duration_seconds_bucket[5m])) by (le)) and on() (sum(rate(alice_llm_inference_duration_seconds_count[5m])) > 1)
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Alta latência nas requisições LLM"
          description: "P95 de latência está acima de 30s por mais de 5 minutos."
        labels:
          severity: warning
          service: chat-service
      
      - uid: llm-critical-latency
        title: LLM Latência Crítica
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.99, sum(rate(alice_llm_inference_duration_seconds_bucket[5m])) by (le)) and on() (sum(rate(alice_llm_inference_duration_seconds_count[5m])) > 1)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [60]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Latência crítica nas requisições LLM"
          description: "P99 de latência está acima de 60s por mais de 2 minutos."
        labels:
          severity: critical
          service: chat-service

      # -----------------------------------------------------------------------
      # TIME TO FIRST TOKEN (TTFT)
      # -----------------------------------------------------------------------
      - uid: llm-high-ttft
        title: LLM Alto TTFT
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(alice_llm_ttft_seconds_bucket[5m])) by (le)) and on() (sum(rate(alice_llm_ttft_seconds_count[5m])) > 1)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Alto Time to First Token"
          description: "TTFT P95 está acima de 5s - impacto na experiência do usuário."
        labels:
          severity: warning
          service: chat-service

      # -----------------------------------------------------------------------
      # TAXA DE ERROS LLM
      # -----------------------------------------------------------------------
      - uid: llm-high-error-rate
        title: LLM Alta Taxa de Erros
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(rate(alice_llm_requests_total{status="error"}[5m])) or on() vector(0)) / ((sum(rate(alice_llm_requests_total[5m])) or on() vector(0)) + 0.001)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Alta taxa de erros no LLM"
          description: "Taxa de erros acima de 5% nos últimos 5 minutos."
        labels:
          severity: warning
          service: chat-service

      - uid: llm-critical-error-rate
        title: LLM Taxa Crítica de Erros
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(rate(alice_llm_requests_total{status="error"}[5m])) or on() vector(0)) / ((sum(rate(alice_llm_requests_total[5m])) or on() vector(0)) + 0.001)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.15]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Taxa crítica de erros no LLM"
          description: "Taxa de erros acima de 15% - possível problema com GPU Manager Service."
        labels:
          severity: critical
          service: chat-service

      # -----------------------------------------------------------------------
      # CIRCUIT BREAKER
      # -----------------------------------------------------------------------
      - uid: circuit-breaker-open
        title: Circuit Breaker Aberto
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: alice_circuit_breaker_state == bool 1
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Circuit Breaker aberto"
          description: "Circuit breaker está aberto - serviço degradado."
        labels:
          severity: critical

      # -----------------------------------------------------------------------
      # TOKENS E CUSTOS
      # -----------------------------------------------------------------------
      - uid: high-token-usage
        title: Alto Consumo de Tokens
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(increase(alice_llm_tokens_prompt_total[1h])) or on() vector(0)) + (sum(increase(alice_llm_tokens_generated_total[1h])) or on() vector(0))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1000000]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Alto consumo de tokens"
          description: "Mais de 1M tokens consumidos na última hora."
        labels:
          severity: warning
          service: chat-service

      - uid: critical-token-usage
        title: Consumo Crítico de Tokens
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(increase(alice_llm_tokens_prompt_total[1h])) or on() vector(0)) + (sum(increase(alice_llm_tokens_generated_total[1h])) or on() vector(0))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5000000]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Consumo crítico de tokens"
          description: "Mais de 5M tokens consumidos na última hora - verificar custos."
        labels:
          severity: critical
          service: chat-service

      # -----------------------------------------------------------------------
      # RAG SERVICE
      # -----------------------------------------------------------------------
      - uid: rag-high-retrieval-time
        title: RAG Alta Latência de Busca
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(alice_rag_search_duration_seconds_bucket[5m])) by (le) and on() (sum(rate(alice_rag_search_duration_seconds_count[5m])) > 0)) or on() vector(0)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Alta latência na busca RAG"
          description: "P95 de busca vetorial está acima de 3s."
        labels:
          severity: warning
          service: rag-service

      - uid: rag-low-relevance
        title: RAG Baixa Relevância
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: avg(alice_rag_relevance_score) or on() vector(1)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [0.5]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Baixa relevância nos resultados RAG"
          description: "Score médio de relevância abaixo de 0.5 - revisar embeddings."
        labels:
          severity: warning
          service: rag-service

      # -----------------------------------------------------------------------
      # IMAGENS (OpenAI)
      # -----------------------------------------------------------------------
      # NOTA 16/01/2026: Geração e análise via OpenAI
      # Alice gera imagens via gpt-image-1 e analisa via gpt-4.1 (Responses API)
      # Métricas image_generation_* devem refletir o pipeline OpenAI

  # ===========================================================================
  # INFRASTRUCTURE ALERTS - Alertas de Infraestrutura
  # ===========================================================================
  - orgId: 1
    name: Infrastructure Alerts
    folder: Alice Enterprise
    interval: 30s
    rules:
      # -----------------------------------------------------------------------
      # DISPONIBILIDADE DOS SERVIÇOS
      # -----------------------------------------------------------------------
      - uid: service-down
        title: Serviço Indisponível
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{environment!="deploy"} == 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Serviço indisponível"
          description: "Um ou mais serviços estão indisponíveis há mais de 2 minutos."
        labels:
          severity: critical

      # -----------------------------------------------------------------------
      # RECURSOS DO SISTEMA
      # -----------------------------------------------------------------------
      - uid: high-memory-usage
        title: Alto Uso de Memória
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.9]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Alto uso de memória"
          description: "Uso de memória acima de 90% por mais de 5 minutos."
        labels:
          severity: warning

      - uid: high-cpu-usage
        title: Alto Uso de CPU
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Alto uso de CPU"
          description: "Uso de CPU acima de 85% por mais de 5 minutos."
        labels:
          severity: warning

      # -----------------------------------------------------------------------
      # CONTAINER CRASHES (SIGILL/SIGBUS/OOM)
      # -----------------------------------------------------------------------
      # CORREÇÃO 01/01/2026: Detectar containers que crasham frequentemente
      # Isso captura SIGILL (Illegal Instruction), SIGBUS, OOMKilled, etc.
      # Métrica: increase(container_cpu_system_seconds_total) com restart
      # -----------------------------------------------------------------------
      - uid: container-frequent-restarts
        title: Container Reiniciando Frequentemente
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(kube_pod_container_status_restarts_total[15m]) > 0 or increase(container_start_time_seconds{container_label_com_docker_compose_service!=""}[15m]) > 2
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Container reiniciando frequentemente"
          description: "Container reiniciou mais de 2 vezes em 15 minutos. Possíveis causas: SIGILL (incompatibilidade CPU), SIGBUS, OOMKilled. Verificar logs com: docker logs <container>"
        labels:
          severity: critical

      - uid: postgres-unhealthy
        title: PostgreSQL Unhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: pg_up == bool 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "PostgreSQL indisponível"
          description: "PostgreSQL está down. Verificar logs com: docker logs alice-postgres. Possíveis causas: SIGILL (pgvector incompatível), disco cheio, crash de conexões."
        labels:
          severity: critical
          service: postgres

  # ===========================================================================
  # GPU ALERTS - Alertas de GPU (modelo-agnóstico)
  # ===========================================================================
  - orgId: 1
    name: GPU Alerts
    folder: Alice Enterprise
    interval: 30s
    rules:
      - uid: gpu-vram-high
        title: GPU VRAM Alta (Crítico)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: ((sum(alice_gpu_vram_used_bytes) / sum(alice_gpu_vram_total_bytes)) * 100) or on() vector(0)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "GPU VRAM alta (>90%)"
          description: "Uso total de VRAM acima de 90% por 5 minutos. Risco elevado de OOM/restart loop em serviços GPU."
        labels:
          severity: critical
          service: gpu

      - uid: gpu-queue-deep
        title: GPU Fila Profunda (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max by (queue) (alice_gpu_manager_queue_depth) or on() vector(0)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Fila do GPU Manager profunda (>10)"
          description: "Alguma fila (llm/embeddings/asr/training) está acima de 10 itens por 2 minutos."
        labels:
          severity: warning
          service: gpu-manager

  # ===========================================================================
  # TRADING ALERTS - KuCoin / Trading (produção pronta)
  # ===========================================================================
  - orgId: 1
    name: Trading Alerts
    folder: Alice Enterprise
    interval: 30s
    rules:
      - uid: kucoin-breaker-open
        title: KuCoin Circuit Breaker OPEN (Crítico)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: alice_circuit_breaker_state{name="kucoin_futures"} == bool 1
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "KuCoin indisponível (circuit breaker OPEN)"
          description: "Circuit breaker de KuCoin Futures está OPEN por 2 minutos. Trading pode ficar indisponível."
        labels:
          severity: critical
          service: integrations-service

      - uid: kucoin-high-latency
        title: KuCoin Alta Latência (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(alice_integration_call_duration_seconds_bucket{integration="kucoin"}[5m])) by (le) and on() (sum(rate(alice_integration_call_duration_seconds_count{integration="kucoin"}[5m])) > 0)) or on() vector(0)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "KuCoin alta latência (P95)"
          description: "Latência P95 das chamadas KuCoin acima de 1s por 5 minutos."
        labels:
          severity: warning
          service: integrations-service

      - uid: kucoin-high-error-rate
        title: KuCoin Alta Taxa de Erros (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: (sum(rate(alice_integration_calls_total{integration="kucoin",status="error"}[5m])) or on() vector(0)) / ((sum(rate(alice_integration_calls_total{integration="kucoin"}[5m])) or on() vector(0)) + 0.001)
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "KuCoin alta taxa de erros"
          description: "Taxa de erros das chamadas KuCoin acima de 10% por 5 minutos (inclui HTTP 429/5xx, timeout, breaker open)."
        labels:
          severity: warning
          service: integrations-service

  # ===========================================================================
  # TRAINING PIPELINE ALERTS
  # ===========================================================================
  - orgId: 1
    name: Training Pipeline Alerts
    folder: Alice Enterprise
    interval: 30s
    rules:
      - uid: training-no-new-samples
        title: Training sem novos dados (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(alice_training_data_collected_total[6h]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 6h
        annotations:
          summary: "Sem novos dados de treinamento"
          description: "Nenhum dado novo foi coletado nas últimas 6 horas. Verifique pipelines de chat/RAG/trading."
        labels:
          severity: warning
          service: training-service

      - uid: training-scheduler-errors
        title: Erros no Scheduler de Auto-learning (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              # CORREÇÃO 11/02/2026: Usar rate ao invés de increase para normalizar
              # e comparar com threshold > 5 para tolerar erros transientes isolados
              expr: sum(increase(alice_training_scheduler_runs_total{result="error"}[30m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    # CORREÇÃO 11/02/2026: Threshold de 0→5 para tolerar erros transientes
                    # (ex: reconexão BD momentânea). Scheduler roda a cada 60s, então
                    # 5 erros em 30min indica problema persistente, não transiente
                    params: [5]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Falhas no scheduler de auto-learning"
          description: "O scheduler registrou mais de 5 falhas nos últimos 30 minutos. Verifique conexão com BD e logs do training-service."
        labels:
          severity: warning
          service: training-service

      - uid: training-high-auto-reject
        title: Training Alta Taxa de Auto-rejeição (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (sum(increase(alice_training_data_rejected_total[1h])) / sum(increase(alice_training_data_collected_total[1h]))) > 0.6
                and sum(increase(alice_training_data_collected_total[1h])) > 10
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
              refId: C
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "Alta taxa de auto-rejeição de dados de training"
          description: "Mais de 60% dos dados coletados foram auto-rejeitados na última hora."
        labels:
          severity: warning
          service: training-service

