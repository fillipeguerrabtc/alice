# Promtail - Coleta de logs do host para Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

  # ============================================================================
  # DOCKER CONTAINERS LOGS (Alice/Infra/Observability)
  # ============================================================================
  # Objetivo: coletar logs reais dos containers (json-file driver) para Loki.
  #
  # Segurança:
  # - NÃO usa Docker socket (evita privilégio excessivo).
  # - Lê apenas arquivos de log via bind mount read-only.
  #
  # Referência (promtail pipeline stages):
  # - https://grafana.com/docs/loki/latest/send-data/promtail/stages/docker/
  # - https://grafana.com/docs/loki/latest/send-data/promtail/stages/json/
  # ============================================================================
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # Extrai "log"/"stream"/"time" do json-file do Docker e ajusta timestamp.
      - docker: {}
      # Parseia logs JSON do Pino (quando aplicável) e adiciona labels de baixa cardinalidade.
      - json:
          expressions:
            level: level
            service: service
      - labels:
          level:
          service:

