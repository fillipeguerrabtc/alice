global:
  scrape_interval: 30s
  evaluation_interval: 30s

# REGRA 6: Configuração de alertas obrigatória para observabilidade enterprise
# NOTA 01/01/2026: Alertmanager REMOVIDO - Grafana Alerting assumiu 100%
# Prometheus ainda avalia regras (para recording rules e métricas derivadas)
# Notificações são gerenciadas pelo Grafana Alerting
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alice-alertmanager:9093

# Arquivos de regras de alerta (montados via docker-compose)
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'alice-services'
    static_configs:
      - targets:
        - 'alice-auth:3001'
        - 'alice-chat:3002'
        - 'alice-rag:3003'
        - 'alice-training:3004'
        - 'alice-integrations:3005'
        - 'alice-gpu-manager:3010'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # ===========================================================================
  # INFRA EXPORTERS (PostgreSQL / PgBouncer / Redis)
  # ===========================================================================
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['alice-postgres-exporter:9187']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'pgbouncer-exporter'
    static_configs:
      - targets: ['alice-pgbouncer-exporter:9127']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['alice-redis-exporter:9121']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'qdrant'
    static_configs:
      - targets: ['alice-qdrant:6333']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # ===========================================================================
  # GPU Services (FastAPI/vLLM) - métricas por serviço
  # ===========================================================================
  - job_name: 'alice-gpu-services'
    static_configs:
      - targets:
        - 'gpu-llm:8000'
        labels:
          service: 'llm'
          gpu_service: 'llm'
      - targets:
        - 'gpu-vlm:8000'
        labels:
          service: 'vlm'
          gpu_service: 'vlm'
      - targets:
        - 'gpu-embeddings:8000'
        labels:
          service: 'embeddings'
          gpu_service: 'rag'
      - targets:
        - 'gpu-asr:8000'
        labels:
          service: 'asr'
          gpu_service: 'transcription'
    metrics_path: '/metrics'
    scrape_timeout: 15s

  - job_name: 'caddy'
    static_configs:
      - targets: ['alice-caddy:2019']
    metrics_path: '/metrics'

  - job_name: 'vector'
    static_configs:
      - targets: ['alice-vector:8686']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
    metrics_path: '/metrics'

  # REMOVIDO 01/01/2026: alertmanager substituído por Grafana Alerting

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: '/metrics'

  # ATUALIZADO 28/12/2025: Jaeger v2 expõe métricas na porta 8888 (não mais 14269)
  # Ref: https://www.jaegertracing.io/docs/2.13/operations/monitoring/
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:8888']
    metrics_path: '/metrics'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['alice-otel-collector:8888']
    metrics_path: '/metrics'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['alice-cadvisor:8080']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'

  # REGRA 6: node-exporter usa network_mode: host, então está acessível via host.docker.internal
  # Docker Compose v2+ mapeia host.docker.internal:host-gateway automaticamente no Linux
  # Se host.docker.internal não funcionar, usar o IP do gateway da rede Docker diretamente
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'alice-prod'
          environment: 'production'
    metrics_path: '/metrics'

  # ===========================================================================
  # Deploy Server (sem GPU) - observabilidade de host + containers
  # ===========================================================================
  # REQUERIMENTO DE SEGURANÇA (2025):
  # - endpoints DEVEM ser expostos apenas para allowlist do servidor de produção
  # - firewall/ufw/nftables é responsabilidade do deploy (não do Prometheus)
  - job_name: 'node-exporter-deploy'
    static_configs:
      - targets: ['46.224.46.93:9100']
        labels:
          instance: 'alice-deploy'
          environment: 'deploy'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'cadvisor-deploy'
    static_configs:
      - targets: ['46.224.46.93:8080']
        labels:
          instance: 'alice-deploy'
          environment: 'deploy'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'langfuse'
    static_configs:
      - targets: ['langfuse:3000']
    metrics_path: '/api/public/metrics'  # Endpoint oficial Langfuse 2.x para Prometheus
