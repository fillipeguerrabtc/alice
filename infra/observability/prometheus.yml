global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'alice-services'
    static_configs:
      - targets:
        - 'alice-auth:3001'
        - 'alice-chat:3002'
        - 'alice-rag:3003'
        - 'alice-training:3004'
        - 'alice-integrations:3005'
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'traefik'
    static_configs:
      - targets: ['alice-traefik:8080']
    metrics_path: '/metrics'

  - job_name: 'vector'
    static_configs:
      - targets: ['alice-vector:8686']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
    metrics_path: '/metrics'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alice-alertmanager:9093']
    metrics_path: '/metrics'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: '/metrics'

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    metrics_path: '/metrics'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['alice-otel-collector:8888']
    metrics_path: '/metrics'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['alice-cadvisor:8080']
    metrics_path: '/metrics'

  # REGRA 6: node-exporter usa network_mode: host, então está acessível via host.docker.internal
  # Docker Compose v2+ mapeia host.docker.internal:host-gateway automaticamente no Linux
  # Se host.docker.internal não funcionar, usar o IP do gateway da rede Docker diretamente
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    metrics_path: '/metrics'

  - job_name: 'langfuse'
    static_configs:
      - targets: ['langfuse:3000']
    metrics_path: '/api/public/metrics'  # Endpoint oficial Langfuse 2.x para Prometheus
