# =============================================================================
# Alice Enterprise Platform - Loki Configuration
# =============================================================================
# Configuração para Loki v3.6+ (Grafana Stack 2025)
#
# CORREÇÕES 19/12/2025:
# - Removido max_transfer_retries (deprecated em Loki 3.0+)
# - Removido shared_store do boltdb_shipper (deprecated em Loki 3.0+)
# - Atualizado schema para v13 (recomendado para novas instalações)
# - Removido boltdb-shipper (deprecated), usando tsdb
# - CORREÇÃO: ingester_rf1 não existe! WAL configurado em ingester.wal (docs oficiais)
#
# Documentação: https://grafana.com/docs/loki/latest/configure/
#
# Autor: Fillipe Guerra
# Data: 19 de Dezembro de 2025
# =============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

# Configuração do ingester (Loki 3.6+ Best Practices)
ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist
      replication_factor: 1
  chunk_idle_period: 5m
  chunk_retain_period: 1m
  # WAL (Write-Ahead Log) - habilitado por padrão no Loki 3.6+
  # Garante durabilidade dos dados gravando no filesystem antes de processar
  # Documentação: https://grafana.com/docs/loki/latest/operations/storage/wal/
  # IMPORTANTE: replay_memory_ceiling deve ser menor que o limite de memória do container (1G)
  # Valor 750MB deixa margem (~250MB) para outras operações do Loki
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
    checkpoint_duration: 5m
    replay_memory_ceiling: 750MB

memberlist:
  join_members:
    - loki

limits_config:
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_streams_per_user: 0
  max_global_streams_per_user: 0
  # Limites adicionais para produção
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# Schema v13 com TSDB (recomendado para Loki 3.0+)
# NOTA: boltdb-shipper foi deprecated, usando tsdb
schema_config:
  configs:
    # Schema legado para dados existentes (se houver)
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Storage usando TSDB (Loki 3.0+ Best Practices)
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-shipper-active
    cache_location: /loki/tsdb-shipper-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

# Compactor para otimização de índices
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Ruler para alertas
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /tmp/rules
  alertmanager_url: http://alice-alertmanager:9093
  ring:
    kvstore:
      store: memberlist

# Query frontend para melhor performance
query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

