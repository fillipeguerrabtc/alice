# =============================================================================
# pgBackRest Configuration - Alice Enterprise Platform
# =============================================================================
# Documentação oficial: https://pgbackrest.org/configuration.html
# Melhores práticas 2025: PITR, WAL archiving, encryption
#
# STORAGE: Volume Local Hetzner (/opt/alice/backups) - SEM S3 EXTERNO
# O backup é 100% local no volume Hetzner de 100GB (expansível até 10TB)
#
# Regra 6: Enterprise-grade (sem workarounds)
# Regra 10: Documentação PT-BR
# Regra 11: Seguir docs oficiais
#
# Autor: Fillipe Guerra
# Data: 05 de Dezembro de 2025
# =============================================================================

[global]
# Repositório local (único - volume Hetzner)
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-retention-archive=15

# NOTA: S3 offsite REMOVIDO (05/12/2025)
# Backups são armazenados 100% localmente no volume Hetzner
# Admin pode configurar rsync externo se necessário

# Compressão e criptografia (best practices 2025)
compress-type=zstd
compress-level=6
cipher-type=aes-256-cbc
cipher-pass=${PGBACKREST_CIPHER_PASS}

# Paralelismo otimizado para Hetzner CX43 (8 vCPU)
process-max=4
archive-async=y
archive-push-queue-max=4GiB
archive-get-queue-max=256MiB

# Logging em português (Regra 10)
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Verificação de integridade
page-checksum=y
start-fast=y

# Buffer otimizado
buffer-size=16MiB
protocol-timeout=1800

# Delta restore (só copia arquivos alterados)
delta=y

# =============================================================================
# STANZA: alice - Banco principal Alice Enterprise
# =============================================================================
[alice]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=alice
pg1-database=alice_db

# Host do PostgreSQL (nome do container)
pg1-host=alice-postgres
pg1-host-user=postgres

# Configuração de recovery
recovery-option=primary_conninfo=host=alice-postgres port=5432 user=alice
