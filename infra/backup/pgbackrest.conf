# =============================================================================
# pgBackRest Configuration - Alice Enterprise Platform
# =============================================================================
# Documentação oficial: https://pgbackrest.org/configuration.html
# Melhores práticas 2025: PITR, WAL archiving, encryption
#
# STORAGE: Volume Local Hetzner (/opt/alice/backups) - SEM S3 EXTERNO
# O backup é 100% local no volume Hetzner de 100GB (expansível até 10TB)
#
# Regra 6: Enterprise-grade (sem workarounds)
# Regra 10: Documentação PT-BR
# Regra 11: Seguir docs oficiais
#
# NOTA: Valores podem ser sobrescritos por variáveis de ambiente do docker-compose
# Variáveis de ambiente têm precedência sobre este arquivo
# pgBackRest NÃO suporta expansão de variáveis shell-style (${VAR}) em arquivos de config
# Use variáveis de ambiente no formato PGBACKREST_* para sobrescrever valores
#
# Autor: Fillipe Guerra
# Data: 08 de Dezembro de 2025
# =============================================================================

[global]
# Repositório local (sobrescrito por PGBACKREST_REPO1_PATH se definido)
# Valor padrão: /var/lib/pgbackrest (será sobrescrito por /opt/alice/backups/postgresql via env)
repo1-path=/var/lib/pgbackrest
repo1-retention-full=15
repo1-retention-diff=7
repo1-retention-archive=30

# NOTA: S3 offsite REMOVIDO (05/12/2025)
# Backups são armazenados 100% localmente no volume Hetzner
# Admin pode configurar rsync externo se necessário

# Compressão e criptografia (best practices 2025)
compress-type=zstd
compress-level=6
# Criptografia do repositório (usar chave via PGBACKREST_REPO1_CIPHER_PASS)
repo1-cipher-type=aes-256-cbc
# IMPORTANTE: repo1-cipher-pass DEVE estar presente no arquivo de configuração
# pgBackRest requer AMBOS cipher-type E cipher-pass no arquivo de config para validação
# 
# NOTA CRÍTICA: pgBackRest sobrescreve automaticamente valores do arquivo de config
# com variáveis de ambiente no formato PGBACKREST_* (funcionalidade nativa do pgBackRest)
# 
# O valor abaixo é SENTINELA e será SEMPRE sobrescrito por:
# - PGBACKREST_REPO1_CIPHER_PASS (definido no docker-compose.prod.yml)
# - Que recebe o valor de BACKUP_CIPHER_PASS (secret do GitHub)
# 
# O entrypoint.sh valida que PGBACKREST_REPO1_CIPHER_PASS está definido (fail-fast)
# Referência: https://pgbackrest.org/configuration.html#section-general/option-repo-cipher-pass
repo1-cipher-pass=REQUIRED_SET_VIA_ENV

# Paralelismo otimizado para Hetzner GEX44 (Intel i5-13500 14 Core)
process-max=8
archive-async=y
archive-push-queue-max=4GiB
archive-get-queue-max=256MiB

# Logging em português (Regra 10)
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Verificação de integridade
start-fast=y

# Buffer otimizado
buffer-size=16MiB
protocol-timeout=1800

# Delta restore (só copia arquivos alterados)
delta=y

# =============================================================================
# STANZA: alice_prod - Banco principal Alice Enterprise
# NOTA: Nome da stanza é definido via PGBACKREST_STANZA no docker-compose
# Este valor será sobrescrito pela variável de ambiente
# =============================================================================
[alice_prod]
# CORREÇÃO CRÍTICA 29/12/2025: pg1-host OBRIGATÓRIO para conexão TCP em Docker
# Sem pg1-host, pgBackRest tenta conectar via Unix socket (/run/postgresql/.s.PGSQL.5432)
# que NÃO existe porque containers Docker têm namespaces de filesystem separados.
# 
# NOTA: NÃO usar pg1-host-type=tls/ssh - isso requer configuração adicional de certificados.
# O pg1-host sem pg1-host-type usa conexão TCP direta via libpq (modo local).
# Ref: https://pgbackrest.org/configuration.html#section-stanza/option-pg-host
pg1-host=postgres

# Caminho dos dados PostgreSQL (sobrescrito por PGBACKREST_DB_PATH se definido)
# PostgreSQL usa /var/lib/postgresql/data diretamente (padrão, não subdiretório /pgdata)
# Deve corresponder ao PGDATA do container postgres
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=alice
pg1-database=alice_prod

# Configuração de recovery
recovery-option=primary_conninfo=host=postgres port=5432 user=alice