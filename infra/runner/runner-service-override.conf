# =============================================================================
# Alice Enterprise Platform - Systemd Service Override para GitHub Actions Runner
# Otimizacoes enterprise para alta performance e estabilidade
# Author: Fillipe Guerra | Data: 27/12/2025
# =============================================================================

[Service]
# === LIMITES DE RECURSOS ===
# Aumentar limite de arquivos abertos
LimitNOFILE=1048576

# Aumentar limite de processos
LimitNPROC=65535

# Memoria ilimitada para stack
LimitSTACK=infinity

# Core dumps para debug (desabilitado em prod)
LimitCORE=0

# === VARIAVEIS DE AMBIENTE ===
# Node.js - Otimizar memoria (6GB de 8GB total)
Environment="NODE_OPTIONS=--max-old-space-size=6144"

# Docker BuildKit
Environment="DOCKER_BUILDKIT=1"
Environment="COMPOSE_DOCKER_CLI_BUILD=1"
Environment="BUILDKIT_PROGRESS=plain"

# Pnpm - Otimizar downloads
Environment="PNPM_HOME=/home/runner/.local/share/pnpm"

# GitHub Actions - Performance
Environment="ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT=1"
Environment="DOTNET_CLI_TELEMETRY_OPTOUT=1"
Environment="DOTNET_NOLOGO=1"

# Cache directories
Environment="npm_config_cache=/home/runner/.npm"
Environment="pip_cache_dir=/home/runner/.cache/pip"

# === RESTART POLICY ===
# Restart automático em caso de falha
Restart=always
RestartSec=5

# Número máximo de restarts em 60 segundos
StartLimitIntervalSec=60
StartLimitBurst=3

# === TIMEOUT ===
# Timeout longo para builds demorados
TimeoutStartSec=120
TimeoutStopSec=30

# === LOGGING ===
StandardOutput=journal
StandardError=journal
SyslogIdentifier=github-runner

# === SEGURANCA ===
# Não permitir novos privilégios
NoNewPrivileges=false

# Manter capabilities para Docker
AmbientCapabilities=

# === SCHEDULING ===
# Prioridade de CPU (0 = default, -20 = alta prioridade)
Nice=-5

# I/O Scheduling class (best-effort com alta prioridade)
IOSchedulingClass=best-effort
IOSchedulingPriority=0
