# =============================================================================
# Alice Enterprise Platform - Limits para GitHub Actions Runner
# Otimizacoes de limites de recursos para CI/CD de alta performance
# Author: Fillipe Guerra | Data: 27/12/2025
# =============================================================================

# User runner
runner soft nofile 1048576
runner hard nofile 1048576
runner soft nproc 65535
runner hard nproc 65535
runner soft memlock unlimited
runner hard memlock unlimited
runner soft stack 65536
runner hard stack 65536

# Root (para Docker)
root soft nofile 1048576
root hard nofile 1048576
root soft nproc 65535
root hard nproc 65535
