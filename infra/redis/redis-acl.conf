# =============================================================================
# Redis 7 ACL Configuration - ERPNext Production
# Documentação: Redis 7 Security + GAP-ERPNEXT-001/008
# Referência: docs/DOCUMENTACAO-2025.md
# =============================================================================

# =============================================================================
# DESABILITAR USUÁRIO DEFAULT (Segurança)
# =============================================================================
user default off

# =============================================================================
# USUÁRIO FRAPPE - Cache e Queue
# Permissões: Todas operações necessárias para ERPNext
# =============================================================================
user frappe_cache on >FRAPPE_REDIS_CACHE_PASSWORD ~* +@all -@dangerous

# =============================================================================
# USUÁRIO FRAPPE QUEUE - Filas RQ
# Permissões: Operações de fila (lists, sets)
# =============================================================================
user frappe_queue on >FRAPPE_REDIS_QUEUE_PASSWORD ~* +@all -@dangerous

# =============================================================================
# COMANDOS PERIGOSOS DESABILITADOS
# Referência: Redis 7 Security Best Practices
# =============================================================================
# @dangerous inclui: FLUSHALL, FLUSHDB, DEBUG, CONFIG, SHUTDOWN, etc.
