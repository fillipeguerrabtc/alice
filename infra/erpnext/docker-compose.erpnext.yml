# =============================================================================
# Alice Enterprise Platform - ERPNext CRM/ERP com SSO via Alice IdP
# =============================================================================
# Documentação: https://frappeframework.com/docs/user/en/installation
#
# Variáveis de Ambiente Obrigatórias:
# - ERPNEXT_ADMIN_PASSWORD: Senha do admin
# - DB_PASSWORD: Senha do MariaDB
# - ALICE_OAUTH_CLIENT_SECRET: Secret do cliente OAuth (banco oauth_clients)
# - ALICE_OIDC_ISSUER: URL do issuer Alice (ex: https://yesyoudeserve.duckdns.org)
#
# Uso:
#   docker-compose -f docker-compose.erpnext.yml up -d
# =============================================================================

version: "3.8"

services:
  # MariaDB para ERPNext
  erpnext-db:
    image: mariadb:10.11
    container_name: alice-erpnext-db
    restart: unless-stopped
    networks:
      - alice-network
    volumes:
      - erpnext-db-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${ERPNEXT_DB_ROOT_PASSWORD:?ERPNEXT_DB_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=erpnext
      - MYSQL_USER=erpnext
      - MYSQL_PASSWORD=${ERPNEXT_DB_PASSWORD:?ERPNEXT_DB_PASSWORD is required}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
      --skip-innodb-read-only-compressed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ERPNEXT_DB_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Redis para cache e queue
  erpnext-redis:
    image: redis:7-alpine
    container_name: alice-erpnext-redis
    restart: unless-stopped
    networks:
      - alice-network
    volumes:
      - erpnext-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ERPNext Backend
  # SEGURANÇA: v15.88.0 corrige CVE-2025-55732, CVE-2025-55731 (SQL Injection críticos)
  erpnext-backend:
    image: frappe/erpnext:v15.88.0
    container_name: alice-erpnext-backend
    restart: unless-stopped
    networks:
      - alice-network
    depends_on:
      erpnext-db:
        condition: service_healthy
      erpnext-redis:
        condition: service_healthy
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    environment:
      # Database
      - DB_HOST=erpnext-db
      - DB_PORT=3306
      - DB_NAME=erpnext
      - DB_USER=erpnext
      - DB_PASSWORD=${ERPNEXT_DB_PASSWORD}
      
      # Redis
      - REDIS_CACHE=redis://erpnext-redis:6379/0
      - REDIS_QUEUE=redis://erpnext-redis:6379/1
      - REDIS_SOCKETIO=redis://erpnext-redis:6379/2
      
      # Admin
      - ADMIN_PASSWORD=${ERPNEXT_ADMIN_PASSWORD:?ERPNEXT_ADMIN_PASSWORD is required}
      - SITE_NAME=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      
      # Alice OAuth (Social Login Key)
      - ALICE_OAUTH_CLIENT_ID=erpnext-sso
      - ALICE_OAUTH_CLIENT_SECRET=${ALICE_OAUTH_CLIENT_SECRET:?ALICE_OAUTH_CLIENT_SECRET is required}
      - ALICE_OIDC_ISSUER=${ALICE_OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ERPNext Frontend (Nginx)
  # SEGURANÇA: v15.88.0 para compatibilidade com backend atualizado
  erpnext-frontend:
    image: frappe/frappe-nginx:v15.88.0
    container_name: alice-erpnext-frontend
    restart: unless-stopped
    networks:
      - alice-network
    depends_on:
      - erpnext-backend
    ports:
      - "8080:8080"
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites:ro
    environment:
      - FRAPPE_SITE_NAME_HEADER=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      - BACKEND=erpnext-backend:8000
      - SOCKETIO=erpnext-socketio:9000
    labels:
      # Traefik labels para routing
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext.rule=Host(`erp.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.erpnext.entrypoints=websecure"
      - "traefik.http.routers.erpnext.tls.certresolver=letsencrypt"
      - "traefik.http.services.erpnext.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ERPNext Socket.IO
  # SEGURANÇA: v15.88.0 para compatibilidade com backend atualizado
  erpnext-socketio:
    image: frappe/frappe-socketio:v15.88.0
    container_name: alice-erpnext-socketio
    restart: unless-stopped
    networks:
      - alice-network
    depends_on:
      - erpnext-redis
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ERPNext Scheduler (Background Jobs)
  # SEGURANÇA: v15.88.0 corrige CVE-2025-55732, CVE-2025-55731
  erpnext-scheduler:
    image: frappe/erpnext:v15.88.0
    container_name: alice-erpnext-scheduler
    restart: unless-stopped
    networks:
      - alice-network
    depends_on:
      - erpnext-backend
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    command: bench schedule
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ERPNext Worker (Default Queue)
  # SEGURANÇA: v15.88.0 corrige CVE-2025-55732, CVE-2025-55731
  erpnext-worker-default:
    image: frappe/erpnext:v15.88.0
    container_name: alice-erpnext-worker-default
    restart: unless-stopped
    networks:
      - alice-network
    depends_on:
      - erpnext-backend
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    command: bench worker --queue default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ERPNext Worker (Short Queue)
  # SEGURANÇA: v15.88.0 corrige CVE-2025-55732, CVE-2025-55731
  erpnext-worker-short:
    image: frappe/erpnext:v15.88.0
    container_name: alice-erpnext-worker-short
    restart: unless-stopped
    networks:
      - alice-network
    depends_on:
      - erpnext-backend
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    command: bench worker --queue short
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ERPNext Worker (Long Queue)
  # SEGURANÇA: v15.88.0 corrige CVE-2025-55732, CVE-2025-55731
  erpnext-worker-long:
    image: frappe/erpnext:v15.88.0
    container_name: alice-erpnext-worker-long
    restart: unless-stopped
    networks:
      - alice-network
    depends_on:
      - erpnext-backend
    volumes:
      - erpnext-sites:/home/frappe/frappe-bench/sites
      - erpnext-logs:/home/frappe/frappe-bench/logs
    command: bench worker --queue long
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

networks:
  alice-network:
    external: true

volumes:
  erpnext-db-data:
    driver: local
  erpnext-redis-data:
    driver: local
  erpnext-sites:
    driver: local
  erpnext-logs:
    driver: local
