# =============================================================================
# pgBackRest Configuration - PostgreSQL Container (Alice Enterprise Platform)
# =============================================================================
# Esta configuração é usada pelo binário pgBackRest instalado no container PostgreSQL.
# Permite que o archive_command chame pgbackrest archive-push corretamente.
#
# ARQUITETURA (31/12/2025):
# - PostgreSQL: Este container executa archive_command='pgbackrest archive-push %p'
# - pgBackRest Container: Executa backups full/diff/incr e restore
# - Repositório: Volume compartilhado em /var/lib/pgbackrest
#
# Author: Fillipe Guerra
# Data: 31 de Dezembro de 2025
# =============================================================================

[global]
# Repositório local (volume compartilhado com container pgBackRest)
repo1-path=/var/lib/pgbackrest

# Compressão zst (padrão enterprise 2025)
# CORREÇÃO 01/01/2026: pgBackRest usa notação 'zst' (não 'zstd')
# Valores válidos: none, bz2, gz, lz4, zst
compress-type=zst
compress-level=6

# Logs (diretório local no container PostgreSQL)
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Paralelismo otimizado
process-max=4

# Archive async para melhor performance
archive-async=y
spool-path=/var/spool/pgbackrest

# =============================================================================
# STANZA: alice_prod - Deve corresponder ao nome usado no container pgBackRest
# =============================================================================
[alice_prod]
# Caminho dos dados PostgreSQL (dentro deste container)
pg1-path=/var/lib/postgresql/data
