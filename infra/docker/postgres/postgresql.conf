# =============================================================================
# PostgreSQL Configuration - Alice Enterprise Platform
# =============================================================================
# Configuração otimizada para produção com WAL archiving para pgBackRest
#
# Author: Fillipe Guerra
# Data: 29 de Dezembro de 2025
# Documentação PT-BR (Regra 10 CLAUDE.md)
# =============================================================================

# =============================================================================
# CONEXÕES E AUTENTICAÇÃO
# =============================================================================
listen_addresses = '*'
port = 5432
max_connections = 200

# =============================================================================
# WAL CONFIGURATION - Para backups consistentes
# =============================================================================
# ARQUITETURA DOCKER (29/12/2025):
# - PostgreSQL e pgBackRest rodam em containers SEPARADOS
# - archive_command NÃO funciona porque pgBackRest não está instalado aqui
# - Usamos wal_level=replica para backups consistentes
# - pgBackRest faz backups via acesso ao PGDATA (volume compartilhado)
#
# NOTA: archive_mode=off porque:
# 1. pgBackRest não está instalado neste container
# 2. Containers Docker são isolados - archive_command não pode chamar outro container
# 3. Para WAL streaming, seria necessário pgBackRest instalado aqui OU usar pg_receivewal
#
# Os backups pgBackRest (full/incremental) funcionam SEM archive_mode
# usando checkpoint + cópia do PGDATA
# =============================================================================
wal_level = replica
archive_mode = off
# archive_command não configurado (containers separados)

# =============================================================================
# WRITE-AHEAD LOG (WAL)
# =============================================================================
# Configurações otimizadas para workload misto (OLTP + Analytics)
max_wal_size = 2GB
min_wal_size = 512MB
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# =============================================================================
# MEMÓRIA - Otimizado para 64GB RAM (servidor Hetzner GEX44)
# =============================================================================
# shared_buffers: 25% da RAM disponível para PostgreSQL (3GB de 12GB alocados)
# effective_cache_size: 75% da RAM disponível
# work_mem: Memória por operação de sort/hash
# maintenance_work_mem: Operações de manutenção (VACUUM, CREATE INDEX)
# =============================================================================
shared_buffers = 768MB
effective_cache_size = 2304MB
work_mem = 32MB
maintenance_work_mem = 256MB
huge_pages = try

# =============================================================================
# QUERY PLANNER
# =============================================================================
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# =============================================================================
# PARALLEL QUERY
# =============================================================================
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# =============================================================================
# LOGGING
# =============================================================================
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# =============================================================================
# SEGURANÇA
# =============================================================================
ssl = off
password_encryption = scram-sha-256

# =============================================================================
# EXTENSÕES (pgvector)
# =============================================================================
# Carregadas automaticamente quando usadas
