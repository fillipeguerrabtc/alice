# =============================================================================
# PostgreSQL Configuration - Alice Enterprise Platform
# =============================================================================
# Configuração otimizada para produção com WAL archiving para pgBackRest
#
# Author: Fillipe Guerra
# Data: 29 de Dezembro de 2025
# Documentação PT-BR (Regra 10 CLAUDE.md)
# =============================================================================

# =============================================================================
# CONEXÕES E AUTENTICAÇÃO
# =============================================================================
listen_addresses = '*'
port = 5432
max_connections = 200

# =============================================================================
# WAL CONFIGURATION - Para backups consistentes
# =============================================================================
# ARQUITETURA DOCKER (29/12/2025):
# - PostgreSQL e pgBackRest rodam em containers SEPARADOS
# - pgBackRest faz backups via acesso ao PGDATA (volume compartilhado)
# - Usamos wal_level=replica para backups consistentes
#
# CORREÇÃO CRÍTICA 29/12/2025: archive_mode=on OBRIGATÓRIO para validação pgBackRest
# 
# PROBLEMA: pgBackRest check/info valida se archive_mode=on mesmo que archive_command
# não seja usado para backups reais. Com archive_mode=off, pgBackRest retorna erro:
# "archive_mode must be enabled"
#
# SOLUÇÃO: Habilitar archive_mode=on com archive_command dummy (/bin/true)
# - /bin/true retorna exit 0 (sucesso) instantaneamente sem fazer nada
# - Backups pgBackRest funcionam via acesso direto ao PGDATA (volume compartilhado)
# - archive_command dummy satisfaz validação do pgBackRest sem impacto funcional
#
# Ref: https://pgbackrest.org/user-guide.html#quickstart/configure-postgresql
# "archive_mode must be enabled for pgBackRest to work properly"
# =============================================================================
wal_level = replica
archive_mode = on
# CORREÇÃO 29/12/2025: Dummy archive_command para validação pgBackRest
# Backups funcionam via acesso direto ao PGDATA (volume compartilhado)
# O comando /bin/true retorna exit 0 (sucesso) sem fazer nada
archive_command = '/bin/true'

# =============================================================================
# WRITE-AHEAD LOG (WAL)
# =============================================================================
# Configurações otimizadas para workload misto (OLTP + Analytics)
max_wal_size = 2GB
min_wal_size = 512MB
wal_buffers = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# =============================================================================
# MEMÓRIA - Otimizado para 64GB RAM (servidor Hetzner GEX44)
# =============================================================================
# shared_buffers: 25% da RAM disponível para PostgreSQL (3GB de 12GB alocados)
# effective_cache_size: 75% da RAM disponível
# work_mem: Memória por operação de sort/hash
# maintenance_work_mem: Operações de manutenção (VACUUM, CREATE INDEX)
# =============================================================================
shared_buffers = 768MB
effective_cache_size = 2304MB
work_mem = 32MB
maintenance_work_mem = 256MB
huge_pages = try

# =============================================================================
# QUERY PLANNER
# =============================================================================
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# =============================================================================
# PARALLEL QUERY
# =============================================================================
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# =============================================================================
# LOGGING
# =============================================================================
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# =============================================================================
# SEGURANÇA
# =============================================================================
ssl = off
password_encryption = scram-sha-256

# =============================================================================
# EXTENSÕES (pgvector)
# =============================================================================
# Carregadas automaticamente quando usadas
