# =============================================================================
# ALICE ENTERPRISE - Vector Log Aggregation
# =============================================================================
# Coleta logs de todos os servicos e envia para Grafana Cloud (free tier)

[sources.docker_logs]
type = "docker_logs"
docker_host = "/var/run/docker.sock"

[transforms.parse_logs]
type = "remap"
inputs = ["docker_logs"]
source = '''
# Parse JSON logs
parsed, err = parse_json(.message)
if err == null {
  . = merge(., parsed)
}

# Add metadata
.service = .container_name
.environment = get_env_var("NODE_ENV") ?? "development"
.timestamp = now()
'''

[transforms.filter_noise]
type = "filter"
inputs = ["parse_logs"]
condition = '.level != "debug" || get_env_var("LOG_DEBUG") == "true"'

[sinks.console]
type = "console"
inputs = ["filter_noise"]
encoding.codec = "json"

