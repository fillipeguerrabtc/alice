# =============================================================================
# ALICE ENTERPRISE - Vector Log Aggregation
# =============================================================================
# Coleta logs de todos os serviços e envia para Loki local (produção)

[sources.docker_logs]
type = "docker_logs"
docker_host = "/var/run/docker.sock"

[sources.internal_metrics]
type = "internal_metrics"

[transforms.parse_logs]
type = "remap"
inputs = ["docker_logs"]
source = '''
# Parse JSON logs
parsed, err = parse_json(.message)
if err == null {
  . = merge!(., parsed)
}

# Add metadata
.service = .container_name
.environment = get_env_var("NODE_ENV") ?? "development"
.timestamp = now()
'''

[transforms.filter_noise]
type = "filter"
inputs = ["parse_logs"]
# CORREÇÃO 02/01/2026: get_env_var é fallible - usar ?? para default
condition = '.level != "debug" || (get_env_var("LOG_DEBUG") ?? "false") == "true"'

[sinks.console]
type = "console"
inputs = ["filter_noise"]
encoding.codec = "json"

[sinks.loki]
type = "loki"
inputs = ["filter_noise"]
endpoint = "http://loki:3100"
labels.service = "{{ service }}"
labels.environment = "{{ environment }}"
encoding.codec = "json"

[sinks.vector_prometheus_exporter]
type = "prometheus_exporter"
inputs = ["internal_metrics"]
address = "0.0.0.0:9598"

[api]
enabled = true
address = "0.0.0.0:8686"
