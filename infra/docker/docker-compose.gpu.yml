# =============================================================================
# ALICE PLATFORM - DOCKER COMPOSE GPU SERVICES
# =============================================================================
# Versão: Gate 2 (legado local)
# Ambiente: Produção (Hetzner Cloud GPU Server)
# Servidor: Hetzner GEX44 (RTX 4000 Ada 20GB) - GPU dedicada 24/7
# Rede: Rede interna Hetzner (10.0.0.0/16)
#
# ARQUITETURA GPU (Gate 2 - 15/01/2026):
# SERVIÇOS GPU (SSOT no stack modular; este arquivo é apenas compat local):
# - gpu-llm: LLM (texto) - Qwen2.5 7B Instruct AWQ (contexto 8k)
# - gpu-embeddings: Qwen3-Embedding-0.6B INT8 (1024 dim) (budget ~2-3GB)
# - ASR: OpenAI API (sem GPU local)
# - gpu-trainer: QLoRA fine-tuning (sob demanda) (~12GB)
# 
# HISTÓRICO (v4.0.0+):
# - Mixtral 8x7B → Qwen2.5 7B (texto)
# - Vision e geração de imagens migradas para OpenAI
# - Embeddings usa quantização (INT8 quando aplicável) para reduzir pressão de VRAM
# - Todos os serviços rodam simultaneamente (zero latência de troca)
#
# ⚠️ AVISO (SSOT): Este arquivo é LEGADO. A fonte de verdade é o stack modular:
# `infra/docker/stacks/docker-compose.alice.yml`
# Este compose foi mantido apenas para compatibilidade local, mas seus parâmetros
# DEVEM permanecer alinhados ao stack modular para evitar SSOT quebrado.
#
# Portas (alinhadas ao stack modular):
# - 8004 (llm), 8001 (embeddings), 8003 (trainer)
#
# Autor: Fillipe Guerra
# Data: 16 de Janeiro de 2026
# =============================================================================

version: '3.8'

services:
  # =============================================================================
  # Qwen2.5 7B Instruct (AWQ) - LLM (Texto) - 8k
  # =============================================================================
  gpu-llm:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-llm-qwen25:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-llm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${LLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - QUANTIZATION=awq
      - MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-8192}
      - GPU_MEMORY_UTILIZATION=${LLM_GPU_MEMORY_UTILIZATION:-0.50}
      - TENSOR_PARALLEL_SIZE=1
      - HOST=0.0.0.0
      - PORT=8000
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "127.0.0.1:8004:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Embeddings GPU - Qwen3-Embedding-0.6B INT8
  # Gate 2: Texto 1024 dim (Qdrant) - imagens usam OpenAI (sem GPU)
  # =============================================================================
  gpu-embeddings:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-embeddings-gpu:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-embeddings
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - TEXT_MODEL_NAME=${TEXT_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      - TEXT_EMBEDDING_DIM=${TEXT_EMBEDDING_DIM:-1024}
      - QUANTIZATION=int8
      - DEVICE=cuda
      - PORT=8000
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # GPU Trainer - QLoRA Fine-tuning (Sob Demanda)
  # Gate 2: Profile 'training' - só inicia quando necessário
  # =============================================================================
  gpu-trainer:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-qwen-trainer:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-trainer
    restart: "no"
    runtime: nvidia
    profiles:
      - training
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - BASE_MODEL=${TRAINER_BASE_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - TRAINING_METHOD=${TRAINER_METHOD:-qlora}
      - DEVICE=cuda
      - PORT=8000
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "127.0.0.1:8003:8000"
    networks:
      - gpu-network
    volumes:
      - training-data:/data
      - lora-adapters:/adapters
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  training-data:
    driver: local
  lora-adapters:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  gpu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

