# =============================================================================
# ALICE PLATFORM - DOCKER COMPOSE GPU SERVICES
# =============================================================================
# Versão: Gate 2 (legado local)
# Ambiente: Produção (Hetzner Cloud GPU Server)
# Servidor: Hetzner GEX44 (RTX 4000 Ada 20GB) - GPU dedicada 24/7
# Rede: Rede interna Hetzner (10.0.0.0/16)
#
# ARQUITETURA GPU (Gate 2 - 15/01/2026):
# SERVIÇOS GPU (SSOT no stack modular; este arquivo é apenas compat local):
# - gpu-llm: LLM (texto) - Mistral 7B Instruct AWQ (budget ~6GB)
# - gpu-vlm: VLM (visão) - Qwen2.5-VL 7B AWQ (multimodal) (budget ~8GB)
# - gpu-embeddings: Qwen3-Embedding-0.6B INT8 (1024 dim) + OpenCLIP (1024 dim) (budget ~2-3GB + ~2GB)
# - gpu-asr: Canary-1B (transcrição de áudio) (budget ~3-4GB)
# - gpu-trainer: QLoRA fine-tuning (sob demanda) (~12GB)
# 
# HISTÓRICO (v4.0.0):
# - Mixtral 8x7B → Qwen2.5-VL 7B (multimodal, especializado em finanças)
# - FLUX.1 Schnell REMOVIDO (Alice analisa mas NÃO gera imagens)
# - Embeddings usa quantização (INT8 quando aplicável) para reduzir pressão de VRAM
# - Todos os serviços rodam simultaneamente (zero latência de troca)
#
# ⚠️ AVISO (SSOT): Este arquivo é LEGADO. A fonte de verdade é o stack modular:
# `infra/docker/stacks/docker-compose.alice.yml`
# Este compose foi mantido apenas para compatibilidade local, mas seus parâmetros
# DEVEM permanecer alinhados ao stack modular para evitar SSOT quebrado.
#
# Portas (alinhadas ao stack modular):
# - 8000 (vlm), 8004 (llm), 8001 (embeddings), 8002 (asr), 8003 (trainer)
#
# Autor: Fillipe Guerra
# Data: 15 de Janeiro de 2026
# =============================================================================

version: '3.8'

services:
  # =============================================================================
  # Mistral 7B Instruct (AWQ) - LLM (Texto) - Gate 2
  # =============================================================================
  gpu-llm:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-llm-mistral:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-llm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${LLM_MODEL_NAME:-TheBloke/Mistral-7B-Instruct-v0.2-AWQ}
      - QUANTIZATION=awq
      - MAX_MODEL_LEN=${LLM_MAX_MODEL_LEN:-2048}
      # Gate 2: budget conservador para coexistência (LLM + VLM + Embeddings + ASR em 20GB)
      - GPU_MEMORY_UTILIZATION=${LLM_GPU_MEMORY_UTILIZATION:-0.28}
      - TENSOR_PARALLEL_SIZE=1
      - HOST=0.0.0.0
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8004:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Qwen2.5-VL 7B AWQ - VLM (Visão)
  # Gate 2: VLM dedicado (LLM texto separado)
  # =============================================================================
  gpu-vlm:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-qwen-vl:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-vlm
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${QWEN_VL_MODEL_NAME:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      - QUANTIZATION=${QWEN_VL_QUANTIZATION:-awq}
      # Gate 2: alinhado ao stack modular (evita KV cache estourando VRAM em 20GB)
      - MAX_MODEL_LEN=${QWEN_VL_MAX_MODEL_LEN:-2048}
      # Gate 2: budget conservador para coexistência com LLM + Embeddings + ASR
      - GPU_MEMORY_UTILIZATION=${QWEN_VL_GPU_MEMORY_UTILIZATION:-0.36}
      - TENSOR_PARALLEL_SIZE=${QWEN_VL_TENSOR_PARALLEL_SIZE:-1}
      - HOST=0.0.0.0
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Embeddings GPU - Qwen3-Embedding-0.6B INT8 + OpenCLIP
  # Gate 2: Texto 1024 dim (Qdrant) + Imagem 1024 dim (pgvector)
  # =============================================================================
  gpu-embeddings:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-embeddings-gpu:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-embeddings
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - TEXT_MODEL_NAME=${TEXT_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      - TEXT_EMBEDDING_DIM=${TEXT_EMBEDDING_DIM:-1024}
      - IMAGE_MODEL_NAME=${IMAGE_MODEL_NAME:-laion/CLIP-ViT-H-14-laion2B-s32B-b79K}
      - IMAGE_EMBEDDING_DIM=${IMAGE_EMBEDDING_DIM:-1024}
      - QUANTIZATION=int8
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # ASR Canary-1B - Transcrição de Áudio
  # =============================================================================
  gpu-asr:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-asr-canary:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-asr
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${ASR_MODEL_NAME:-nvidia/canary-1b-v2}
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 6G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # GPU Trainer - QLoRA Fine-tuning (Sob Demanda)
  # Gate 2: Profile 'training' - só inicia quando necessário
  # =============================================================================
  gpu-trainer:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-qwen-trainer:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-trainer
    restart: "no"
    runtime: nvidia
    profiles:
      - training
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - BASE_MODEL=${TRAINER_BASE_MODEL:-TheBloke/Mistral-7B-Instruct-v0.2-AWQ}
      - TRAINING_METHOD=${TRAINER_METHOD:-qlora}
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8003:8000"
    networks:
      - gpu-network
    volumes:
      - training-data:/data
      - lora-adapters:/adapters
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  training-data:
    driver: local
  lora-adapters:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  gpu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

