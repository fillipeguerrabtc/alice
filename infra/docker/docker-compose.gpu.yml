# =============================================================================
# ALICE PLATFORM - DOCKER COMPOSE GPU SERVICES
# =============================================================================
# Versão: 4.0.0
# Ambiente: Produção (Hetzner Cloud GPU Server)
# Servidor: Hetzner GEX44 (RTX 4000 Ada 20GB) - GPU dedicada 24/7
# Rede: Rede interna Hetzner (10.0.0.0/16)
#
# ARQUITETURA v4.0.0 (11/01/2026):
# SERVIÇOS GPU (3 containers sempre ativos + 1 sob demanda):
# - gpu-qwen-vl: Qwen2.5-VL 7B AWQ (LLM multimodal: texto + vision) ~4GB
# - gpu-embeddings: Qwen3-Embedding-8B INT8 + OpenCLIP (embeddings) ~8GB
# - gpu-asr: Canary-1B (transcrição de áudio) ~3GB
# - gpu-trainer: QLoRA fine-tuning (sob demanda) ~12GB
#
# TOTAL VRAM (serviços sempre ativos): ~15GB de 20GB disponíveis
# 
# MUDANÇAS v4.0.0:
# - Mixtral 8x7B → Qwen2.5-VL 7B (multimodal, especializado em finanças)
# - FLUX.1 Schnell REMOVIDO (Alice analisa mas NÃO gera imagens)
# - Embeddings agora usa INT8 quantization (16GB → 8GB VRAM)
# - Todos os serviços rodam simultaneamente (zero latência de troca)
#
# Portas: 8000 (qwen-vl), 8001 (embeddings), 8003 (asr), 8004 (trainer)
#
# Autor: Fillipe Guerra
# Data: 11 de Janeiro de 2026
# =============================================================================

version: '3.8'

services:
  # =============================================================================
  # Qwen2.5-VL 7B AWQ - LLM Multimodal (Texto + Vision)
  # ARQUITETURA v4.0.0: Substitui Mixtral 8x7B
  # =============================================================================
  gpu-qwen-vl:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-qwen-vl:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-qwen-vl
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${QWEN_VL_MODEL_NAME:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      - QUANTIZATION=${QWEN_VL_QUANTIZATION:-awq}
      - MAX_MODEL_LEN=${QWEN_VL_MAX_MODEL_LEN:-32768}
      - GPU_MEMORY_UTILIZATION=${QWEN_VL_GPU_MEMORY_UTILIZATION:-0.95}
      - TENSOR_PARALLEL_SIZE=${QWEN_VL_TENSOR_PARALLEL_SIZE:-1}
      - HOST=0.0.0.0
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8000:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Embeddings GPU - Qwen3-Embedding-8B INT8 + OpenCLIP
  # ARQUITETURA v4.0.0: INT8 quantization (16GB → 8GB VRAM)
  # =============================================================================
  gpu-embeddings:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-embeddings-gpu:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-embeddings
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - TEXT_MODEL_NAME=${TEXT_MODEL_NAME:-Qwen/Qwen3-Embedding-8B}
      - TEXT_EMBEDDING_DIM=${TEXT_EMBEDDING_DIM:-4096}
      - IMAGE_MODEL_NAME=${IMAGE_MODEL_NAME:-laion/CLIP-ViT-H-14-laion2B-s32B-b79K}
      - IMAGE_EMBEDDING_DIM=${IMAGE_EMBEDDING_DIM:-1024}
      - QUANTIZATION=int8
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8001:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # ASR Canary-1B - Transcrição de Áudio
  # =============================================================================
  gpu-asr:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-asr-canary:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-asr
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${ASR_MODEL_NAME:-nvidia/canary-1b-v2}
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8003:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 6G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # GPU Trainer - QLoRA Fine-tuning (Sob Demanda)
  # ARQUITETURA v4.0.0: Profile 'training' - só inicia quando necessário
  # =============================================================================
  gpu-trainer:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-qwen-trainer:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-trainer
    restart: "no"
    runtime: nvidia
    profiles:
      - training
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - BASE_MODEL=${TRAINER_BASE_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      - TRAINING_METHOD=${TRAINER_METHOD:-qlora}
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8004:8000"
    networks:
      - gpu-network
    volumes:
      - training-data:/data
      - lora-adapters:/adapters
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  training-data:
    driver: local
  lora-adapters:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  gpu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

