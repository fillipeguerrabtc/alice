# =============================================================================
# ALICE PLATFORM - DOCKER COMPOSE GPU SERVICES
# =============================================================================
# Versão: 1.0.0
# Ambiente: Produção (Hetzner Cloud GPU Server)
# Servidor: Hetzner GEX44 (RTX 4000 Ada 20GB) - GPU dedicada 24/7
# Rede: Rede interna Hetzner (10.0.0.0/16)
#
# SERVIÇOS GPU (4 containers):
# - gpu-mixtral: Mixtral 8x7B vLLM (LLM inference)
# - gpu-embeddings: Qwen3-Embedding-8B + OpenCLIP (embeddings texto/imagem)
# - gpu-flux: FLUX.1 Schnell (geração de imagens)
# - gpu-asr: Canary-1B (transcrição de áudio)
#
# ARQUITETURA:
# - Todos os serviços compartilham a mesma GPU (time-sharing)
# - Portas: 8000 (mixtral), 8001 (embeddings), 8002 (flux), 8003 (asr)
# - Health checks configurados para cada serviço
# - Resource limits para evitar OOM
#
# Autor: Fillipe Guerra
# Data: 25 de Dezembro de 2025
# =============================================================================

version: '3.8'

services:
  # =============================================================================
  # Mixtral 8x7B vLLM - LLM Principal
  # =============================================================================
  gpu-mixtral:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-mixtral-vllm:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-mixtral
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${MIXTRAL_MODEL_NAME:-TheBloke/Mixtral-8x7B-Instruct-v0.1-AWQ}
      - QUANTIZATION=${MIXTRAL_QUANTIZATION:-awq}
      - MAX_MODEL_LEN=${MIXTRAL_MAX_MODEL_LEN:-32768}
      - GPU_MEMORY_UTILIZATION=${MIXTRAL_GPU_MEMORY_UTILIZATION:-0.90}
      - TENSOR_PARALLEL_SIZE=${MIXTRAL_TENSOR_PARALLEL_SIZE:-1}
      - HOST=0.0.0.0
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8000:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 20G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Embeddings GPU - Qwen3 + OpenCLIP
  # =============================================================================
  gpu-embeddings:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-embeddings-gpu:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-embeddings
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - TEXT_MODEL_NAME=${TEXT_MODEL_NAME:-Qwen/Qwen3-Embedding-8B}
      - TEXT_EMBEDDING_DIM=${TEXT_EMBEDDING_DIM:-4096}
      - IMAGE_MODEL_NAME=${IMAGE_MODEL_NAME:-laion/CLIP-ViT-H-14-laion2B-s32B-b79K}
      - IMAGE_EMBEDDING_DIM=${IMAGE_EMBEDDING_DIM:-1024}
      - DEVICE=cuda
      - PORT=8000
      - KEEP_WARM_MINUTES=${EMBEDDINGS_KEEP_WARM_MINUTES:-30}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8001:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # FLUX.1 Schnell - Geração de Imagens
  # =============================================================================
  gpu-flux:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-flux-schnell:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-flux
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${FLUX_MODEL_NAME:-black-forest-labs/FLUX.1-schnell}
      - NUM_INFERENCE_STEPS=${FLUX_NUM_INFERENCE_STEPS:-4}
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8002:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 18G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # ASR Canary-1B - Transcrição de Áudio
  # =============================================================================
  gpu-asr:
    image: ghcr.io/${DOCKERHUB_USERNAME:-fillipeguerrabtc}/alice-asr-canary:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-asr
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${ASR_MODEL_NAME:-nvidia/canary-1b-v2}
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "8003:8000"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  gpu-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

