      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128M
      - /app/.cache:mode=1777,size=512M
    profiles:
      - gpu
    environment:
      PORT: 8080
      MODEL_NAME: "ViT-L/14"
      TORCH_HOME: /app/.cache
      PYTHONUNBUFFERED: "1"
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-clip.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/clip`)"
      - "traefik.http.routers.alice-clip.entrypoints=websecure"
      - "traefik.http.routers.alice-clip.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-clip.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-clip.loadbalancer.server.port=8080"
