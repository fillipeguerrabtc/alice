  # ===========================================================================
  # CLICKHOUSE - OLAP Database para Langfuse v3 (Arquitetura Oficial 2025)
  # Documentação: https://clickhouse.com/docs/en/operations/server-configuration-parameters
  # NOTA: ClickHouse é OBRIGATÓRIO para Langfuse v3 - não é opcional
  # ===========================================================================
  # ===========================================================================
  # MINIO - Object Storage S3-Compatible para Langfuse v3
  # OBRIGATÓRIO: Langfuse v3 requer S3 para armazenamento de eventos/traces
  # Documentação: https://langfuse.com/self-hosting/infrastructure/blobstorage
  # ===========================================================================
  minio:
    # ATUALIZADO 01/01/2026: MinIO estável para Langfuse v3
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    platform: linux/amd64
    container_name: alice-minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO 01/01/2026: minio/minio não tem mc binário, usar curl com endpoint oficial
      # Ref: https://min.io/docs/minio/linux/operations/monitoring/healthcheck-probe.html
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # MinIO Init - Cria bucket para Langfuse na primeira execução
  # CORREÇÃO 01/01/2026: Syntax error fix - usar | ao invés de > para preservar quebras de linha
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    platform: linux/amd64
    container_name: alice-minio-init
    restart: "no"
    security_opt:
      - no-new-privileges:true
    # CORREÇÃO 01/01/2026: Usar entrypoint + command com | (literal scalar)
    # O formato > (folded scalar) REMOVE quebras de linha, causando syntax error
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        
        echo '🔧 MinIO Init - Configuração de Bucket para Langfuse'
        echo "   MINIO_ROOT_USER: $${MINIO_ROOT_USER}"
        
        # Validar que senha foi fornecida
        if [ -z "$${MINIO_ROOT_PASSWORD}" ]; then
          echo '❌ ERRO: MINIO_ROOT_PASSWORD não está definido!'
          echo '   Adicione o secret no GitHub: MINIO_ROOT_PASSWORD'
          exit 1
        fi
        echo '   MINIO_ROOT_PASSWORD: (definido)'
        
        echo ''
        echo '⏳ Aguardando MinIO iniciar (máx 60s)...'
        
        MAX_RETRIES=20
        RETRY=0
        while [ $$RETRY -lt $$MAX_RETRIES ]; do
          echo "   Tentativa $$((RETRY + 1))/$$MAX_RETRIES..."
          if mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" 2>/dev/null; then
            echo '✅ MinIO conectado com sucesso'
            break
          fi
          RETRY=$$((RETRY + 1))
          if [ $$RETRY -eq $$MAX_RETRIES ]; then
            echo '❌ ERRO: Não foi possível conectar ao MinIO após 60s'
            echo '   Verifique se:'
            echo '   - Container minio está rodando e healthy'
            echo '   - MINIO_ROOT_USER/PASSWORD estão corretos'
            exit 1
          fi
          sleep 3
        done
        
        echo ''
        echo '📦 Criando bucket langfuse-events...'
        if mc mb --ignore-existing myminio/langfuse-events; then
          echo '✅ Bucket langfuse-events criado/verificado'
        else
          echo '❌ ERRO: Falha ao criar bucket langfuse-events'
          exit 1
        fi
        
        echo '🔓 Configurando permissões de download...'
        if mc anonymous set download myminio/langfuse-events; then
          echo '✅ Permissões configuradas'
        else
          echo '❌ ERRO: Falha ao configurar permissões'
          exit 1
        fi
        
        echo ''
        echo '✅ MinIO Init concluído com sucesso!'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - alice-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  clickhouse:
    # ATUALIZADO 20/12/2025: ClickHouse 24.8 LTS - tag versionada (digest removido - incompatível com amd64)
    image: clickhouse/clickhouse-server:25.12-alpine
    platform: linux/amd64
    container_name: alice-clickhouse
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # CORREÇÃO 22/12/2025: CLICKHOUSE_LISTEN_HOST é OBRIGATÓRIO!
      # O entrypoint da imagem oficial passa --listen_host=127.0.0.1 por padrão
      # Isso faz o ClickHouse escutar APENAS localhost, ignorando outras conexões
      # Sem esta variável, Langfuse não consegue conectar ao ClickHouse
      # Documentação: https://github.com/ClickHouse/ClickHouse/blob/master/docker/server/entrypoint.sh
      CLICKHOUSE_LISTEN_HOST: "0.0.0.0"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-langfuse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # REMOVIDO 22/12/2025: override.xml estava causando problemas!
      # A imagem oficial já tem docker_related_config.xml com listen_host correto
      # e listen_try=1 para ignorar falhas de IPv6. Não precisa de override.
      # O override estava sobrescrevendo listen_try e causando falha na inicialização.
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO 21/12/2025: clickhouse-client precisa de credenciais para autenticar
      # Usa variáveis de ambiente CLICKHOUSE_USER e CLICKHOUSE_PASSWORD
      # --host localhost evita problemas com resolução de hostname
      # NOTA: start_period aumentado para 120s - primeira inicialização pode demorar
      test: ["CMD-SHELL", "clickhouse-client --host localhost --user ${CLICKHOUSE_USER:-langfuse} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # LANGFUSE v3 - LLM Observability (Arquitetura Completa 2025)
  # Documentação v3: https://langfuse.com/docs/deployment/v3/overview
  # REQUISITOS v3: PostgreSQL + ClickHouse + Redis + S3/MinIO (OBRIGATÓRIO)
  # ===========================================================================
  langfuse:
    # CORREÇÃO 01/01/2026: Usar versão estável mais recente
    # A versão 3 é estável com todas as dependências corretas (S3, ClickHouse, Redis)
    image: langfuse/langfuse:3
    platform: linux/amd64
    container_name: langfuse
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # === VARIÁVEIS OBRIGATÓRIAS v3 ===
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXT_AUTH_SECRET}
      NEXTAUTH_URL: https://langfuse.yesyoudeserve.duckdns.org
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      # === DATABASE (PostgreSQL para metadados) ===
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}?sslmode=disable
      # === CLICKHOUSE (OLAP para traces - OBRIGATÓRIO v3) ===
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
      # === REDIS (Queue - usa alice-redis existente) ===
      REDIS_HOST: alice-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      # === S3/MINIO (OBRIGATÓRIO v3 para armazenamento de eventos) ===
      # CORREÇÃO CRÍTICA 01/01/2026: Langfuse v3 REQUER S3 para traces
      # Ref: https://langfuse.com/self-hosting/infrastructure/blobstorage
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # Media uploads desabilitado (usamos RAG service)
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      # === CONFIG v3 ===
      LANGFUSE_ENABLE_BACKGROUND_MIGRATIONS: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # === Variáveis Next.js para evitar problemas de inicialização ===
      NEXT_RUNTIME: nodejs
      NODE_ENV: production
    networks:
      - alice-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      # CORREÇÃO 01/01/2026: start_period aumentado para primeiro deploy (Next.js build + migrations)
      start_period: 180s
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      alice-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # CORREÇÃO 01/01/2026: Aguardar bucket ser criado antes de iniciar Langfuse
      minio-init:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`langfuse.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.langfuse.entrypoints=websecure"
      - "traefik.http.routers.langfuse.tls.certresolver=letsencrypt"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.35'

  # Langfuse Worker - Processamento assíncrono (obrigatório v3)
  # Processa traces, scores e eventos em background via ClickHouse
  langfuse-worker:
    # CORREÇÃO 01/01/2026: Mesma versão do langfuse principal
    image: langfuse/langfuse:3
    platform: linux/amd64
    container_name: langfuse-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["node", "packages/shared/dist/src/server/background-migrations/run.js"]
    environment:
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXT_AUTH_SECRET}
      NEXTAUTH_URL: https://langfuse.yesyoudeserve.duckdns.org
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
      REDIS_HOST: alice-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      # === S3/MINIO (OBRIGATÓRIO v3) ===
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
    networks:
      - alice-network
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse:
        condition: service_healthy
      minio:
        condition: service_healthy
      # CORREÇÃO 01/01/2026: Aguardar bucket ser criado antes de iniciar worker
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  langfuse-db:
    # ATUALIZADO 20/12/2025: PostgreSQL 16 Alpine (Langfuse DB)
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: alice-langfuse-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD_FILE: /run/secrets/langfuse_db_password
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
      - /opt/alice/secrets/langfuse_db_password:/run/secrets/langfuse_db_password:ro
    networks:
      - alice-network
    healthcheck:
      # pg_isready verifica se PostgreSQL aceita conexões
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 15
      # CORREÇÃO 01/01/2026: start_period aumentado para primeiro deploy (cluster init)
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  prometheus:
    # ATUALIZADO 14/12/2025: v3.0.1 -> v3.8.0 (Dec 2, 2025)
    # ATUALIZADO 27/12/2025: Digest rotacionado no Docker Hub (pull por digest anterior falhava no deploy)
    # Fonte de verdade: Docker Hub API (tag v3.8.0, linux/amd64)
    image: prom/prometheus:v3.8.1
    platform: linux/amd64
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # REGRA 6: Mapear host.docker.internal para gateway da rede Docker (Linux)
    # Docker Compose v2+ suporta "host-gateway" que resolve automaticamente para o gateway correto
    # Necessário para acessar node-exporter que usa network_mode: host (porta 9100)
    # NOTA: host.docker.internal funciona no Docker Desktop (Windows/Mac), mas em Linux
    # precisa ser mapeado explicitamente via extra_hosts com "host-gateway"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - /opt/alice/data/prometheus:/prometheus
      # Config file: caminho relativo ao diretório infra/docker/ onde docker-compose é executado
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Regras de alerta: diretório montado para Prometheus carregar via rule_files
      - ../observability/rules:/etc/prometheus/rules:ro
    networks:
      - alice-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`metrics.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  grafana:
    # ATUALIZADO 14/12/2025: Grafana 11.6.2 com SHA256 digest (Supply Chain Security 2025)
    # Grafana 11.x LTS com suporte até Jun 2026
    # ATUALIZADO 28/12/2025: Grafana 12.3.1 (major upgrade - não usamos plugins AngularJS)
    # ATUALIZADO 31/12/2025: Security hardening enterprise (best practices 2025)
    # Ref: https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/
    image: grafana/grafana:12.3.1
    platform: linux/amd64
    container_name: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # =================================================================
      # GRAFANA 12 - CONFIGURAÇÃO ENTERPRISE (31/12/2025)
      # =================================================================
      # ADMIN CREDENTIALS (obrigatórios)
      # - GRAFANA_ADMIN_USER: Username customizável (pode ser diferente de "admin")
      # - GRAFANA_ADMIN_PASSWORD: Senha forte (recomendado 8+ chars)
      # =================================================================
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # SECURITY HARDENING (Best Practices 2025)
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      GF_SECURITY_X_XSS_PROTECTION: "true"
      # SERVER CONFIG
      GF_SERVER_ROOT_URL: https://observability.yesyoudeserve.duckdns.org
      GF_SERVER_ENFORCE_DOMAIN: "true"
      # =================================================================
      # SSO OAUTH - ALICE COMO IdP (31/12/2025)
      # =================================================================
      # Deploy 100% automatizado - SSO funciona no primeiro acesso
      # Ref: https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/generic-oauth/
      # =================================================================
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Alice Enterprise
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana-sso
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/userinfo
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(role, 'super_admin') && 'Admin' || contains(role, 'admin') && 'Editor' || 'Viewer'"
      # =================================================================
      # SMTP - GRAFANA ALERTING (01/01/2026)
      # =================================================================
      # SUBSTITUIU Alertmanager - notificações de alertas via Gmail SMTP
      # Ref: https://grafana.com/docs/grafana/latest/alerting/
      # Vantagens: UI completa para Contact Points, Notification Policies
      # =================================================================
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GMAIL_USER}
      GF_SMTP_PASSWORD: ${GMAIL_APP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GMAIL_USER}
      GF_SMTP_FROM_NAME: Alice Enterprise Alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # =================================================================
      # ALERTING CONFIG (01/01/2026)
      # =================================================================
      # Unified Alerting habilitado por padrão no Grafana 12
      # Provisioning via /etc/grafana/provisioning/alerting/
      # =================================================================
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - /opt/alice/data/grafana:/var/lib/grafana
      # Config file: caminho relativo ao diretório infra/docker/ onde docker-compose é executado
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - alice-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`observability.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

