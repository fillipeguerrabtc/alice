# =============================================================================
# ALICE PLATFORM - DOCKER COMPOSE PRODUÇÃO
# =============================================================================
# Versão: 3.0
# Ambiente: Produção (Hetzner Cloud CX43)
# Servidor: 8 vCPU, 16GB RAM, 160GB NVMe SSD
# Domínio: yesyoudeserve.duckdns.org
# IP: 46.224.46.93
# =============================================================================

version: "3.9"

# =============================================================================
# NETWORKS - Redes externas (criadas manualmente no servidor)
# =============================================================================
# IMPORTANTE: Executar uma vez no servidor antes do primeiro deploy:
#   docker network create --driver bridge --subnet 172.28.0.0/16 alice-network
#   docker network create --driver bridge erpnext-network
# =============================================================================
networks:
  alice-network:
    external: true
    name: alice-network
  
  erpnext-network:
    external: true
    name: erpnext-network

# =============================================================================
# VOLUMES - Persistência de dados
# =============================================================================
volumes:
  # Alice
  postgres_data:
    name: alice-postgres-data
    driver: local
  
  traefik_acme:
    name: alice-traefik-acme
    driver: local
  
  # ERPNext
  erpnext_sites:
    name: erpnext-sites
    driver: local
  
  erpnext_logs:
    name: erpnext-logs
    driver: local
  
  mariadb_data:
    name: erpnext-mariadb-data
    driver: local
  
  redis_cache_data:
    name: erpnext-redis-cache
    driver: local
  
  redis_queue_data:
    name: erpnext-redis-queue
    driver: local

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # DOCKER SOCKET PROXY - Proxy seguro para Docker API
  # Docs 2025: Minimal proxy - 0.1 CPU, 64MB
  # ===========================================================================
  # Resolve incompatibilidade de versão da API Docker com Traefik v3.0
  # Expõe API Docker via TCP para o Traefik consumir
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: alice-dockerproxy
    restart: always
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - TASKS=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alice-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2375/version"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'

  # ===========================================================================
  # TRAEFIK INIT - Inicializa diretório ACME com permissões corretas
  # SEGURANÇA: Necessário para Traefik rodar como non-root
  # ===========================================================================
  traefik-init:
    image: busybox:1.36
    container_name: alice-traefik-init
    volumes:
      - traefik_acme:/acme
    command: ["sh", "-c", "chown -R 1001:1001 /acme && chmod 700 /acme"]
    restart: "no"
    networks:
      - alice-network

  # ===========================================================================
  # TRAEFIK - API Gateway com SSL Automático
  # Docs 2025: Traefik v3 small/medium traffic - 0.5 CPU, 512MB
  # SEGURANÇA: CAP_NET_BIND_SERVICE para portas < 1024 (Docker 2025)
  # ===========================================================================
  traefik:
    image: traefik:v3.3
    container_name: alice-traefik
    restart: unless-stopped
    user: "1001:1001"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      dockerproxy:
        condition: service_healthy
      traefik-init:
        condition: service_completed_successfully
    command:
      # API e Dashboard (desabilitado em produção por segurança)
      - "--api.dashboard=false"
      - "--api.insecure=false"
      
      # Ping endpoint para healthcheck (porta interna dedicada)
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      
      # Providers - via Docker Socket Proxy
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://dockerproxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=alice-network"
      
      # Entrypoints públicos
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      
      # SSL/TLS Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=admin@yesyoudeserve.duckdns.org"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_acme:/acme
    networks:
      - alice-network
      - erpnext-network
    labels:
      - "traefik.enable=true"
      # Middleware: Security Headers (OWASP 2025)
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-XSS-Protection=1; mode=block"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Permissions-Policy=geolocation=(), microphone=(), camera=()"
      # Middleware: Rate Limiting (100 req/s média, burst 200)
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=200"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.rate-limit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Middleware: Auth Rate Limiting (10 req/min para login)
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=10"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=20"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.period=60s"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:8082/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # POSTGRESQL - Banco de dados Alice com pgvector
  # Docs: PostgreSQL 16 recomenda 25% RAM para shared_buffers, shm_size > 64MB
  # Configuração: 3GB RAM (750MB shared_buffers), 1.5 CPU limit
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alice-postgres
    restart: always
    shm_size: '1g'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alice_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alice} -d ${POSTGRES_DB:-alice_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ===========================================================================
  # ALICE FRONTEND SERVICE - React/Nginx
  # ===========================================================================
  alice-frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    container_name: alice-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-frontend.rule=Host(`yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.alice-frontend.entrypoints=websecure"
      - "traefik.http.routers.alice-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-frontend.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-frontend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # ALICE AUTH SERVICE - Autenticação OAuth/SAML/Local
  # Docs: Node.js single-thread 0.5-1.0 CPU, 512MB RAM standard
  # ===========================================================================
  alice-auth:
    image: ${IMAGE_PREFIX}-auth:${IMAGE_TAG:-latest}
    container_name: alice-auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}
      SESSION_SECRET: ${SESSION_SECRET}
      # OAuth Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # OAuth GitHub
      GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      # OAuth Microsoft
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      # Callback URL
      OAUTH_CALLBACK_URL: https://yesyoudeserve.duckdns.org/api/auth/callback
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-auth.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.alice-auth.entrypoints=websecure"
      - "traefik.http.routers.alice-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-auth.middlewares=security-headers@docker,auth-rate-limit@docker"
      - "traefik.http.services.alice-auth.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Docs 2025: Node.js 20 light service - 0.5 CPU, 512MB
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ===========================================================================
  # ALICE CHAT SERVICE - Conversas + WebSocket + LLM
  # Docs 2025: Node.js 20 + WebSocket streaming - 1.0 CPU, 1GB
  # ===========================================================================
  alice-chat:
    image: ${IMAGE_PREFIX}-chat:${IMAGE_TAG:-latest}
    container_name: alice-chat
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVICE_NAME: chat-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}
      # Salad Cloud LLM
      SALAD_API_KEY: ${SALAD_API_KEY}
      SALAD_ORGANIZATION_ID: ${SALAD_ORGANIZATION_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-chat.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/chat`)"
      - "traefik.http.routers.alice-chat.entrypoints=websecure"
      - "traefik.http.routers.alice-chat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-chat.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-chat.loadbalancer.server.port=3002"
      # WebSocket
      - "traefik.http.routers.alice-ws.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.alice-ws.entrypoints=websecure"
      - "traefik.http.routers.alice-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-ws.middlewares=rate-limit@docker"
      - "traefik.http.services.alice-ws.loadbalancer.server.port=3002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/chat/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # ALICE RAG SERVICE - Knowledge Base + Embeddings
  # Docs 2025: Node.js 20 + pgvector queries - 1.0 CPU, 1GB
  # ===========================================================================
  alice-rag:
    image: ${IMAGE_PREFIX}-rag:${IMAGE_TAG:-latest}
    container_name: alice-rag
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      SERVICE_NAME: rag-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-rag.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/rag`)"
      - "traefik.http.routers.alice-rag.entrypoints=websecure"
      - "traefik.http.routers.alice-rag.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-rag.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-rag.loadbalancer.server.port=3003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/rag/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # ALICE TRAINING SERVICE - Fine-tuning + Aprendizado
  # Docs 2025: Node.js 20 standard - 0.75 CPU, 768MB
  # ===========================================================================
  alice-training:
    image: ${IMAGE_PREFIX}-training:${IMAGE_TAG:-latest}
    container_name: alice-training
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      SERVICE_NAME: training-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}
      SALAD_API_KEY: ${SALAD_API_KEY}
      SALAD_ORGANIZATION_ID: ${SALAD_ORGANIZATION_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-training.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/training`)"
      - "traefik.http.routers.alice-training.entrypoints=websecure"
      - "traefik.http.routers.alice-training.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-training.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-training.loadbalancer.server.port=3004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/api/training/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.75'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # ALICE INTEGRATIONS SERVICE - ERPNext, Stripe, Twilio
  # Docs 2025: Node.js 20 light - 0.5 CPU, 512MB
  # ===========================================================================
  alice-integrations:
    image: ${IMAGE_PREFIX}-integrations:${IMAGE_TAG:-latest}
    container_name: alice-integrations
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      SERVICE_NAME: integrations-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}
      # Stripe Portugal
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # ERPNext
      ERPNEXT_URL: http://erpnext-backend:8000
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      # Resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Wise (pagamentos globais)
      WISE_API_KEY: ${WISE_API_KEY}
      WISE_PROFILE_ID: ${WISE_PROFILE_ID}
      WISE_WEBHOOK_SECRET: ${WISE_WEBHOOK_SECRET}
      WISE_SANDBOX: ${WISE_SANDBOX:-false}
      # Inter-service communication
      CHAT_SERVICE_URL: http://alice-chat:3002
    depends_on:
      postgres:
        condition: service_healthy
      alice-chat:
        condition: service_healthy
    networks:
      - alice-network
      - erpnext-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-integrations.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/integrations`)"
      - "traefik.http.routers.alice-integrations.entrypoints=websecure"
      - "traefik.http.routers.alice-integrations.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-integrations.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-integrations.loadbalancer.server.port=3005"
      # Webhook Stripe (rota específica)
      - "traefik.http.routers.alice-webhook.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/webhook`)"
      - "traefik.http.routers.alice-webhook.entrypoints=websecure"
      - "traefik.http.routers.alice-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-webhook.middlewares=security-headers@docker"
      - "traefik.http.services.alice-webhook.loadbalancer.server.port=3005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/api/integrations/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ===========================================================================
  # ERPNEXT STACK - Baseado em frappe_docker oficial
  # ===========================================================================
  
  # MariaDB - Banco de dados ERPNext
  # Docs 2025: MariaDB 10.11 production - 1.5 CPU, 2GB
  # innodb_buffer_pool_size = 70% do container memory (1.4GB para 2GB container)
  erpnext-mariadb:
    image: mariadb:10.11
    container_name: erpnext-mariadb
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=1400M
      - --innodb-buffer-pool-instances=2
      - --max-connections=50
      - --query-cache-type=OFF
      - --query-cache-size=0
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --key-buffer-size=16M
      - --table-open-cache=400
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --expire-logs-days=7
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD:-erpnext_root_password}
      MYSQL_DATABASE: ${ERPNEXT_DB_NAME:-erpnext}
      MYSQL_USER: ${ERPNEXT_DB_USER:-erpnext}
      MYSQL_PASSWORD: ${ERPNEXT_DB_PASSWORD:-erpnext_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ERPNEXT_MYSQL_ROOT_PASSWORD:-erpnext_root_password}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis Cache - Cache ERPNext
  # Docs 2025: Redis 7.4 cache - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL habilitado com autenticação (GAP-ERPNEXT-001)
  erpnext-redis-cache:
    image: redis:7-alpine
    container_name: erpnext-redis-cache
    restart: always
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:-redis_cache_secure_2025}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_cache_data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD:-redis_cache_secure_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Redis Queue - Filas ERPNext
  # Docs 2025: Redis 7.4 queue - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL habilitado com autenticação (GAP-ERPNEXT-001)
  erpnext-redis-queue:
    image: redis:7-alpine
    container_name: erpnext-redis-queue
    restart: always
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_QUEUE_PASSWORD:-redis_queue_secure_2025}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_queue_data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_QUEUE_PASSWORD:-redis_queue_secure_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # ERPNext Configurator - Configura common_site_config.json na primeira execução
  # NOTA: Serviço executa UMA VEZ e termina (restart: "no") - Padrão oficial frappe_docker
  # ===========================================================================
  erpnext-configurator:
    image: frappe/erpnext:v15
    container_name: erpnext-configurator
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erpnext-mariadb;
        bench set-config -g db_port 3306;
        bench set-config -g redis_cache "redis://:${REDIS_CACHE_PASSWORD:-redis_cache_secure_2025}@erpnext-redis-cache:6379";
        bench set-config -g redis_queue "redis://:${REDIS_QUEUE_PASSWORD:-redis_queue_secure_2025}@erpnext-redis-queue:6379";
        bench set-config -g redis_socketio "redis://:${REDIS_QUEUE_PASSWORD:-redis_queue_secure_2025}@erpnext-redis-queue:6379";
        echo "Configuração ERPNext concluída com sucesso (Redis ACL habilitado)!"
    environment:
      - DB_HOST=erpnext-mariadb
      - DB_PORT=3306
      - REDIS_CACHE_PASSWORD=${REDIS_CACHE_PASSWORD:-redis_cache_secure_2025}
      - REDIS_QUEUE_PASSWORD=${REDIS_QUEUE_PASSWORD:-redis_queue_secure_2025}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    networks:
      - erpnext-network

  # ===========================================================================
  # ERPNext Create-Site - Cria o site na primeira instalação
  # NOTA: Serviço executa UMA VEZ e termina (restart: "no") - Padrão oficial frappe_docker
  # Credenciais padrão: admin/admin (alterar após primeira instalação)
  # IDEMPOTENTE: Se site já existe, sai com sucesso (exit 0)
  # ===========================================================================
  erpnext-create-site:
    image: frappe/erpnext:v15
    container_name: erpnext-create-site
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        echo "=== ERPNext Create-Site ===";
        
        if [[ -d "sites/${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}" ]]; then
          echo "Site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org} já existe.";
          echo "Pulando criação. Deploy subsequente detectado.";
          exit 0;
        fi;
        
        export START=$$(date +%s);
        echo "Aguardando common_site_config.json...";
        until [[ -f "sites/common_site_config.json" ]] || [[ $$(date +%s) -gt $$((START + 180)) ]]; do
          sleep 5;
          echo "  Verificando... ($$(( $$(date +%s) - START ))s)";
        done;
        
        if [[ ! -f "sites/common_site_config.json" ]]; then
          echo "ERRO: common_site_config.json não encontrado após 180s";
          exit 1;
        fi;
        
        echo "common_site_config.json encontrado!";
        echo "Criando site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}...";
        
        bench new-site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
          --mariadb-root-password=${ERPNEXT_MYSQL_ROOT_PASSWORD:-erpnext_root_password}
          --admin-password=${ERPNEXT_ADMIN_PASSWORD:-admin}
          --install-app=erpnext
          --mariadb-user-host-login-scope=%;
        
        bench --site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org} set-config host_name "https://${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}";
        
        echo "Site ERPNext criado com sucesso!"
    environment:
      - ERPNEXT_SITE_NAME=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      - ERPNEXT_MYSQL_ROOT_PASSWORD=${ERPNEXT_MYSQL_ROOT_PASSWORD:-erpnext_root_password}
      - ERPNEXT_ADMIN_PASSWORD=${ERPNEXT_ADMIN_PASSWORD:-admin}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
    networks:
      - erpnext-network

  # ERPNext Backend - Frappe/Python
  # Docs 2025: Frappe/Gunicorn production - 1.5 CPU, 2GB
  erpnext-backend:
    image: frappe/erpnext:v15
    container_name: erpnext-backend
    restart: always
    command: bench serve --port 8000
    environment:
      - FRAPPE_SITE_NAME_HEADER=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    networks:
      - erpnext-network
      - alice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/frappe.ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ERPNext Frontend - Nginx
  # Docs 2025: Nginx static - 0.25 CPU, 256MB
  erpnext-frontend:
    image: frappe/erpnext:v15
    container_name: erpnext-frontend
    restart: always
    command: nginx-entrypoint.sh
    environment:
      - BACKEND=erpnext-backend:8000
      - SOCKETIO=erpnext-websocket:9000
      - FRAPPE_SITE_NAME_HEADER=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    networks:
      - erpnext-network
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext.rule=Host(`erp.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.erpnext.entrypoints=websecure"
      - "traefik.http.routers.erpnext.tls.certresolver=letsencrypt"
      - "traefik.http.services.erpnext.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ERPNext WebSocket - Socket.io
  # Docs 2025: Node.js Socket.io - 0.3 CPU, 256MB
  erpnext-websocket:
    image: frappe/erpnext:v15
    container_name: erpnext-websocket
    restart: always
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      - erpnext-redis-cache
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ERPNext Scheduler - Tarefas agendadas
  # Docs 2025: Python scheduler - 0.3 CPU, 512MB
  erpnext-scheduler:
    image: frappe/erpnext:v15
    container_name: erpnext-scheduler
    restart: always
    command: bench schedule
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-backend:
        condition: service_healthy
    networks:
      - erpnext-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ERPNext Worker - Short Jobs
  # Docs 2025: Python worker short - 0.4 CPU, 512MB
  erpnext-worker-short:
    image: frappe/erpnext:v15
    container_name: erpnext-worker-short
    restart: always
    command: bench worker --queue short
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-backend:
        condition: service_healthy
    networks:
      - erpnext-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.4'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ERPNext Worker - Default Jobs
  # Docs 2025: Python worker default - 0.4 CPU, 512MB
  erpnext-worker-default:
    image: frappe/erpnext:v15
    container_name: erpnext-worker-default
    restart: always
    command: bench worker --queue default
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-backend:
        condition: service_healthy
    networks:
      - erpnext-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.4'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ERPNext Worker - Long Jobs
  # Docs 2025: Python worker heavy - 0.75 CPU, 1GB
  erpnext-worker-long:
    image: frappe/erpnext:v15
    container_name: erpnext-worker-long
    restart: always
    command: bench worker --queue long
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-backend:
        condition: service_healthy
    networks:
      - erpnext-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # OBSERVABILIDADE - Logging centralizado
  # Docs 2025: Vector log collector - 0.25 CPU, 256MB
  # ===========================================================================
  vector:
    image: timberio/vector:0.34.0-alpine
    container_name: alice-vector
    restart: always
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NODE_ENV: production
    networks:
      - alice-network
    depends_on:
      - traefik
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
