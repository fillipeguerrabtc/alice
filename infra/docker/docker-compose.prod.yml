  jaeger:
    # ATUALIZADO 28/12/2025: Jaeger v2.13.0 (migração URGENTE - v1 EOL em 31/12/2025)
    # MUDANÇAS v1→v2: Imagem unificada 'jaeger' (não mais 'all-in-one'), healthcheck porta 13133
    # STORAGE: Badger configurado via YAML (env vars não suportadas em v2)
    # Ref: https://www.jaegertracing.io/docs/2.13/getting-started/
    image: jaegertracing/jaeger:2.13.0
    platform: linux/amd64
    container_name: jaeger
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # ENTERPRISE 28/12/2025: Jaeger v2 requer config YAML para Badger storage
    # Environment variables (SPAN_STORAGE_TYPE, BADGER_*) não são mais suportadas
    command: ["--config", "/etc/jaeger/jaeger-config.yml"]
    volumes:
      # Config file: caminho relativo ao diretório infra/docker/ onde docker-compose é executado
      - ../observability/jaeger/jaeger-config.yml:/etc/jaeger/jaeger-config.yml:ro
