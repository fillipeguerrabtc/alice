  # ===========================================================================
  # ALERTMANAGER REMOVIDO (01/01/2026)
  # ===========================================================================
  # MOTIVO: Grafana Alerting substitui 100% das funcionalidades do Alertmanager
  # com vantagens significativas:
  # - UI completa para configurar Contact Points, Notification Policies, Mute Timings
  # - Não requer edição de arquivos YAML para mudar configurações
  # - Suporta múltiplas fontes de dados (não só Prometheus)
  # - Elimina container redundante (-256MB RAM, -1 container)
  #
  # MIGRAÇÃO: Todas as 18 regras de alerta foram migradas para Grafana Alerting
  # via provisioning em /etc/grafana/provisioning/alerting/
  #
  # SMTP: Grafana usa mesmo Gmail SMTP via variáveis GF_SMTP_*
  # ===========================================================================

  # ===========================================================================
  # OTEL COLLECTOR - Pipeline unificado de telemetria
  # ===========================================================================
  otel-collector:
    # ATUALIZADO 14/12/2025: 0.114.0 -> 0.141.0 (Dec 3, 2025)
    image: otel/opentelemetry-collector-contrib:0.142.0
    platform: linux/amd64
    container_name: alice-otel-collector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      # Config file: caminho relativo ao diretório infra/docker/ onde docker-compose é executado
      - ../../apps/observability-service/config/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks:
      - alice-network
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # NODE EXPORTER - Métricas do host
  # ===========================================================================
  node-exporter:
    # ATUALIZADO 20/12/2025: Node Exporter v1.8.2 - tag versionada (digest removido - incompatível com amd64)
    image: prom/node-exporter:v1.9.1
    platform: linux/amd64
    container_name: alice-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
      - '--collector.netclass.ignored-devices=^(veth.*|docker.*|br-.*)$$'
      - '--collector.netdev.device-exclude=^(veth.*|docker.*|br-.*)$$'
      - '--web.listen-address=:9100'
    healthcheck:
      # CORREÇÃO 20/12/2025: Node Exporter é baseado em busybox/static - não tem wget/curl
      # Usar /proc/net/tcp para verificar se porta 9100 está escutando (0x238C = 9100 em hex)
      test: ["CMD-SHELL", "grep -q ':238C' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
        reservations:
          memory: 64M
          cpus: '0.05'

  # ===========================================================================
  # CADVISOR - Métricas de containers Docker
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    platform: linux/amd64
    container_name: alice-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "9101:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - alice-network
    healthcheck:
      # cAdvisor tem wget disponível na imagem
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # PGBACKREST - Backup Enterprise PostgreSQL (WAL Archiving + Incremental)
  # Docs 2025: pgBackRest 2.57 com AES-256 encryption
  # SEGURANÇA: Container hardening + Imagem customizada buildada no CI/CD
  # REGRA 6: Enterprise-grade (sem placeholders, imagem buildada)
  # ===========================================================================
  pgbackrest:
    image: ${IMAGE_PREFIX}-pgbackrest:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-pgbackrest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      # Spool directory necessário para archive-async=y (operações assíncronas de arquivamento)
      # pgBackRest precisa de escrita neste diretório para status files e queue de arquivamento
      - /var/spool/pgbackrest:mode=1777,size=256M
    environment:
      # Stanza name (deve corresponder ao nome no pgbackrest.conf e entrypoint.sh)
      PGBACKREST_STANZA: alice_prod
      # ==========================================================================
      # CORREÇÃO CRÍTICA 30/12/2025: Conexão SQL via libpq (NÃO SSH)
      # ==========================================================================
      # pgBackRest usa libpq para conexões SQL quando pg1-host NÃO está no config.
      # As variáveis PGHOST, PGPORT, PGUSER, PGPASSWORD são padrão do PostgreSQL/libpq.
      # Ref: https://www.postgresql.org/docs/current/libpq-envars.html
      # ==========================================================================
      # Conexão SQL via libpq (variáveis padrão PostgreSQL)
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-alice}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-alice_prod}
      # Caminho dos dados PostgreSQL (volume montado no container pgBackRest)
      # IMPORTANTE: Este é o caminho DENTRO do container pgBackRest
      PGBACKREST_DB_PATH: /var/lib/postgresql/data
      # Repositório de backup (caminho DENTRO do container, não do host)
      # O volume /opt/alice/backups/postgresql do host é montado em /var/lib/pgbackrest no container
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      # Retenção de backups
      PGBACKREST_REPO1_RETENTION_FULL: 15
      PGBACKREST_REPO1_RETENTION_DIFF: 7
      PGBACKREST_REPO1_RETENTION_ARCHIVE: 30
      # Criptografia
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
      # Logging
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGBACKREST_LOG_LEVEL_FILE: detail
    volumes:
      # Dados PostgreSQL (read-only para backup)
      - postgres_data:/var/lib/postgresql/data:ro
      # CORREÇÃO 31/12/2025: Volume wal_archive REMOVIDO - não mais necessário
      # Com imagem customizada PostgreSQL, archive_command='pgbackrest archive-push %p'
      # é executado DENTRO do container PostgreSQL, arquivando diretamente no repositório
      # pgBackRest container apenas executa backups full/diff/incr e restore
      # Repositório de backups (volume Hetzner persistente) - rw explícito necessário com read_only: true
      - /opt/alice/backups/postgresql:/var/lib/pgbackrest:rw
      # Logs persistentes (volume Hetzner para troubleshooting) - rw explícito necessário com read_only: true
      - /opt/alice/backups/postgresql/logs:/var/log/pgbackrest:rw
      # Configuração pgBackRest (read-only)
      # Caminho relativo: docker-compose está em infra/docker/, config está em infra/backup/
      - ../backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO BUG #2: Usar variável de ambiente PGBACKREST_STANZA (default: alice_prod)
      # Usa script wrapper que expande corretamente a variável de ambiente
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

# =============================================================================
# GPU SERVICES - RTX 4000 Ada 20GB (Hetzner GEX44)
# =============================================================================
# ARQUITETURA GPU TIME-SHARING ENTERPRISE (27/12/2025):
#
# PROBLEMA: GPU única de 20GB não suporta múltiplos modelos grandes simultaneamente
# - Mixtral 8x7B AWQ: ~16-18GB VRAM
# - Qwen3-Embedding-8B: ~15-16GB VRAM
# - FLUX.1 Schnell: ~10-12GB VRAM
# - Canary-1B: ~2-4GB VRAM
#
# SOLUÇÃO: Docker Compose PROFILES para controle granular (Best Practice 2025)
# - Profile "gpu-llm": Apenas Mixtral (LLM principal para chat)
# - Profile "gpu-embeddings": Apenas embeddings (indexação RAG)
# - Profile "gpu-flux": Apenas FLUX (geração de imagens)
# - Profile "gpu-asr": Apenas ASR (transcrição de áudio)
# - Profile "gpu-training": Apenas trainer (fine-tuning LoRA)
#
# USO:
#   docker compose --profile gpu-llm up -d           # Iniciar Mixtral
#   docker compose --profile gpu-embeddings up -d   # Iniciar Embeddings
#   docker compose --profile gpu-llm down           # Parar Mixtral antes de trocar
#
# NOTA: Apenas UM profile GPU deve estar ativo por vez (GPU única)!
# GPU Manager detecta serviços indisponíveis e retorna 503 apropriado.
# =============================================================================

  # =============================================================================
  # Mixtral 8x7B vLLM - LLM Principal (PROFILE: gpu-llm)
  # =============================================================================
  gpu-mixtral:
    image: ${IMAGE_PREFIX}-mixtral-vllm:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-mixtral
    restart: unless-stopped
    runtime: nvidia
    profiles:
      - gpu-llm
    security_opt:
      - no-new-privileges:true
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${MIXTRAL_MODEL_NAME:-TheBloke/Mixtral-8x7B-Instruct-v0.1-AWQ}
      - QUANTIZATION=${MIXTRAL_QUANTIZATION:-awq}
      - MAX_MODEL_LEN=${MIXTRAL_MAX_MODEL_LEN:-32768}
      # ENTERPRISE-GRADE (25/12/2025): Otimizado para 20GB VRAM (GEX44 RTX 4000 Ada)
      # 0.85 = 85% de 20GB = 17GB (margem de ~3GB para variações)
      # Mixtral 8x7B AWQ 4-bit usa ~16-18GB, então 17GB é suficiente e seguro
      - GPU_MEMORY_UTILIZATION=${MIXTRAL_GPU_MEMORY_UTILIZATION:-0.85}
      - TENSOR_PARALLEL_SIZE=${MIXTRAL_TENSOR_PARALLEL_SIZE:-1}
      - HOST=0.0.0.0
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"  # Apenas localhost (não expor externamente)
    networks:
      - alice-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 20G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Embeddings GPU - Qwen3 + OpenCLIP (PROFILE: gpu-embeddings)
