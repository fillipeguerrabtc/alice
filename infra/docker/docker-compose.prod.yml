        reservations:
          memory: 4G
          cpus: '2.0'
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ===========================================================================
  # ERPNEXT STACK - Baseado em frappe_docker oficial
  # ===========================================================================
  
  # MariaDB - Banco de dados ERPNext
  # Docs 2025: MariaDB 10.11 production - 1.5 CPU, 2GB
  # innodb_buffer_pool_size = 70% do container memory (1.4GB para 2GB container)
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  erpnext-mariadb:
    image: mariadb:10.11@sha256:896f79e37178838799a8af4c8e4431b26352d5770cf7edd803b7fcadba7d953d
    platform: linux/amd64
    container_name: erpnext-mariadb
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /run/mysqld:mode=1777,size=8M
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=1400M
      - --innodb-buffer-pool-instances=2
      - --max-connections=50
      - --query-cache-type=OFF
      - --query-cache-size=0
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --key-buffer-size=16M
      - --table-open-cache=400
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --expire-logs-days=7
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD:?ERPNEXT_MYSQL_ROOT_PASSWORD obrigatorio}
      MYSQL_DATABASE: ${ERPNEXT_DB_NAME:-erpnext}
      MYSQL_USER: ${ERPNEXT_DB_USER:-erpnext}
      MYSQL_PASSWORD: ${ERPNEXT_DB_PASSWORD:?ERPNEXT_DB_PASSWORD obrigatorio}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ERPNEXT_MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis Cache - Cache ERPNext
  # Docs 2025: Redis 7.4 cache - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL + Image digest SHA256 (Supply Chain Security 2025)
  erpnext-redis-cache:
    image: redis:7-alpine@sha256:4706ecab5371690fecfdd782268929c94ad5b5ce9ce0b35bfdfe191c4ad17851
    platform: linux/amd64
    container_name: erpnext-redis-cache
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD obrigatorio}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_cache_data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Redis Queue - Filas ERPNext
  # Docs 2025: Redis 7.4 queue - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL + Image digest SHA256 (Supply Chain Security 2025)
  erpnext-redis-queue:
    image: redis:7-alpine@sha256:4706ecab5371690fecfdd782268929c94ad5b5ce9ce0b35bfdfe191c4ad17851
    platform: linux/amd64
    container_name: erpnext-redis-queue
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD obrigatorio}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_queue_data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_QUEUE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===================================================================
  # ERPNext restante (services) - mantidos conforme original
  # ===================================================================
  erpnext-configurator:
    image: frappe/erpnext:v15.38.6@sha256:3ea8dbb32c1882272b48f31e73d71a9a8d0a04139a0d2e190ca3ffa2efd5b1d8
    platform: linux/amd64
    container_name: erpnext-configurator
    restart: "no"
    # REGRA 16: Security Hardening - no-new-privileges (init precisa escrever, não pode ter read_only)
    security_opt:
      - no-new-privileges:true
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    # REGRA 6 + Security: gera URLs Redis de forma segura sem reinterpretação pelo shell
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        CACHE_URL="$(printf 'redis://:%s@erpnext-redis-cache:6379' "$REDIS_CACHE_PASSWORD")"
        QUEUE_URL="$(printf 'redis://:%s@erpnext-redis-queue:6379' "$REDIS_QUEUE_PASSWORD")"
        bench set-config -g db_host erpnext-mariadb
        bench set-config -g db_port 3306
        bench set-config -g redis_cache "$CACHE_URL"
        bench set-config -g redis_queue "$QUEUE_URL"
    environment:
      SITE_NAME: ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      DB_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      INSTALL_APPS: "erpnext"
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_QUEUE_PASSWORD: ${REDIS_QUEUE_PASSWORD}
    networks:
      - erpnext-network
    depends_on:
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    # REGRA 16: Resource limits para init containers (best practice enterprise)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  erpnext-create-site:
    image: frappe/erpnext:v15.38.6@sha256:3ea8dbb32c1882272b48f31e73d71a9a8d0a04139a0d2e190ca3ffa2efd5b1d8
    platform: linux/amd64
    container_name: erpnext-create-site
    restart: "no"
    # REGRA 16: Security Hardening - no-new-privileges (init precisa escrever, não pode ter read_only)
    security_opt:
      - no-new-privileges:true
    command: ["new", "--db-root-password", "${ERPNEXT_MYSQL_ROOT_PASSWORD}", "--admin-password", "${ERPNEXT_ADMIN_PASSWORD}", "--install-app", "erpnext", "${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}"]
    environment:
      SITE_NAME: ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      DB_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      INSTALL_APPS: "erpnext"
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    # REGRA 16: Resource limits para init containers (best practice enterprise)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  erpnext-backend:
    image: frappe/erpnext:v15.38.6@sha256:3ea8dbb32c1882272b48f31e73d71a9a8d0a04139a0d2e190ca3ffa2efd5b1d8
    platform: linux/amd64
    container_name: erpnext-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/method/frappe.health.check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["bench", "serve", "--port", "8000"]
    environment:
      DB_HOST: erpnext-mariadb
      DB_PORT: 3306
      DB_NAME: ${ERPNEXT_DB_NAME:-erpnext}
