        max-file: "3"

  # =============================================================================
  # GPU Manager Service - Gerenciamento Centralizado de Requisições GPU
  # =============================================================================
  # ENTERPRISE (27/12/2025): gpu-manager NÃO depende dos containers GPU
  # - Containers GPU são opcionais via PROFILES (apenas um ativo por vez)
  # - gpu-manager detecta dinamicamente quais serviços estão disponíveis
  # - Retorna 503 Service Unavailable para serviços não disponíveis
  # - Permite deploy inicial sem GPU (serviços core funcionam normalmente)
  gpu-manager:
    image: ${IMAGE_PREFIX}-gpu-manager:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-gpu-manager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.prod
    environment:
      - PORT=3010
      - REDIS_URL=${REDIS_URL:?REDIS_URL é obrigatório}
      # CORREÇÃO 28/12/2025: INTERNAL_API_SECRET obrigatório em produção (Regra 6)
      # gpu-manager-service/index.ts linha 56-60 exige esta variável
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET é obrigatório}
      # URLs dos serviços GPU (verificados dinamicamente via healthcheck)
      - MIXTRAL_GPU_URL=${MIXTRAL_GPU_URL:-http://gpu-mixtral:8000}
      - EMBEDDINGS_GPU_URL=${EMBEDDINGS_GPU_URL:-http://gpu-embeddings:8000}
      - TRAINING_GPU_URL=${TRAINING_GPU_URL:-http://gpu-trainer:8000}
      - FLUX_GPU_URL=${FLUX_GPU_URL:-http://gpu-flux:8000}
      - ASR_GPU_URL=${ASR_GPU_URL:-http://gpu-asr:8000}
      - NODE_ENV=production
      # Timeout padrão para requisições GPU (ms) - LLM inference pode levar 30-60s+
      - GPU_SERVICE_TIMEOUT=${GPU_SERVICE_TIMEOUT:-60000}
    ports:
      - "127.0.0.1:3010:3010"  # Apenas localhost
    networks:
      - alice-network
    depends_on:
      alice-redis:
        condition: service_healthy
      # REMOVIDO: Dependências de containers GPU (agora são opcionais via profiles)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      # CORREÇÃO 01/01/2026: Alpine usa "node" no PATH (não /nodejs/bin/node do Distroless)
      # /live verifica se processo está vivo (liveness probe)
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3010/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

