      # ERPNext (opcionais - gerados após deploy via ERPNext UI)
      ERPNEXT_URL: http://erpnext-backend:8000
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      # Resend
      RESEND_API_KEY: ${RESEND_API_KEY}
      # Wise (pagamentos globais)
      WISE_API_KEY: ${WISE_API_KEY}
      WISE_PROFILE_ID: ${WISE_PROFILE_ID}
      # Wise webhook secret (opcional - gerado após configurar webhook no Wise Dashboard)
      WISE_WEBHOOK_SECRET: ${WISE_WEBHOOK_SECRET:-}
      # Wise sandbox mode (opcional - default: false para produção)
      WISE_SANDBOX: ${WISE_SANDBOX:-false}
      # Inter-service communication
      CHAT_SERVICE_URL: http://alice-chat:3002
      TRAINING_SERVICE_URL: http://alice-training:3004
      # RAG Service para indexação de mídia WhatsApp (15/12/2025)
      RAG_SERVICE_URL: http://alice-rag:3003
      # Qdrant - Banco vetorial para texto (4096 dim) - 17/12/2025
      QDRANT_URL: http://alice-qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # KuCoin Futures API (Trading BTC Perpetuals) - CORREÇÃO 17/12/2025
      # Usar nomes corretos dos secrets GitHub (KUCOIN_PRO_*)
      KUCOIN_PRO_API_KEY: ${KUCOIN_PRO_API_KEY:-}
      KUCOIN_PRO_API_SECRET: ${KUCOIN_PRO_API_SECRET:-}
      KUCOIN_PRO_API_PASSPHRASE: ${KUCOIN_PRO_API_PASSPHRASE:-}
      KUCOIN_PRO_BASE_URL: ${KUCOIN_PRO_BASE_URL:-https://api-futures.kucoin.com}
      KUCOIN_SANDBOX_MODE: ${KUCOIN_SANDBOX_MODE:-false}
      # Redis Cache distribuído (OBRIGATÓRIO em produção - Regra 6)
      # BUG FIX 21/12/2025: REDIS_URL estava FALTANDO - rate limiting requer Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      alice-chat:
        condition: service_healthy
      alice-rag:
        condition: service_healthy
      alice-qdrant:
        condition: service_healthy
      alice-redis:
        condition: service_healthy
    networks:
      - alice-network
      - erpnext-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-integrations.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/integrations`)"
      - "traefik.http.routers.alice-integrations.entrypoints=websecure"
      - "traefik.http.routers.alice-integrations.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-integrations.middlewares=security-headers@docker,rate-limit@docker"
      # BUG FIX 23/12/2025: Especificar service explícito (evita "cannot be linked automatically with multiple Services")
      - "traefik.http.routers.alice-integrations.service=alice-integrations"
      - "traefik.http.services.alice-integrations.loadbalancer.server.port=3005"
      # Webhook Stripe (rota específica)
      # BUG FIX 23/12/2025: Router alice-webhook deve usar o mesmo serviço alice-integrations
      # Não existe serviço separado alice-webhook - ambos routers apontam para alice-integrations:3005
      - "traefik.http.routers.alice-webhook.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/webhook`)"
      - "traefik.http.routers.alice-webhook.entrypoints=websecure"
      - "traefik.http.routers.alice-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-webhook.middlewares=security-headers@docker"
      # BUG FIX 23/12/2025: Especificar service explícito apontando para alice-integrations (mesmo serviço)
      - "traefik.http.routers.alice-webhook.service=alice-integrations"
    healthcheck:
      # Distroless não tem curl/wget, usar Node.js diretamente
      # CORREÇÃO 21/12/2025: Usar /live (liveness probe - processo vivo) para Docker healthcheck
      # /ready verifica dependências externas (ERPNext, Stripe) - pode falhar temporariamente
      # Docker healthcheck deve verificar se PROCESSO está vivo, não dependências externas
      # Docker Compose v2+ requer "CMD" como primeiro elemento do array
      test: ["CMD", "/nodejs/bin/node", "-e", "const r=require('http').get('http://localhost:3005/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ===========================================================================
  # ALICE OBSERVABILITY SERVICE - Health Checker + Backup Orchestrator
  # ===========================================================================
  alice-observability:
    image: ${IMAGE_PREFIX}-observability:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-observability
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    # REGRA 6: env_file carrega CORS_ORIGINS do .env.prod (obrigatório em produção)
    # Docker Compose v2+ garante que variáveis do .env.prod estejam disponíveis
    # para expansão em environment: e uso no código Node.js
    env_file:
      - .env.prod
    volumes:
      # Volume Hetzner para backups e manifestos - rw explícito necessário com read_only: true
      - /opt/alice/backups:/opt/alice/backups:rw
    environment:
      NODE_ENV: production
      PORT: 3007
      SERVICE_NAME: observability-service
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      # Backup configuração (100% local - SEM S3)
      BACKUP_DIR: /opt/alice/backups
      UPLOADS_DIR: /opt/alice/uploads
      # CORREÇÃO 21/12/2025: sslmode=disable para conexões internas Docker (PostgreSQL sem SSL)
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      # URLs internas dos serviços de observabilidade
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      JAEGER_URL: http://jaeger:16686
      LANGFUSE_URL: http://langfuse:3000
      # URLs externas para UI
      GRAFANA_EXTERNAL_URL: https://observability.yesyoudeserve.duckdns.org
      PROMETHEUS_EXTERNAL_URL: https://metrics.yesyoudeserve.duckdns.org
      JAEGER_EXTERNAL_URL: https://traces.yesyoudeserve.duckdns.org
      LANGFUSE_EXTERNAL_URL: https://langfuse.yesyoudeserve.duckdns.org
      # Redis Cache distribuído (OBRIGATÓRIO em produção - Regra 6)
      # BUG FIX 21/12/2025: REDIS_URL estava FALTANDO - rate limiting requer Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
    depends_on:
      traefik:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alice-redis:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-observability.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/observability`)"
      - "traefik.http.routers.alice-observability.entrypoints=websecure"
      - "traefik.http.routers.alice-observability.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-observability.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-observability.loadbalancer.server.port=3007"
    healthcheck:
      # Distroless não tem curl/wget, usar Node.js diretamente
      # BUG FIX 23/12/2025: Usar /health em vez de /live (endpoint /live requer autenticação INTERNAL_API_SECRET)
      # /health não requer autenticação e é adequado para Docker healthcheck (verifica se processo está vivo)
      # /ready verifica observability stack (Prometheus, Grafana) - pode falhar temporariamente
      # Docker healthcheck deve verificar se PROCESSO está vivo, não dependências externas
      # Docker Compose v2+ requer "CMD" como primeiro elemento do array
      test: ["CMD", "/nodejs/bin/node", "-e", "const r=require('http').get('http://localhost:3007/health',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # ERPNEXT STACK - Baseado em frappe_docker oficial
  # ===========================================================================
  # NOTA (17/12/2025): Container alice-clip-inference foi REMOVIDO.
  # Motivo: Arquitetura migrada para 100% GPU Salad Cloud:
  # - Embeddings de texto: Qwen3-Embedding-8B (4096 dim) → Qdrant
  # - Embeddings de imagem: OpenCLIP ViT-H/14 (1024 dim) → pgvector
  # - ASR: Canary-1B → Salad Cloud
  # Serviços agora usam EMBEDDINGS_GPU_URL diretamente.
  # ===========================================================================
  
  # MariaDB - Banco de dados ERPNext
  # Docs 2025: MariaDB 10.11 production - 1.5 CPU, 2GB
  # innodb_buffer_pool_size = 70% do container memory (1.4GB para 2GB container)
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  erpnext-mariadb:
    image: mariadb:10.11@sha256:896f79e37178838799a8af4c8e4431b26352d5770cf7edd803b7fcadba7d953d
    platform: linux/amd64
    container_name: erpnext-mariadb
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /run/mysqld:mode=1777,size=8M
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=1400M
      - --innodb-buffer-pool-instances=2
      - --max-connections=50
      - --query-cache-type=OFF
      - --query-cache-size=0
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --key-buffer-size=16M
      - --table-open-cache=400
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --expire-logs-days=7
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD:?ERPNEXT_MYSQL_ROOT_PASSWORD obrigatorio}
      MYSQL_DATABASE: ${ERPNEXT_DB_NAME:-erpnext}
      MYSQL_USER: ${ERPNEXT_DB_USER:-erpnext}
      MYSQL_PASSWORD: ${ERPNEXT_DB_PASSWORD:?ERPNEXT_DB_PASSWORD obrigatorio}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ERPNEXT_MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis Cache - Cache ERPNext
  # Docs 2025: Redis 7.4 cache - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL + Image digest SHA256 (Supply Chain Security 2025)
  erpnext-redis-cache:
    # ATUALIZADO 14/12/2025: 7-alpine -> 7.4.6-alpine (ultima estável do 7.x)
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    platform: linux/amd64
    container_name: erpnext-redis-cache
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD obrigatorio}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_cache_data:/data
    networks:
      - erpnext-network
    healthcheck:
      # CORREÇÃO 22/12/2025: --no-auth-warning evita logs com warning sobre senha na linha de comando
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_CACHE_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Redis Queue - Filas ERPNext
  # Docs 2025: Redis 7.4 queue - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL + Image digest SHA256 (Supply Chain Security 2025)
  erpnext-redis-queue:
    # ATUALIZADO 14/12/2025: 7-alpine -> 7.4.6-alpine (ultima estável do 7.x)
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
    platform: linux/amd64
    container_name: erpnext-redis-queue
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD obrigatorio}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_queue_data:/data
    networks:
      - erpnext-network
    healthcheck:
      # CORREÇÃO 22/12/2025: --no-auth-warning evita logs com warning sobre senha na linha de comando
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_QUEUE_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===================================================================
  # ERPNext restante (services) - mantidos conforme original
  # ===================================================================
  erpnext-configurator:
    # ATUALIZADO 14/12/2025: ERPNext v15.91.3 (última versão estável) com SHA256 digest
    image: frappe/erpnext:v15.91.3@sha256:e0509ed0ce906637b08f70eaa9b606b6b13c9915b2a0b5db907dda93e3be3fa5
    platform: linux/amd64
    container_name: erpnext-configurator
    restart: "no"
    # REGRA 16: Security Hardening - no-new-privileges (init precisa escrever, não pode ter read_only)
    security_opt:
      - no-new-privileges:true
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    # CORREÇÃO 22/12/2025: Seguir padrão oficial frappe_docker
    # Ref: https://github.com/frappe/frappe_docker/blob/main/compose.yaml
    # apps.txt deve ser criado dinamicamente com ls -1 apps (não hardcoded)
    # redis_socketio é OBRIGATÓRIO para websocket funcionar
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cd /home/frappe/frappe-bench
        
        # BUG FIX 24/12/2025: Verificar se diretório apps existe antes de listar
        if [ ! -d "apps" ]; then
          echo "❌ ERRO: Diretório apps não existe em /home/frappe/frappe-bench"
          echo "   Estrutura esperada do bench não foi encontrada"
          exit 1
        fi
        
        # Criar apps.txt dinamicamente (padrão oficial frappe_docker)
        # Lista os apps instalados no bench, não hardcoded
        echo "📋 Criando apps.txt..."
        if ! ls -1 apps > sites/apps.txt 2>/dev/null; then
          echo "❌ ERRO: Falha ao listar apps e criar apps.txt"
          exit 1
        fi
        echo "   Apps encontrados:"
        cat sites/apps.txt || echo "  (apps.txt vazio ou não legível)"
        
        # Construir URLs Redis com senha (ACL habilitado)
        CACHE_URL="redis://:$${REDIS_CACHE_PASSWORD}@erpnext-redis-cache:6379"
        QUEUE_URL="redis://:$${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379"
        
        # Configurar globalmente (seguindo padrão oficial)
        echo "⚙️ Configurando bench..."
        if ! bench set-config -g db_host erpnext-mariadb; then
          echo "❌ ERRO: Falha ao configurar db_host"
          exit 1
        fi
        if ! bench set-config -g db_port 3306; then
          echo "❌ ERRO: Falha ao configurar db_port"
          exit 1
        fi
        if ! bench set-config -g redis_cache "$${CACHE_URL}"; then
          echo "❌ ERRO: Falha ao configurar redis_cache"
          exit 1
        fi
        if ! bench set-config -g redis_queue "$${QUEUE_URL}"; then
          echo "❌ ERRO: Falha ao configurar redis_queue"
          exit 1
        fi
        if ! bench set-config -g redis_socketio "$${QUEUE_URL}"; then
          echo "❌ ERRO: Falha ao configurar redis_socketio"
          exit 1
        fi
        if ! bench set-config -g socketio_port 9000; then
          echo "❌ ERRO: Falha ao configurar socketio_port"
          exit 1
        fi
        
        # Verificar se common_site_config.json foi criado
        if [ ! -f "sites/common_site_config.json" ]; then
          echo "❌ ERRO: common_site_config.json não foi criado após bench set-config"
          exit 1
        fi
        
        echo "✅ ERPNext configurator concluído com sucesso"
        # SEGURANÇA: Mostrar apenas chaves, não valores (contém senhas Redis)
        echo "=== Chaves em common_site_config.json ==="
        if command -v jq >/dev/null 2>&1; then
          jq -r 'keys[]' sites/common_site_config.json 2>/dev/null || echo "  (jq falhou ao ler chaves)"
        else
          echo "  (jq não disponível - mostrando apenas tamanho do arquivo)"
          wc -c sites/common_site_config.json || true
        fi
    environment:
      SITE_NAME: ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      DB_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      INSTALL_APPS: "erpnext"
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_QUEUE_PASSWORD: ${REDIS_QUEUE_PASSWORD}
    networks:
      - erpnext-network
    depends_on:
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    # REGRA 16: Resource limits para init containers (best practice enterprise)
    # CORREÇÃO 22/12/2025: bench set-config precisa de memória razoável
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  erpnext-create-site:
    # ATUALIZADO 14/12/2025: ERPNext v15.91.3 (última versão estável) com SHA256 digest
    image: frappe/erpnext:v15.91.3@sha256:e0509ed0ce906637b08f70eaa9b606b6b13c9915b2a0b5db907dda93e3be3fa5
    platform: linux/amd64
    container_name: erpnext-create-site
    restart: "no"
    # REGRA 16: Security Hardening - no-new-privileges (init precisa escrever, não pode ter read_only)
    security_opt:
      - no-new-privileges:true
    # CORREÇÃO 22/12/2025: Script com logging detalhado para debug
    # Documentação: https://frappeframework.com/docs/user/en/bench/reference/new-site
    entrypoint:
      - bash
      - -c
    command:
      - |
        set -euo pipefail
        cd /home/frappe/frappe-bench
        
        echo "=== DEBUG: Verificando ambiente ==="
        echo "PWD: $$(pwd)"
        echo "USER: $$(whoami)"
        # CORREÇÃO 22/12/2025: Usar SITE_NAME (definido no environment do container)
        # ERPNEXT_SITE_NAME está no .env.prod, mas o container recebe como SITE_NAME
        echo "SITE_NAME env: $${SITE_NAME:-não definido}"
        ls -la sites/ || echo "sites/ não existe"
        # SEGURANÇA: Verificar existência sem expor conteúdo (contém senhas Redis)
        if [ -f "sites/common_site_config.json" ]; then
          echo "✅ common_site_config.json existe ($$(wc -c < sites/common_site_config.json) bytes)"
          # Mostrar apenas chaves, não valores (segurança)
          jq -r 'keys[]' sites/common_site_config.json 2>/dev/null || echo "  (jq não disponível para listar chaves)"
        else
          echo "❌ common_site_config.json não existe"
        fi
        cat sites/apps.txt || echo "apps.txt não existe"
        
        # CORREÇÃO 22/12/2025: Usar SITE_NAME do environment (não ERPNEXT_SITE_NAME)
        # O environment já define SITE_NAME a partir de ERPNEXT_SITE_NAME do .env.prod
        echo "=== Usando SITE_NAME: $${SITE_NAME} ==="
        
        if [ -f "sites/$${SITE_NAME}/site_config.json" ]; then
          echo "✅ Site $${SITE_NAME} já existe. Pulando criação."
          exit 0
        fi
        
        # NOTA: Removido teste mysql client - imagem frappe/erpnext não tem mysql CLI
        # O bench new-site faz sua própria verificação de conexão
        
        echo "🔧 Criando site $${SITE_NAME}..."
        # BUG FIX 24/12/2025: Substituir --no-mariadb-socket (DEPRECATED) por --mariadb-user-host-login-scope
        # Ref: https://frappeframework.com/docs/user/en/bench/reference/new-site
        # --mariadb-user-host-login-scope='%' permite conexão de qualquer host (equivalente ao antigo --no-mariadb-socket)
        # CORREÇÃO 24/12/2025: Usar variáveis de ambiente do container ($${MYSQL_ROOT_PASSWORD}, $${ADMIN_PASSWORD})
        # O Docker Compose interpola ${VAR} do .env.prod para criar environment do container
        # Dentro do comando, usamos $${VAR} para escapar do Docker Compose e deixar o shell do container interpretar
        bench new-site "$${SITE_NAME}" \
          --db-host erpnext-mariadb \
          --db-port 3306 \
          --mariadb-root-password "$${MYSQL_ROOT_PASSWORD}" \
          --admin-password "$${ADMIN_PASSWORD}" \
          --mariadb-user-host-login-scope='%' \
          --install-app erpnext \
          --verbose 2>&1 | tee /tmp/bench-new-site.log
        BENCH_EXIT_CODE=$${PIPESTATUS[0]}
        
        if [ "$${BENCH_EXIT_CODE}" -ne 0 ]; then
          echo ""
          echo "❌ ERRO: bench new-site falhou com exit code: $${BENCH_EXIT_CODE}"
          echo ""
          echo "=== Últimas 300 linhas do output do bench (contexto completo) ==="
          tail -300 /tmp/bench-new-site.log 2>/dev/null || echo "Sem output disponível"
          echo ""
          echo "=== Buscando erros específicos no log (grep ERROR/error/Error/Exception/Traceback/Failed/Fatal) ==="
          grep -i "error\|exception\|traceback\|failed\|fatal" /tmp/bench-new-site.log 2>/dev/null | tail -50 || echo "  (nenhum erro encontrado via grep)"
          echo ""
          echo "=== Verificando uso de memória durante falha ==="
          free -h 2>/dev/null || echo "  (comando free não disponível)"
          echo ""
          echo "=== Logs do bench (últimos arquivos com mais contexto) ==="
          if [ -d "logs" ]; then
            # Mostrar últimos 150 linhas de cada log para ter contexto completo
            find logs -name "*.log" -type f -exec sh -c 'echo "=== $1 ==="; tail -150 "$1" 2>/dev/null || echo "  (erro ao ler log)"' _ {} \; 2>/dev/null || echo "Sem logs disponíveis"
          else
            echo "Diretório logs não existe"
          fi
          echo ""
          echo "=== Verificando se site foi criado parcialmente ==="
          if [ -d "sites/$${SITE_NAME}" ]; then
            echo "⚠️ Diretório do site existe - instalação pode ter falhado parcialmente"
            echo "   Conteúdo do diretório:"
            ls -la "sites/$${SITE_NAME}/" || true
            if [ -f "sites/$${SITE_NAME}/site_config.json" ]; then
              echo "   ✅ site_config.json existe (site foi criado)"
            else
              echo "   ❌ site_config.json NÃO existe (site não foi criado completamente)"
            fi
            # Verificar se há migrations pendentes ou erros
            if [ -d "sites/$${SITE_NAME}/migrations" ]; then
              echo "   Migrations encontradas:"
              ls -la "sites/$${SITE_NAME}/migrations/" | head -20 || true
            fi
          else
            echo "   ❌ Diretório do site NÃO existe (site não foi criado)"
          fi
          echo ""
          echo "=== Verificando se erpnext foi instalado parcialmente ==="
          if [ -d "apps/erpnext" ]; then
            echo "   ✅ Diretório apps/erpnext existe"
            echo "   Tamanho: $$(du -sh apps/erpnext 2>/dev/null || echo 'desconhecido')"
          else
            echo "   ❌ Diretório apps/erpnext NÃO existe"
          fi
          echo ""
          echo "=== Verificando se há processos Python rodando (bench pode ter travado) ==="
          ps aux | grep -i "python\|bench\|frappe" | grep -v grep || echo "  (nenhum processo encontrado)"
          exit 1
        }
        echo "✅ Site $${SITE_NAME} criado com sucesso!"
    environment:
      SITE_NAME: ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      DB_ROOT_USER: root
      DB_HOST: erpnext-mariadb
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      INSTALL_APPS: "erpnext"
      # CORREÇÃO 20/12/2025: Redis com senha - necessário para bench new-site funcionar
      # O configurator criou URLs Redis com senha, o create-site precisa das mesmas configs
      REDIS_CACHE: redis://:${REDIS_CACHE_PASSWORD}@erpnext-redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    # REGRA 16: Resource limits para init containers (best practice enterprise)
    # CORREÇÃO 22/12/2025: bench new-site precisa de MUITA memória!
    # 256MB→1GB ainda insuficiente - ERPNext v15.91.3 usa >1GB durante instalação
    # BUG FIX 24/12/2025: Aumentado para 3GB - instalação do erpnext após frappe pode precisar de mais memória
    # Durante "Installing erpnext..." o processo cria ~300 tabelas e instala módulos, consumindo muita memória
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '2.0'
        reservations:
          memory: 1.5G
          cpus: '0.75'

  erpnext-backend:
    # ATUALIZADO 14/12/2025: ERPNext v15.91.3 (última versão estável) com SHA256 digest
    image: frappe/erpnext:v15.91.3@sha256:e0509ed0ce906637b08f70eaa9b606b6b13c9915b2a0b5db907dda93e3be3fa5
    platform: linux/amd64
    container_name: erpnext-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["bench", "serve", "--port", "8000"]
    environment:
      DB_HOST: erpnext-mariadb
      DB_PORT: 3306
      DB_NAME: ${ERPNEXT_DB_NAME:-erpnext}
      DB_USER: ${ERPNEXT_DB_USER:-erpnext}
      DB_PASSWORD: ${ERPNEXT_DB_PASSWORD}
      REDIS_CACHE: redis://:${REDIS_CACHE_PASSWORD}@erpnext-redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379
      REDIS_SOCKETIO: redis://:${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379/1
      SOCKETIO_PORT: 9000
      AUTO_MIGRATE: 1
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      LETSENCRYPT_EMAIL: ${ACME_EMAIL}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      ERPNEXT_PY: /home/frappe/frappe-bench/sites
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    networks:
      - erpnext-network
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    healthcheck:
      # BUG FIX 24/12/2025: Aumentado start_period de 60s para 120s
      # ERPNext backend pode demorar mais para iniciar após create-site
      # Especialmente em primeira instalação quando precisa processar migrations
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/method/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  erpnext-frontend:
    # ATUALIZADO 14/12/2025: Migrado para arquitetura unificada ERPNext v15
    # ERPNext v15 usa imagem única frappe/erpnext com comandos diferentes para cada serviço
    # Ref: https://github.com/frappe/frappe_docker (arquitetura 2024/2025)
    image: frappe/erpnext:v15.91.3@sha256:e0509ed0ce906637b08f70eaa9b606b6b13c9915b2a0b5db907dda93e3be3fa5
    platform: linux/amd64
    container_name: erpnext-frontend
    restart: unless-stopped
    # Comando para iniciar Nginx (substitui imagem frappe/erpnext-nginx)
    command: nginx-entrypoint.sh
    security_opt:
      - no-new-privileges:true
    environment:
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:ro
      - erpnext_logs:/home/frappe/frappe-bench/logs:ro
    depends_on:
      erpnext-backend:
        condition: service_started
      erpnext-websocket:
        condition: service_started
    networks:
      - erpnext-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext-frontend.rule=Host(`erp.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.erpnext-frontend.entrypoints=websecure"
      - "traefik.http.routers.erpnext-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.erpnext-frontend.loadbalancer.server.port=8080"
    healthcheck:
      # BUG FIX 24/12/2025: Aumentado start_period de 30s para 90s
      # ERPNext frontend depende do backend estar healthy, pode demorar mais
      # Imagem unificada frappe/erpnext tem wget disponível
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  erpnext-websocket:
    # ATUALIZADO 14/12/2025: Migrado para arquitetura unificada ERPNext v15
    # ERPNext v15 usa imagem única frappe/erpnext com comandos diferentes para cada serviço
    # Ref: https://github.com/frappe/frappe_docker (arquitetura 2024/2025)
    image: frappe/erpnext:v15.91.3@sha256:e0509ed0ce906637b08f70eaa9b606b6b13c9915b2a0b5db907dda93e3be3fa5
    platform: linux/amd64
    container_name: erpnext-websocket
    restart: unless-stopped
    # Comando para iniciar Socket.IO (substitui imagem frappe/frappe-socketio)
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    security_opt:
      - no-new-privileges:true
    environment:
      SOCKETIO_PORT: 9000
      REDIS_QUEUE: redis://:${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379
      REDIS_SOCKETIO: redis://:${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379/1
      SITES_PATH: /home/frappe/frappe-bench/sites
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:ro
      - erpnext_logs:/home/frappe/frappe-bench/logs:ro
    depends_on:
      erpnext-redis-queue:
        condition: service_healthy
      erpnext-backend:
        condition: service_started
    networks:
      - erpnext-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext-ws.rule=Host(`erp.yesyoudeserve.duckdns.org`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.erpnext-ws.entrypoints=websecure"
      - "traefik.http.routers.erpnext-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.erpnext-ws.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://localhost:9000/socket.io/?EIO=4&transport=polling' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

