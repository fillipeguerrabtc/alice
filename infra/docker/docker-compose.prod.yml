    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ERPNext Scheduler - Tarefas agendadas
  # Docs 2025: Python scheduler - 0.3 CPU, 512MB
  # SEGURANÇA: Container hardening (Docker 2025 + OWASP Container Security)
  erpnext-scheduler:
    image: frappe/erpnext:v15.88.0@sha256:158d31411565fc3b3de18945af2c8b2f7b85c77bdcc5ef442e6ed5f9d8d158fe
    platform: linux/amd64
