      - /home/frappe/.cache:mode=1777,size=16M
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      - erpnext-redis-cache
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000')"]
      interval: 30s
      timeout: 10s
