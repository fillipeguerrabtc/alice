      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD obrigatorio}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
