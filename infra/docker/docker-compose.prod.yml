  # ===========================================================================
  # PGBACKREST - Backup Enterprise PostgreSQL com PITR
  # Docs 2025: pgBackRest best practices - 0.5 CPU, 512MB
  # Recursos: WAL archiving, incremental backups, criptografia AES-256
  # O Backup Orchestrator (observability-service) coordena os backups unificados
  # SEGURANÇA: Container hardening (Docker 2025 + OWASP Container Security)
  # NOTA: Usando woblerr/pgbackrest (imagem oficial da comunidade - pgbackrest/pgbackrest não existe no Docker Hub)
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  # =============================================================================
  pgbackrest:
    image: woblerr/pgbackrest:2.54.2-alpine@sha256:509b1def8b37f7c0736286a6476db9ad39d2aba044149ee2286aa8721eda755e
    platform: linux/amd64
    container_name: alice-pgbackrest
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /var/run:mode=1777,size=8M
    environment:
      PGBACKREST_STANZA: alice
      PGBACKREST_PG1_HOST: postgres
      PGBACKREST_PG1_PORT: "5432"
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-alice_prod}
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_RETENTION_FULL: "4"
      PGBACKREST_REPO1_RETENTION_DIFF: "14"
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGBACKREST_LOG_LEVEL_FILE: detail
      PGUSER: ${POSTGRES_USER:-alice}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/alice/backups/pgbackrest:/var/lib/pgbackrest
      - /opt/alice/backups/manifests:/opt/alice/backups/manifests
      - postgres_data:/var/lib/postgresql/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      test: ["CMD", "pgbackrest", "info", "--stanza=alice"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # OBSERVABILIDADE - Logging centralizado
  # Docs 2025: Vector log collector - 0.25 CPU, 256MB
  # Healthcheck: API interna do Vector (Regra 16 - Best Practices 2025)
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  # ===========================================================================
  vector:
    image: timberio/vector:0.43.1-alpine@sha256:74ddced29f5377778a0666cea5a4232db7206f4d2bb3177b5c83ab1070b246f7
    platform: linux/amd64
    container_name: alice-vector
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
      - /var/lib/vector:mode=1777,size=64M
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NODE_ENV: production
      VECTOR_API_ENABLED: "true"
      VECTOR_API_ADDRESS: "0.0.0.0:8686"
    networks:
      - alice-network
    depends_on:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8686/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
