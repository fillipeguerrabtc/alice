  # Para deploy local/Hetzner, usar profiles: ["gpu"] e deployar separadamente
  # Documentação: docs/DEPLOYMENT.md - Seção "Salad Cloud Integration"
  # SEGURANÇA: Container hardening (Docker 2025 + OWASP Container Security)
  # ===========================================================================
  alice-clip-inference:
    image: ${IMAGE_PREFIX}-clip-inference:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-clip-inference
    restart: unless-stopped
