      test:
        - CMD-SHELL
        - wget --quiet --tries=1 --timeout=5 --spider http://localhost:8686/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # ALERTMANAGER - Notificações Prometheus
  # ===========================================================================
  # CORREÇÃO 19/12/2025: REMOVIDO env_file que vazava secrets nos logs
  # O env_file carregava TODAS as variáveis do .env.prod (incluindo secrets),
  # que eram logadas pelo Docker quando o container falhava. Agora passamos
  # apenas as variáveis necessárias via environment (princípio do mínimo privilégio).
  # ===========================================================================
  alertmanager:
    # ATUALIZADO 20/12/2025: Alertmanager v0.27.0 - tag versionada (digest removido - incompatível com amd64)
    image: prom/alertmanager:v0.27.0
    platform: linux/amd64
    container_name: alice-alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c"]
    # NOTA: $$ é escape para $ no Docker Compose (evita interpolação de variáveis shell)
    command: |
      set -e
      # Suprimir output do apk para não logar informações desnecessárias
      apk add --no-cache gettext > /dev/null 2>&1 || (echo "ERRO: Falha ao instalar gettext" >&2 && exit 1)
      # REGRA 6: Validação explícita de variáveis obrigatórias (fail-fast)
      REQUIRED_VARS="SMTP_HOST SMTP_PORT SMTP_FROM SMTP_USERNAME ALERT_EMAIL CRITICAL_EMAIL ONCALL_EMAIL"
      for VAR in $$REQUIRED_VARS; do
        eval "value=\$${$$VAR}"
        if [ -z "$$value" ]; then
          echo "ERRO: Variável obrigatória $$VAR não definida" >&2
          exit 1
        fi
      done
      # Processar template com variáveis (sem logar valores)
      envsubst '$${SMTP_HOST} $${SMTP_PORT} $${SMTP_FROM} $${SMTP_USERNAME} $${ALERT_EMAIL} $${CRITICAL_EMAIL} $${ONCALL_EMAIL}' < /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml || (echo "ERRO: Falha ao processar alertmanager.yml" >&2 && exit 1)
      exec /bin/alertmanager \
        --config.file=/tmp/alertmanager.yml \
        --storage.path=/alertmanager \
        --web.external-url=https://alertmanager.yesyoudeserve.duckdns.org
    environment:
      # APENAS variáveis necessárias para o Alertmanager (princípio do mínimo privilégio)
      # Nenhuma outra variável do .env.prod é carregada, evitando vazamento de secrets
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-onboarding@resend.dev}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      ALERT_EMAIL: ${ALERT_EMAIL:-ops@yesyoudeserve.duckdns.org}
      CRITICAL_EMAIL: ${CRITICAL_EMAIL:-critical@yesyoudeserve.duckdns.org}
      ONCALL_EMAIL: ${ONCALL_EMAIL:-oncall@yesyoudeserve.duckdns.org}
    volumes:
      # Config file: caminho relativo ao diretório infra/docker/ onde docker-compose é executado
      - ../../apps/observability-service/config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager:rw
      - alertmanager_tmp:/tmp:rw
      - /opt/alice/secrets/alertmanager/smtp_password:/run/secrets/smtp_password:ro
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # OTEL COLLECTOR - Pipeline unificado de telemetria
  # ===========================================================================
  otel-collector:
    # ATUALIZADO 14/12/2025: 0.114.0 -> 0.141.0 (Dec 3, 2025)
    image: otel/opentelemetry-collector-contrib:0.141.0@sha256:b14234c4bc1b7364629af272e564913bb57bdc9736d45b8b6db5ab3417dc75f9
    platform: linux/amd64
    container_name: alice-otel-collector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      # Config file: caminho relativo ao diretório infra/docker/ onde docker-compose é executado
      - ../../apps/observability-service/config/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks:
      - alice-network
    depends_on:
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # NODE EXPORTER - Métricas do host
  # ===========================================================================
  node-exporter:
    # ATUALIZADO 20/12/2025: Node Exporter v1.8.2 - tag versionada (digest removido - incompatível com amd64)
    image: prom/node-exporter:v1.8.2
    platform: linux/amd64
    container_name: alice-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
      - '--collector.netclass.ignored-devices=^(veth.*|docker.*|br-.*)$$'
      - '--collector.netdev.device-exclude=^(veth.*|docker.*|br-.*)$$'
      - '--web.listen-address=:9100'
    healthcheck:
      # CORREÇÃO 20/12/2025: Node Exporter é baseado em busybox/static - não tem wget/curl
      # Usar /proc/net/tcp para verificar se porta 9100 está escutando (0x238C = 9100 em hex)
      test: ["CMD-SHELL", "grep -q ':238C' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
        reservations:
          memory: 64M
          cpus: '0.05'

  # ===========================================================================
  # CADVISOR - Métricas de containers Docker
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    platform: linux/amd64
    container_name: alice-cadvisor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "9101:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - alice-network
    healthcheck:
      # cAdvisor tem wget disponível na imagem
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # PGBACKREST - Backup Enterprise PostgreSQL (WAL Archiving + Incremental)
  # Docs 2025: pgBackRest 2.57 com AES-256 encryption
  # SEGURANÇA: Container hardening + Imagem customizada buildada no CI/CD
  # REGRA 6: Enterprise-grade (sem placeholders, imagem buildada)
  # ===========================================================================
  pgbackrest:
    image: ${IMAGE_PREFIX}-pgbackrest:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-pgbackrest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      # Spool directory necessário para archive-async=y (operações assíncronas de arquivamento)
      # pgBackRest precisa de escrita neste diretório para status files e queue de arquivamento
      - /var/spool/pgbackrest:mode=1777,size=256M
    environment:
      # Stanza name (deve corresponder ao nome no pgbackrest.conf e entrypoint.sh)
      PGBACKREST_STANZA: alice_prod
      # PostgreSQL connection
      PGBACKREST_PG1_HOST: postgres
      PGBACKREST_PG1_PORT: "5432"
      PGBACKREST_PG1_DATABASE: ${POSTGRES_DB:-alice_prod}
      # Caminho dos dados PostgreSQL (deve corresponder ao PGDATA do container postgres)
      # PostgreSQL usa /var/lib/postgresql/data diretamente (padrão, não subdiretório /pgdata)
      PGBACKREST_DB_PATH: /var/lib/postgresql/data
      # Repositório de backup (caminho DENTRO do container, não do host)
      # O volume /opt/alice/backups/postgresql do host é montado em /var/lib/pgbackrest no container
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      # Retenção de backups
      PGBACKREST_REPO1_RETENTION_FULL: 15
      PGBACKREST_REPO1_RETENTION_DIFF: 7
      PGBACKREST_REPO1_RETENTION_ARCHIVE: 30
      # Criptografia
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
      # Logging
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGBACKREST_LOG_LEVEL_FILE: detail
      # PostgreSQL credentials
      # NOTA: PGPASSWORD é variável de ambiente do pgBackRest (não é secret do GitHub)
      # Recebe valor de POSTGRES_PASSWORD (secret do GitHub)
      PGUSER: ${POSTGRES_USER:-alice}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Dados PostgreSQL (read-only para backup)
      - postgres_data:/var/lib/postgresql/data:ro
      # Repositório de backups (volume Hetzner persistente) - rw explícito necessário com read_only: true
      - /opt/alice/backups/postgresql:/var/lib/pgbackrest:rw
      # Logs persistentes (volume Hetzner para troubleshooting) - rw explícito necessário com read_only: true
      - /opt/alice/backups/postgresql/logs:/var/log/pgbackrest:rw
      # Configuração pgBackRest (read-only)
      # Caminho relativo: docker-compose está em infra/docker/, config está em infra/backup/
      - ../backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO BUG #2: Usar variável de ambiente PGBACKREST_STANZA (default: alice_prod)
      # Usa script wrapper que expande corretamente a variável de ambiente
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

