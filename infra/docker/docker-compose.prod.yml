# =============================================================================
# ALICE PLATFORM - DOCKER COMPOSE PRODUÇÃO
# =============================================================================
# Versão: 4.5
# Ambiente: Produção (Hetzner Cloud - Servidor Único com GPU)
# Servidor: GPU Hetzner GEX44 (RTX 4000 Ada 20GB), Intel Core i5-13500 14 Core, 64GB DDR4 RAM, 2x 1.92TB NVMe SSD
# NOTA: Servidor único GEX44 - todos os 51 containers rodam no mesmo servidor (8 infra + 7 Alice + 15 ERPNext + 14 observability + 6 GPU + 1 backup)
# Volume Adicional: Hetzner Volume 100GB (alice-data) montado em /opt/alice
# Domínio: yesyoudeserve.duckdns.org
# IP: 178.63.41.108
#
# STORAGE: 100% Local (SEM S3 EXTERNO)
# - Dados: /opt/alice/data (PostgreSQL, MariaDB, Redis)
# - Uploads: /opt/alice/uploads (RAG multimodal)
# - Backups: /opt/alice/backups (pgBackRest, Mariabackup, Redis)
#
# CONTAINERS: 50 total (8 infra + 8 Alice + 15 ERPNext + 14 observability + 1 backup + 4 GPU)
# GPU SERVICES (4): gpu-mixtral, gpu-embeddings, gpu-flux, gpu-asr
# GPU MANAGER (1): gpu-manager (gerenciamento centralizado de requisições GPU)
# INFRAESTRUTURA (8): dockerproxy, traefik-init, traefik, postgres, redis, qdrant, tor, searxng
# ALICE (8): frontend, auth, chat, rag, training, integrations, observability, gpu-manager
# - alice-qdrant: Banco vetorial para embeddings de texto 4096 dim (Qwen3-Embedding-8B)
# - alice-redis: Cache distribuído dedicado para serviços Alice (Regra 15)
# - alice-searxng: Metabusca interna (SearXNG) para Web Search
#
# ARQUITETURA ENTERPRISE (17/12/2025):
# - Texto: Qwen3-Embedding-8B (4096 dim) → Qdrant | Licença Apache 2.0
# - Imagem: OpenCLIP ViT-H/14 (1024 dim) → pgvector | Licença MIT
# - LLM: Mixtral 8x7B (vLLM AWQ) via GPU Manager Service (Hetzner GPU)
# - GPU Manager Service gerencia todas as requisições GPU (LLM, Embeddings, FLUX, ASR)
#
# HEALTHCHECKS ENTERPRISE (21/12/2025):
# - Serviços Alice usam /live (liveness probe) para Docker healthchecks
# - /live: verifica se processo está vivo (não dependências externas)
# - /ready: usado para Kubernetes readiness (roteamento de tráfego)
# - Evita falsos positivos quando GPU Manager Service não está pronto
#
# SECURITY: Tags versionadas em imagens externas (sem digests SHA256 - evita falha por rotação no Docker Hub)
# ERPNEXT: Arquitetura unificada v15 - imagem única frappe/erpnext com comandos por serviço
#
# Autor: Fillipe Guerra
# Data: 27 de Dezembro de 2025
# Atualização: Removidos digests SHA256 de imagens externas (tags versionadas são suficientes e não rotacionam)
# =============================================================================

# =============================================================================
# NETWORKS - Redes externas (criadas manualmente no servidor)
# =============================================================================
# IMPORTANTE: Executar uma vez no servidor antes do primeiro deploy:
#   docker network create --driver bridge --subnet 172.28.0.0/16 alice-network
#   docker network create --driver bridge erpnext-network
# =============================================================================
networks:
  alice-network:
    external: true
    name: alice-network
  
  erpnext-network:
    external: true
    name: erpnext-network

# =============================================================================
# VOLUMES - Persistência de dados (binds para o volume /opt/alice)
# =============================================================================
volumes:
  # Alice
  postgres_data:
    name: alice-postgres-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/postgres

  # CORREÇÃO 31/12/2025: Spool directory para pgBackRest archive-async
  # Usado pelo binário pgbackrest no container PostgreSQL para async archiving
  pgbackrest_spool:
    name: alice-pgbackrest-spool
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/pgbackrest-spool

  alice_redis_data:
    name: alice-redis-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/redis-alice

  traefik_acme:
    name: alice-traefik-acme
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/traefik-acme
  
  searxng_config:
    name: alice-searxng-config
    driver: local
    driver_opts:
      type: none
      o: bind
      # CORREÇÃO 01/01/2026: Path alinhado com mkdir no deploy-production.yml
      device: /opt/alice/data/searxng-config

  # CORREÇÃO 01/01/2026: MinIO volume para Langfuse v3 (S3 obrigatório)
  minio_data:
    name: alice-minio-data
    driver: local
    driver_opts:
      type: none
      o: bind
      # CORREÇÃO 01/01/2026: Path alinhado com mkdir no deploy-production.yml
      device: /opt/alice/data/minio
  
  # ERPNext
  erpnext_sites:
    name: erpnext-sites
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/erpnext-sites
  
  erpnext_logs:
    name: erpnext-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/logs/erpnext
  
  mariadb_data:
    name: erpnext-mariadb-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/erpnext-mariadb
  
  redis_cache_data:
    name: erpnext-redis-cache
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/erpnext-redis-cache
  
  redis_queue_data:
    name: erpnext-redis-queue
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/erpnext-redis-queue

  vector_data:
    name: alice-vector-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/vector

  # REMOVIDO 01/01/2026: Alertmanager substituído por Grafana Alerting
  # Volumes alertmanager_data e alertmanager_tmp removidos
  # Motivo: Grafana Alerting é mais completo (UI configurável, contact points, notification policies)
  # e elimina redundância na plataforma. Ver docs/ARQUITETURA.md para detalhes.

  langfuse_db_data:
    name: alice-langfuse-db-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/langfuse-db

  # ClickHouse - OLAP database para Langfuse v3 (arquitetura oficial 2025)
  clickhouse_data:
    name: alice-clickhouse-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/clickhouse

  clickhouse_logs:
    name: alice-clickhouse-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/logs/clickhouse

  # Qdrant - Banco vetorial para embeddings de texto (4096 dim)
  qdrant_data:
    name: alice-qdrant-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/alice/data/qdrant

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # SEARXNG - Metabusca self-hosted para Web Search (fase multimodal)
  # Nota: rota interna (não exposta publicamente). Traefik não configurado aqui.
  # ===========================================================================
  # ===========================================================================
  # TOR PROXY - Proxy SOCKS5 para acesso a .onion (engines ahmia/torch)
  # ===========================================================================
  # ENTERPRISE (23/12/2025): Tor habilitado para engines .onion completas
  # Elimina warnings: "loading engine ahmia/torch failed: set engine to inactive!"
  # 
  # Imagem: dperson/torproxy - imagem comunitária bem mantida baseada em Alpine
  # NOTA: O Tor Project NÃO fornece imagens Docker oficiais.
  # Esta é uma das imagens mais estáveis e usadas para Tor proxy em Docker.
  # Ref: https://github.com/dperson/torproxy
  # ===========================================================================
  alice-tor:
    # NOTA: dperson/torproxy não publica digests SHA256 estáveis
    # A tag latest é a única mantida ativamente pelo autor
    # Para supply chain security, monitoramos atualizações via Dependabot
    image: dperson/torproxy:latest
    platform: linux/amd64
    container_name: alice-tor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Tor precisa escrever em vários diretórios (cache, logs, dados)
    # read_only: true NÃO suportado pelo Tor daemon
    environment:
      # Porta SOCKS5 padrão - SearXNG conecta via socks5h://alice-tor:9050
      TOR_SOCKS_PORT: "9050"
      # BUG FIX 23/12/2025: Removido TOR_DNSPORT: "0" - causa conflito com torrc padrão da imagem
      # A imagem dperson/torproxy já desabilita DNS por padrão se TOR_DNSPORT não for definido
      # Definir TOR_DNSPORT: "0" junto com torrc padrão causa "Invalid DNSPort configuration"
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO 23/12/2025: Usar /proc/net/tcp para verificar porta SOCKS5
      # A imagem dperson/torproxy é baseada em Alpine onde:
      # - /dev/tcp NÃO funciona (bash Alpine não tem --enable-net-redirections)
      # - nc/wget/curl podem não estar disponíveis
      # Solução: /proc/net/tcp funciona em QUALQUER imagem Linux
      # Porta 9050 decimal = 235A hexadecimal
      test: ["CMD-SHELL", "grep -qi ':235A' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Tor precisa de tempo para bootstrap (conectar à rede Tor)
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  alice-searxng:
    image: searxng/searxng:latest
    platform: linux/amd64
    container_name: alice-searxng
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
      # CORREÇÃO 23/12/2025: SearXNG tenta atualizar certificados SSL no startup
      # Erro: "can't create /etc/ssl/certs/ca-certificates.crt.new: Read-only file system"
      - /etc/ssl/certs:mode=1777,size=8M
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:?SEARXNG_SECRET_KEY é obrigatório}
      # Bind default 8080; acesso interno via alice-network
      - SEARXNG_BASE_URL=http://alice-searxng:8080/
      # CORREÇÃO 23/12/2025: Desabilitar atualização de certificados (imagem já tem certs válidos)
      - SSL_CERT_DIR=/etc/ssl/certs
    volumes:
      - searxng_config:/etc/searxng
    depends_on:
      alice-tor:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # CORREÇÃO 22/12/2025: Aumentado start_period de 30s para 60s
      # No primeiro deploy, a imagem precisa ser baixada antes de iniciar
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # DOCKER SOCKET PROXY - Proxy seguro para Docker API
  # Docs 2025: Minimal proxy - 0.1 CPU, 64MB
  # SEGURANÇA: Container hardening + Image digest SHA256 (Supply Chain Security 2025)
  # ===========================================================================
  # Resolve incompatibilidade de versão da API Docker com Traefik v3.0
  # Expõe API Docker via TCP para o Traefik consumir
  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    platform: linux/amd64
    container_name: alice-dockerproxy
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
      # CORREÇÃO 19/12/2025: HAProxy precisa escrever /run/haproxy.pid
      - /run:mode=1777,size=16M
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - NETWORKS=1
      - TASKS=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO 21/12/2025: Healthcheck robusto para docker-socket-proxy
      # A imagem usa HAProxy - verificamos se o processo está rodando e escutando
      # wget está disponível no Alpine base da imagem tecnativa/docker-socket-proxy
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:2375/_ping 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'

  # ===========================================================================
  # TRAEFIK INIT - Inicializa diretório ACME com permissões corretas
  # SEGURANÇA: Necessário para Traefik rodar como non-root
  # Image digest SHA256 (Supply Chain Security 2025)
  # ===========================================================================
  traefik-init:
    image: busybox:1.36
    platform: linux/amd64
    container_name: alice-traefik-init
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=8M
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
        reservations:
          memory: 8M
          cpus: '0.05'
    volumes:
      - traefik_acme:/acme
    command: ["sh", "-c", "chown -R 1001:1001 /acme && chmod 700 /acme"]
    restart: "no"
    networks:
      - alice-network

  # ===========================================================================
  # TRAEFIK - API Gateway com SSL Automático
  # Docs 2025: Traefik v3 small/medium traffic - 0.5 CPU, 512MB
  # SEGURANÇA: CAP_NET_BIND_SERVICE + Image digest SHA256 (Supply Chain Security 2025)
  # ===========================================================================
  traefik:
    # ATUALIZADO 14/12/2025: v3.3 -> v3.6.4 (corrige CVE-2025-66490, CVE-2025-66491)
    # ATUALIZADO 27/12/2025: Digest rotacionado no Docker Hub (pull por digest anterior falhava no deploy)
    # Fonte de verdade: Docker Hub API (tag v3.6.4, linux/amd64)
    image: traefik:v3.6.5
    platform: linux/amd64
    container_name: alice-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
    user: "1001:1001"
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      dockerproxy:
        condition: service_healthy
      traefik-init:
        condition: service_completed_successfully
    command:
      # API e Dashboard (desabilitado em produção por segurança)
      - "--api.dashboard=false"
      - "--api.insecure=false"
      
      # Ping endpoint para healthcheck (porta interna dedicada)
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      
      # Providers - via Docker Socket Proxy
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://dockerproxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=alice-network"
      
      # Entrypoints públicos
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # HTTP/2 para melhor performance (Traefik 2025 Best Practices)
      - "--entrypoints.websecure.http2.maxConcurrentStreams=250"
      
      # SSL/TLS Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_acme:/acme
    networks:
      - alice-network
      - erpnext-network
    labels:
      - "traefik.enable=true"
      # Middleware: Security Headers (OWASP 2025)
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-XSS-Protection=1; mode=block"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Permissions-Policy=geolocation=(), microphone=(), camera=()"
      - "traefik.http.middlewares.security-headers.headers.contentSecurityPolicy=default-src 'self'; base-uri 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; upgrade-insecure-requests"
      # Middleware: Rate Limiting (100 req/s média, burst 200)
      - "traefik.http.middlewares.rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=200"
      - "traefik.http.middlewares.rate-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.rate-limit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # Middleware: Auth Rate Limiting (10 req/min para login)
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.average=10"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.burst=20"
      - "traefik.http.middlewares.auth-rate-limit.ratelimit.period=60s"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:8082/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # POSTGRESQL - Banco de dados Alice com pgvector + pgBackRest
  # ==========================================================================
  # IMAGEM CUSTOMIZADA (31/12/2025): PostgreSQL + pgvector + pgBackRest
  # PROBLEMA ANTERIOR: pgBackRest exige archive_command='pgbackrest archive-push %p'
  # mas imagem pgvector/pgvector:pg16 não tem binário pgbackrest instalado.
  # Erro: "archive_command 'cp %p /archive/%f' must contain pgbackrest"
  # SOLUÇÃO: Imagem customizada com pgvector + pgbackrest instalados.
  # 
  # Docs: PostgreSQL 16 recomenda 25% RAM para shared_buffers, shm_size > 64MB
  # Configuração: 3GB RAM (750MB shared_buffers), 1.5 CPU limit
  # SEGURANÇA: Imagem buildada no CI/CD com SHA256 reproducível
  # ===========================================================================
  postgres:
    image: ${IMAGE_PREFIX}-postgres:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    # NOTA: read_only: true removido porque pgbackrest precisa escrever em /var/spool/pgbackrest
    # Segurança mantida via no-new-privileges e diretórios específicos
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /var/run/postgresql:mode=1777,size=8M
    shm_size: '1g'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alice_prod}
      # PGDATA padrão do PostgreSQL: /var/lib/postgresql/data (não usar subdiretório /pgdata)
      PGDATA: /var/lib/postgresql/data
      # CORREÇÃO 31/12/2025: Criptografia pgBackRest - OBRIGATÓRIO para archive-push
      # Container pgbackrest cria repositório com AES-256-CBC criptografado
      # Sem essas variáveis, archive_command falha com "repo is encrypted but cipher not configured"
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
    # ==========================================================================
    # CORREÇÃO 31/12/2025: WAL Archiving para pgBackRest (Backup Enterprise)
    # ==========================================================================
    # SOLUÇÃO ENTERPRISE: archive_command chama pgbackrest diretamente
    # pgBackRest valida que archive_command contém "pgbackrest"
    # Binário pgbackrest instalado na imagem customizada
    # ==========================================================================
    command:
      - "postgres"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=alice_prod archive-push %p"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "wal_keep_size=512MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # CORREÇÃO 31/12/2025: Init script garante extensão pgvector na primeira inicialização
      # Scripts em /docker-entrypoint-initdb.d/ executam apenas quando PGDATA está vazio
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      # CORREÇÃO 31/12/2025: Repositório pgBackRest compartilhado
      # PostgreSQL escreve WALs, pgBackRest container lê para backup
      - /opt/alice/backups/postgresql:/var/lib/pgbackrest:rw
      # Logs pgBackRest (troubleshooting)
      # CORREÇÃO 31/12/2025: Usar mesmo caminho do container pgbackrest para consistência
      # Ambos containers escrevem em /var/log/pgbackrest → mesmo diretório host
      - /opt/alice/backups/postgresql/logs:/var/log/pgbackrest:rw
      # Spool directory para archive-async (pgbackrest-pg.conf configura archive-async=y)
      - pgbackrest_spool:/var/spool/pgbackrest
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO 31/12/2025: Health check avançado verifica 3 condições:
      # 1. Processo PostgreSQL aceita conexões (pg_isready)
      # 2. Database existe e aceita queries (SELECT 1)
      # 3. Extensão pgvector está disponível (OBRIGATÓRIO para embeddings de imagem)
      # PROBLEMA ANTERIOR: Apenas pg_isready não garantia que extensão existia,
      # causando crash loop em auth-service/training-service (vector type not found)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alice} -d ${POSTGRES_DB:-alice_prod} && psql -U ${POSTGRES_USER:-alice} -d ${POSTGRES_DB:-alice_prod} -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      # CORREÇÃO 31/12/2025: Aumentado start_period para 120s
      # Primeiro deploy: criar cluster + init scripts + extensão pgvector pode demorar
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ===========================================================================
  # ALICE REDIS - Cache Distribuído para Serviços Alice
  # Docs 2025: Redis 7.4 - Cache de sessões e dados temporários
  # SEGURANÇA: ACL + Image digest SHA256 (Supply Chain Security 2025)
  # ISOLAMENTO: Redis dedicado para Alice (segregação de ERPNext - Regra 15)
  # ===========================================================================
  alice-redis:
    # ATUALIZADO 14/12/2025: 7-alpine -> 7.4.6-alpine (ultima estável do 7.x)
    image: redis:7.4.6-alpine
    platform: linux/amd64
    container_name: alice-redis
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    environment:
      # CORREÇÃO SEGURANÇA: Redis password obrigatório em produção
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatório em produção}
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      # CORREÇÃO SEGURANÇA: Requer senha para autenticação
      - --requirepass
      - "${REDIS_PASSWORD}"
      # Segurança: Desabilitar comandos perigosos
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - alice_redis_data:/data
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO SEGURANÇA: Health check usa autenticação via flag -a (padrão redis-cli)
      # Docker Compose interpola ${REDIS_PASSWORD} antes de executar o comando
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      # CORREÇÃO 22/12/2025: Aumentado start_period de 10s para 30s e retries de 3 para 5
      # No primeiro deploy, imagem precisa ser baixada antes de iniciar
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # QDRANT - Banco Vetorial para Texto (4096 dimensões)
  # ===========================================================================
  # Qdrant v1.16.2 - Suporta HNSW com 4096+ dimensões
  # Usado para embeddings de texto com Qwen3-Embedding-8B (4096 dim)
  # PostgreSQL pgvector para imagens (1024 dim)
  # Docs: https://qdrant.tech/documentation/
  #
  # Autor: Fillipe Guerra
  # Data: 17 de Dezembro de 2025
  # ===========================================================================
  alice-qdrant:
    # ATUALIZADO 20/12/2025: Qdrant v1.16.2 - tag versionada fixa (digest removido - multi-arch inconsistente no Docker Hub)
    # Tags versionadas (não "latest") são seguras para Supply Chain Security
    image: qdrant/qdrant:v1.16.2
    platform: linux/amd64
    container_name: alice-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # CORREÇÃO 23/12/2025: Qdrant precisa escrever em vários diretórios temporários
      # - /tmp: arquivos temporários gerais
      # - /qdrant/snapshots: diretório de snapshots
      # NOTA: Warning ".qdrant-initialized: Read-only file system" é esperado e não afeta funcionamento
      # Qdrant tenta criar arquivo de flag na raiz do workdir mas não é crítico
      - /tmp:mode=1777,size=64M
      - /qdrant/snapshots:mode=1777,size=256M
    environment:
      # API Key para autenticação (Regra 6 - sem acesso anônimo em produção)
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY é obrigatório em produção}
      # Configuração de performance
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 4
      QDRANT__STORAGE__ON_DISK_PAYLOAD: true
      # Telemetria desabilitada (privacidade)
      QDRANT__TELEMETRY_DISABLED: true
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO 22/12/2025: Healthcheck robusto para Qdrant (Best Practice 2025)
      # Problema: Qdrant imagem minimalista não tem curl/wget/pgrep
      # Solução: Verificar porta 6333 via /proc/net/tcp (funciona em qualquer imagem Linux)
      # Formato /proc/net/tcp: sl local_address rem_address st ... (porta em hex)
      # 6333 decimal = 18BD hexadecimal
      # CORREÇÃO: -i para case-insensitive (alguns sistemas mostram hex em minúsculo)
      # || exit 1 garante código de saída correto
      test: ["CMD-SHELL", "grep -qi ':18BD' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # CORREÇÃO 22/12/2025: Aumentado start_period de 60s para 120s
      # No primeiro deploy, a imagem precisa ser baixada (~1GB) antes de iniciar
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # ALICE FRONTEND SERVICE - React/Nginx
  # ===========================================================================
  alice-frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      traefik:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-frontend.rule=Host(`yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.alice-frontend.entrypoints=websecure"
      - "traefik.http.routers.alice-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-frontend.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-frontend.loadbalancer.server.port=8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /var/cache/nginx:mode=1777,size=32M
      - /var/run:mode=1777,size=8M
      # CORREÇÃO 23/12/2025: Script 10-listen-on-ipv6-by-default.sh tenta modificar default.conf
      # Warning: "can not modify /etc/nginx/conf.d/default.conf (read-only file system?)"
      # CORREÇÃO 23/12/2025: Mode 1755 não permite escrita - deve ser 1777 para tmpfs gravável
      - /etc/nginx/conf.d:mode=1777,size=8M
    healthcheck:
      # BUG FIX 23/12/2025: Healthcheck simplificado - verificar se processo nginx está rodando
      # wget pode não estar disponível no BusyBox Alpine em read_only:true
      # Verificar processo é suficiente para healthcheck básico (se nginx está vivo, está funcionando)
      # Alternativa mais robusta: usar sh com printf + nc se necessário, mas pgrep é mais simples
      # start_period aumentado para dar tempo ao nginx iniciar completamente
      test: ["CMD-SHELL", "pgrep -f 'nginx: master process' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # ALICE AUTH SERVICE - Autenticação OAuth/SAML/Local
  # ===========================================================================
  alice-auth:
    image: ${IMAGE_PREFIX}-auth:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-auth
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    # REGRA 6: env_file carrega CORS_ORIGIN do .env.prod (obrigatório em produção)
    # Docker Compose v2+ garante que variáveis do .env.prod estejam disponíveis
    # para expansão em environment: e uso no código Node.js
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: auth-service
      # CORREÇÃO 21/12/2025: sslmode=disable para conexões internas Docker (PostgreSQL sem SSL)
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      # OAuth Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # OAuth GitHub
      GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      # Callback URL
      OAUTH_CALLBACK_URL: https://yesyoudeserve.duckdns.org/api/auth/callback
      # =================================================================
      # OIDC PROVIDER - ALICE COMO IdP (31/12/2025)
      # =================================================================
      # Configurações para Alice atuar como OIDC Provider para Grafana/ERPNext
      # Inclui secrets OAuth para seed automático dos clientes no startup
      # =================================================================
      OIDC_ISSUER: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}
      OIDC_COOKIE_KEYS: ${OIDC_COOKIE_KEYS}
      GRAFANA_URL: ${GRAFANA_URL:-https://observability.yesyoudeserve.duckdns.org}
      ERPNEXT_URL: ${ERPNEXT_URL:-https://erp.yesyoudeserve.duckdns.org}
      # OAuth Client Secrets para seed automático (31/12/2025)
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      ERPNEXT_OAUTH_CLIENT_SECRET: ${ERPNEXT_OAUTH_CLIENT_SECRET}
      # Redis Cache distribuído (OBRIGATÓRIO em produção - Regra 6)
      # BUG FIX 21/12/2025: REDIS_URL estava FALTANDO - rate limiting requer Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      alice-redis:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      # OIDC Provider routes (31/12/2025)
      # OBRIGATÓRIO: .service label quando container tem múltiplos serviços Traefik
      # Sem isso: "cannot be linked automatically with multiple Services"
      # Ref: Bug fix alice-chat/alice-ws 23/12/2025
      - "traefik.http.routers.alice-oidc.rule=Host(`yesyoudeserve.duckdns.org`) && (PathPrefix(`/.well-known/openid-configuration`) || PathPrefix(`/oauth`))"
      - "traefik.http.routers.alice-oidc.entrypoints=websecure"
      - "traefik.http.routers.alice-oidc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-oidc.middlewares=security-headers@docker"
      - "traefik.http.routers.alice-oidc.service=alice-oidc"
      - "traefik.http.services.alice-oidc.loadbalancer.server.port=3001"
      # Auth API routes
      - "traefik.http.routers.alice-auth.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.alice-auth.entrypoints=websecure"
      - "traefik.http.routers.alice-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-auth.middlewares=security-headers@docker,auth-rate-limit@docker"
      - "traefik.http.routers.alice-auth.service=alice-auth"
      - "traefik.http.services.alice-auth.loadbalancer.server.port=3001"
    healthcheck:
      # CORREÇÃO 01/01/2026: Alpine usa "node" no PATH (não /nodejs/bin/node do Distroless)
      # /live verifica se processo está vivo (liveness probe)
      # Docker Compose v2+ requer "CMD" como primeiro elemento do array
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3001/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Docs 2025: Node.js 20 light service - 0.5 CPU, 512MB
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ===========================================================================
  # ALICE CHAT SERVICE - Conversas + WebSocket + LLM
  # ===========================================================================
  alice-chat:
    image: ${IMAGE_PREFIX}-chat:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-chat
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    # REGRA 6: env_file carrega CORS_ORIGINS do .env.prod (obrigatório em produção)
    # Docker Compose v2+ garante que variáveis do .env.prod estejam disponíveis
    # para expansão em environment: e uso no código Node.js
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVICE_NAME: chat-service
      # CORREÇÃO 21/12/2025: sslmode=disable para conexões internas Docker (PostgreSQL sem SSL)
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      # Sessão WebSocket (OBRIGATÓRIO em produção - Regra 6)
      SESSION_SECRET: ${SESSION_SECRET}
      # Comunicação inter-service (URLs Docker DNS)
      RAG_SERVICE_URL: http://alice-rag:3003
      INTEGRATIONS_SERVICE_URL: http://alice-integrations:3005
      TRAINING_SERVICE_URL: http://alice-training:3004
      # GPU Manager Service - Gerenciamento centralizado de requisições GPU (25/12/2025)
      # BUG FIX 25/12/2025: Container name correto é alice-gpu-manager (definido no service gpu-manager)
      GPU_MANAGER_URL: ${GPU_MANAGER_URL:-http://alice-gpu-manager:3010}
      # Redis Cache distribuído (OBRIGATÓRIO em produção - Regra 6)
      # CORREÇÃO SEGURANÇA: REDIS_URL inclui senha para autenticação
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
      # Mixtral GPU URL para streaming direto (bypass GPU Manager quando stream=true)
      MIXTRAL_GPU_URL: ${MIXTRAL_GPU_URL:-http://gpu-mixtral:8000}
    depends_on:
      postgres:
        condition: service_healthy
      alice-redis:
        condition: service_healthy
      # GPU é OBRIGATÓRIO para Alice (Regra 6 - sem fallback)
      gpu-manager:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-chat.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/chat`)"
      - "traefik.http.routers.alice-chat.entrypoints=websecure"
      - "traefik.http.routers.alice-chat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-chat.middlewares=security-headers@docker,rate-limit@docker"
      # CORREÇÃO 23/12/2025: Especificar service explícito (evita "cannot be linked automatically with multiple Services")
      - "traefik.http.routers.alice-chat.service=alice-chat"
      - "traefik.http.services.alice-chat.loadbalancer.server.port=3002"
      # WebSocket - mesma porta, router separado
      - "traefik.http.routers.alice-ws.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.alice-ws.entrypoints=websecure"
      - "traefik.http.routers.alice-ws.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-ws.middlewares=rate-limit@docker"
      # CORREÇÃO 23/12/2025: Especificar service explícito para WebSocket
      - "traefik.http.routers.alice-ws.service=alice-ws"
      - "traefik.http.services.alice-ws.loadbalancer.server.port=3002"
    healthcheck:
      # CORREÇÃO 01/01/2026: Alpine usa "node" no PATH (não /nodejs/bin/node do Distroless)
      # /live verifica se processo está vivo (liveness probe)
      # Docker Compose v2+ requer "CMD" como primeiro elemento do array
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3002/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # ALICE RAG SERVICE - Knowledge Base + Multimodal Processing + Storage Local
  # ARQUITETURA ENTERPRISE (25/12/2025) via GPU Manager Service:
  # - Embeddings de texto: Qwen3-Embedding-8B (4096 dim) → Qdrant
  # - Embeddings de imagem: OpenCLIP ViT-H/14 (1024 dim) → pgvector
  # - Transcrição de áudio: Canary-1B - GPU Manager Service
  # ===========================================================================
  alice-rag:
    image: ${IMAGE_PREFIX}-rag:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-rag
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    # REGRA 6: env_file carrega CORS_ORIGINS do .env.prod (obrigatório em produção)
    # Docker Compose v2+ garante que variáveis do .env.prod estejam disponíveis
    # para expansão em environment: e uso no código Node.js
    env_file:
      - .env.prod
    volumes:
      # Volume Hetzner para uploads RAG (imagens, áudios, documentos) - rw explícito necessário com read_only: true
      - /opt/alice/uploads:/opt/alice/uploads:rw
    environment:
      NODE_ENV: production
      PORT: 3003
      SERVICE_NAME: rag-service
      # CORREÇÃO 21/12/2025: sslmode=disable para conexões internas Docker (PostgreSQL sem SSL)
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET é obrigatório}
      # ARQUITETURA ENTERPRISE (17/12/2025):
      # - Texto: Qwen3-Embedding-8B (4096 dim) → Qdrant | Licença Apache 2.0
      # - Imagem: OpenCLIP ViT-H/14 (1024 dim) → pgvector | Licença MIT
      # - Transcrição: Canary-1B via GPU Manager Service
      # Qdrant - Banco vetorial para texto (4096 dim) - CORREÇÃO 21/12/2025
      # BUG: Variáveis QDRANT_URL e QDRANT_API_KEY estavam FALTANDO neste serviço!
      # RAG service usa Qdrant para embeddings de texto - conexão falhava sem estas variáveis
      QDRANT_URL: http://alice-qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY é obrigatório em produção}
      # GPU Manager Service - Gerenciamento centralizado de requisições GPU (25/12/2025)
      # BUG FIX 25/12/2025: Container name correto é alice-gpu-manager (definido no service gpu-manager)
      GPU_MANAGER_URL: ${GPU_MANAGER_URL:-http://alice-gpu-manager:3010}
      # Web Search interno (SearXNG self-hosted) - sem dependências externas
      SEARXNG_URL: http://alice-searxng:8080
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
      # Storage local (SEM S3)
      STORAGE_BASE_DIR: /opt/alice/uploads
      STORAGE_BASE_URL: /api/media/files
      # URL pública do RAG para upload de arquivos (HTTPS Traefik)
      RAG_PUBLIC_BASE_URL: ${RAG_PUBLIC_BASE_URL:?RAG_PUBLIC_BASE_URL é obrigatório}
      # Redis Cache distribuído (OBRIGATÓRIO em produção - Regra 6)
      # BUG FIX 21/12/2025: REDIS_URL estava FALTANDO - causava "REDIS_URL não configurado em produção"
      # Rate limiting distribuído requer Redis para funcionar em cluster
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      alice-qdrant:
        condition: service_healthy
      alice-searxng:
        condition: service_healthy
      alice-redis:
        condition: service_healthy
      # GPU é OBRIGATÓRIO para Alice (Regra 6 - sem fallback)
      gpu-manager:
        condition: service_healthy
    networks:
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alice-rag.rule=Host(`yesyoudeserve.duckdns.org`) && PathPrefix(`/api/rag`)"
      - "traefik.http.routers.alice-rag.entrypoints=websecure"
      - "traefik.http.routers.alice-rag.tls.certresolver=letsencrypt"
      - "traefik.http.routers.alice-rag.middlewares=security-headers@docker,rate-limit@docker"
      - "traefik.http.services.alice-rag.loadbalancer.server.port=3003"
    healthcheck:
    # RAG Service usa node:22-bookworm-slim (base consistente com dependências do serviço; suporte a vídeo foi removido)
      # CORREÇÃO 21/12/2025: Usar /live (liveness probe - processo vivo) para Docker healthcheck
      # /ready verifica dependências externas (GPU Manager Service, Qdrant) - pode falhar sem GPU pronta
      # Docker healthcheck deve verificar se PROCESSO está vivo, não dependências externas
      # Docker Compose v2+ requer "CMD" como primeiro elemento do array
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3003/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
