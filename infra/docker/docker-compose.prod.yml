      - "traefik.http.services.alice-rag.loadbalancer.server.port=3003"
    healthcheck:
      # RAG Service usa node:22-bookworm-slim (precisa FFmpeg para vídeos)
      # IMPORTANTE: Usar /ready (verifica PostgreSQL + embeddings) ao invés de /health (sempre 200)
      # Docker Compose v2+ requer "CMD" como primeiro elemento do array
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3003/ready',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
