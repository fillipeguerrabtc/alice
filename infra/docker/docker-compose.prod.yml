  # ===========================================================================
  # NODE EXPORTER - Métricas do host
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:f503a55e9c5017d6f7282678ae77658e3d0f157f5b1032d5db36b27ca2e8bbdb
    platform: linux/amd64
    container_name: alice-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
      - '--collector.netclass.ignored-devices=^(veth.*|docker.*|br-.*)$$'
      - '--collector.netdev.device-exclude=^(veth.*|docker.*|br-.*)$$'
      - '--web.listen-address=:9100'
    healthcheck:
