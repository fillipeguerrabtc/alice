        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ===========================================================================
  # ERPNEXT STACK - Baseado em frappe_docker oficial
  # ===========================================================================
  
  # MariaDB - Banco de dados ERPNext
  # Docs 2025: MariaDB 10.11 production - 1.5 CPU, 2GB
  # innodb_buffer_pool_size = 70% do container memory (1.4GB para 2GB container)
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  erpnext-mariadb:
    image: mariadb:10.11@sha256:896f79e37178838799a8af4c8e4431b26352d5770cf7edd803b7fcadba7d953d
    platform: linux/amd64
    container_name: erpnext-mariadb
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /run/mysqld:mode=1777,size=8M
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=1400M
      - --innodb-buffer-pool-instances=2
      - --max-connections=50
      - --query-cache-type=OFF
      - --query-cache-size=0
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --key-buffer-size=16M
      - --table-open-cache=400
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --expire-logs-days=7
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MYSQL_ROOT_PASSWORD:?ERPNEXT_MYSQL_ROOT_PASSWORD obrigatorio}
      MYSQL_DATABASE: ${ERPNEXT_DB_NAME:-erpnext}
      MYSQL_USER: ${ERPNEXT_DB_USER:-erpnext}
      MYSQL_PASSWORD: ${ERPNEXT_DB_PASSWORD:?ERPNEXT_DB_PASSWORD obrigatorio}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ERPNEXT_MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis Cache - Cache ERPNext
  # Docs 2025: Redis 7.4 cache - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL + Image digest SHA256 (Supply Chain Security 2025)
  erpnext-redis-cache:
    image: redis:7-alpine@sha256:4706ecab5371690fecfdd782268929c94ad5b5ce9ce0b35bfdfe191c4ad17851
    platform: linux/amd64
    container_name: erpnext-redis-cache
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD obrigatorio}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_cache_data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Redis Queue - Filas ERPNext
  # Docs 2025: Redis 7.4 queue - maxmemory = 80-90% do container (200MB para 256MB)
  # SEGURANÇA: ACL + Image digest SHA256 (Supply Chain Security 2025)
  erpnext-redis-queue:
    image: redis:7-alpine@sha256:4706ecab5371690fecfdd782268929c94ad5b5ce9ce0b35bfdfe191c4ad17851
    platform: linux/amd64
    container_name: erpnext-redis-queue
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    command:
      - redis-server
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - ${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD obrigatorio}
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_queue_data:/data
    networks:
      - erpnext-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_QUEUE_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # ERPNext Configurator - Configura common_site_config.json na primeira execução
  # NOTA: Serviço executa UMA VEZ e termina (restart: "no") - Padrão oficial frappe_docker
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  # ===========================================================================
  erpnext-configurator:
    image: frappe/erpnext:v15.88.0@sha256:158d31411565fc3b3de18945af2c8b2f7b85c77bdcc5ef442e6ed5f9d8d158fe
    platform: linux/amd64
    container_name: erpnext-configurator
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
      - /home/frappe/.cache:mode=1777,size=16M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host erpnext-mariadb;
        bench set-config -g db_port 3306;
        bench set-config -g redis_cache "redis://:${REDIS_CACHE_PASSWORD}@erpnext-redis-cache:6379";
        bench set-config -g redis_queue "redis://:${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379";
        bench set-config -g redis_socketio "redis://:${REDIS_QUEUE_PASSWORD}@erpnext-redis-queue:6379";
        echo "Configuração ERPNext concluída com sucesso (Redis ACL habilitado)!"
    environment:
      - DB_HOST=erpnext-mariadb
      - DB_PORT=3306
      - REDIS_CACHE_PASSWORD=${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD obrigatorio}
      - REDIS_QUEUE_PASSWORD=${REDIS_QUEUE_PASSWORD:?REDIS_QUEUE_PASSWORD obrigatorio}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    networks:
      - erpnext-network

  # ===========================================================================
  # ERPNext Create-Site - Cria o site na primeira instalação
  # NOTA: Serviço executa UMA VEZ e termina (restart: "no") - Padrão oficial frappe_docker
  # Credenciais padrão: admin/admin (alterar após primeira instalação)
  # IDEMPOTENTE: Se site já existe, sai com sucesso (exit 0)
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  # ===========================================================================
  erpnext-create-site:
    image: frappe/erpnext:v15.88.0@sha256:158d31411565fc3b3de18945af2c8b2f7b85c77bdcc5ef442e6ed5f9d8d158fe
    platform: linux/amd64
    container_name: erpnext-create-site
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
      - /home/frappe/.cache:mode=1777,size=16M
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    entrypoint:
      - bash
      - -c
    command:
      - >
        echo "=== ERPNext Create-Site ===";
        
        if [[ -d "sites/${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}" ]]; then
          echo "Site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org} já existe.";
          echo "Pulando criação. Deploy subsequente detectado.";
          exit 0;
        fi;
        
        export START=$$(date +%s);
        echo "Aguardando common_site_config.json...";
        until [[ -f "sites/common_site_config.json" ]] || [[ $$(date +%s) -gt $$((START + 180)) ]]; do
          sleep 5;
          echo "  Verificando... ($$(( $$(date +%s) - START ))s)";
        done;
        
        if [[ ! -f "sites/common_site_config.json" ]]; then
          echo "ERRO: common_site_config.json não encontrado após 180s";
          exit 1;
        fi;
        
        echo "common_site_config.json encontrado!";
        echo "Criando site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}...";
        
        bench new-site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
          --mariadb-root-password=${ERPNEXT_MYSQL_ROOT_PASSWORD}
          --admin-password=${ERPNEXT_ADMIN_PASSWORD}
          --install-app=erpnext
          --mariadb-user-host-login-scope=%;
        
        bench --site ${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org} set-config host_name "https://${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}";
        
        echo "Site ERPNext criado com sucesso!"
    environment:
      - ERPNEXT_SITE_NAME=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
      - ERPNEXT_MYSQL_ROOT_PASSWORD=${ERPNEXT_MYSQL_ROOT_PASSWORD:?ERPNEXT_MYSQL_ROOT_PASSWORD obrigatorio}
      - ERPNEXT_ADMIN_PASSWORD=${ERPNEXT_ADMIN_PASSWORD:?ERPNEXT_ADMIN_PASSWORD obrigatorio}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
    networks:
      - erpnext-network

  # ERPNext Backend - Frappe/Python
  # Docs 2025: Frappe/Gunicorn production - 1.5 CPU, 2GB
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  erpnext-backend:
    image: frappe/erpnext:v15.88.0@sha256:158d31411565fc3b3de18945af2c8b2f7b85c77bdcc5ef442e6ed5f9d8d158fe
    platform: linux/amd64
    container_name: erpnext-backend
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /home/frappe/.cache:mode=1777,size=32M
      - /var/run:mode=1777,size=8M
    command: bench serve --port 8000
    environment:
      - FRAPPE_SITE_NAME_HEADER=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites
      - erpnext_logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-create-site:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_healthy
      erpnext-redis-queue:
        condition: service_healthy
    networks:
      - erpnext-network
      - alice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/frappe.ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ERPNext Frontend - Nginx
  # Docs 2025: Nginx static - 0.25 CPU, 256MB
  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  erpnext-frontend:
    image: frappe/erpnext:v15.88.0@sha256:158d31411565fc3b3de18945af2c8b2f7b85c77bdcc5ef442e6ed5f9d8d158fe
    platform: linux/amd64
    container_name: erpnext-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
      - /var/cache/nginx:mode=1777,size=32M
      - /var/run:mode=1777,size=8M
    command: nginx-entrypoint.sh
    environment:
      - BACKEND=erpnext-backend:8000
      - SOCKETIO=erpnext-websocket:9000
      - FRAPPE_SITE_NAME_HEADER=${ERPNEXT_SITE_NAME:-erp.yesyoudeserve.duckdns.org}
    volumes:
      - erpnext_sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    networks:
      - erpnext-network
      - alice-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.erpnext.rule=Host(`erp.yesyoudeserve.duckdns.org`)"
      - "traefik.http.routers.erpnext.entrypoints=websecure"
      - "traefik.http.routers.erpnext.tls.certresolver=letsencrypt"
      - "traefik.http.services.erpnext.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ERPNext WebSocket - Socket.io
