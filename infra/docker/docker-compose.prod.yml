  # SEGURANÇA: Image digest SHA256 (Supply Chain Security 2025)
  erpnext-websocket:
    image: frappe/erpnext:v15.88.0@sha256:158d31411565fc3b3de18945af2c8b2f7b85c77bdcc5ef442e6ed5f9d8d158fe
