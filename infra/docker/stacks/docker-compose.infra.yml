# =============================================================================
# ALICE PLATFORM - INFRA STACK
# =============================================================================
# Versão: 5.0 (Arquitetura Modular Multi-Stack)
# Data: 05 de Janeiro de 2026
# Autor: Fillipe Guerra
#
# PROPÓSITO: Infraestrutura base OBRIGATÓRIA para todos os outros stacks.
# Este stack DEVE subir PRIMEIRO e estar healthy antes de qualquer outro.
#
# CONTAINERS (11):
#   - postgres (com pgvector) - Banco principal
#   - pgbouncer - Connection pooling (reduz conexões idle)
#   - alice-redis - Cache distribuído
#   - alice-qdrant - Banco vetorial para texto
#   - alice-tor - Proxy SOCKS5 para .onion
#   - alice-searxng - Metabusca (depende de tor)
#   - caddy - Reverse proxy SSL (dual-network: alice + erpnext)
#   - minio - Object storage S3 (para Langfuse v3)
#   - minio-init - Init container para criar bucket
#   - pgbackrest-init - Init container para criar stanza
#
# ORDEM DE DEPLOY:
#   1. PRÉ-REQUISITOS: Networks externas criadas
#   2. INFRA: Este stack
#   3. Drizzle push (schema migration)
#   4. ALICE/OBSERVABILITY/ERPNEXT (paralelos)
#   5. BACKUP
#
# HEALTH CHECKS OBRIGATÓRIOS antes de prosseguir:
#   ✓ postgres: pg_isready + pgvector extension
#   ✓ alice-redis: redis-cli ping
#   ✓ alice-qdrant: HTTP /health
#   ✓ caddy: HTTP /health (porta 80)
#   ✓ minio: mc ready local (MinIO Client 2025)
#   ✓ minio-init: service_completed_successfully
#   ✓ pgbackrest-init: service_completed_successfully
#
# REGRA 6 CLAUDE.md: Enterprise-grade, sem workarounds
# REGRA 11 CLAUDE.md: Seguir melhores práticas 2025
# REGRA 12 CLAUDE.md: Deploy Hetzner GPU
# =============================================================================

# =============================================================================
# NETWORKS (externas - definidas em docker-compose.base.yml)
# =============================================================================
networks:
  alice-network:
    external: true
    name: alice-network
  
  erpnext-network:
    external: true
    name: erpnext-network

# =============================================================================
# VOLUMES
# =============================================================================
# NOTA IMPORTANTE (06/01/2026):
# Volumes são HERDADOS de docker-compose.base.yml quando usado com -f
# NÃO redeclarar aqui para evitar conflito "external" + "driver_opts"
# 
# Docker Compose NÃO permite volume com external=true E driver_opts simultaneamente.
# Se redeclarar com external: true aqui, conflita com driver_opts do base.yml.
#
# Referência: https://docs.docker.com/reference/compose-file/volumes/
# Issue fix: https://github.com/fillipeguerrabtc/alice/actions/runs/20764650206/job/59627992252
# CLAUDE.md Regra 6: Enterprise-grade, sem workarounds
# =============================================================================

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # TOR PROXY - Proxy SOCKS5 para acesso a .onion (engines ahmia/torch)
  # ===========================================================================
  # NOTA: dperson/torproxy é a imagem mantida ativamente com curl instalado
  # osminogin/tor-simple é minimalista SEM curl/wget - healthcheck falhava
  # Ref: https://github.com/dperson/torproxy
  # ===========================================================================
  alice-tor:
    # NOTA: dperson/torproxy não publica tags versionadas (apenas :latest)
    # Monitorar atualizações via Dependabot para supply chain security
    image: dperson/torproxy:latest
    platform: linux/amd64
    container_name: alice-tor
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Porta SOCKS5 padrão - SearXNG conecta via socks5h://alice-tor:9050
      TOR_SOCKS_PORT: "9050"
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#94 (09/01/2026): Verificar apenas porta SOCKS5 (9050)
      # NÃO fazer requisição externa - muito lento e pode dar timeout
      # dperson/torproxy tem curl instalado
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD-SHELL", "curl -sf --max-time 3 --socks5 localhost:9050 http://localhost:9050 2>/dev/null || timeout 3 bash -c 'echo > /dev/tcp/localhost/9050' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # SEARXNG - Metabusca self-hosted para Web Search
  # ===========================================================================
  alice-searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-2025.12.30-a5c946a32}
    platform: linux/amd64
    container_name: alice-searxng
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
      - /etc/ssl/certs:mode=1777,size=8M
    environment:
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:?SEARXNG_SECRET_KEY é obrigatório}
      - SEARXNG_BASE_URL=http://alice-searxng:8080/
    volumes:
      - searxng_config:/etc/searxng
    depends_on:
      alice-tor:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#104: Reduzir interval para 20s
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # CADDY - Reverse Proxy com SSL Automático
  # ===========================================================================
  # NOTA: Caddy usa DUAL-NETWORK para rotear tráfego de Alice E ERPNext
  # ===========================================================================
  caddy:
    image: ${IMAGE_PREFIX}-caddy:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - alice-network
      - erpnext-network
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if wget -q --spider http://localhost:80/health 2>/dev/null; then
            exit 0
          else
            exit 1
          fi
      # CORREÇÃO PR#104: Reduzir timeouts
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # PGBACKREST INIT - Cria stanza APÓS PostgreSQL iniciar
  # ===========================================================================
  # CORREÇÃO 09/01/2026: REMOVIDO pg1-host que fazia pgBackRest tentar SSH
  # O erro "unable to execute 'ssh': No such file or directory" ocorre porque
  # pgBackRest com pg1-host assume conexão SSH remota, mas SSH não está instalado.
  # 
  # SOLUÇÃO: Usar --no-online para criar stanza SEM verificar cluster
  # A verificação é desnecessária pois depends_on já garante postgres healthy.
  # O volume postgres_data está montado localmente para acesso ao pg_control.
  #
  # Ref: https://pgbackrest.org/command.html#command-stanza-create
  # ===========================================================================
  pgbackrest-init:
    image: ${IMAGE_PREFIX}-pgbackrest:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-pgbackrest-init
    # NOTA: UID 70 definido no Dockerfile.pgbackrest (mesmo que PostgreSQL Alpine)
    entrypoint: ["/bin/sh", "-c"]
    restart: "no"  # SEÇÃO 3.1: Never restart after completion
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /var/log/pgbackrest:mode=1777,size=16M
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "autoclean=true"  # SEÇÃO 3.1: Mark for auto-removal
    environment:
      # Configuração LOCAL (sem pg1-host = sem SSH)
      # pg1-path aponta para o volume montado localmente
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      # Configuração do repositório
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGBACKREST_LOG_LEVEL_FILE: "off"
      PGBACKREST_STANZA: alice_prod
      # Se true, permite resetar stanza inconsistente (perda de metadados de backup)
      PGBACKREST_ALLOW_STANZA_RESET: ${PGBACKREST_ALLOW_STANZA_RESET:-false}
    volumes:
      - /opt/alice/backups/postgresql:/var/lib/pgbackrest:rw
      - postgres_data:/var/lib/postgresql/data:ro
    networks:
      - alice-network
    command:
      - |
        set -eu
        STANZA="$PGBACKREST_STANZA"
        ALLOW_RESET="$PGBACKREST_ALLOW_STANZA_RESET"
        INFO_ERR="/tmp/pgbackrest_info.err"
        CREATE_ERR="/tmp/pgbackrest_create.err"
        if [ -z "$STANZA" ]; then
          STANZA="alice_prod"
        fi
        if [ -z "$ALLOW_RESET" ]; then
          ALLOW_RESET="false"
        fi
        echo "🔍 Verificando se stanza '$STANZA' já existe..."
        if pgbackrest info --stanza="$STANZA" > /tmp/pgbackrest_info.txt 2> "$INFO_ERR"; then
          if grep -q "status: ok" /tmp/pgbackrest_info.txt; then
            echo "✅ Stanza '$STANZA' já existe e está OK"
            exit 0
          fi
        fi
        if grep -qE "ArchiveMismatchError|backup and archive info files exist" "$INFO_ERR"; then
          echo "⚠️  Stanza '$STANZA' inconsistente com o PostgreSQL atual."
          if [ "$ALLOW_RESET" = "true" ]; then
            echo "🧹 Reset autorizado: removendo stanza '$STANZA' (metadados de backup serão recriados)."
            pgbackrest stanza-delete --stanza="$STANZA" --force --log-level-console=info
          else
            echo "❌ Stanza inconsistente. Para resetar, defina PGBACKREST_ALLOW_STANZA_RESET=true."
            cat "$INFO_ERR" >&2
            exit 1
          fi
        fi
        echo "📦 Criando stanza '$STANZA' (modo offline - postgres já está healthy)..."
        # --no-online: Cria stanza sem verificar cluster via SSH/TCP
        # Seguro porque depends_on já garante postgres:service_healthy
        if ! pgbackrest stanza-create --stanza="$STANZA" --no-online --log-level-console=info 2> "$CREATE_ERR"; then
          if grep -qE "ArchiveMismatchError|backup and archive info files exist" "$CREATE_ERR"; then
            echo "⚠️  Stanza '$STANZA' inconsistente durante criação."
            if [ "$ALLOW_RESET" = "true" ]; then
              echo "🧹 Reset autorizado: removendo stanza '$STANZA' e recriando."
              pgbackrest stanza-delete --stanza="$STANZA" --force --log-level-console=info
              pgbackrest stanza-create --stanza="$STANZA" --no-online --log-level-console=info
            else
              echo "❌ Stanza inconsistente. Para resetar, defina PGBACKREST_ALLOW_STANZA_RESET=true."
              cat "$CREATE_ERR" >&2
              exit 1
            fi
          else
            cat "$CREATE_ERR" >&2
            exit 1
          fi
        fi
        echo "✅ Stanza '$STANZA' criada com sucesso!"
        pgbackrest info --stanza="$STANZA"

  # ===========================================================================
  # POSTGRESQL - Banco Principal com pgvector
  # ===========================================================================
  postgres:
    image: ${IMAGE_PREFIX}-postgres:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /var/run/postgresql:mode=1777,size=8M
    shm_size: '1g'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alice_prod}
      PGDATA: /var/lib/postgresql/data
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
    command:
      - "postgres"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=alice_prod archive-push %p || (mkdir -p /tmp/wal_pending && cp %p /tmp/wal_pending/ && echo 'WAL archived to /tmp/wal_pending (stanza pending)')"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "wal_keep_size=512MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
      - /opt/alice/backups/postgresql:/var/lib/pgbackrest:rw
      - /opt/alice/backups/postgresql/logs:/var/log/pgbackrest:rw
      - pgbackrest_spool:/var/spool/pgbackrest
    networks:
      - alice-network
    healthcheck:
      # =================================================================
      # CORREÇÃO PR#89 (09/01/2026): Healthcheck em 4 estágios progressivos
      # =================================================================
      # MELHORIA: Adicionado estágio 0 para verificar se processo está rodando
      # PROBLEMA: Se PostgreSQL crasha por Permission denied, pg_isready nunca retorna
      #           porque o servidor nunca inicia (processo não existe)
      # SOLUÇÃO: Verificar pgrep ANTES de pg_isready para fail-fast em crash loops
      #
      # ESTÁGIOS:
      #   0. Processo PostgreSQL rodando? (fail-fast para crash loops)
      #   1. Aceita conexões? (pg_isready)
      #   2. Database responde? (SELECT 1)
      #   3. Extension vector? (SOFT - não falha em primeiro boot)
      #
      # REF: CLAUDE.md Regra 6 (Enterprise-grade), Regra 9 (Validação contínua)
      # REF: CLAUDE.md Regra 11 (Best practices PostgreSQL 2025)
      # =================================================================
      test:
        - CMD-SHELL
        - |
          # =================================================================
          # ESTÁGIO 0: Processo PostgreSQL está rodando?
          # =================================================================
          # CRÍTICO para detectar crash loops (Permission denied, SIGILL, etc.)
          # Se processo não existe, pg_isready nunca vai funcionar
          # =================================================================
          if ! pgrep -x postgres > /dev/null 2>&1; then
            echo "HEALTHCHECK FAIL [ESTÁGIO 0]: Processo PostgreSQL não encontrado" >&2
            echo "   CAUSA PROVÁVEL: Crash durante inicialização (Permission denied, SIGILL, etc.)" >&2
            echo "   AÇÃO: Verificar logs com 'docker logs alice-postgres'" >&2
            exit 1
          fi
          
          # =================================================================
          # ESTÁGIO 1: PostgreSQL está aceitando conexões?
          # =================================================================
          if ! pg_isready -U ${POSTGRES_USER:-alice} -d ${POSTGRES_DB:-alice_prod} -t 5; then
            echo "HEALTHCHECK FAIL [ESTÁGIO 1]: PostgreSQL não está aceitando conexões" >&2
            exit 1
          fi
          
          # =================================================================
          # ESTÁGIO 2: Database existe e aceita queries?
          # =================================================================
          if ! psql -U ${POSTGRES_USER:-alice} -d ${POSTGRES_DB:-alice_prod} -tAc "SELECT 1;" 2>/dev/null | grep -q 1; then
            echo "HEALTHCHECK FAIL [ESTÁGIO 2]: Database não aceita queries" >&2
            exit 1
          fi
          
          # =================================================================
          # ESTÁGIO 3: Extensão vector está instalada? (SOFT CHECK)
          # =================================================================
          # NÃO falha em primeiro boot - extensão é criada pelo init script
          # =================================================================
          if ! psql -U ${POSTGRES_USER:-alice} -d ${POSTGRES_DB:-alice_prod} -tAc "SELECT 1 FROM pg_extension WHERE extname = 'vector';" 2>/dev/null | grep -q 1; then
            echo "HEALTHCHECK WARN [ESTÁGIO 3]: vector extension não encontrada (pode estar inicializando)" >&2
          fi
          
          exit 0
      # =================================================================
      # CORREÇÃO CRÍTICA PR#86 (08/01/2026): Healthcheck otimizado para primeiro boot
      # =================================================================
      # CORREÇÃO PR#104: Reduzir timeouts - servidor já tem dados
      # Primeiro boot: 90-180s (initdb + pgvector) - raro
      # Boot normal: ~5-10s (dados já existem) - comum
      # =================================================================
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.5'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ===========================================================================
  # POSTGRES EXPORTER - Métricas PostgreSQL (Prometheus)
  # ===========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    platform: linux/amd64
    container_name: alice-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Fonte: https://github.com/prometheus-community/postgres_exporter
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alice_prod}?sslmode=disable
    networks:
      - alice-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9187/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # PGBOUNCER - Connection Pooling para PostgreSQL
  # ===========================================================================
  # Conforme PostgreSQL High Connections Guide 2025
  # Reduz conexões idle de ~50 para ~10, economia de ~400MB RAM
  # Porta 6432 é a porta oficial do PgBouncer (pgbouncer.org)
  # ===========================================================================
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer}:${PGBOUNCER_VERSION:-latest}
    platform: linux/amd64
    container_name: alice-pgbouncer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # edoburu/pgbouncer environment variables (simpler than Bitnami)
      # Ref: https://github.com/edoburu/docker-pgbouncer
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-alice}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-alice_prod}
      # =======================================================================
      # CORREÇÃO PR#106 (10/01/2026): AUTH_TYPE SCRAM-SHA-256
      # =======================================================================
      # PROBLEMA: PostgreSQL 14+ usa SCRAM-SHA-256 por padrão
      #           PgBouncer sem AUTH_TYPE tentava MD5, causando:
      #           "cannot do SCRAM authentication: wrong password type"
      #           Isso impedia TODOS os serviços Alice de conectar!
      #
      # SOLUÇÃO: Configurar AUTH_TYPE=scram-sha-256
      #          PgBouncer passa credenciais ao PostgreSQL para validação
      #
      # REF: https://www.pgbouncer.org/config.html#auth_type
      # REF: CLAUDE.md Regra 7 (Diagnóstico de causa raiz)
      # =======================================================================
      AUTH_TYPE: scram-sha-256
      # PgBouncer Configuration
      # LISTEN_PORT: Porta oficial do PgBouncer conforme pgbouncer.org (não usar 5432 que é do PostgreSQL)
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 3
      MAX_DB_CONNECTIONS: 50
      MAX_USER_CONNECTIONS: 50
      ADMIN_USERS: ${POSTGRES_USER:-alice}
    ports:
      - "6432:6432"
    networks:
      - alice-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-alice}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # PGBOUNCER EXPORTER - Métricas PgBouncer (Prometheus)
  # ===========================================================================
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.9.0
    platform: linux/amd64
    container_name: alice-pgbouncer-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Fonte: https://github.com/prometheus-community/pgbouncer_exporter
      PGBOUNCER_EXPORTER_CONNECTION_STRING: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable
    networks:
      - alice-network
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9127/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # ALICE REDIS - Cache Distribuído
  # ===========================================================================
  alice-redis:
    image: redis:${REDIS_ALICE_VERSION:-7.4.7-alpine}
    platform: linux/amd64
    container_name: alice-redis
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatório em produção}
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --save
      - "900"
      - "1"
      - --save
      - "300"
      - "10"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - alice_redis_data:/data
    networks:
      - alice-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # REDIS EXPORTER - Métricas Redis (Prometheus)
  # ===========================================================================
  redis-exporter:
    # Tag alpine inclui /bin/sh + wget, necessário para healthcheck HTTP (evita falso "unhealthy")
    image: oliver006/redis_exporter:v1.69.0-alpine
    platform: linux/amd64
    container_name: alice-redis-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Fonte: https://github.com/oliver006/redis_exporter
      REDIS_ADDR: redis://alice-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - alice-network
    depends_on:
      alice-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9121/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # QDRANT - Banco Vetorial para Texto (1024 dim)
  # ===========================================================================
  # NOTA (03/01/2026): NÃO usar read_only: true aqui!
  # Qdrant precisa escrever arquivo .qdrant-initialized no WORKDIR /qdrant.
  # Com read_only: true, o container falha com 'Read-only file system' e fica unhealthy.
  # tmpfs em /tmp e /qdrant/tmp não ajudam porque o arquivo é em /qdrant root.
  alice-qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.16.2}
    platform: linux/amd64
    container_name: alice-qdrant
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY é obrigatório em produção}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#94 (09/01/2026): Usar endpoint oficial /healthz
      # REF: https://qdrant.tech/documentation/guides/monitoring/
      # NOTA: Imagem qdrant/qdrant NÃO tem wget/curl
      # Usar timeout + bash + /dev/tcp como fallback robusto
      # CORREÇÃO PR#104: Reduzir interval para 20s
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # MINIO - Object Storage S3 (para Langfuse v3)
  # ===========================================================================
  # NOTA (07/01/2026): MinIO descontinuou Docker Hub em 23/10/2025
  # Migração para Quay.io (registro oficial mantido pela MinIO)
  # Ref: https://quay.io/repository/minio/minio
  # ===========================================================================
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio}:${MINIO_VERSION:-latest}
    platform: linux/amd64
    container_name: alice-minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # =========================================================================
      # MC_HOST_local: Configura alias "local" para MinIO Client (mc)
      # =========================================================================
      # NECESSÁRIO para healthcheck "mc ready local" funcionar
      # Formato: http://USER:PASSWORD@HOST:PORT
      # REF: https://min.io/docs/minio/linux/reference/minio-mc/minio-client-settings.html
      # =========================================================================
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD}@localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - alice-network
    healthcheck:
      # =======================================================================
      # CORREÇÃO PR#99 (09/01/2026): MinIO 2025 Healthcheck Enterprise
      # =======================================================================
      # HISTÓRICO DE PROBLEMAS:
      #   - curl: REMOVIDO da imagem oficial (github.com/minio/minio/issues/18389)
      #   - wget: REMOVIDO da imagem oficial (distroless security)
      #
      # SOLUÇÃO ATUAL: Usar "mc ready local" com MC_HOST_local env var
      #   - mc (MinIO Client) está INCLUÍDO na imagem quay.io/minio/minio
      #   - MC_HOST_local configura o alias "local" automaticamente
      #   - REF: min.io/docs/minio/linux/reference/minio-mc/minio-client-settings.html
      #
      # FALLBACK (se mc não existir na imagem futura):
      #   test: ["CMD-SHELL", "printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' > /dev/tcp/localhost/9000 || exit 1"]
      #   NOTA: Requer bash com /dev/tcp habilitado
      #
      # REF: github.com/minio/minio/issues/18389
      # REF: CLAUDE.md Regra 11 (Seguir docs oficiais 2025)
      # CORREÇÃO PR#104: Reduzir interval para 20s
      # =======================================================================
      test: ["CMD", "mc", "ready", "local"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # MINIO INIT - Cria bucket para Langfuse
  # ===========================================================================
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc}:${MINIO_MC_VERSION:-latest}
    platform: linux/amd64
    container_name: alice-minio-init
    entrypoint: ["/bin/sh", "-c"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    labels:
      - "autoclean=true"  # SEÇÃO 3.1: Mark for auto-removal
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - alice-network
    command:
      - |
        set -e
        echo '🔧 Configurando MinIO client...'
        
        MAX_RETRIES=30
        RETRY_COUNT=0
        
        while [ $$RETRY_COUNT -lt $$MAX_RETRIES ]; do
          if mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" 2>/dev/null; then
            echo '✅ Conectado ao MinIO'
            break
          fi
          RETRY_COUNT=$$((RETRY_COUNT + 1))
          echo "   Tentativa $$RETRY_COUNT/$$MAX_RETRIES - MinIO ainda inicializando..."
          sleep 3
        done
        
        if [ $$RETRY_COUNT -ge $$MAX_RETRIES ]; then
          echo '❌ ERRO: Falha ao conectar ao MinIO após 30 tentativas'
          exit 1
        fi
        
        echo ''
        echo '📦 Criando bucket langfuse-events...'
        if mc mb --ignore-existing myminio/langfuse-events; then
          echo '✅ Bucket langfuse-events criado/verificado'
        else
          echo '❌ ERRO: Falha ao criar bucket langfuse-events'
          exit 1
        fi
        
        echo '🔓 Configurando permissões de download...'
        if mc anonymous set download myminio/langfuse-events; then
          echo '✅ Permissões configuradas'
        else
          echo '⚠️ Aviso: Falha ao configurar permissões (bucket pode já existir com outras permissões)'
        fi
        
        echo ''
        echo '🎉 MinIO inicializado com sucesso!'
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
