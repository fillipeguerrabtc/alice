# =============================================================================
# ALICE PLATFORM - OBSERVABILITY STACK
# =============================================================================
# Versão: 5.1 (WS4 break-glass + ajustes Gate 2)
# Data: 15 de Janeiro de 2026
# Autor: Fillipe Guerra
#
# PROPÓSITO: Stack de observabilidade, métricas, logs e tracing.
#
# CONTAINERS (13):
#   - prometheus - Métricas (scrape Alice services)
#   - grafana - Dashboards + SSO com Alice Auth
#   - loki - Logs agregados
#   - promtail - Coleta de logs
#   - jaeger - Distributed tracing
#   - vector - Agregador de logs
#   - otel-collector - OpenTelemetry pipeline
#   - node-exporter - Métricas do host (network_mode: host)
#   - cadvisor - Métricas de containers (privileged)
#   - langfuse - LLM Observability
#   - langfuse-worker - Processamento assíncrono
#   - langfuse-db - PostgreSQL para Langfuse
#   - clickhouse - OLAP para Langfuse v3
#
# DEPENDÊNCIAS:
#   - INFRA Stack DEVE estar healthy (alice-redis, minio para Langfuse)
#   - ALICE Stack PODE estar up (Grafana SSO via alice-auth)
#
# NOTAS ESPECIAIS:
#   - node-exporter usa network_mode: host (acesso métricas host)
#   - cadvisor usa privileged: true (acesso sistema)
#   - Grafana SSO depende de alice-auth para OIDC
#   - Langfuse v3 depende de ClickHouse + MinIO + Redis
#
# REGRA 11 CLAUDE.md: Seguir melhores práticas 2025
# REGRA 16 CLAUDE.md: Health checks, circuit breakers
# =============================================================================

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  alice-network:
    external: true
    name: alice-network

# =============================================================================
# VOLUMES
# =============================================================================
# NOTA IMPORTANTE (06/01/2026):
# Volumes são HERDADOS de docker-compose.base.yml quando usado com -f
# NÃO redeclarar aqui para evitar conflito "external" + "driver_opts"
#
# Referência: CLAUDE.md Regra 6 - Enterprise-grade, sem workarounds
# =============================================================================

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # PROMETHEUS - Métricas
  # ===========================================================================
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.8.1}
    platform: linux/amd64
    container_name: prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-lifecycle"
    volumes:
      - /opt/alice/data/prometheus:/prometheus
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/rules:/etc/prometheus/rules:ro
      - /opt/alice/secrets/qdrant_api_key:/run/secrets/qdrant_api_key:ro
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#95 (09/01/2026): Prometheus é baseado em BusyBox (não tem curl)
      # REF: https://prometheus.io/docs/prometheus/latest/management_api/
      # Usar wget que está disponível em BusyBox
      # CORREÇÃO PR#104: Reduzir interval para 20s
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # GRAFANA - Dashboards + SSO Alice Auth
  # ===========================================================================
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.3.2}
    platform: linux/amd64
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # =================================================================
      # CORREÇÃO #1: Grafana Behind Reverse Proxy (Caddy)
      # =================================================================
      # PROBLEMA: cookie_secure=true forçava HTTPS mas Grafana roda em HTTP
      # CAUSA RAIZ: Caddy termina SSL → envia HTTP → Grafana força HTTPS → loop
      # SOLUÇÃO: Caddy adiciona Secure flag via headers, Grafana usa HTTP interno
      # REF: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/reverse-proxy/
      # =================================================================
      GF_SERVER_PROTOCOL: http
      GF_SERVER_DOMAIN: observability.yesyoudeserve.duckdns.org
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "false"
      GF_SECURITY_X_CONTENT_TYPE_OPTIONS: "true"
      GF_SECURITY_X_XSS_PROTECTION: "true"
      GF_SERVER_ROOT_URL: https://observability.yesyoudeserve.duckdns.org
      GF_SERVER_ENFORCE_DOMAIN: "false"
      # SSO OAuth - Alice como IdP
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Alice Enterprise
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana-sso
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      # Escopo "alice" é necessário para receber claims customizados (role, tenant_id, modules) via /oauth/userinfo
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email alice
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}/oauth/userinfo
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(role, 'super_admin') && 'Admin' || contains(role, 'admin') && 'Editor' || 'Viewer'"
      # WS4 (Break-glass): manter login local habilitado caso OIDC indisponível
      # (docs/SECRETS.md: GF_AUTH_DISABLE_LOGIN_FORM deve permanecer unset ou false)
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      # SMTP - Grafana Alerting
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GMAIL_USER}
      GF_SMTP_PASSWORD: ${GMAIL_APP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GMAIL_USER}
      GF_SMTP_FROM_NAME: Alice Enterprise Alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - /opt/alice/data/grafana:/var/lib/grafana
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - alice-network
    healthcheck:
      # Grafana tem curl disponível (não wget)
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # LOKI - Log Aggregation
  # ===========================================================================
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.6.3}
    platform: linux/amd64
    container_name: loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../../observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - /opt/alice/data/loki:/loki
    networks:
      - alice-network
    # =======================================================================
    # HEALTHCHECK: DESABILITADO para imagem distroless
    # =======================================================================
    # PROBLEMA: Loki 3.6+ usa imagem distroless (sem shell, wget, curl)
    #           CMD-SHELL falha com: "/bin/sh: no such file or directory"
    #
    # CAUSA RAIZ: Grafana migrou Loki para imagem distroless desde v3.2.0
    #             REF: https://community.grafana.com/t/plans-for-non-distroless-image/143362
    #
    # SOLUÇÃO ENTERPRISE:
    # 1. Desabilitar healthcheck no docker-compose
    # 2. Confiar em: restart: unless-stopped (Docker reinicia se crasha)
    # 3. Monitoramento via Prometheus scraping /metrics (já configurado)
    # 4. Logs mostram Loki funcionando: "uploading tables", "checkpoint done"
    #
    # ALTERNATIVAS CONSIDERADAS E REJEITADAS:
    # - Sidecar container: Adiciona complexidade desnecessária
    # - Imagem Alpine: Não existe mais para Loki 3.6+
    # - CMD com binário loki: Não suporta flag de healthcheck
    #
    # REF: Docker 2025 best practices for distroless containers
    # REF: CLAUDE.md Regra 6 (Enterprise-grade), Regra 11 (Docs oficiais)
    # =======================================================================
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # PROMTAIL - Log Collection
  # ===========================================================================
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-3.6.3}
    platform: linux/amd64
    container_name: promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../../observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log
      # Logs reais dos containers Docker (json-file) para Loki
      # NÃO usa Docker socket (reduz superfície de ataque)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - alice-network
    # =======================================================================
    # HEALTHCHECK: DESABILITADO para imagem sem wget/curl
    # =======================================================================
    # PROBLEMA: Promtail imagem NÃO tem wget, curl ou ferramentas HTTP
    #           REF: https://github.com/grafana/loki/issues/11590
    #
    # NOTA: Promtail está em LTS até 28/02/2026, EOL em 02/03/2026
    #       REF: https://grafana.com/docs/loki/latest/send-data/promtail/installation/
    #
    # SOLUÇÃO ENTERPRISE:
    # 1. Desabilitar healthcheck no docker-compose
    # 2. Confiar em: restart: unless-stopped (Docker reinicia se crasha)
    # 3. Monitoramento via Prometheus scraping /metrics
    #
    # REF: Docker 2025 best practices for minimal images
    # REF: CLAUDE.md Regra 6 (Enterprise-grade), Regra 11 (Docs oficiais)
    # =======================================================================
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # JAEGER - Distributed Tracing (v2.13)
  # ===========================================================================
  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.13.0}
    platform: linux/amd64
    container_name: jaeger
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["--config", "/etc/jaeger/jaeger-config.yml"]
    volumes:
      - ../../observability/jaeger/jaeger-config.yml:/etc/jaeger/jaeger-config.yml:ro
      - jaeger_data:/badger
    networks:
      - alice-network
    healthcheck:
      # Jaeger v2 é distroless (não tem wget/curl)
      # CORREÇÃO PR#94: disable: true é a forma correta de desabilitar
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ===========================================================================
  # VECTOR - Log Aggregator
  # ===========================================================================
  vector:
    image: timberio/vector:${VECTOR_VERSION:-0.45.0-alpine}
    platform: linux/amd64
    container_name: alice-vector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["--config", "/etc/vector/vector.toml"]
    tmpfs:
      - /tmp:mode=1777,size=32M
    ports:
      - "8686:8686"
    volumes:
      - ../vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector
      - /var/log/vector:/var/log/vector
    networks:
      - alice-network
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      # =======================================================================
      # CORREÇÃO PR#106 (10/01/2026): Usar 127.0.0.1 ao invés de localhost
      # =======================================================================
      # PROBLEMA: BusyBox wget resolve "localhost" para IPv6 [::1]
      #           Mas Vector escuta apenas em 0.0.0.0 (IPv4)
      #           Resultado: "Connection refused" no healthcheck
      #
      # EVIDÊNCIA DO SERVIDOR:
      #   $ docker exec alice-vector wget -O - http://localhost:8686/health
      #   Connecting to localhost:8686 ([::1]:8686)  ← IPv6!
      #   wget: can't connect to remote host: Connection refused
      #
      # SOLUÇÃO: Usar 127.0.0.1 explicitamente para forçar IPv4
      #
      # REF: https://vector.dev/docs/reference/api/ (endpoint /health)
      # REF: CLAUDE.md Regra 7 (Diagnóstico de causa raiz)
      # =======================================================================
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 5 http://127.0.0.1:8686/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # OTEL COLLECTOR - OpenTelemetry Pipeline
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.142.0}
    platform: linux/amd64
    container_name: alice-otel-collector
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../../observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - alice-network
    healthcheck:
      # OTel Collector é scratch/distroless (não tem wget/curl)
      # CORREÇÃO PR#94: disable: true é a forma correta de desabilitar
      disable: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # NODE EXPORTER - Métricas do Host
  # ===========================================================================
  # NOTA: Usa bind mounts do host; não depende de network_mode: host
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.9.1}
    platform: linux/amd64
    container_name: alice-node-exporter
    restart: unless-stopped
    pid: host
    security_opt:
      - no-new-privileges:true
    read_only: true
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - alice-network
    healthcheck:
      # Node Exporter é scratch (não tem wget/curl/shell)
      # CORREÇÃO PR#94: disable: true é a forma correta de desabilitar
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # CADVISOR - Container Metrics
  # ===========================================================================
  # NOTA: Usa privileged: true para acessar informações de containers
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.52.1}
    platform: linux/amd64
    container_name: alice-cadvisor
    restart: unless-stopped
    privileged: true
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - alice-network
    healthcheck:
      # cAdvisor é minimalista (não tem wget/curl)
      # CORREÇÃO PR#94: disable: true é a forma correta de desabilitar
      disable: true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # CLICKHOUSE - OLAP para Langfuse v3
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.12-alpine}
    platform: linux/amd64
    container_name: alice-clickhouse
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CLICKHOUSE_LISTEN_HOST: "0.0.0.0"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-langfuse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD-SHELL", "clickhouse-client --host localhost --user ${CLICKHOUSE_USER:-langfuse} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===========================================================================
  # LANGFUSE DB - PostgreSQL para Langfuse
  # ===========================================================================
  langfuse-db:
    image: postgres:${POSTGRES_LANGFUSE_VERSION:-16-alpine}
    platform: linux/amd64
    container_name: alice-langfuse-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD_FILE: /run/secrets/langfuse_db_password
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
      - /opt/alice/secrets/langfuse_db_password:/run/secrets/langfuse_db_password:ro
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # LANGFUSE - LLM Observability v3
  # ===========================================================================
  langfuse:
    image: langfuse/langfuse:${LANGFUSE_VERSION:-3.85.0}
    platform: linux/amd64
    container_name: langfuse
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXT_AUTH_SECRET}
      NEXTAUTH_URL: https://langfuse.yesyoudeserve.duckdns.org
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@alice-langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
      REDIS_HOST: alice-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # NOTA: Usar container name (alice-minio) pois MinIO está em projeto Docker diferente (alice-infra)
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://alice-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      LANGFUSE_ENABLE_BACKGROUND_MIGRATIONS: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      NEXT_RUNTIME: nodejs
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#104: Reduzir timeouts - migrations já aplicadas
      # Primeiro boot: ~2 min (migrations) - raro
      # Boot normal: ~30s (migrations já aplicadas) - comum
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3000/api/public/health',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    # NOTA CROSS-STACK DEPENDENCY (07/01/2026):
    # Langfuse depende de MinIO (S3 storage) que está no stack INFRA.
    # O workflow deploy-stack-modular.yml garante que deploy-observability
    # depende de health-infra (linha 1324), então MinIO está healthy antes
    # de Langfuse iniciar. Não é possível adicionar depends_on direto aqui
    # pois containers estão em stacks diferentes.
    # Ref: CLAUDE.md Regra 16 (Health checks em cascata)
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.35'

  # ===========================================================================
  # LANGFUSE WORKER - Processamento Assíncrono v3
  # ===========================================================================
  langfuse-worker:
    image: langfuse/langfuse-worker:${LANGFUSE_WORKER_VERSION:-3.85.0}
    platform: linux/amd64
    container_name: langfuse-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXT_AUTH_SECRET}
      NEXTAUTH_URL: https://langfuse.yesyoudeserve.duckdns.org
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD}@alice-langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-langfuse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED:-false}
      REDIS_HOST: alice-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # NOTA: Usar container name (alice-minio) pois MinIO está em projeto Docker diferente (alice-infra)
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://alice-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
    networks:
      - alice-network
    # NOTA CROSS-STACK DEPENDENCY (07/01/2026):
    # Langfuse Worker depende de MinIO (S3 storage) que está no stack INFRA.
    # O workflow deploy-stack-modular.yml garante que deploy-observability
    # depende de health-infra (linha 1324), então MinIO está healthy antes
    # de Langfuse Worker iniciar. Não é possível adicionar depends_on direto
    # aqui pois containers estão em stacks diferentes.
    # Ref: CLAUDE.md Regra 16 (Health checks em cascata)
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
