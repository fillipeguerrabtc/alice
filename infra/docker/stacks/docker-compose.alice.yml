# =============================================================================
# ALICE PLATFORM - ALICE STACK (Microserviços + GPU)
# =============================================================================
# Versão: 6.0 (Arquitetura GPU v4.0.0 - Simplificada)
# Data: 11 de Janeiro de 2026
# Autor: Fillipe Guerra
#
# PROPÓSITO: Serviços core da plataforma Alice + GPU Manager + GPU containers
#
# CONTAINERS (8 microserviços + 3 GPU sempre ativos + 1 GPU sob demanda):
#   MICROSERVIÇOS:
#   - alice-frontend - React SPA
#   - alice-auth - OAuth/SAML/OIDC Provider
#   - alice-chat - WebSocket + LLM
#   - alice-rag - Knowledge Base + Embeddings
#   - alice-training - Fine-tuning + Learning
#   - alice-integrations - Stripe, Twilio, Wise, KuCoin (dual-network)
#   - alice-observability - Health checks
#   - gpu-manager - Gerenciamento centralizado de GPU
#
#   GPU (SEMPRE ATIVOS - 15GB de 20GB VRAM):
#   - gpu-qwen-vl - Qwen2.5-VL 7B AWQ (4GB) - LLM + Vision
#   - gpu-embeddings - Qwen3-Embedding-8B INT8 (8GB) - RAG
#   - gpu-asr - Canary-1B (3GB) - Transcrição de áudio
#
#   GPU (SOB DEMANDA via profile):
#   - gpu-trainer (profile: gpu-training) - QLoRA (12GB)
#
# DEPENDÊNCIAS:
#   - INFRA Stack DEVE estar healthy antes deste stack
#   - Drizzle push DEVE ter executado (schema base criado)
#
# REGRA 6 CLAUDE.md: GPU é OBRIGATÓRIO (sem fallback CPU)
# REGRA 12 CLAUDE.md: Deploy Hetzner GPU GEX44
# =============================================================================

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  alice-network:
    external: true
    name: alice-network
  
  erpnext-network:
    external: true
    name: erpnext-network

# =============================================================================
# VOLUMES
# =============================================================================
# NOTA IMPORTANTE (06/01/2026):
# Volumes são HERDADOS de docker-compose.base.yml quando usado com -f
# NÃO redeclarar aqui para evitar conflito "external" + "driver_opts"
#
# Referência: CLAUDE.md Regra 6 - Enterprise-grade, sem workarounds
# =============================================================================

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # ALICE FRONTEND - React SPA
  # ===========================================================================
  # NOTA: Dependência do caddy (stack infra) verificada via job check-dependencies
  # ===========================================================================
  alice-frontend:
    image: ${IMAGE_PREFIX}-frontend:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-frontend
    restart: unless-stopped
    # NOTA: caddy está no stack infra - verificado pelo workflow antes do deploy
    networks:
      - alice-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
      - /var/cache/nginx:mode=1777,size=32M
      - /var/run:mode=1777,size=8M
      # CORREÇÃO 07/01/2026: NGINX precisa escrever logs temporários em /var/lib/nginx
      # Removido /etc/nginx/conf.d pois configs são read-only da imagem
      # Ref: NGINX Alpine 2025 best practices
      - /var/lib/nginx:mode=1777,size=16M
    healthcheck:
      # =======================================================================
      # CORREÇÃO PR#106 (10/01/2026): Usar 127.0.0.1 ao invés de localhost
      # =======================================================================
      # PROBLEMA: BusyBox wget resolve "localhost" para IPv6 [::1]
      #           Mas NGINX escuta apenas em 0.0.0.0 (IPv4)
      #           Resultado: "Connection refused" no healthcheck
      #
      # EVIDÊNCIA DO SERVIDOR:
      #   $ docker exec alice-frontend wget -O - http://localhost:8080/health
      #   Connecting to localhost:8080 ([::1]:8080)  ← IPv6!
      #   wget: can't connect to remote host: Connection refused
      #
      # SOLUÇÃO: Usar 127.0.0.1 explicitamente para forçar IPv4
      #
      # REF: nginx.conf location /health retorna "healthy\n"
      # REF: CLAUDE.md Regra 7 (Diagnóstico de causa raiz)
      # =======================================================================
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 5 http://127.0.0.1:8080/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===========================================================================
  # ALICE AUTH SERVICE - OAuth/SAML/OIDC Provider
  # ===========================================================================
  alice-auth:
    image: ${IMAGE_PREFIX}-auth:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-auth
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@alice-pgbouncer:6432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET}
      OAUTH_CALLBACK_URL: https://yesyoudeserve.duckdns.org/api/auth/callback
      OIDC_ISSUER: ${OIDC_ISSUER:-https://yesyoudeserve.duckdns.org}
      OIDC_COOKIE_KEYS: ${OIDC_COOKIE_KEYS}
      GRAFANA_URL: ${GRAFANA_URL:-https://observability.yesyoudeserve.duckdns.org}
      ERPNEXT_URL: ${ERPNEXT_URL:-https://erp.yesyoudeserve.duckdns.org}
      GRAFANA_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      ERPNEXT_OAUTH_CLIENT_SECRET: ${ERPNEXT_OAUTH_CLIENT_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
    # NOTA: postgres e alice-redis estão no stack infra - verificados pelo workflow
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#103 (10/01/2026): Aumentar start_period
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3001/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ===========================================================================
  # ALICE CHAT SERVICE - WebSocket + LLM
  # ===========================================================================
  alice-chat:
    image: ${IMAGE_PREFIX}-chat:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-chat
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVICE_NAME: chat-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@alice-pgbouncer:6432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      RAG_SERVICE_URL: http://alice-rag:3003
      INTEGRATIONS_SERVICE_URL: http://alice-integrations:3005
      TRAINING_SERVICE_URL: http://alice-training:3004
      GPU_MANAGER_URL: ${GPU_MANAGER_URL:-http://alice-gpu-manager:3010}
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
      # ARQUITETURA v4.0.0: Qwen2.5-VL substitui Mixtral (multimodal, finanças)
      QWEN_VL_GPU_URL: ${QWEN_VL_GPU_URL:-http://gpu-qwen-vl:8000}
    # NOTA: postgres e alice-redis estão no stack infra - verificados pelo workflow
    depends_on:
      gpu-manager:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#104: Reduzir interval para 20s
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3002/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # ALICE RAG SERVICE - Knowledge Base + Embeddings
  # ===========================================================================
  alice-rag:
    image: ${IMAGE_PREFIX}-rag:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-rag
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    env_file:
      - ../.env.prod
    volumes:
      - /opt/alice/uploads:/opt/alice/uploads:rw
    environment:
      NODE_ENV: production
      PORT: 3003
      SERVICE_NAME: rag-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@alice-pgbouncer:6432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET é obrigatório}
      QDRANT_URL: http://alice-qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY é obrigatório em produção}
      GPU_MANAGER_URL: ${GPU_MANAGER_URL:-http://alice-gpu-manager:3010}
      SEARXNG_URL: http://alice-searxng:8080
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
      STORAGE_BASE_DIR: /opt/alice/uploads
      STORAGE_BASE_URL: /api/media/files
      RAG_PUBLIC_BASE_URL: ${RAG_PUBLIC_BASE_URL:?RAG_PUBLIC_BASE_URL é obrigatório}
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
      # CORREÇÃO 12/01/2026: SESSION_SECRET para validação de cookies (session-auth middleware)
      SESSION_SECRET: ${SESSION_SECRET}
    # NOTA: postgres, alice-qdrant, alice-searxng, alice-redis estão no stack infra
    depends_on:
      gpu-manager:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3003/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # ===========================================================================
  # ALICE TRAINING SERVICE - Fine-tuning + Learning
  # ===========================================================================
  alice-training:
    image: ${IMAGE_PREFIX}-training:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-training
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    volumes:
      - /opt/alice/uploads:/opt/alice/uploads:rw
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      PORT: 3004
      SERVICE_NAME: training-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@alice-pgbouncer:6432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      GPU_MANAGER_URL: ${GPU_MANAGER_URL:-http://alice-gpu-manager:3010}
      QDRANT_URL: http://alice-qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
    # NOTA: postgres, alice-qdrant, alice-redis estão no stack infra
    depends_on:
      gpu-manager:
        condition: service_healthy
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO PR#103 (10/01/2026): Aumentar start_period
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3004/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # ALICE INTEGRATIONS SERVICE - Stripe, Twilio, Wise, KuCoin, ERPNext
  # NOTA: Dual-network para comunicar com ERPNext
  # ===========================================================================
  alice-integrations:
    image: ${IMAGE_PREFIX}-integrations:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-integrations
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      PORT: 3005
      SERVICE_NAME: integrations-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@alice-pgbouncer:6432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ERPNEXT_URL: http://erpnext-backend:8000
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      WISE_API_KEY: ${WISE_API_KEY}
      WISE_PROFILE_ID: ${WISE_PROFILE_ID}
      WISE_WEBHOOK_SECRET: ${WISE_WEBHOOK_SECRET:-}
      WISE_SANDBOX: ${WISE_SANDBOX:-false}
      CHAT_SERVICE_URL: http://alice-chat:3002
      TRAINING_SERVICE_URL: http://alice-training:3004
      RAG_SERVICE_URL: http://alice-rag:3003
      QDRANT_URL: http://alice-qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      KUCOIN_PRO_API_KEY: ${KUCOIN_PRO_API_KEY:-}
      KUCOIN_PRO_API_SECRET: ${KUCOIN_PRO_API_SECRET:-}
      KUCOIN_PRO_API_PASSPHRASE: ${KUCOIN_PRO_API_PASSPHRASE:-}
      KUCOIN_PRO_BASE_URL: ${KUCOIN_PRO_BASE_URL:-https://api-futures.kucoin.com}
      KUCOIN_SANDBOX_MODE: ${KUCOIN_SANDBOX_MODE:-false}
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
      # CORREÇÃO 12/01/2026: SESSION_SECRET obrigatório para validação de cookies
      # Sem isso, session-auth middleware não consegue validar assinatura HMAC
      # Resultado: Trading/KuCoin retornava 401 "usuário não autenticado"
      SESSION_SECRET: ${SESSION_SECRET}
    # NOTA: postgres, alice-qdrant, alice-redis estão no stack infra
    # alice-chat e alice-rag são do mesmo stack
    depends_on:
      alice-chat:
        condition: service_healthy
      alice-rag:
        condition: service_healthy
    networks:
      - alice-network
      - erpnext-network
    healthcheck:
      # CORREÇÃO PR#104: Reduzir interval para 20s
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3005/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # ===========================================================================
  # ALICE OBSERVABILITY SERVICE - Health Checks
  # ===========================================================================
  alice-observability:
    image: ${IMAGE_PREFIX}-observability:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-observability
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    env_file:
      - ../.env.prod
    volumes:
      - /opt/alice/backups:/opt/alice/backups:rw
      - /opt/alice/uploads:/opt/alice/uploads:ro
    environment:
      NODE_ENV: production
      PORT: 3007
      SERVICE_NAME: observability-service
      BACKUP_DIR: /opt/alice/backups
      UPLOADS_DIR: /opt/alice/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER:-alice}:${POSTGRES_PASSWORD}@alice-pgbouncer:6432/${POSTGRES_DB:-alice_prod}?sslmode=disable
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      JAEGER_URL: http://jaeger:16686
      LANGFUSE_URL: http://langfuse:3000
      GRAFANA_EXTERNAL_URL: https://observability.yesyoudeserve.duckdns.org
      PROMETHEUS_EXTERNAL_URL: https://metrics.yesyoudeserve.duckdns.org
      JAEGER_EXTERNAL_URL: https://traces.yesyoudeserve.duckdns.org
      LANGFUSE_EXTERNAL_URL: https://langfuse.yesyoudeserve.duckdns.org
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@alice-redis:6379
    # NOTA: caddy, postgres, alice-redis estão no stack infra - verificados pelo workflow
    networks:
      - alice-network
    healthcheck:
      # CORREÇÃO 07/01/2026: Usar endpoint /health SEM autenticação para Docker healthcheck
      # /live requer header x-internal-api-secret que não pode ser passado via healthcheck
      # Ref: apps/observability-service/src/index.ts linha 49 e 372
      # CORREÇÃO PR#104: Reduzir interval para 20s
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3007/health',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # ===========================================================================
  # GPU MANAGER SERVICE - Gerenciamento Centralizado de GPU
  # ===========================================================================
  # ARQUITETURA v4.0.0 (11/01/2026) - Arquitetura Simplificada:
  # - Todos os serviços GPU rodam simultaneamente (15GB de 20GB VRAM)
  # - Qwen2.5-VL 7B AWQ (4GB) - LLM + Vision
  # - Qwen3-Embedding-8B INT8 (8GB) - RAG
  # - Canary-1B (3GB) - ASR
  # - Zero latência de troca (todos sempre ativos)
  # - Treinamento sob demanda (profile gpu-training)
  # ===========================================================================
  gpu-manager:
    image: ${IMAGE_PREFIX}-gpu-manager:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-gpu-manager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env.prod
    environment:
      - PORT=3010
      - REDIS_URL=${REDIS_URL:?REDIS_URL é obrigatório}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET é obrigatório}
      # ARQUITETURA v4.0.0: URLs dos serviços GPU (todos sempre ativos)
      - QWEN_VL_GPU_URL=${QWEN_VL_GPU_URL:-http://gpu-qwen-vl:8000}
      - EMBEDDINGS_GPU_URL=${EMBEDDINGS_GPU_URL:-http://gpu-embeddings:8000}
      - ASR_GPU_URL=${ASR_GPU_URL:-http://gpu-asr:8000}
      - TRAINING_GPU_URL=${TRAINING_GPU_URL:-http://gpu-trainer:8000}
      - NODE_ENV=production
      - GPU_SERVICE_TIMEOUT=${GPU_SERVICE_TIMEOUT:-60000}
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - alice-network
    # NOTA: alice-redis está no stack infra - verificado pelo workflow
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:3010/live',{timeout:5000},(res)=>{res.resume();process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # GPU SERVICES - ARQUITETURA v4.0.0 (11/01/2026)
  # ===========================================================================
  # Todos os serviços GPU rodam SIMULTANEAMENTE (15GB de 20GB VRAM):
  # - gpu-qwen-vl: Qwen2.5-VL 7B AWQ (4GB) - LLM + Vision
  # - gpu-embeddings: Qwen3-Embedding-8B INT8 (8GB) - RAG
  # - gpu-asr: Canary-1B (3GB) - Transcrição de áudio
  # - gpu-trainer: QLoRA (12GB) - Sob demanda via profile
  #
  # Benefícios:
  # - Zero latência de troca (todos sempre ativos)
  # - 5GB livres para operações extras
  # - Treinamento sob demanda pausa serviços temporariamente
  # ===========================================================================

  # Qwen2.5-VL 7B AWQ - LLM + Vision
  # ARQUITETURA v4.0.1 (12/01/2026): Modelo multimodal especializado em finanças/matemática
  # 
  # CORREÇÃO VRAM v4.0.1:
  # - Modelo AWQ ocupa ~6.5GB (pesos), NÃO ~4GB como estimado
  # - max-model-len=4096 reduz KV cache para caber em 8GB total
  # - gpu_memory_utilization=0.45 (9GB) garante espaço para KV cache
  # 
  # VRAM real (nvidia-smi):
  # - Qwen-VL: ~8GB (6.5GB modelo + 1.5GB KV cache com 4096 tokens)
  # - Embeddings: ~7.4GB (Qwen3-Embedding-8B INT8)
  # - ASR: ~4GB (Canary-1B)
  # - Total: ~19.4GB de 20GB
  gpu-qwen-vl:
    image: ${IMAGE_PREFIX}-qwen-vl:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-qwen-vl
    restart: unless-stopped
    runtime: nvidia
    security_opt:
      - no-new-privileges:true
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${QWEN_VL_MODEL_NAME:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      - QUANTIZATION=awq
      # CORREÇÃO v4.0.1: max-model-len=4096 para reduzir KV cache
      # 4096 tokens suficientes para chat e trading (prompts típicos < 2K)
      # NOTA: Reduzido de 8192 pois KV cache excedia VRAM disponível
      - MAX_MODEL_LEN=${QWEN_VL_MAX_MODEL_LEN:-4096}
      # CORREÇÃO v4.0.1: 45% de 20GB = 9GB para Qwen-VL
      # Necessário: 6.5GB (modelo) + 1.5GB (KV cache) = ~8GB mínimo
      - GPU_MEMORY_UTILIZATION=${QWEN_VL_GPU_MEMORY_UTILIZATION:-0.45}
      - TENSOR_PARALLEL_SIZE=1
      - HOST=0.0.0.0
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - alice-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Embeddings GPU - Qwen3-Embedding-8B INT8
  # ARQUITETURA v4.0.0: Quantizado para INT8 (8GB vs 16GB FP16)
  gpu-embeddings:
    image: ${IMAGE_PREFIX}-embeddings-gpu:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-embeddings
    restart: unless-stopped
    runtime: nvidia
    security_opt:
      - no-new-privileges:true
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - TEXT_MODEL_NAME=${TEXT_MODEL_NAME:-Qwen/Qwen3-Embedding-8B}
      - TEXT_EMBEDDING_DIM=${TEXT_EMBEDDING_DIM:-4096}
      - IMAGE_MODEL_NAME=${IMAGE_MODEL_NAME:-laion/CLIP-ViT-H-14-laion2B-s32B-b79K}
      - IMAGE_EMBEDDING_DIM=${IMAGE_EMBEDDING_DIM:-1024}
      # ARQUITETURA v4.0.0: Quantização INT8 para reduzir VRAM de 16GB para 8GB
      - QUANTIZATION=int8
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - alice-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ASR Canary-1B - Transcrição de Áudio
  # ARQUITETURA v4.0.0: Sempre ativo (sem profile)
  gpu-asr:
    image: ${IMAGE_PREFIX}-asr-canary:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-asr
    restart: unless-stopped
    runtime: nvidia
    security_opt:
      - no-new-privileges:true
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_NAME=${ASR_MODEL_NAME:-nvidia/canary-1b-v2}
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - alice-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 6G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # QLoRA Trainer - Fine-tuning (Sob Demanda)
  # ARQUITETURA v4.0.0: Usa profile pois requer pausa dos outros serviços
  # Execução: docker compose --profile gpu-training up -d gpu-trainer
  gpu-trainer:
    image: ${IMAGE_PREFIX}-qwen-trainer:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: gpu-trainer
    restart: unless-stopped
    runtime: nvidia
    profiles:
      - gpu-training
    security_opt:
      - no-new-privileges:true
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - DEVICE=cuda
      - PORT=8000
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
      - STORAGE_DIR=/opt/alice/uploads/training
      # ARQUITETURA v4.0.0: QLoRA para Qwen2.5-VL
      - BASE_MODEL=${QWEN_VL_MODEL_NAME:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      - TRAINING_METHOD=qlora
    volumes:
      - /opt/alice/uploads:/opt/alice/uploads:rw
    ports:
      - "127.0.0.1:8003:8000"
    networks:
      - alice-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 16G
          cpus: '4.0'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
