# =============================================================================
# ALICE PLATFORM - BACKUP STACK
# =============================================================================
# Versão: 5.0 (Arquitetura Modular Multi-Stack)
# Data: 05 de Janeiro de 2026
# Autor: Fillipe Guerra
#
# PROPÓSITO: Stack de backup enterprise.
#
# CONTAINERS (1):
#   - pgbackrest - Backup PostgreSQL enterprise (WAL archiving, incremental)
#
# DEPENDÊNCIAS:
#   - INFRA Stack: postgres deve estar healthy
#
# OPERAÇÃO:
#   - pgbackrest-init no INFRA stack cria a stanza
#   - Este container executa backups programados
#
# REGRA 6 CLAUDE.md: Enterprise-grade, sem workarounds
# =============================================================================

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  alice-network:
    external: true
    name: alice-network

# =============================================================================
# VOLUMES
# =============================================================================
# NOTA IMPORTANTE (06/01/2026):
# Volumes são HERDADOS de docker-compose.base.yml quando usado com -f
# NÃO redeclarar aqui para evitar conflito "external" + "driver_opts"
#
# Referência: CLAUDE.md Regra 6 - Enterprise-grade, sem workarounds
# =============================================================================

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ===========================================================================
  # PGBACKREST - Backup Container
  # ===========================================================================
  # NOTA (08/01/2026): pg1-host OBRIGATÓRIO para conexão TCP entre containers
  # Ref: https://pgbackrest.org/configuration.html#section-stanza/option-pg-host
  # ===========================================================================
  pgbackrest:
    image: ${IMAGE_PREFIX}-pgbackrest:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: alice-pgbackrest
    # NOTA: UID 70 definido no Dockerfile.pgbackrest (mesmo que PostgreSQL Alpine)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    environment:
      # =======================================================================
      # CORREÇÃO PR#96 (09/01/2026): REMOVIDO PGBACKREST_PG1_HOST
      # =======================================================================
      # PROBLEMA ANTERIOR: PGBACKREST_PG1_HOST=postgres forçava SSH
      # Erro: "unable to execute 'ssh': [2] No such file or directory"
      #
      # SOLUÇÃO ENTERPRISE:
      # 1. NÃO usar PG1_HOST (evita SSH)
      # 2. Usar variáveis libpq (PGHOST, PGPORT, etc.) para conexão SQL
      # 3. pg1-path no pgbackrest.conf aponta para volume montado
      #
      # Ref: https://pgbackrest.org/configuration.html
      # =======================================================================
      # Conexão SQL via libpq (pgBackRest usa para pg_start_backup/pg_stop_backup)
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-alice_prod}
      PGUSER: ${POSTGRES_USER:-alice}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Configuração do stanza
      PGBACKREST_STANZA: alice_prod
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS}
      PGBACKREST_REPO1_RETENTION_FULL: "2"
      PGBACKREST_REPO1_RETENTION_DIFF: "7"
      PGBACKREST_LOG_LEVEL_CONSOLE: info
      PGBACKREST_LOG_LEVEL_FILE: detail
      # Schedule: Full backup semanal, diff diário
      BACKUP_SCHEDULE_FULL: "0 2 * * 0"
      BACKUP_SCHEDULE_DIFF: "0 2 * * 1-6"
    volumes:
      - /opt/alice/backups/postgresql:/var/lib/pgbackrest:rw
      - /opt/alice/backups/postgresql/logs:/var/log/pgbackrest:rw
      - postgres_data:/var/lib/postgresql/data:ro
      - pgbackrest_spool:/var/spool/pgbackrest
    networks:
      - alice-network
    # NOTA: postgres e pgbackrest-init estão no stack infra - verificados pelo workflow
    healthcheck:
      # CORREÇÃO PR#104: Reduzir timeouts
      test: ["CMD", "pgbackrest", "info", "--stanza=alice_prod", "--output=json"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # PGBACKREST EXPORTER - Métricas de backup (Prometheus) - WS2
  # ===========================================================================
  # Exporta métricas via `pgbackrest info --output json` (fonte de verdade).
  # Requer acesso ao pgbackrest.conf e ao repo local (/opt/alice/backups/postgresql).
  #
  # Ref: https://github.com/woblerr/pgbackrest_exporter
  # ===========================================================================
  pgbackrest-exporter:
    image: ${PGBACKREST_EXPORTER_IMAGE:-woblerr/pgbackrest_exporter}:${PGBACKREST_EXPORTER_VERSION:-latest}
    platform: linux/amd64
    container_name: alice-pgbackrest-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32M
    environment:
      # Exporter
      EXPORTER_PORT: "9854"
      EXPORTER_TELEMETRY_PATH: "/metrics"
      COLLECT_INTERVAL: "60"
      STANZA_INCLUDE: "alice_prod"
      # pgBackRest (config explícita para evitar exit 37)
      PGBACKREST_CONFIG_PATH: /etc/pgbackrest/pgbackrest.conf
      PGBACKREST_STANZA: alice_prod
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
    volumes:
      # Config SSOT do pgBackRest (necessário para `pgbackrest info`)
      - ../../backup/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Repo local (métricas de backup/repo)
      - /opt/alice/backups/postgresql:/var/lib/pgbackrest:ro
      - /opt/alice/backups/postgresql/logs:/var/log/pgbackrest:ro
    networks:
      - alice-network
    depends_on:
      pgbackrest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9854/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
