  # ===========================================================================
  # EXPORTERS (WS2) - ERPNext Observability
  # ===========================================================================
  # Objetivo: expor métricas mínimas (MariaDB + Redis cache/queue) para Prometheus,
  # sem quebrar o isolamento do stack ERPNext (somente exporters entram em alice-network).
  #
  # NOTA ENTERPRISE: evitar expor portas no host; scrape ocorre via rede Docker.
  # ===========================================================================

  erpnext-mariadb-exporter:
    image: ${MYSQLD_EXPORTER_IMAGE:-prom/mysqld-exporter}:${MYSQLD_EXPORTER_VERSION:-v0.18.0}
    platform: linux/amd64
    container_name: erpnext-mariadb-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Least privilege: usuário dedicado criado via init script do MariaDB (infra/erpnext/mariadb-init)
      ERPNEXT_MYSQL_EXPORTER_USER: ${ERPNEXT_MYSQL_EXPORTER_USER:-erpnext_exporter}
      ERPNEXT_MYSQL_EXPORTER_PASSWORD: ${ERPNEXT_MYSQL_EXPORTER_PASSWORD:?ERPNEXT_MYSQL_EXPORTER_PASSWORD obrigatorio}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "${ERPNEXT_MYSQL_EXPORTER_USER:-}" ]; then
          echo "ERRO: ERPNEXT_MYSQL_EXPORTER_USER não definido (exporter)."
          exit 1
        fi
        cat > /tmp/my.cnf <<EOF
        [client]
        user=${ERPNEXT_MYSQL_EXPORTER_USER}
        password=${ERPNEXT_MYSQL_EXPORTER_PASSWORD}
        host=erpnext-mariadb
        port=3306
        EOF
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/my.cnf --mysqld.address=erpnext-mariadb:3306
    networks:
      - erpnext-network
      - alice-network
    depends_on:
      erpnext-mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  erpnext-redis-cache-exporter:
    # Tag alpine inclui /bin/sh + wget, necessário para healthcheck HTTP (evita falso "unhealthy")
    image: oliver006/redis_exporter:v1.69.0-alpine
    platform: linux/amd64
    container_name: erpnext-redis-cache-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ADDR: redis://erpnext-redis-cache:6379
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD}
    networks:
      - erpnext-network
      - alice-network
    depends_on:
      erpnext-redis-cache:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
        reservations:
          memory: 32M
          cpus: '0.1'

