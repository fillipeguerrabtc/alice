version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alice-postgres
    environment:
      POSTGRES_USER: alice
      POSTGRES_PASSWORD: alice_dev_password
      POSTGRES_DB: alice_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alice -d alice_development && psql -U alice -d alice_development -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alice-network

  # Caddy substitui Traefik em todos os ambientes (MIGRAÇÃO 02/01/2026)
  caddy:
    build:
      context: ./
      dockerfile: Dockerfile.caddy
    container_name: alice-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: admin@yesyoudeserve.duckdns.org
      NODE_ENV: development
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - alice-network

  auth-service:
    build:
      context: ../../
      dockerfile: apps/auth-service/Dockerfile
    container_name: alice-auth
    environment:
      NODE_ENV: development
      PORT: 3001
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql://alice:alice_dev_password@postgres:5432/alice_development
      SESSION_SECRET: dev-session-secret-change-in-prod-32chars
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network

  chat-service:
    build:
      context: ../../
      dockerfile: apps/chat-service/Dockerfile
    container_name: alice-chat
    environment:
      NODE_ENV: development
      PORT: 3002
      SERVICE_NAME: chat-service
      DATABASE_URL: postgresql://alice:alice_dev_password@postgres:5432/alice_development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network

  rag-service:
    build:
      context: ../../
      dockerfile: apps/rag-service/Dockerfile
    container_name: alice-rag
    environment:
      NODE_ENV: development
      PORT: 3003
      SERVICE_NAME: rag-service
      DATABASE_URL: postgresql://alice:alice_dev_password@postgres:5432/alice_development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network

  training-service:
    build:
      context: ../../
      dockerfile: apps/training-service/Dockerfile
    container_name: alice-training
    environment:
      NODE_ENV: development
      PORT: 3004
      SERVICE_NAME: training-service
      DATABASE_URL: postgresql://alice:alice_dev_password@postgres:5432/alice_development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network

  integrations-service:
    build:
      context: ../../
      dockerfile: apps/integrations-service/Dockerfile
    container_name: alice-integrations
    environment:
      NODE_ENV: development
      PORT: 3005
      SERVICE_NAME: integrations-service
      DATABASE_URL: postgresql://alice:alice_dev_password@postgres:5432/alice_development
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      ERPNEXT_URL: ${ERPNEXT_URL:-}
      ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
      ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - alice-network

  vector:
    image: timberio/vector:0.51.1-alpine
    container_name: alice-vector
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NODE_ENV: development
    depends_on:
      caddy:
        condition: service_healthy
    networks:
      - alice-network

volumes:
  postgres_data:
    driver: local
  caddy_data:
  caddy_config:

networks:
  alice-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
