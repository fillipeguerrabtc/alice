# =============================================================================
# SEARXNG SETTINGS - Configuração Enterprise Alice Platform
# =============================================================================
# Autor: Fillipe Guerra
# Data: 26 de Janeiro de 2026
# Documentação: https://docs.searxng.org/admin/settings/index.html
#
# ENTERPRISE (23/12/2025):
# - Tor proxy habilitado para engines .onion (ahmia, torch)
# - Elimina warnings "loading engine ahmia/torch failed"
# - Bot detection configurado para acesso interno
# =============================================================================

# CRÍTICO: Mesclar com configurações padrão ao invés de substituir
# Sem esta diretiva, APENAS os engines definidos aqui seriam usados,
# desabilitando Google, Bing, DuckDuckGo, Wikipedia e todos os outros!
# Documentação: https://docs.searxng.org/admin/settings/settings.html#use-default-settings
use_default_settings: true

# Configurações gerais (mescladas com defaults)
general:
  # Debug desabilitado em produção
  debug: false
  # Instance name
  instance_name: "Alice Search"
  # Contato do admin (não exposto publicamente)
  contact_url: false
  # Ativar métricas para monitoramento
  enable_metrics: true

# Configuração de servidor (Granian ASGI)
server:
  # Bind interno - Traefik faz proxy externo
  bind_address: "0.0.0.0"
  port: 8080
  # Segredo carregado via variável de ambiente SEARXNG_SECRET
  # (não manter valor vazio aqui para não sobrescrever o env)
  # Formato de log JSON para parsing por Loki
  limiter: false
  # Limiter desabilitado - rate limiting feito na borda
  # Instância interna (não exposta publicamente pelo Caddy)
  public_instance: false
  # Resultado de imagens em formato JSON
  image_proxy: true

# Configurações de UI
ui:
  # Tema padrão
  default_theme: simple
  # Locale padrão PT-BR (Regra 13)
  default_locale: pt-BR
  # Resultados por página
  results_on_new_tab: false
  # Centro de resultado
  center_alignment: true
  # Hotkeys habilitadas
  hotkeys: default

# Configuração de saída
outgoing:
  # Request timeout padrão para engines clearnet
  request_timeout: 5.0
  # Timeout de conexão
  connect_timeout: 3.0
  # Pool de conexões
  pool_connections: 100
  pool_maxsize: 20
  # User agent genérico para privacidade
  useragent_suffix: ""
  
  # CORREÇÃO 23/12/2025: NÃO usar proxy global (all://)
  # Proxy global roteia TODAS as buscas pelo Tor (Google, Bing, etc.)
  # causando degradação de performance e captchas/bloqueios
  # Proxy Tor é configurado APENAS nos engines específicos (.onion)
  # via 'proxies' local no engine (ver seção engines abaixo)

# Configuração de busca
search:
  # Safe search desabilitado (é uma ferramenta interna)
  safe_search: 0
  # Autocomplete habilitado
  autocomplete: "google"
  # Formato padrão HTML
  default_lang: "pt-BR"
  # CORREÇÃO 26/01/2026: liberar JSON para integração agentic
  # Sem essa lista, o SearXNG responde 403 para format=json.
  # Docs: https://docs.searxng.org/dev/search_api.html
  formats:
    - html
    - json
  # Máximo de resultados
  max_page: 0
  # Ban time para engines com falha
  ban_time_on_fail: 10
  # Máximo de resultados por request
  max_request_timeout: 15.0

# Engines custom removidas para evitar ruído de deepweb.
# Mantemos engines padrão (use_default_settings: true).
# O Tor permanece disponível para deepweb quando necessário.

# Bot detection (acesso interno via alice-network)
# CORREÇÃO 23/12/2025: Configura trusted proxies para eliminar warning
# "X-Forwarded-For nor X-Real-IP header is set!"
redis:
  # Limiter usa Redis se configurado, senão desabilitado
  url: false

# Plugins habilitados
enabled_plugins:
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker URL remover'
  - 'Unit converter'

