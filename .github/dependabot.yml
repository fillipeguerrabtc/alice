# =============================================================================
# ALICE PLATFORM - DEPENDABOT CONFIGURATION
# =============================================================================
# Automação de atualização de dependências para segurança enterprise
# Atualizado: 07/01/2026
# Autor: Fillipe Guerra
# =============================================================================
# REGRA 11 (CLAUDE.md): Seguir docs oficiais - melhores práticas 2025
# REGRA 6 (CLAUDE.md): Enterprise-grade - detecção automática de CVEs
# =============================================================================
# Ref: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# =============================================================================

version: 2
updates:
  # ============================================================================
  # GitHub Actions - Atualização de actions usadas nos workflows
  # ============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    reviewers:
      - "fillipeguerrabtc"

  # ============================================================================
  # npm - Dependências Node.js (apps/ e packages/)
  # ============================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "security"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    reviewers:
      - "fillipeguerrabtc"
    groups:
      # Agrupar atualizações de tipos TypeScript
      typescript-types:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # Agrupar atualizações de ESLint
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
        update-types:
          - "minor"
          - "patch"
      # Agrupar atualizações de testing
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

  # ============================================================================
  # Docker - Imagens Docker nos docker-compose files
  # ============================================================================
  - package-ecosystem: "docker"
    directory: "/infra/docker/stacks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "docker"
      - "security"
    commit-message:
      prefix: "build(docker)"
      include: "scope"
    reviewers:
      - "fillipeguerrabtc"

  # ============================================================================
  # pip - Dependências Python (GPU containers)
  # ============================================================================
  # NOTA: requirements.txt criados em 07/01/2026 para permitir Dependabot
  # Anteriormente pip install era inline nos Dockerfiles (Dependabot não parseava)
  # ============================================================================
  - package-ecosystem: "pip"
    directory: "/docker/gpu/embeddings-gpu"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "gpu"
      - "security"
    commit-message:
      prefix: "build(deps-gpu)"
      include: "scope"
    reviewers:
      - "fillipeguerrabtc"

  - package-ecosystem: "pip"
    directory: "/docker/gpu/mixtral-vllm"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "gpu"
      - "security"
    commit-message:
      prefix: "build(deps-gpu)"
      include: "scope"
    reviewers:
      - "fillipeguerrabtc"
