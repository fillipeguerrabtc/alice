# =============================================================================
# Composite Action: Setup Node.js + pnpm
# =============================================================================
# Descrição: Action reutilizável para configurar Node.js LTS e pnpm
# ENTERPRISE-GRADE: Elimina duplicação de código entre jobs (~14 repetições → 1)
# Author: Fillipe Guerra
# Data: 27/12/2025
#
# OTIMIZAÇÃO DE PERFORMANCE:
# - Versões passadas via inputs (calculadas uma vez no job principal)
# - Cache pnpm store com restore + save separados (best practice 2025)
# - Fallback automático para mirror npm se registry instável
# - Setup único reutilizado por múltiplos jobs
#
# FIX (27/12/2025): Corrigido bug de cache não persistindo
# - Problema: actions/cache não persiste corretamente em composite actions
# - Solução: Usar actions/cache/restore para restaurar + actions/cache/save para salvar
# - Referência: https://github.com/actions/cache#using-a-combination-of-restore-and-save-caching-steps
#
# REGRAS APLICADAS:
# - REGRA 6: Enterprise-grade - versionamento automático
# - REGRA 11: Melhores práticas GitHub Actions 2025
# - GAP-GHACTIONS-001: SHA pinning para supply chain security
# =============================================================================

name: 'Setup Node.js + pnpm'
description: 'Configura Node.js LTS e pnpm com cache otimizado'

inputs:
  node-version:
    description: 'Versão do Node.js (ex: 22.12 ou 22)'
    required: true
  pnpm-version:
    description: 'Versão do pnpm (ex: 10.26.1)'
    required: true
  install-dependencies:
    description: 'Executar pnpm install após setup (true/false)'
    required: false
    default: 'true'
  save-cache:
    description: 'Salvar cache após install (true/false). Defina como false se outro job já salvou.'
    required: false
    default: 'true'

outputs:
  pnpm-store-path:
    description: 'Caminho do pnpm store para cache'
    value: ${{ steps.pnpm_store_path.outputs.store-dir }}
  cache-hit:
    description: 'Se o cache foi restaurado'
    value: ${{ steps.cache_restore.outputs.cache-hit }}
  cache-key:
    description: 'Chave do cache para uso em save steps externos'
    value: ${{ steps.cache_key.outputs.key }}

runs:
  using: 'composite'
  steps:
    # Enterprise: Fallback automático para mirror se npm registry estiver instável
    - name: Configure npm registry fallback
      shell: bash
      run: |
        if ! curl -sf --max-time 5 https://registry.npmjs.org/pnpm > /dev/null 2>&1; then
          echo "⚠️ npm registry instável, usando mirror npmmirror.com"
          npm config set registry https://registry.npmmirror.com/
          echo "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/" >> $GITHUB_ENV
        fi

    # pnpm/action-setup - SHA: pnpm/action-setup@v4 (c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c)
    - name: Setup pnpm
      uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c
      with:
        version: ${{ inputs.pnpm-version }}

    # SHA: actions/setup-node@v4.1.0 (39370e3970a6d050c480ffad4ff0ed4d3fdee5af)
    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
      with:
        node-version: ${{ inputs.node-version }}

    # Configurar store path explícito para cache consistente
    - name: Configurar pnpm store path
      id: pnpm_store_path
      shell: bash
      run: |
        STORE_DIR="$HOME/.pnpm-store"
        echo "store-dir=$STORE_DIR" >> "$GITHUB_OUTPUT"
        pnpm config set store-dir "$STORE_DIR"

    # Gerar chave de cache para reutilização
    - name: Gerar chave de cache
      id: cache_key
      shell: bash
      run: |
        CACHE_KEY="pnpm-store-${{ runner.os }}-${{ inputs.pnpm-version }}-${{ hashFiles('pnpm-lock.yaml') }}"
        echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
        echo "📦 Cache key: $CACHE_KEY"

    # FIX: Usar actions/cache/restore em vez de actions/cache
    # actions/cache em composite actions não executa o post-step de save corretamente
    # SHA: actions/cache@v4.2.0 (1bd1e32a3bdc45362d1e726936510720a7c30a57)
    - name: Restaurar cache do pnpm
      id: cache_restore
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ${{ steps.pnpm_store_path.outputs.store-dir }}
        key: ${{ steps.cache_key.outputs.key }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ inputs.pnpm-version }}-
          pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        ATTEMPTS=3
        BACKOFF=10
        for attempt in $(seq 1 "${ATTEMPTS}"); do
          echo "📦 pnpm install tentativa ${attempt}/${ATTEMPTS}..."
          if pnpm install --frozen-lockfile --prefer-offline; then
            echo "✅ Dependências instaladas com lockfile congelado"
            exit 0
          fi
          if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
            echo "⚠️ Falha transitória no install. Retry em ${BACKOFF}s..."
            sleep "${BACKOFF}"
            BACKOFF=$((BACKOFF * 2))
          fi
        done
        echo "❌ Falha ao instalar dependências após ${ATTEMPTS} tentativas"
        exit 1
      env:
        NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'

    # FIX: Salvar cache explicitamente após install
    # Só salva se:
    # 1. save-cache está habilitado
    # 2. install-dependencies foi executado
    # 3. Cache não foi restaurado completamente (evita re-save desnecessário)
    # SHA: actions/cache/save@v4.2.0 (1bd1e32a3bdc45362d1e726936510720a7c30a57)
    - name: Salvar cache do pnpm
      if: ${{ inputs.save-cache == 'true' && inputs.install-dependencies == 'true' && steps.cache_restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ${{ steps.pnpm_store_path.outputs.store-dir }}
        key: ${{ steps.cache_key.outputs.key }}
