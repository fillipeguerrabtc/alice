# =============================================================================
# GitHub Actions Workflow - Deploy GPU Services (Salad Cloud)
# =============================================================================
# Descrição: Build, push e deploy dos serviços GPU no Salad Cloud
# Serviços: Mixtral 8x7B (vLLM), ASR Canary, FLUX.1 Schnell, Embeddings GPU
# Infraestrutura: Terraform para Container Groups
# 
# Autor: Fillipe Guerra
# Data: 16 de Dezembro de 2025
# =============================================================================

name: Deploy GPU Services (Salad Cloud)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de deploy'
        type: choice
        options:
          - production
          - staging
        default: 'production'
      services:
        description: 'Serviços para deploy'
        type: choice
        options:
          - all
          - mixtral
          - asr
          - flux
          - embeddings
        default: 'all'
      apply_terraform:
        description: 'Aplicar Terraform (criar/atualizar Container Groups)'
        type: boolean
        default: true
  
  # Trigger automático quando há mudanças nos Dockerfiles GPU
  push:
    branches:
      - main
    paths:
      - 'docker/gpu/**'
      - 'infra/salad-cloud/**'

concurrency:
  group: deploy-salad-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice

jobs:
  # ===========================================================================
  # Job 1: Build e Push das Imagens GPU
  # ===========================================================================
  build-gpu-images:
    name: Build GPU Images
    runs-on: ubuntu-latest
    
    outputs:
      mixtral_digest: ${{ steps.build-mixtral.outputs.digest }}
      asr_digest: ${{ steps.build-asr.outputs.digest }}
      flux_digest: ${{ steps.build-flux.outputs.digest }}
      embeddings_digest: ${{ steps.build-embeddings.outputs.digest }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
      # Bug fix: Exportar quais serviços foram construídos para usar tag correta no Terraform
      mixtral_built: ${{ steps.build-mixtral.outcome == 'success' }}
      asr_built: ${{ steps.build-asr.outcome == 'success' }}
      flux_built: ${{ steps.build-flux.outcome == 'success' }}
      embeddings_built: ${{ steps.build-embeddings.outcome == 'success' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Definir variáveis
        id: vars
        run: |
          echo "image_tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349

      - name: Login no GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ===========================================================================
      # Build Mixtral vLLM
      # ===========================================================================
      - name: Build e Push - Mixtral vLLM
        id: build-mixtral
        # Bug fix: Tratar push trigger onde inputs é vazio (services undefined = build all)
        if: github.event_name == 'push' || github.event.inputs.services == 'all' || github.event.inputs.services == 'mixtral'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: ./docker/gpu/mixtral-vllm
          file: ./docker/gpu/mixtral-vllm/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-mixtral-vllm:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-mixtral-vllm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.vars.outputs.date }}

      # ===========================================================================
      # Build ASR Canary
      # ===========================================================================
      - name: Build e Push - ASR Canary
        id: build-asr
        # Bug fix: Tratar push trigger onde inputs é vazio (services undefined = build all)
        if: github.event_name == 'push' || github.event.inputs.services == 'all' || github.event.inputs.services == 'asr'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: ./docker/gpu/asr-canary
          file: ./docker/gpu/asr-canary/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-asr-canary:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-asr-canary:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===========================================================================
      # Build FLUX.1 Schnell
      # ===========================================================================
      - name: Build e Push - FLUX.1 Schnell
        id: build-flux
        # Bug fix: Tratar push trigger onde inputs é vazio (services undefined = build all)
        if: github.event_name == 'push' || github.event.inputs.services == 'all' || github.event.inputs.services == 'flux'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: ./docker/gpu/flux-schnell
          file: ./docker/gpu/flux-schnell/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-flux-schnell:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-flux-schnell:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===========================================================================
      # Build Embeddings GPU (Dual-Dimension: Qwen3 4096 + OpenCLIP 1024)
      # ===========================================================================
      - name: Build e Push - Embeddings GPU
        id: build-embeddings
        # Bug fix: Tratar push trigger onde inputs é vazio (services undefined = build all)
        if: github.event_name == 'push' || github.event.inputs.services == 'all' || github.event.inputs.services == 'embeddings'
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: ./docker/gpu/embeddings-gpu
          file: ./docker/gpu/embeddings-gpu/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-embeddings-gpu:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-embeddings-gpu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 2: Deploy Terraform (Salad Cloud Container Groups)
  # ===========================================================================
  deploy-salad-terraform:
    name: Deploy Salad Cloud (Terraform)
    runs-on: ubuntu-latest
    needs: build-gpu-images
    # Bug fix: Tratar push trigger (inputs undefined = deploy automático)
    if: github.event_name == 'push' || github.event.inputs.apply_terraform == 'true' || github.event.inputs.apply_terraform == ''
    
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    # Bug fix: Exportar outputs para jobs downstream (state local não é compartilhado)
    outputs:
      mixtral_endpoint: ${{ steps.outputs.outputs.mixtral_endpoint }}
      asr_endpoint: ${{ steps.outputs.outputs.asr_endpoint }}
      flux_endpoint: ${{ steps.outputs.outputs.flux_endpoint }}
      embeddings_endpoint: ${{ steps.outputs.outputs.embeddings_endpoint }}

    steps:
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: ./infra/salad-cloud
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infra/salad-cloud
        env:
          TF_VAR_salad_api_key: ${{ secrets.SALAD_API_KEY }}
          TF_VAR_salad_organization_id: ${{ secrets.SALAD_ORGANIZATION_ID }}
          TF_VAR_salad_project_id: ${{ secrets.SALAD_PROJECT_ID }}
          TF_VAR_huggingface_token: ${{ secrets.HUGGINGFACE_TOKEN }}
          TF_VAR_environment: ${{ github.event.inputs.environment || 'production' }}
          # Bug fix: Usar tag SHA se serviço foi construído, senão fallback para 'latest'
          TF_VAR_mixtral_image: ${{ env.IMAGE_PREFIX }}-mixtral-vllm:${{ needs.build-gpu-images.outputs.mixtral_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
          TF_VAR_asr_image: ${{ env.IMAGE_PREFIX }}-asr-canary:${{ needs.build-gpu-images.outputs.asr_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
          TF_VAR_flux_image: ${{ env.IMAGE_PREFIX }}-flux-schnell:${{ needs.build-gpu-images.outputs.flux_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
          TF_VAR_embeddings_image: ${{ env.IMAGE_PREFIX }}-embeddings-gpu:${{ needs.build-gpu-images.outputs.embeddings_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./infra/salad-cloud
        env:
          TF_VAR_salad_api_key: ${{ secrets.SALAD_API_KEY }}
          TF_VAR_salad_organization_id: ${{ secrets.SALAD_ORGANIZATION_ID }}
          TF_VAR_salad_project_id: ${{ secrets.SALAD_PROJECT_ID }}
          TF_VAR_huggingface_token: ${{ secrets.HUGGINGFACE_TOKEN }}
          TF_VAR_environment: ${{ github.event.inputs.environment || 'production' }}
          # Bug fix: Usar tag SHA se serviço foi construído, senão fallback para 'latest'
          TF_VAR_mixtral_image: ${{ env.IMAGE_PREFIX }}-mixtral-vllm:${{ needs.build-gpu-images.outputs.mixtral_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
          TF_VAR_asr_image: ${{ env.IMAGE_PREFIX }}-asr-canary:${{ needs.build-gpu-images.outputs.asr_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
          TF_VAR_flux_image: ${{ env.IMAGE_PREFIX }}-flux-schnell:${{ needs.build-gpu-images.outputs.flux_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
          TF_VAR_embeddings_image: ${{ env.IMAGE_PREFIX }}-embeddings-gpu:${{ needs.build-gpu-images.outputs.embeddings_built == 'true' && needs.build-gpu-images.outputs.image_tag || 'latest' }}
        run: terraform apply -auto-approve tfplan

      - name: Capturar Outputs
        id: outputs
        working-directory: ./infra/salad-cloud
        run: |
          # Exportar endpoints para job outputs (Bug fix: state local não compartilhado entre runners)
          echo "mixtral_endpoint=$(terraform output -raw mixtral_endpoint)" >> $GITHUB_OUTPUT
          echo "asr_endpoint=$(terraform output -raw asr_endpoint)" >> $GITHUB_OUTPUT
          echo "flux_endpoint=$(terraform output -raw flux_endpoint)" >> $GITHUB_OUTPUT
          echo "embeddings_endpoint=$(terraform output -raw embeddings_endpoint)" >> $GITHUB_OUTPUT
          
          # Summary para visualização
          echo "## Salad Cloud Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          terraform output -json all_endpoints | jq -r 'to_entries[] | "- **\(.key)**: \(.value)"' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 3: Smoke Tests
  # ===========================================================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-salad-terraform
    if: always() && needs.deploy-salad-terraform.result == 'success'

    steps:
      - name: Health Check - Todos os serviços
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          # Bug fix: Usar outputs do job anterior (state Terraform local não compartilhado)
          MIXTRAL_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.mixtral_endpoint }}
          ASR_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.asr_endpoint }}
          FLUX_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.flux_endpoint }}
          EMBEDDINGS_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.embeddings_endpoint }}
        run: |
          echo "## Health Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Aguardar serviços iniciarem (cold start pode demorar)
          echo "Aguardando 120s para cold start dos containers..."
          sleep 120
          
          # Verificar cada endpoint usando outputs do job anterior
          declare -A endpoints=(
            ["mixtral"]="${MIXTRAL_ENDPOINT}"
            ["asr"]="${ASR_ENDPOINT}"
            ["flux"]="${FLUX_ENDPOINT}"
            ["embeddings"]="${EMBEDDINGS_ENDPOINT}"
          )
          
          for service in "${!endpoints[@]}"; do
            endpoint="${endpoints[$service]}"
            if [ -n "$endpoint" ]; then
              echo "Verificando ${service}: ${endpoint}/health"
              
              status=$(curl -sf -o /dev/null -w "%{http_code}" \
                -H "Salad-Api-Key: ${SALAD_API_KEY}" \
                "${endpoint}/health" || echo "000")
              
              if [ "$status" == "200" ]; then
                echo "- ✅ **${service}**: OK (HTTP ${status})" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ⚠️ **${service}**: ${status} (pode estar em cold start)" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "- ⏭️ **${service}**: Endpoint não disponível" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ===========================================================================
  # Job 4: Atualizar .env no Hetzner (opcional)
  # ===========================================================================
  update-hetzner-env:
    name: Update Hetzner .env
    runs-on: ubuntu-latest
    needs: [deploy-salad-terraform, smoke-tests]
    if: always() && needs.deploy-salad-terraform.result == 'success'

    steps:
      - name: Gerar variáveis para Hetzner
        env:
          # Bug fix: Usar outputs do job anterior (state Terraform local não compartilhado)
          MIXTRAL_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.mixtral_endpoint }}
          ASR_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.asr_endpoint }}
          FLUX_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.flux_endpoint }}
          EMBEDDINGS_ENDPOINT: ${{ needs.deploy-salad-terraform.outputs.embeddings_endpoint }}
        run: |
          echo "Gerando variáveis de ambiente para Hetzner..."
          cat > /tmp/salad_endpoints.env << EOF
          # Salad Cloud Endpoints (gerado por GitHub Actions)
          SALAD_MIXTRAL_URL=${MIXTRAL_ENDPOINT}
          SALAD_ASR_URL=${ASR_ENDPOINT}
          SALAD_FLUX_URL=${FLUX_ENDPOINT}
          SALAD_EMBEDDINGS_URL=${EMBEDDINGS_ENDPOINT}
          EOF
          cat /tmp/salad_endpoints.env

      - name: Atualizar .env no Hetzner
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          # Configurar SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${HETZNER_HOST} >> ~/.ssh/known_hosts 2>/dev/null
          
          # Copiar variáveis para Hetzner
          scp /tmp/salad_endpoints.env root@${HETZNER_HOST}:/opt/alice/salad_endpoints.env
          
          # Atualizar .env.prod
          ssh root@${HETZNER_HOST} << 'EOF'
            cd /opt/alice/app/infra/docker
            
            # Backup do .env atual
            cp .env.prod .env.prod.backup.$(date +%Y%m%d_%H%M%S)
            
            # Bug fix: Remover APENAS as variáveis de endpoint Salad (não as credentials!)
            # Mantém: SALAD_API_KEY, SALAD_ORGANIZATION_ID, SALAD_TTS_IMAGE, etc.
            # Remove: SALAD_MIXTRAL_URL, SALAD_ASR_URL, SALAD_FLUX_URL, SALAD_EMBEDDINGS_URL
            grep -v "^SALAD_MIXTRAL_URL=" .env.prod | \
            grep -v "^SALAD_ASR_URL=" | \
            grep -v "^SALAD_FLUX_URL=" | \
            grep -v "^SALAD_EMBEDDINGS_URL=" > /tmp/.env.prod.tmp || true
            
            # Adicionar novas variáveis de endpoint
            cat /tmp/.env.prod.tmp /opt/alice/salad_endpoints.env > .env.prod
            
            echo "✅ .env.prod atualizado com endpoints Salad Cloud (credentials preservadas)"
          EOF
