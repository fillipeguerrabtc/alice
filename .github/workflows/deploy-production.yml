# =============================================================================
# GitHub Actions Workflow - Deploy para Produção (Hetzner Cloud)
# =============================================================================
# Descrição: CI/CD automatizado para deploy da Alice Enterprise Platform
# Servidor: Hetzner CX43 (8 vCPU, 16GB RAM, 160GB SSD) em Nuremberg
# Domínio: yesyoudeserve.duckdns.org
# IP: 46.224.46.93
# Arquitetura: Docker Compose (100% containerizado)
# SEGURANÇA:
#   - GAP-GHACTIONS-001: Actions pinadas a SHA (supply chain security)
#   - GAP-GHACTIONS-002: OIDC/GITHUB_TOKEN para GHCR (elimina PAT para registry)
#   - GAP-GHACTIONS-003: Least privilege permissions
#   - SSH keys para Hetzner (padrão da indústria - OIDC não suportado por VPS)
# =============================================================================

name: Deploy to Production (Hetzner Cloud)

on:
  # =============================================================================
  # REGRA 4: Deploy APENAS manual (Aprovação Obrigatória)
  # Best Practices 2025: Usar Release & Tag para versionamento, depois deploy
  # =============================================================================
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para deploy (ex: v1.0.0, latest)'
        required: false
        default: 'latest'
      services:
        description: 'Serviços para deploy (all, alice-only, erpnext-only)'
        required: false
        default: 'all'
      skip_approval:
        description: 'Pular aprovação manual (hotfix crítico)'
        type: boolean
        default: false
      skip_tests:
        description: 'Pular testes (emergência crítica)'
        type: boolean
        default: false

# =============================================================================
# SEGURANÇA: Permissões mínimas no nível do workflow (GAP-GHACTIONS-003)
# =============================================================================
permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DOMAIN: yesyoudeserve.duckdns.org
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice

jobs:
  # ===========================================================================
  # Job 1: Análise de Código e Qualidade
  # ===========================================================================
  code-quality:
    name: Análise de Qualidade
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    permissions:
      contents: read
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Best Practices 2025: pnpm/action-setup@v4 (Node.js 20, November 2025)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # SHA: actions/setup-node@v4.1.0 (2024-10-24)
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint
        continue-on-error: false

      # Build shared packages primeiro usando TypeScript project references
      # tsc -b respeita a ordem de dependências definida em tsconfig.build.json
      # Ordem: shared → shared-utils → config → logger → database
      # NOTA: NODE_OPTIONS aumenta memória para evitar heap out of memory
      - name: Build shared packages first
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run build:tsc

      - name: TypeScript Check
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run typecheck
        continue-on-error: false

      - name: Executar testes unitários
        run: pnpm run test
        continue-on-error: false

      - name: Verificar vulnerabilidades npm
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # ===========================================================================
  # Job 2: Security Scanning (GAP-GHACTIONS - Audit Logging)
  # ===========================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    
    permissions:
      contents: read
      security-events: write
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Trivy Scanner para vulnerabilidades em containers
      # SHA: aquasecurity/trivy-action@0.28.0 (2024-10-15)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      # Upload results to GitHub Security tab
      # SHA: github/codeql-action@v3.27.0 (2024-11-05)
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ===========================================================================
  # Job 3: Build Imagens Docker
  # ===========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Extrair metadata
        id: meta
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # SHA: docker/setup-buildx-action@v3.7.1 (2024-10-22)
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349

      # SHA: docker/login-action@v3.3.0 (2024-07-31)
      # GAP-GHACTIONS-002: Usando GITHUB_TOKEN (OIDC nativo) em vez de PAT para GHCR
      # github.token é automaticamente provisionado pelo GitHub Actions com escopo limitado
      # Mais seguro que PAT: não requer secret manual, expira automaticamente, permissões mínimas
      # NOTA: Usar github.token (não secrets.GITHUB_TOKEN) - é um contexto especial do GitHub Actions
      - name: Login no GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build paralelo de todas as imagens
      # SHA: docker/build-push-action@v6.9.0 (2024-10-22)
      - name: Build e Push - Auth Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-auth:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-auth:latest
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth
          platforms: linux/amd64

      - name: Build e Push - Chat Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/chat-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-chat:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-chat:latest
          cache-from: type=gha,scope=chat
          cache-to: type=gha,mode=max,scope=chat
          platforms: linux/amd64

      - name: Build e Push - RAG Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/rag-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-rag:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-rag:latest
          cache-from: type=gha,scope=rag
          cache-to: type=gha,mode=max,scope=rag
          platforms: linux/amd64

      - name: Build e Push - Training Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/training-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-training:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-training:latest
          cache-from: type=gha,scope=training
          cache-to: type=gha,mode=max,scope=training
          platforms: linux/amd64

      - name: Build e Push - Integrations Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/integrations-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-integrations:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-integrations:latest
          cache-from: type=gha,scope=integrations
          cache-to: type=gha,mode=max,scope=integrations
          platforms: linux/amd64

      - name: Build e Push - Frontend Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/frontend-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

      # ===========================================================================
      # SERVIÇOS ADICIONAIS - Enterprise Stack Completo (9 microsserviços)
      # ===========================================================================
      
      - name: Build e Push - Observability Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/observability-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-observability:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-observability:latest
          cache-from: type=gha,scope=observability
          cache-to: type=gha,mode=max,scope=observability
          platforms: linux/amd64

      - name: Build e Push - CLIP Inference Service (GPU/Salad Cloud)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/clip-inference-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-clip-inference:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-clip-inference:latest
          cache-from: type=gha,scope=clip-inference
          cache-to: type=gha,mode=max,scope=clip-inference
          platforms: linux/amd64

      - name: Build e Push - API Gateway (Traefik Config)
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api-gateway:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api-gateway:latest
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway
          platforms: linux/amd64

  # ===========================================================================
  # Job 4: Container Image Security Scan (Trivy)
  # A1 Code Review: Trivy image scan para vulnerabilidades em containers
  # ===========================================================================
  image-security-scan:
    name: Container Image Security
    runs-on: ubuntu-latest
    needs: build-docker
    if: always() && needs.build-docker.result == 'success'
    
    permissions:
      contents: read
      packages: read
      security-events: write
    
    steps:
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Login no GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Scan Auth Service Image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_PREFIX }}-auth:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-auth.sarif'
        continue-on-error: true

      - name: Scan Chat Service Image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_PREFIX }}-chat:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-chat.sarif'
        continue-on-error: true

      - name: Scan Frontend Service Image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
        continue-on-error: true

      - name: Upload Trivy Auth scan results
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        with:
          sarif_file: 'trivy-auth.sarif'
          category: 'trivy-auth-image'
        continue-on-error: true

      - name: Upload Trivy Chat scan results
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        with:
          sarif_file: 'trivy-chat.sarif'
          category: 'trivy-chat-image'
        continue-on-error: true

      - name: Upload Trivy Frontend scan results
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'trivy-frontend-image'
        continue-on-error: true

  # ===========================================================================
  # Job 5: Aprovação Manual (ambiente production)
  # ===========================================================================
  manual-approval:
    name: Aguardando Aprovação
    runs-on: ubuntu-latest
    needs: [build-docker, image-security-scan]
    if: github.event.inputs.skip_approval != 'true'
    environment: production
    
    permissions:
      contents: read
    
    steps:
      - name: Aprovação concedida
        run: |
          echo "Deploy para produção aprovado!"
          echo "Commit: ${{ github.sha }}"
          echo "Por: ${{ github.actor }}"

  # ===========================================================================
  # Job 6: Deploy para Hetzner Cloud via Docker Compose
  # ===========================================================================
  # SEGURANÇA (GAP-GHACTIONS-002):
  # - GITHUB_TOKEN: Usado para GHCR (OIDC nativo, sem PAT)
  # - GH_PAT: Ainda necessário para git clone no servidor Hetzner
  #   (GITHUB_TOKEN não funciona fora do runner GitHub Actions)
  # - SSH keys: Padrão da indústria para VPS (OIDC não suportado por Hetzner)
  # ===========================================================================
  deploy:
    name: Deploy Hetzner Cloud
    runs-on: ubuntu-latest
    needs: [build-docker, image-security-scan, manual-approval]
    if: always() && needs.build-docker.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped')
    
    permissions:
      contents: read
    
    env:
      IMAGE_TAG: ${{ needs.build-docker.outputs.image_tag }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HETZNER_VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Criar arquivo .env.prod seguro
        run: |
          cat > .env.prod << EOF
          # ==============================================
          # ALICE PLATFORM - PRODUÇÃO
          # Gerado automaticamente pelo CI/CD
          # Commit: ${{ github.sha }}
          # ==============================================
          
          # Imagens Docker
          IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          
          # PostgreSQL Alice
          POSTGRES_USER=alice
          POSTGRES_PASSWORD=${{ secrets.PGPASSWORD }}
          POSTGRES_DB=alice_prod
          
          # Redis ERPNext (ACL habilitado - GAP-ERPNEXT-001)
          REDIS_CACHE_PASSWORD=${{ secrets.REDIS_CACHE_PASSWORD }}
          REDIS_QUEUE_PASSWORD=${{ secrets.REDIS_QUEUE_PASSWORD }}
          
          # Sessão e Segurança S2S
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          INTERNAL_API_SECRET=${{ secrets.INTERNAL_API_SECRET }}
          
          # OAuth Google
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          
          # OAuth GitHub
          OAUTH_GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          
          # Salad Cloud (LLM)
          SALAD_API_KEY=${{ secrets.SALAD_API_KEY }}
          SALAD_ORGANIZATION_ID=${{ secrets.SALAD_ORGANIZATION_ID }}
          
          # Stripe Portugal
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          
          # Twilio
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER=${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          
          # Resend
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          
          # Wise (pagamentos globais)
          WISE_API_KEY=${{ secrets.WISE_API_KEY }}
          WISE_PROFILE_ID=${{ secrets.WISE_PROFILE_ID }}
          WISE_WEBHOOK_SECRET=${{ secrets.WISE_WEBHOOK_SECRET }}
          WISE_SANDBOX=false
          
          # ERPNext Database
          ERPNEXT_SITE_NAME=erp.yesyoudeserve.duckdns.org
          ERPNEXT_MYSQL_ROOT_PASSWORD=${{ secrets.ERPNEXT_MYSQL_ROOT_PASSWORD }}
          ERPNEXT_ADMIN_PASSWORD=${{ secrets.ERPNEXT_ADMIN_PASSWORD }}
          ERPNEXT_DB_NAME=erpnext
          ERPNEXT_DB_USER=erpnext
          ERPNEXT_DB_PASSWORD=${{ secrets.ERPNEXT_DB_PASSWORD }}
          
          # ERPNext API (para integrations-service)
          ERPNEXT_URL=https://erp.yesyoudeserve.duckdns.org
          ERPNEXT_API_KEY=${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET=${{ secrets.ERPNEXT_API_SECRET }}
          EOF
          chmod 600 .env.prod

      - name: Transferir arquivos via SCP
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .env.prod ${{ secrets.HETZNER_VM_USER }}@${{ secrets.HETZNER_VM_HOST }}:/tmp/.env.prod

      # SHA: appleboy/ssh-action@v1.2.0 (2024-09-16)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice
          IMAGE_TAG: ${{ needs.build-docker.outputs.image_tag || github.sha }}
          DEPLOY_SERVICES: ${{ github.event.inputs.services || 'all' }}
          REPO_FULL_NAME: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: ${{ secrets.HETZNER_VM_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          envs: GH_PAT,PGPASSWORD,IMAGE_PREFIX,IMAGE_TAG,DEPLOY_SERVICES,REPO_FULL_NAME,GITHUB_SHA,GITHUB_ACTOR
          script: |
            set -e
            
            # Variáveis já injetadas via envs do ssh-action
            export IMAGE_PREFIX="${IMAGE_PREFIX}"
            export IMAGE_TAG="${IMAGE_TAG}"
            export DEPLOY_SERVICES="${DEPLOY_SERVICES}"
            
            echo "=============================================="
            echo "ALICE ENTERPRISE - DEPLOY PRODUÇÃO"
            echo "=============================================="
            echo "Domínio: yesyoudeserve.duckdns.org"
            echo "Commit: ${GITHUB_SHA}"
            echo "Image Prefix: ${IMAGE_PREFIX}"
            echo "Image Tag: ${IMAGE_TAG}"
            echo "Serviços: ${DEPLOY_SERVICES}"
            echo "Repositório: ${REPO_FULL_NAME}"
            echo "Timestamp: $(date)"
            echo "=============================================="
            
            # Criar estrutura de diretórios
            mkdir -p /opt/alice/{app,data,logs,backups}
            cd /opt/alice
            
            # ==============================================
            # SETUP INICIAL - Redes Docker (idempotente)
            # ==============================================
            echo "Configurando redes Docker..."
            
            if ! docker network inspect alice-network >/dev/null 2>&1; then
              docker network create --driver bridge --subnet 172.28.0.0/16 alice-network
            fi
            
            if ! docker network inspect erpnext-network >/dev/null 2>&1; then
              docker network create --driver bridge erpnext-network
            fi
            
            echo "Redes Docker configuradas"
            
            # ==============================================
            # PRÉ-DEPLOY: LIMPEZA SEGURA
            # ==============================================
            echo "PRÉ-DEPLOY: LIMPEZA SEGURA"
            docker container prune -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            docker builder prune -f 2>/dev/null || true
            docker volume prune -f 2>/dev/null || true
            
            # Clone ou update do repositório
            REPO_URL="https://${GITHUB_ACTOR}:${GH_PAT}@github.com/${REPO_FULL_NAME}.git"
            
            if [ -d "app/.git" ]; then
              cd app
              git remote set-url origin "${REPO_URL}"
              git fetch origin
              git checkout main
              git reset --hard origin/main
              git remote set-url origin "https://github.com/${REPO_FULL_NAME}.git"
              cd ..
            else
              rm -rf app
              git clone "${REPO_URL}" app
              cd app
              git remote set-url origin "https://github.com/${REPO_FULL_NAME}.git"
              cd ..
            fi
            cd app
            
            # Mover .env.prod para diretório correto
            mv /tmp/.env.prod infra/docker/.env.prod
            chmod 600 infra/docker/.env.prod
            
            # Login no GitHub Container Registry
            echo "${GH_PAT}" | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
            
            cd infra/docker
            
            # ==============================================
            # MIGRAÇÃO DATABASE - RLS e índices
            # ==============================================
            echo "Iniciando PostgreSQL para migração..."
            docker compose -f docker-compose.prod.yml \
              --env-file .env.prod \
              up -d postgres
            
            # Aguardar PostgreSQL
            PG_READY=false
            for i in {1..30}; do
              if docker compose -f docker-compose.prod.yml \
                --env-file .env.prod \
                exec -T postgres pg_isready -U alice -d alice_prod >/dev/null 2>&1; then
                echo "PostgreSQL está pronto!"
                PG_READY=true
                break
              fi
              sleep 2
            done
            
            if [ "$PG_READY" = "false" ]; then
              echo "ERRO: PostgreSQL não está pronto"
              exit 1
            fi
            
            # Executar migração RLS
            echo "Executando migração RLS..."
            if [ -f "../../drizzle/migrations/0001_rls_security_enterprise.sql" ]; then
              docker compose -f docker-compose.prod.yml \
                --env-file .env.prod \
                exec -T postgres psql -U alice -d alice_prod \
                -f /dev/stdin < ../../drizzle/migrations/0001_rls_security_enterprise.sql || echo "Migração RLS já aplicada ou erro ignorável"
            fi
            
            echo "Migração concluída!"
            
            # Deploy baseado nos serviços selecionados
            case "${DEPLOY_SERVICES}" in
              "alice-only")
                echo "Deploy apenas Alice Stack..."
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  pull --ignore-pull-failures \
                  alice-frontend alice-auth alice-chat alice-rag alice-training alice-integrations
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  up -d --no-build --remove-orphans \
                  dockerproxy traefik-init traefik postgres alice-frontend alice-auth alice-chat alice-rag alice-training alice-integrations
                ;;
              "erpnext-only")
                echo "Deploy apenas ERPNext Stack..."
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  up -d --no-build --remove-orphans \
                  erpnext-mariadb erpnext-redis-cache erpnext-redis-queue \
                  erpnext-configurator erpnext-create-site \
                  erpnext-backend erpnext-frontend erpnext-websocket \
                  erpnext-scheduler erpnext-worker-short erpnext-worker-default erpnext-worker-long
                ;;
              *)
                echo "Deploy Stack Completa (Alice + ERPNext)..."
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  pull --ignore-pull-failures
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  up -d --no-build --remove-orphans
                ;;
            esac
            
            echo "=============================================="
            echo "DEPLOY CONCLUÍDO COM SUCESSO!"
            echo "=============================================="
            docker compose -f docker-compose.prod.yml ps

  # ===========================================================================
  # Job 6: Health Check Pós-Deploy
  # ===========================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    
    permissions:
      contents: read
    
    steps:
      - name: Aguardar serviços iniciarem
        run: sleep 60

      - name: Health Check - Frontend
        run: |
          curl -sf https://yesyoudeserve.duckdns.org/health || echo "Frontend health check falhou (pode estar iniciando)"

      - name: Health Check - Auth Service
        run: |
          curl -sf https://yesyoudeserve.duckdns.org/api/auth/health || echo "Auth service health check falhou (pode estar iniciando)"

      - name: Health Check - ERPNext
        run: |
          curl -sf https://erp.yesyoudeserve.duckdns.org/api/method/frappe.ping || echo "ERPNext health check falhou (pode estar iniciando)"

      - name: Resumo do Deploy
        run: |
          echo "=============================================="
          echo "DEPLOY HEALTH CHECK CONCLUÍDO"
          echo "=============================================="
          echo "Frontend: https://yesyoudeserve.duckdns.org"
          echo "ERPNext: https://erp.yesyoudeserve.duckdns.org"
          echo "Commit: ${{ github.sha }}"
          echo "=============================================="
