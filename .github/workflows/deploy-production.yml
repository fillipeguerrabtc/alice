# =============================================================================
# GitHub Actions Workflow - Deploy para Produção (Hetzner Cloud)
# =============================================================================
# Descrição: CI/CD automatizado para deploy da Alice Enterprise Platform
# Servidor: Hetzner CX43 (8 vCPU, 16GB RAM, 160GB SSD) em Nuremberg
# Domínio: yesyoudeserve.duckdns.org
# IP: 46.224.46.93
# Arquitetura: Docker Compose (100% containerizado)
# =============================================================================

name: Deploy to Production (Hetzner Cloud)

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Serviços para deploy (all, alice-only, erpnext-only)'
        required: false
        default: 'all'
      skip_approval:
        description: 'Pular aprovação manual (hotfix)'
        type: boolean
        default: false
      skip_tests:
        description: 'Pular testes (emergência)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/**'

env:
  NODE_VERSION: '20'
  DOMAIN: yesyoudeserve.duckdns.org
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice

jobs:
  # ===========================================================================
  # Job 1: Análise de Código e Qualidade
  # ===========================================================================
  code-quality:
    name: Análise de Qualidade
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npm run typecheck

      - name: Executar testes unitários
        run: npm run test

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=moderate || echo "Vulnerabilidades moderate do esbuild/vite conhecidas"

  # ===========================================================================
  # Job 2: Build Imagens Docker
  # ===========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Extrair metadata
        id: meta
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # Build paralelo de todas as imagens
      - name: Build e Push - Auth Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-auth:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-auth:latest
          cache-from: type=gha,scope=auth
          cache-to: type=gha,mode=max,scope=auth
          platforms: linux/amd64

      - name: Build e Push - Chat Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/chat-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-chat:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-chat:latest
          cache-from: type=gha,scope=chat
          cache-to: type=gha,mode=max,scope=chat
          platforms: linux/amd64

      - name: Build e Push - RAG Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/rag-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-rag:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-rag:latest
          cache-from: type=gha,scope=rag
          cache-to: type=gha,mode=max,scope=rag
          platforms: linux/amd64

      - name: Build e Push - Training Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/training-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-training:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-training:latest
          cache-from: type=gha,scope=training
          cache-to: type=gha,mode=max,scope=training
          platforms: linux/amd64

      - name: Build e Push - Integrations Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/integrations-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-integrations:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-integrations:latest
          cache-from: type=gha,scope=integrations
          cache-to: type=gha,mode=max,scope=integrations
          platforms: linux/amd64

      - name: Build e Push - Frontend Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          platforms: linux/amd64

  # ===========================================================================
  # Job 3: Aprovação Manual (ambiente production)
  # ===========================================================================
  manual-approval:
    name: Aguardando Aprovação
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event.inputs.skip_approval != 'true'
    environment: production
    steps:
      - name: Aprovação concedida
        run: |
          echo "🚀 Deploy para produção aprovado!"
          echo "Commit: ${{ github.sha }}"
          echo "Por: ${{ github.actor }}"

  # ===========================================================================
  # Job 4: Deploy para Hetzner Cloud via Docker Compose
  # ===========================================================================
  deploy:
    name: Deploy Hetzner Cloud
    runs-on: ubuntu-latest
    needs: [build-docker, manual-approval]
    if: always() && needs.build-docker.result == 'success' && (needs.manual-approval.result == 'success' || needs.manual-approval.result == 'skipped')
    env:
      IMAGE_TAG: ${{ needs.build-docker.outputs.image_tag }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HETZNER_VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Criar arquivo .env.prod seguro
        run: |
          cat > .env.prod << EOF
          # ==============================================
          # ALICE PLATFORM - PRODUÇÃO
          # Gerado automaticamente pelo CI/CD
          # Commit: ${{ github.sha }}
          # ==============================================
          
          # Imagens Docker
          IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          
          # PostgreSQL Alice
          POSTGRES_USER=alice
          POSTGRES_PASSWORD=${{ secrets.PGPASSWORD }}
          POSTGRES_DB=alice_prod
          
          # Sessão
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          
          # OAuth Google
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          
          # OAuth GitHub
          OAUTH_GITHUB_CLIENT_ID=${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET=${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          
          # Salad Cloud (LLM)
          SALAD_API_KEY=${{ secrets.SALAD_API_KEY }}
          SALAD_ORGANIZATION_ID=${{ secrets.SALAD_ORGANIZATION_ID }}
          
          # Stripe Portugal
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          
          # Twilio
          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER=${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          
          # Resend
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          
          # Wise (pagamentos globais)
          WISE_API_KEY=${{ secrets.WISE_API_KEY }}
          WISE_PROFILE_ID=${{ secrets.WISE_PROFILE_ID }}
          WISE_WEBHOOK_SECRET=${{ secrets.WISE_WEBHOOK_SECRET }}
          WISE_SANDBOX=false
          
          # ERPNext Database
          # NOTA: Secrets criados após primeiro deploy do ERPNext
          # Se vazios, o ERPNext usará defaults internos da imagem Docker
          ERPNEXT_SITE_NAME=erp.yesyoudeserve.duckdns.org
          ERPNEXT_MYSQL_ROOT_PASSWORD=${{ secrets.ERPNEXT_MYSQL_ROOT_PASSWORD }}
          ERPNEXT_DB_NAME=erpnext
          ERPNEXT_DB_USER=erpnext
          ERPNEXT_DB_PASSWORD=${{ secrets.ERPNEXT_DB_PASSWORD }}
          
          # ERPNext API (para integrations-service)
          # NOTA: Secrets criados após setup do site ERPNext
          ERPNEXT_URL=https://erp.yesyoudeserve.duckdns.org
          ERPNEXT_API_KEY=${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET=${{ secrets.ERPNEXT_API_SECRET }}
          EOF
          chmod 600 .env.prod

      - name: Transferir arquivos via SCP
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no .env.prod ${{ secrets.HETZNER_VM_USER }}@${{ secrets.HETZNER_VM_HOST }}:/tmp/.env.prod

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice
          IMAGE_TAG: ${{ needs.build-docker.outputs.image_tag || github.sha }}
          DEPLOY_SERVICES: ${{ github.event.inputs.services || 'all' }}
          REPO_FULL_NAME: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: ${{ secrets.HETZNER_VM_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          envs: GH_PAT,PGPASSWORD,IMAGE_PREFIX,IMAGE_TAG,DEPLOY_SERVICES,REPO_FULL_NAME,GITHUB_SHA,GITHUB_ACTOR
          script: |
            set -e
            
            # Variáveis já injetadas via envs do ssh-action
            export IMAGE_PREFIX="${IMAGE_PREFIX}"
            export IMAGE_TAG="${IMAGE_TAG}"
            export DEPLOY_SERVICES="${DEPLOY_SERVICES}"
            
            echo "=============================================="
            echo "🚀 ALICE ENTERPRISE - DEPLOY PRODUÇÃO"
            echo "=============================================="
            echo "Domínio: yesyoudeserve.duckdns.org"
            echo "Commit: ${GITHUB_SHA}"
            echo "Image Prefix: ${IMAGE_PREFIX}"
            echo "Image Tag: ${IMAGE_TAG}"
            echo "Serviços: ${DEPLOY_SERVICES}"
            echo "Repositório: ${REPO_FULL_NAME}"
            echo "Timestamp: $(date)"
            echo "=============================================="
            
            # Debug: verificar variáveis recebidas
            echo ""
            echo "🔍 DEBUG - Variáveis recebidas via SSH:"
            echo "  REPO_FULL_NAME: ${REPO_FULL_NAME:-NÃO DEFINIDO}"
            echo "  GITHUB_ACTOR: ${GITHUB_ACTOR:-NÃO DEFINIDO}"
            echo "  GH_PAT length: ${#GH_PAT} chars"
            echo ""
            
            # Criar estrutura de diretórios
            mkdir -p /opt/alice/{app,data,logs,backups}
            cd /opt/alice
            
            # ==============================================
            # SETUP INICIAL - Redes Docker (idempotente)
            # ==============================================
            echo "🔧 Configurando redes Docker..."
            
            # Criar rede alice-network se não existir
            if ! docker network inspect alice-network >/dev/null 2>&1; then
              echo "  → Criando rede alice-network..."
              docker network create --driver bridge --subnet 172.28.0.0/16 alice-network
            else
              echo "  ✓ Rede alice-network já existe"
            fi
            
            # Criar rede erpnext-network se não existir
            if ! docker network inspect erpnext-network >/dev/null 2>&1; then
              echo "  → Criando rede erpnext-network..."
              docker network create --driver bridge erpnext-network
            else
              echo "  ✓ Rede erpnext-network já existe"
            fi
            
            echo "✓ Redes Docker configuradas"
            echo ""
            
            # Clone ou update do repositório usando header-based auth
            # Isso resolve: "fatal: could not read Username for 'https://github.com'"
            # Usando header evita exposição do token em URLs/logs de erro
            echo "🔑 Verificando GH_PAT..."
            if [ -z "${GH_PAT}" ]; then
              echo "❌ ERRO: GH_PAT não está configurado ou não foi passado para o script SSH!"
              echo "   Verifique: 1) Se o secret existe  2) Se o token não expirou  3) Se tem permissões repo/packages"
              exit 1
            fi
            # Debug: mostrar apenas o comprimento do token (nunca o token em si!)
            echo "✓ GH_PAT recebido (${#GH_PAT} caracteres)"
            
            GH_AUTH_HEADER="Authorization: Bearer ${GH_PAT}"
            REPO_URL="https://github.com/${REPO_FULL_NAME}.git"
            
            if [ -d "app/.git" ]; then
              echo "📥 Atualizando repositório..."
              cd app
              git -c "http.extraHeader=${GH_AUTH_HEADER}" fetch origin
              git checkout main
              git reset --hard origin/main
              cd ..
            else
              echo "📥 Clonando repositório..."
              rm -rf app
              git -c "http.extraHeader=${GH_AUTH_HEADER}" clone "${REPO_URL}" app
            fi
            cd app
            
            # Mover .env.prod para diretório correto
            echo "📝 Configurando variáveis de ambiente..."
            mv /tmp/.env.prod infra/docker/.env.prod
            chmod 600 infra/docker/.env.prod
            
            # Login no GitHub Container Registry usando Personal Access Token
            echo "🔐 Autenticando no registry..."
            echo "${GH_PAT}" | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin
            
            # Carregar variáveis de ambiente
            cd infra/docker
            
            # ==============================================
            # MIGRAÇÃO DATABASE - Drizzle db:push
            # Executa antes de iniciar os serviços
            # ==============================================
            echo "🗄️ Iniciando PostgreSQL para migração..."
            docker compose -f docker-compose.prod.yml \
              --env-file .env.prod \
              up -d postgres
            
            # Aguardar PostgreSQL ficar pronto
            echo "⏳ Aguardando PostgreSQL ficar pronto..."
            for i in {1..30}; do
              if docker compose -f docker-compose.prod.yml \
                --env-file .env.prod \
                exec -T postgres pg_isready -U alice -d alice_prod >/dev/null 2>&1; then
                echo "✅ PostgreSQL está pronto!"
                break
              fi
              echo "  Tentativa $i/30..."
              sleep 2
            done
            
            # Executar migração Drizzle via container temporário
            echo "📦 Executando migração Drizzle (db:push)..."
            docker run --rm \
              --network alice-network \
              -e DATABASE_URL="postgresql://alice:${PGPASSWORD}@postgres:5432/alice_prod" \
              -v "$(pwd)/../../shared/schema.ts:/app/shared/schema.ts" \
              -v "$(pwd)/../../drizzle.config.ts:/app/drizzle.config.ts" \
              -w /app \
              node:20-alpine \
              sh -c "npm install drizzle-kit drizzle-orm @neondatabase/serverless pg && npx drizzle-kit push"
            
            echo "✅ Migração concluída!"
            echo ""
            
            # Deploy baseado nos serviços selecionados (PULL em vez de BUILD)
            case "${DEPLOY_SERVICES}" in
              "alice-only")
                echo "🐳 Deploy apenas Alice Stack..."
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  pull --ignore-pull-failures \
                  alice-frontend alice-auth alice-chat alice-rag alice-training alice-integrations
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  up -d --no-build --remove-orphans \
                  dockerproxy traefik postgres alice-frontend alice-auth alice-chat alice-rag alice-training alice-integrations
                ;;
              "erpnext-only")
                echo "🐳 Deploy apenas ERPNext Stack..."
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  up -d --no-build --remove-orphans \
                  erpnext-mariadb erpnext-redis-cache erpnext-redis-queue \
                  erpnext-backend erpnext-frontend erpnext-websocket \
                  erpnext-scheduler erpnext-worker-short erpnext-worker-default erpnext-worker-long
                ;;
              *)
                echo "🐳 Deploy Stack Completa (Alice + ERPNext)..."
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  pull --ignore-pull-failures
                docker compose -f docker-compose.prod.yml \
                  --env-file .env.prod \
                  up -d --no-build --remove-orphans
                ;;
            esac
            
            # Aguardar containers iniciarem
            echo "⏳ Aguardando containers iniciarem..."
            sleep 45
            
            # Verificar status dos containers
            echo ""
            echo "📊 Status dos containers:"
            docker compose -f docker-compose.prod.yml ps
            
            # Verificar saúde do Traefik antes de salvar tag como sucesso
            echo ""
            echo "🔍 Verificando saúde do Traefik..."
            TRAEFIK_HEALTHY=false
            for i in {1..10}; do
              TRAEFIK_STATUS=$(docker inspect --format='{{.State.Health.Status}}' alice-traefik 2>/dev/null || echo "unknown")
              if [ "$TRAEFIK_STATUS" = "healthy" ]; then
                TRAEFIK_HEALTHY=true
                echo "✅ Traefik está healthy!"
                break
              fi
              echo "⏳ Tentativa $i/10: Traefik status = $TRAEFIK_STATUS"
              sleep 10
            done
            
            if [ "$TRAEFIK_HEALTHY" = "true" ]; then
              # Salvar tag atual como last_success para rollback futuro
              echo "${IMAGE_TAG}" > /opt/alice/last_success_tag.txt
              echo "📌 Tag ${IMAGE_TAG} salva como último deploy bem-sucedido"
            else
              echo "⚠️ Traefik não está healthy após 100s, verifique os logs"
              docker logs alice-traefik --tail 50
              exit 1
            fi
            
            # Limpar imagens antigas
            echo ""
            echo "🧹 Limpando imagens antigas..."
            docker image prune -f
            
            echo ""
            echo "=============================================="
            echo "✅ DEPLOY CONCLUÍDO COM SUCESSO!"
            echo "=============================================="
            echo "🌐 Alice: https://yesyoudeserve.duckdns.org"
            echo "🏢 ERPNext: https://erp.yesyoudeserve.duckdns.org"
            echo "🏷️  Image Tag: ${IMAGE_TAG}"
            echo "=============================================="

  # ===========================================================================
  # Job 5: Health Check
  # ===========================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    
    steps:
      - name: Aguardar serviços
        run: sleep 60

      - name: Verificar Alice Frontend
        run: |
          echo "🔍 Verificando Alice..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://yesyoudeserve.duckdns.org/ --max-time 30 || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ Alice Frontend: OK ($STATUS)"
              break
            fi
            echo "⏳ Tentativa $i: Status $STATUS"
            sleep 10
          done

      - name: Verificar Health Endpoints
        run: |
          echo ""
          echo "🏥 Verificando health endpoints..."
          
          # Auth Service
          curl -s https://yesyoudeserve.duckdns.org/api/auth/health --max-time 10 && echo " ✅ Auth" || echo " ⏳ Auth iniciando"
          
          # Chat Service
          curl -s https://yesyoudeserve.duckdns.org/api/chat/health --max-time 10 && echo " ✅ Chat" || echo " ⏳ Chat iniciando"
          
          # RAG Service
          curl -s https://yesyoudeserve.duckdns.org/api/rag/health --max-time 10 && echo " ✅ RAG" || echo " ⏳ RAG iniciando"
          
          # Training Service
          curl -s https://yesyoudeserve.duckdns.org/api/training/health --max-time 10 && echo " ✅ Training" || echo " ⏳ Training iniciando"
          
          # Integrations Service
          curl -s https://yesyoudeserve.duckdns.org/api/integrations/health --max-time 10 && echo " ✅ Integrations" || echo " ⏳ Integrations iniciando"
        continue-on-error: true

      - name: Verificar ERPNext
        run: |
          echo ""
          echo "🏢 Verificando ERPNext..."
          curl -s https://erp.yesyoudeserve.duckdns.org/ --max-time 30 -o /dev/null -w "Status: %{http_code}\n" || echo "⏳ ERPNext iniciando"
        continue-on-error: true

  # ===========================================================================
  # Job 6: Notificação de Sucesso
  # ===========================================================================
  notify-success:
    name: Notificação
    runs-on: ubuntu-latest
    needs: health-check
    if: success()
    
    steps:
      - name: Criar resumo do deploy
        run: |
          echo "## 🚀 Deploy Bem-Sucedido!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ambiente" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Servidor** | Hetzner CX43 (8 vCPU, 16GB RAM) |" >> $GITHUB_STEP_SUMMARY
          echo "| **IP** | 46.224.46.93 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deploy por** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URLs" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 **Alice:** https://yesyoudeserve.duckdns.org" >> $GITHUB_STEP_SUMMARY
          echo "- 🏢 **ERPNext:** https://erp.yesyoudeserve.duckdns.org" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **Traefik:** https://traefik.yesyoudeserve.duckdns.org" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Microserviços Alice" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ frontend-service (Nginx)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ auth-service (:3001)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ chat-service (:3002)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ rag-service (:3003)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ training-service (:3004)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ integrations-service (:3005)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Stack ERPNext" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ erpnext-frontend" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ erpnext-backend" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ erpnext-websocket" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ erpnext-scheduler" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ erpnext-workers (3)" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 7: Rollback em caso de falha (por tag de imagem, não git reset)
  # ===========================================================================
  rollback:
    name: Rollback Automático
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    steps:
      - name: Executar rollback por tag
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: ${{ secrets.HETZNER_VM_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          envs: IMAGE_PREFIX
          script: |
            # Variáveis injetadas via envs do ssh-action
            export IMAGE_PREFIX="${IMAGE_PREFIX}"
            
            echo "⚠️ Deploy falhou, executando rollback por tag..."
            
            cd /opt/alice/app/infra/docker
            
            # Verificar se existe tag anterior salva
            LAST_TAG_FILE="/opt/alice/last_success_tag.txt"
            if [ -f "$LAST_TAG_FILE" ]; then
              LAST_TAG=$(cat "$LAST_TAG_FILE")
              echo "📌 Usando última tag bem-sucedida: ${LAST_TAG}"
            else
              # Fallback para 'latest' se não houver tag salva
              LAST_TAG="latest"
              echo "⚠️ Nenhuma tag anterior encontrada, usando: latest"
            fi
            
            # Atualizar .env.prod com a tag anterior
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${LAST_TAG}/" .env.prod
            
            # Pull e restart containers com imagens anteriores
            echo "🔄 Fazendo pull das imagens com tag: ${LAST_TAG}..."
            docker compose -f docker-compose.prod.yml \
              --env-file .env.prod \
              pull --ignore-pull-failures
            
            docker compose -f docker-compose.prod.yml \
              --env-file .env.prod \
              up -d --no-build --remove-orphans
            
            echo "🔄 Rollback concluído com tag: ${LAST_TAG}"
            echo "⚠️ Verifique os logs para investigar a falha original."

      - name: Notificar falha
        run: |
          echo "## ❌ Deploy Falhou - Rollback Executado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Por:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O sistema foi revertido para a última tag de imagem bem-sucedida." >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs do workflow para mais detalhes." >> $GITHUB_STEP_SUMMARY
