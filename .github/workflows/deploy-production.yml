# =============================================================================
# GitHub Actions Workflow - Deploy para Produção (Hetzner Cloud)
# =============================================================================
# Descrição: CI/CD automatizado para deploy da Alice Enterprise Platform
# Servidor: Hetzner CX43 (8 vCPU, 16GB RAM, 160GB SSD) em Nuremberg
# Domínio: yesyoudeserve.duckdns.org
# IP: 46.224.46.93
# Arquitetura: Docker Compose (100% containerizado)
# SEGURANÇA:
#   - GAP-GHACTIONS-001: Actions pinadas a SHA (supply chain security)
#   - GAP-GHACTIONS-002: OIDC/GITHUB_TOKEN para GHCR (elimina PAT para registry)
#   - GAP-GHACTIONS-003: Least privilege permissions
#   - SSH keys para Hetzner (padrão da indústria - OIDC não suportado por VPS)
# =============================================================================

name: Deploy to Production (Hetzner Cloud)

on:
  # =============================================================================
  # REGRA 4: Deploy APENAS manual (Aprovação Obrigatória)
  # Best Practices 2025: Usar Release & Tag para versionamento, depois deploy
  # 
  # COMPLIANCE: Removidos skip_approval e skip_tests (REGRA 4 e 6 do CLAUDE.md)
  # - Testes são OBRIGATÓRIOS antes de qualquer deploy
  # - Aprovação manual é OBRIGATÓRIA sem exceções
  # - Para hotfixes críticos, usar branch hotfix/ com PR review
  # =============================================================================
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão para deploy (ex: v1.0.0, latest)'
        required: false
        default: 'latest'
      services:
        description: 'Serviços para deploy (all, alice-only, erpnext-only)'
        required: false
        default: 'all'

# =============================================================================
# CONCURRENCY: Evitar múltiplos deploys simultâneos
# cancel-in-progress: true cancela deploys anteriores automaticamente
# =============================================================================
concurrency:
  group: deploy-production
  cancel-in-progress: true

# =============================================================================
# SEGURANÇA: Permissões mínimas no nível do workflow (GAP-GHACTIONS-003)
# =============================================================================
permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: '22'
  DOMAIN: yesyoudeserve.duckdns.org
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice

jobs:
  # ===========================================================================
  # Job 1: Análise de Código e Qualidade
  # COMPLIANCE: Testes são SEMPRE obrigatórios (REGRA 4 e 6 do CLAUDE.md)
  # ===========================================================================
  code-quality:
    name: Análise de Qualidade
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Enterprise: Fallback automático para mirror se npm registry estiver instável (500/503)
      # Regra 16: Melhores práticas - resiliência com fallback automático
      - name: Configure npm registry fallback
        run: |
          echo "Verificando disponibilidade do npm registry..."
          if ! curl -sf --max-time 10 https://registry.npmjs.org/pnpm > /dev/null 2>&1; then
            echo "⚠️ npm registry instável, configurando mirror npmmirror.com..."
            npm config set registry https://registry.npmmirror.com/
            echo "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/" >> $GITHUB_ENV
          else
            echo "✅ npm registry oficial disponível"
          fi

      # Best Practices 2025: pnpm/action-setup@v4 (Node.js 20, November 2025)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # SHA: actions/setup-node@v4.1.0 (2024-10-24)
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint
        continue-on-error: false

      # Build shared packages primeiro usando TypeScript project references
      # tsc -b respeita a ordem de dependências definida em tsconfig.build.json
      # Ordem: shared → shared-utils → config → logger → database
      # NOTA: NODE_OPTIONS aumenta memória para evitar heap out of memory
      - name: Build shared packages first
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run build:tsc

      - name: TypeScript Check
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run typecheck
        continue-on-error: false

      - name: Executar testes unitários
        run: pnpm run test
        continue-on-error: false

      - name: Verificar vulnerabilidades npm
        run: pnpm audit --audit-level=high
        continue-on-error: false

  # ===========================================================================
  # Job 2: Security Scanning (GAP-GHACTIONS - Audit Logging)
  # ===========================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    
    permissions:
      contents: read
      security-events: write
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Trivy Scanner para vulnerabilidades no código
      # SHA: aquasecurity/trivy-action@0.28.0 (2024-10-15)
      # REGRA 6: Pipeline DEVE falhar em vulnerabilidades CRITICAL/HIGH
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          trivyignores: '.trivyignore'

      # Garantir que arquivo SARIF exista para upload (fallback se Trivy falhar)
      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f "trivy-results.sarif" ]; then
            echo "⚠️ SARIF não gerado pelo Trivy, criando fallback..."
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[],"_scanFailed":true}' > trivy-results.sarif
            echo "Fallback SARIF criado para diagnóstico"
          else
            echo "✅ SARIF existe: trivy-results.sarif"
          fi
          
      # Upload SARIF como artifact para download e análise
      # SHA: actions/upload-artifact@v4.6.0 (2024-12-18)
      - name: Upload Trivy SARIF as artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: trivy-filesystem-sarif
          path: trivy-results.sarif
          retention-days: 30

      # Upload results to GitHub Security tab (opcional, não bloqueia pipeline)
      # SHA: github/codeql-action@v3.27.0 (2024-11-05)

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ===========================================================================
  # Job 3: Build Imagens Docker
  # ===========================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan]
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ===========================================================================
      # VERSIONAMENTO AUTOMÁTICO: Buscar versões mais recentes de todos os componentes
      # REGRA 11: Todos os módulos devem seguir versionamento automático
      # ===========================================================================
      - name: Buscar versões mais recentes de todos os componentes
        id: versions
        run: |
          echo "🔍 Buscando versões mais recentes de todos os componentes..."
          
          # Função para buscar última release do GitHub
          # REGRA 6: Enterprise-grade - usar jq para parsing JSON (não grep regex)
          # REGRA 11: Seguir melhores práticas GitHub Actions 2025
          fetch_github_release() {
            local repo=$1
            local fallback=$2
            local tag_name=$(curl -s --max-time 10 "https://api.github.com/repos/${repo}/releases/latest" | \
              jq -r '.tag_name // empty' 2>/dev/null || echo "")
            
            if [ -z "$tag_name" ]; then
              echo "$fallback"
            else
              # Remover prefixo "v" se existir
              echo "${tag_name#v}"
            fi
          }
          
          # pgBackRest
          PGBACKREST_VERSION=$(fetch_github_release "pgbackrest/pgbackrest" "2.57.0")
          echo "PGBACKREST_VERSION=$PGBACKREST_VERSION" >> $GITHUB_ENV
          echo "pgbackrest_version=$PGBACKREST_VERSION" >> $GITHUB_OUTPUT
          echo "✅ pgBackRest: $PGBACKREST_VERSION"
          
          # Traefik
          TRAEFIK_VERSION=$(fetch_github_release "traefik/traefik" "3.3.0")
          echo "TRAEFIK_VERSION=$TRAEFIK_VERSION" >> $GITHUB_ENV
          echo "traefik_version=$TRAEFIK_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Traefik: $TRAEFIK_VERSION"
          
          # Prometheus
          PROMETHEUS_VERSION=$(fetch_github_release "prometheus/prometheus" "3.0.1")
          echo "PROMETHEUS_VERSION=$PROMETHEUS_VERSION" >> $GITHUB_ENV
          echo "prometheus_version=$PROMETHEUS_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Prometheus: $PROMETHEUS_VERSION"
          
          # Grafana
          GRAFANA_VERSION=$(fetch_github_release "grafana/grafana" "11.1.4")
          echo "GRAFANA_VERSION=$GRAFANA_VERSION" >> $GITHUB_ENV
          echo "grafana_version=$GRAFANA_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Grafana: $GRAFANA_VERSION"
          
          # Loki
          LOKI_VERSION=$(fetch_github_release "grafana/loki" "3.1.0")
          echo "LOKI_VERSION=$LOKI_VERSION" >> $GITHUB_ENV
          echo "loki_version=$LOKI_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Loki: $LOKI_VERSION"
          
          # Promtail
          PROMTAIL_VERSION=$(fetch_github_release "grafana/promtail" "3.1.0")
          echo "PROMTAIL_VERSION=$PROMTAIL_VERSION" >> $GITHUB_ENV
          echo "promtail_version=$PROMTAIL_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Promtail: $PROMTAIL_VERSION"
          
          # Jaeger
          JAEGER_VERSION=$(fetch_github_release "jaegertracing/jaeger" "1.58.0")
          echo "JAEGER_VERSION=$JAEGER_VERSION" >> $GITHUB_ENV
          echo "jaeger_version=$JAEGER_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Jaeger: $JAEGER_VERSION"
          
          # Langfuse
          LANGFUSE_VERSION=$(fetch_github_release "langfuse/langfuse" "2.39.1")
          echo "LANGFUSE_VERSION=$LANGFUSE_VERSION" >> $GITHUB_ENV
          echo "langfuse_version=$LANGFUSE_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Langfuse: $LANGFUSE_VERSION"
          
          # ERPNext (buscar última versão v15.x)
          # REGRA 6: Enterprise-grade - usar jq para parsing JSON (não grep regex)
          ERPNEXT_VERSION=$(curl -s --max-time 10 "https://api.github.com/repos/frappe/erpnext/releases" | \
            jq -r '[.[] | select(.tag_name | startswith("v15.")) | .tag_name] | first // empty' 2>/dev/null | \
            sed 's/^v15\.//' || echo "38.6")
          echo "ERPNEXT_VERSION=$ERPNEXT_VERSION" >> $GITHUB_ENV
          echo "erpnext_version=$ERPNEXT_VERSION" >> $GITHUB_OUTPUT
          echo "✅ ERPNext: v15.$ERPNEXT_VERSION"
          
          # Docker Socket Proxy (Tecnativa)
          DOCKER_SOCKET_PROXY_VERSION=$(fetch_github_release "Tecnativa/docker-socket-proxy" "0.4.1")
          echo "DOCKER_SOCKET_PROXY_VERSION=$DOCKER_SOCKET_PROXY_VERSION" >> $GITHUB_ENV
          echo "docker_socket_proxy_version=$DOCKER_SOCKET_PROXY_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Docker Socket Proxy: $DOCKER_SOCKET_PROXY_VERSION"
          
          # Busybox (buscar última versão 1.x)
          BUSYBOX_VERSION=$(curl -s --max-time 10 "https://registry.hub.docker.com/v2/repositories/library/busybox/tags?page_size=100" | \
            jq -r '.results[] | select(.name | test("^1\\.[0-9]+$")) | .name' 2>/dev/null | \
            sort -V | tail -1 || echo "1.36")
          echo "BUSYBOX_VERSION=$BUSYBOX_VERSION" >> $GITHUB_ENV
          echo "busybox_version=$BUSYBOX_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Busybox: $BUSYBOX_VERSION"
          
          # Redis (buscar última versão 7-alpine)
          REDIS_VERSION=$(curl -s --max-time 10 "https://registry.hub.docker.com/v2/repositories/library/redis/tags?page_size=100" | \
            jq -r '.results[] | select(.name | test("^7.*-alpine$")) | .name' 2>/dev/null | \
            sort -V | tail -1 || echo "7-alpine")
          echo "REDIS_VERSION=$REDIS_VERSION" >> $GITHUB_ENV
          echo "redis_version=$REDIS_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Redis: $REDIS_VERSION"
          
          # MariaDB (buscar última versão 10.11)
          MARIADB_VERSION=$(curl -s --max-time 10 "https://registry.hub.docker.com/v2/repositories/library/mariadb/tags?page_size=100" | \
            jq -r '.results[] | select(.name | test("^10\\.11\\.[0-9]+$")) | .name' 2>/dev/null | \
            sort -V | tail -1 || echo "10.11")
          echo "MARIADB_VERSION=$MARIADB_VERSION" >> $GITHUB_ENV
          echo "mariadb_version=$MARIADB_VERSION" >> $GITHUB_OUTPUT
          echo "✅ MariaDB: $MARIADB_VERSION"
          
          # pgvector (tag fixa pg16, mas verificar se há versão específica)
          # pgvector usa tag semântica: 0.8.1-pg16, mas pg16 aponta para a mais recente
          # Manter pg16 como tag fixa (é atualizada automaticamente pelo Docker Hub)
          echo "PGVECTOR_TAG=pg16" >> $GITHUB_ENV
          echo "pgvector_tag=pg16" >> $GITHUB_OUTPUT
          echo "✅ pgvector: pg16 (tag fixa - atualizada automaticamente pelo Docker Hub)"
          
          echo ""
          echo "=========================================="
          echo "✅ Todas as versões foram buscadas!"
          echo "=========================================="

      # ===========================================================================
      # VERSIONAMENTO AUTOMÁTICO: Buscar SHA256 digests via Docker Registry API v2
      # REGRA 6: Enterprise-grade - usar API oficial (não workarounds)
      # REGRA 11: Seguir documentação oficial Docker Registry API v2
      # REGRA 16: SHA256 digests obrigatórios para segurança (Supply Chain Security)
      # ===========================================================================
      - name: Buscar SHA256 digests de todas as imagens
        id: digests
        run: |
          echo "🔍 Buscando SHA256 digests via Docker Registry API v2..."
          
          # Função para buscar digest via Docker Registry API v2 (oficial)
          # REGRA 11: Seguir documentação oficial Docker Registry HTTP API v2
          # https://docs.docker.com/registry/spec/api/
          fetch_docker_digest() {
            local image=$1
            local tag=$2
            local registry="registry-1.docker.io"
            
            # 1. Obter token de autenticação (anônimo para imagens públicas)
            # REGRA 6: Enterprise-grade - usar jq para parsing JSON (não grep regex)
            local auth_url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${image}:pull"
            local token=$(curl -s --max-time 10 "${auth_url}" | jq -r '.token // empty' 2>/dev/null || echo "")
            
            if [ -z "$token" ]; then
              echo ""
              return
            fi
            
            # 2. Obter manifest e extrair digest do header Docker-Content-Digest
            # REGRA 6: Enterprise-grade - extrair header HTTP de forma robusta
            local manifest_url="https://${registry}/v2/${image}/manifests/${tag}"
            local digest=$(curl -s -I --max-time 10 \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              -H "Authorization: Bearer ${token}" \
              "${manifest_url}" 2>/dev/null | \
              grep -i "^Docker-Content-Digest:" | \
              cut -d' ' -f2 | \
              tr -d '\r\n' || echo "")
            
            echo "$digest"
          }
          
          # Buscar digests para cada componente
          echo "📦 Buscando digests (Docker Registry API v2)..."
          
          TRAEFIK_DIGEST=$(fetch_docker_digest "traefik" "v${TRAEFIK_VERSION}")
          PROMETHEUS_DIGEST=$(fetch_docker_digest "prom/prometheus" "v${PROMETHEUS_VERSION}")
          GRAFANA_DIGEST=$(fetch_docker_digest "grafana/grafana" "${GRAFANA_VERSION}")
          LOKI_DIGEST=$(fetch_docker_digest "grafana/loki" "${LOKI_VERSION}")
          PROMTAIL_DIGEST=$(fetch_docker_digest "grafana/promtail" "${PROMTAIL_VERSION}")
          JAEGER_DIGEST=$(fetch_docker_digest "jaegertracing/all-in-one" "${JAEGER_VERSION}")
          LANGFUSE_DIGEST=$(fetch_docker_digest "langfuse/langfuse" "${LANGFUSE_VERSION}")
          ERPNEXT_DIGEST=$(fetch_docker_digest "frappe/erpnext" "v15.${ERPNEXT_VERSION}")
          ERPNEXT_NGINX_DIGEST=$(fetch_docker_digest "frappe/erpnext-nginx" "v15.${ERPNEXT_VERSION}")
          ERPNEXT_SOCKETIO_DIGEST=$(fetch_docker_digest "frappe/frappe-socketio" "v15.${ERPNEXT_VERSION}")
          ERPNEXT_WORKER_DIGEST=$(fetch_docker_digest "frappe/erpnext-worker" "v15.${ERPNEXT_VERSION}")
          
          # Exportar para GitHub Actions
          echo "TRAEFIK_DIGEST=${TRAEFIK_DIGEST}" >> $GITHUB_ENV
          echo "PROMETHEUS_DIGEST=${PROMETHEUS_DIGEST}" >> $GITHUB_ENV
          echo "GRAFANA_DIGEST=${GRAFANA_DIGEST}" >> $GITHUB_ENV
          echo "LOKI_DIGEST=${LOKI_DIGEST}" >> $GITHUB_ENV
          echo "PROMTAIL_DIGEST=${PROMTAIL_DIGEST}" >> $GITHUB_ENV
          echo "JAEGER_DIGEST=${JAEGER_DIGEST}" >> $GITHUB_ENV
          echo "LANGFUSE_DIGEST=${LANGFUSE_DIGEST}" >> $GITHUB_ENV
          echo "ERPNEXT_DIGEST=${ERPNEXT_DIGEST}" >> $GITHUB_ENV
          echo "ERPNEXT_NGINX_DIGEST=${ERPNEXT_NGINX_DIGEST}" >> $GITHUB_ENV
          echo "ERPNEXT_SOCKETIO_DIGEST=${ERPNEXT_SOCKETIO_DIGEST}" >> $GITHUB_ENV
          echo "ERPNEXT_WORKER_DIGEST=${ERPNEXT_WORKER_DIGEST}" >> $GITHUB_ENV
          echo "DOCKER_SOCKET_PROXY_DIGEST=${DOCKER_SOCKET_PROXY_DIGEST}" >> $GITHUB_ENV
          echo "BUSYBOX_DIGEST=${BUSYBOX_DIGEST}" >> $GITHUB_ENV
          echo "REDIS_DIGEST=${REDIS_DIGEST}" >> $GITHUB_ENV
          echo "MARIADB_DIGEST=${MARIADB_DIGEST}" >> $GITHUB_ENV
          echo "PGVECTOR_DIGEST=${PGVECTOR_DIGEST}" >> $GITHUB_ENV
          
          echo ""
          echo "✅ Digests buscados:"
          echo "   - Traefik: ${TRAEFIK_DIGEST:-não encontrado}"
          echo "   - Prometheus: ${PROMETHEUS_DIGEST:-não encontrado}"
          echo "   - Grafana: ${GRAFANA_DIGEST:-não encontrado}"
          echo "   - Loki: ${LOKI_DIGEST:-não encontrado}"
          echo "   - Promtail: ${PROMTAIL_DIGEST:-não encontrado}"
          echo "   - Jaeger: ${JAEGER_DIGEST:-não encontrado}"
          echo "   - Langfuse: ${LANGFUSE_DIGEST:-não encontrado}"
          echo "   - ERPNext: ${ERPNEXT_DIGEST:-não encontrado}"
          echo "   - Docker Socket Proxy: ${DOCKER_SOCKET_PROXY_DIGEST:-não encontrado}"
          echo "   - Busybox: ${BUSYBOX_DIGEST:-não encontrado}"
          echo "   - Redis: ${REDIS_DIGEST:-não encontrado}"
          echo "   - MariaDB: ${MARIADB_DIGEST:-não encontrado}"
          echo "   - pgvector: ${PGVECTOR_DIGEST:-não encontrado}"

      # Limpeza de disco para builds grandes (PyTorch ~2GB, CUDA ~5GB)
      # Necessário para clip-inference-service
      - name: Liberar espaço em disco
        run: |
          echo "📊 Espaço antes da limpeza:"
          df -h /
          
          # Remover ferramentas pré-instaladas que não usamos (~10GB)
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          
          # Limpar caches do sistema (NÃO limpar pip/pnpm - runners são efêmeros)
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          
          echo "📊 Espaço após limpeza:"
          df -h /

      - name: Extrair metadata
        id: meta
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # SHA: docker/setup-buildx-action@v3.7.1 (2024-10-22)
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349

      # SHA: docker/login-action@v3.3.0 (2024-07-31)
      # GAP-GHACTIONS-002: Usando GITHUB_TOKEN (OIDC nativo) em vez de PAT para GHCR
      # github.token é automaticamente provisionado pelo GitHub Actions com escopo limitado
      # Mais seguro que PAT: não requer secret manual, expira automaticamente, permissões mínimas
      # NOTA: Usar github.token (não secrets.GITHUB_TOKEN) - é um contexto especial do GitHub Actions
      - name: Login no GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ===========================================================================
      # Build paralelo de todas as imagens com CACHE OTIMIZADO
      # ===========================================================================
      # SHA: docker/build-push-action@v6.9.0 (2024-10-22)
      # 
      # ESTRATÉGIA DE CACHE (Best Practices 2025):
      # - Registry cache no GHCR: NÃO é branch-specific (compartilha entre workflows)
      # - mode=max salva todas as layers intermediárias
      # - Imagens de cache são armazenadas no próprio GHCR com tag :cache
      #
      # BENEFÍCIOS:
      # - Cache compartilhado entre release.yml e deploy-production.yml
      # - Rebuild sem mudanças: ~1-2 min (vs ~8 min sem cache)
      # - Mudança em 1 serviço: apenas esse serviço rebuilda
      # - Mudança em package.json: rebuilda a partir do pnpm install
      # - Mudança em código: rebuilda apenas layers afetadas
      #
      # SEGURANÇA:
      # - Cache é invalidado automaticamente por hash SHA256
      # - pnpm-lock.yaml garante versões exatas de dependências
      # - Trivy escaneia a imagem FINAL (não o cache)
      # ===========================================================================
      
      - name: Build e Push - Auth Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-auth:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-auth:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-auth:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-auth:cache,mode=max
          platforms: linux/amd64

      - name: Build e Push - Chat Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/chat-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-chat:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-chat:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-chat:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-chat:cache,mode=max
          platforms: linux/amd64

      - name: Build e Push - RAG Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          file: apps/rag-service/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-rag:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-rag:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-rag:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-rag:cache,mode=max
          platforms: linux/amd64

      - name: Build e Push - Training Service
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
