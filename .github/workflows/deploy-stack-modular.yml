  health-observability:
    name: Health Check OBSERVABILITY
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-observability]
    if: needs.deploy-observability.result == 'success'
    timeout-minutes: 10
    
    steps:
      - name: Check health with retry logic
        id: check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "🏥 Checking OBSERVABILITY stack health..."
            
            # =================================================================
            # CORREÇÃO PR#93 (09/01/2026): Lógica de verificação que entende
            # containers com e sem healthcheck
            # =================================================================
            # Containers COM healthcheck: devem ficar "healthy"
            # Containers SEM healthcheck (distroless): devem estar "running"
            #
            # Containers distroless (não têm wget/curl/shell):
            # - jaeger, alice-otel-collector, alice-cadvisor, alice-node-exporter
            # =================================================================
            
            # Containers que TÊM healthcheck (devem ficar "healthy")
            HEALTH_CONTAINERS="prometheus grafana loki promtail alice-vector alice-clickhouse alice-langfuse-db langfuse"
            
            # Containers SEM healthcheck (devem estar "running")
            # - jaeger, alice-otel-collector, alice-cadvisor, alice-node-exporter: distroless
            # - langfuse-worker: não tem healthcheck definido
            RUNNING_CONTAINERS="jaeger alice-otel-collector alice-cadvisor alice-node-exporter langfuse-worker"
            
            MAX_RETRIES=15
            SLEEP_TIME=10
            
            # Verificar containers com healthcheck
            for container in $HEALTH_CONTAINERS; do
              echo "Aguardando $container ficar healthy..."
              retry=0
              while [ $retry -lt $MAX_RETRIES ]; do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' $container 2>/dev/null || echo "not_found")
                if [ "$STATUS" = "healthy" ]; then
                  echo "✅ $container: healthy"
                  break
                elif [ "$STATUS" = "not_found" ]; then
                  echo "❌ $container: não encontrado"
                  exit 1
                else
                  echo "⏳ $container: $STATUS (tentativa $((retry+1))/$MAX_RETRIES)"
                  sleep $SLEEP_TIME
                  retry=$((retry+1))
                fi
              done
              
              if [ $retry -eq $MAX_RETRIES ]; then
                echo "❌ $container: timeout após $((MAX_RETRIES * SLEEP_TIME))s"
                exit 1
              fi
            done
            
            # Verificar containers distroless (sem healthcheck - apenas "running")
            for container in $RUNNING_CONTAINERS; do
              echo "Verificando $container (sem healthcheck)..."
              RUNNING=$(docker inspect --format='{{.State.Running}}' $container 2>/dev/null || echo "false")
              if [ "$RUNNING" = "true" ]; then
                echo "✅ $container: running"
              else
                echo "❌ $container: não está rodando"
                exit 1
              fi
            done
            
            echo "✅ Todos os containers do OBSERVABILITY stack estão OK"

