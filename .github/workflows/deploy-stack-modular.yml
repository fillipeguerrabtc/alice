            docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.erpnext.yml pull
            docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.erpnext.yml up -d --remove-orphans
            
            # Salvar versão atual
            echo "${{ needs.validate.outputs.version }}" > /opt/alice/versions/erpnext.current
            
            echo "✅ ERPNEXT stack deployed"

  health-erpnext:
    name: Health Check ERPNEXT
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-erpnext]
    if: needs.deploy-erpnext.result == 'success'
    timeout-minutes: 15
    
    steps:
      - name: Check health with retry logic
        id: check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "🏥 Checking ERPNEXT stack health..."
            
            # CRITICAL FIX (06/01/2026): Adicionar todos os 10 containers com healthcheck
            # Faltavam: websocket (Socket.IO), scheduler (cron), workers (job queues)
            CONTAINERS="erpnext-mariadb erpnext-redis-cache erpnext-redis-queue erpnext-backend erpnext-frontend erpnext-websocket erpnext-scheduler erpnext-worker-default erpnext-worker-short erpnext-worker-long"
            # =================================================================
            # CORREÇÃO PR#97 (09/01/2026): Restaurar MAX_RETRIES=25 (4+ min total)
            # =================================================================
            # PROBLEMA: MAX_RETRIES=15 dava apenas 2.5min de timeout
            # ERPNext cria site, instala apps, migra banco - pode levar 3-4min
            # =================================================================
            MAX_RETRIES=25
            SLEEP_TIME=10
            
            for container in $CONTAINERS; do
              echo "Aguardando $container ficar healthy..."
              retry=0
              while [ $retry -lt $MAX_RETRIES ]; do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' $container 2>/dev/null || echo "not_found")
                if [ "$STATUS" = "healthy" ]; then
                  echo "✅ $container: healthy"
                  break
                elif [ "$STATUS" = "not_found" ]; then
                  echo "❌ $container: não encontrado"
                  exit 1
                else
                  echo "⏳ $container: $STATUS (tentativa $((retry+1))/$MAX_RETRIES)"
                  sleep $SLEEP_TIME
                  retry=$((retry+1))
                fi
              done
              
              if [ $retry -eq $MAX_RETRIES ]; then
                echo "❌ $container: timeout após $((MAX_RETRIES * SLEEP_TIME))s"
                exit 1
              fi
            done
            
            echo "✅ Todos os containers do ERPNEXT stack estão healthy"

  rollback-erpnext:
    name: Rollback ERPNEXT
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, prepare, deploy-erpnext, health-erpnext]
    # CRITICAL: 2 modos de rollback
    # 1) MANUAL: Usuário solicitou (is_rollback=true) → usar rollback_version
    # 2) AUTOMÁTICO: Deploy sucesso mas health falhou → usar .previous
    if: |
      (needs.validate.outputs.is_rollback == 'true' && needs.validate.outputs.deploy_erpnext == 'true' && needs.prepare.result == 'success') ||
      (failure() && needs.deploy-erpnext.result == 'success' && needs.health-erpnext.result == 'failure')
    timeout-minutes: 15
    
    steps:
      - name: Execute rollback cirúrgico (5 estágios)
        uses: appleboy/ssh-action@v1.2.2
        env:
          IS_ROLLBACK: ${{ needs.validate.outputs.is_rollback }}
          ROLLBACK_VERSION: ${{ needs.validate.outputs.rollback_version }}
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          envs: IS_ROLLBACK,ROLLBACK_VERSION
          script: |
            set -euo pipefail
            # =================================================================
            # SEÇÃO 2.4: Surgical Rollback for ERPNEXT Stack
            # =================================================================
            # CORREÇÃO PR#95 (09/01/2026): Suporte a primeiro deploy
            # Em primeiro deploy não existe versão anterior - apenas limpa
            # =================================================================
            echo "🔄 ROLLBACK CIRÚRGICO - Stack ERPNEXT"
            echo "========================================"
            echo "⚠️  ERPNext pode falhar SEM afetar Alice - design proposital"
            
            # Determinar modo: MANUAL (versão específica), AUTO (versão anterior), ou CLEANUP (primeiro deploy)
            ROLLBACK_MODE="cleanup"  # Default para primeiro deploy
            TARGET_VERSION=""
            
            if [ "${IS_ROLLBACK}" = "true" ] && [ -n "${ROLLBACK_VERSION}" ]; then
              ROLLBACK_MODE="manual"
              TARGET_VERSION="${ROLLBACK_VERSION}"
              echo "📌 ROLLBACK MANUAL para versão: $TARGET_VERSION"
            elif [ -f /opt/alice/versions/erpnext.previous ]; then
              TARGET_VERSION=$(cat /opt/alice/versions/erpnext.previous)
              if [ -n "$TARGET_VERSION" ]; then
                ROLLBACK_MODE="auto"
                echo "📌 ROLLBACK AUTOMÁTICO para versão anterior: $TARGET_VERSION"
              fi
            fi
            
            if [ "$ROLLBACK_MODE" = "cleanup" ]; then
              echo "🧹 MODO CLEANUP - Primeiro deploy falhou, apenas limpando containers"
              echo "   (Não existe versão anterior para rollback)"
            fi
            
            echo ""
            cd /opt/alice/app/infra/docker/stacks
            
            # STAGE 1: Stop and Remove via Docker Compose
            echo "🛑 Stage 1: Stopping ERPNEXT stack containers..."
            docker compose -p alice-erpnext --env-file ../.env.prod \
                           -f docker-compose.base.yml \
                           -f docker-compose.erpnext.yml \
                           down --remove-orphans --timeout 30 2>&1 || true
            
            # STAGE 2: Force Remove All Containers
            echo ""
            echo "🧹 Stage 2: Force cleaning ALL ERPNEXT containers..."
            ERPNEXT_CONTAINERS=(
              "erpnext-mariadb"
              "erpnext-redis-cache"
              "erpnext-redis-queue"
              "erpnext-backend"
              "erpnext-frontend"
              "erpnext-websocket"
              "erpnext-scheduler"
              "erpnext-worker-default"
              "erpnext-worker-short"
              "erpnext-worker-long"
              "erpnext-configurator"
              "erpnext-create-site"
            )
            
            REMOVED_COUNT=0
            for container in "${ERPNEXT_CONTAINERS[@]}"; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${container}$"; then
                echo "   🗑️  Removing: $container"
                docker rm -f "$container" 2>/dev/null || true
                REMOVED_COUNT=$((REMOVED_COUNT + 1))
              fi
            done
            echo "   ✅ Removed $REMOVED_COUNT containers"
            
            # STAGE 3: Validate clean state
            # CORREÇÃO PR#96 (09/01/2026): Usar grep com regex para match exato
            # Docker filter faz substring match - não é preciso
            echo ""
            echo "🧪 Stage 3: Validating clean state..."
            REMAINING=0
            for container in "${ERPNEXT_CONTAINERS[@]}"; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${container}$"; then
                REMAINING=$((REMAINING + 1))
                echo "   ⚠️  Container ainda existe: $container"
              fi
            done
            if [ "$REMAINING" -eq 0 ]; then
              echo "   ✅ All ERPNEXT containers cleaned"
            else
              echo "   ⚠️  WARNING: $REMAINING ERPNEXT containers still present"
              echo "   🔄 Forcing removal..."
              for container in "${ERPNEXT_CONTAINERS[@]}"; do
                docker rm -f "$container" 2>/dev/null || true
              done
            fi
            
            # STAGE 4: Deploy (apenas se não for cleanup mode)
            if [ "$ROLLBACK_MODE" != "cleanup" ]; then
              echo ""
              echo "========================================"
              echo "🐳 Deploying rollback version: $TARGET_VERSION"
              echo "========================================"
              echo "   NOTE: ERPNEXT uses public Frappe images only (no IMAGE_TAG)"
              
              docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.erpnext.yml pull
              docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.erpnext.yml up -d --remove-orphans
              
              echo "$TARGET_VERSION" > /opt/alice/versions/erpnext.current
              
              echo ""
              echo "✅ ROLLBACK CONCLUÍDO"
              echo "   Versão atual: $TARGET_VERSION"
            else
              echo ""
              echo "✅ CLEANUP CONCLUÍDO"
              echo "   Containers ERPNEXT removidos"
              echo "   Servidor limpo para nova tentativa de deploy"
              rm -f /opt/alice/versions/erpnext.current 2>/dev/null || true
            fi
            
            echo "⚠️  Outros stacks NÃO foram afetados (Alice continua rodando)"

  # ===========================================================================
  # BACKUP STACK - Deploy + Health + Rollback
  # Roda em PARALELO após infra
  # ===========================================================================
  
  deploy-backup:
    name: Deploy Stack BACKUP
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, prepare, deploy-infra, health-infra, drizzle-push]
    # CRITICAL FIX (06/01/2026): Verificar health-infra para evitar deploy contra infra quebrada
    # - deploy-infra NÃO PODE ter falhado (needs.deploy-infra.result != 'failure')
    # CRITICAL: NÃO rodar em rollback manual (deploy seria sobrescrito pelo rollback)
    if: needs.validate.outputs.deploy_backup == 'true' && needs.prepare.result == 'success' && needs.deploy-infra.result != 'failure' && (needs.health-infra.result == 'success' || needs.health-infra.result == 'skipped') && (needs.drizzle-push.result == 'success' || needs.drizzle-push.result == 'skipped') && needs.validate.outputs.is_rollback == 'false'
    timeout-minutes: 10
    
    steps:
      - name: Deploy stack backup via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            # =================================================================
            # SEÇÃO 2.7: Trap Handler for Cleanup on Failure
            # =================================================================
            cleanup_on_failure() {
              local exit_code=$?
              if [ $exit_code -ne 0 ]; then
                echo ""
                echo "🚨 Deploy failed - executing automatic cleanup..."
                cd /opt/alice/app/infra/docker/stacks
                docker compose -p alice-backup --env-file ../.env.prod \
                               -f docker-compose.base.yml \
                               -f docker-compose.backup.yml \
                               down --remove-orphans --timeout 30 2>&1 || true
                echo "✅ Cleanup completed"
              fi
            }
            trap cleanup_on_failure EXIT
            
            cd /opt/alice/app/infra/docker/stacks
            
            echo "🚀 Deploying BACKUP stack (pgbackrest)..."
            
            # Salvar versão anterior
            if [ -f /opt/alice/versions/backup.current ]; then
              cp /opt/alice/versions/backup.current /opt/alice/versions/backup.previous
            fi
            
            # Pull e deploy
            # CRITICAL: Incluir base.yml para criar volumes/networks externos
            docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.backup.yml pull
            docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.backup.yml up -d --remove-orphans
            
            # Salvar versão atual
            echo "${{ needs.validate.outputs.version }}" > /opt/alice/versions/backup.current
            
            echo "✅ BACKUP stack deployed"

  health-backup:
    name: Health Check BACKUP
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-backup]
    if: needs.deploy-backup.result == 'success'
    timeout-minutes: 5
    
    steps:
      - name: Check health with retry logic
        id: check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "🏥 Checking BACKUP stack health..."
            
            CONTAINER="alice-pgbackrest"
            MAX_RETRIES=15
            SLEEP_TIME=10
            
            echo "Aguardando $CONTAINER ficar healthy..."
            retry=0
            while [ $retry -lt $MAX_RETRIES ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ $CONTAINER: healthy"
                break
              elif [ "$STATUS" = "not_found" ]; then
                echo "❌ $CONTAINER: não encontrado"
                exit 1
              else
                echo "⏳ $CONTAINER: $STATUS (tentativa $((retry+1))/$MAX_RETRIES)"
                sleep $SLEEP_TIME
                retry=$((retry+1))
              fi
            done
            
            if [ $retry -eq $MAX_RETRIES ]; then
              echo "❌ $CONTAINER: timeout após $((MAX_RETRIES * SLEEP_TIME))s"
              exit 1
            fi
            
            echo "✅ BACKUP stack está healthy"

  rollback-backup:
    name: Rollback BACKUP
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, prepare, deploy-backup, health-backup]
    # CRITICAL: 2 modos de rollback
    # 1) MANUAL: Usuário solicitou (is_rollback=true) → usar rollback_version
    # 2) AUTOMÁTICO: Deploy sucesso mas health falhou → usar .previous
    if: |
      (needs.validate.outputs.is_rollback == 'true' && needs.validate.outputs.deploy_backup == 'true' && needs.prepare.result == 'success') ||
      (failure() && needs.deploy-backup.result == 'success' && needs.health-backup.result == 'failure')
    timeout-minutes: 5
    
    steps:
      - name: Execute rollback cirúrgico (5 estágios)
        uses: appleboy/ssh-action@v1.2.2
        env:
          IS_ROLLBACK: ${{ needs.validate.outputs.is_rollback }}
          ROLLBACK_VERSION: ${{ needs.validate.outputs.rollback_version }}
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          envs: IS_ROLLBACK,ROLLBACK_VERSION
          script: |
            set -euo pipefail
            # =================================================================
            # SEÇÃO 2.5: Surgical Rollback for BACKUP Stack
            # =================================================================
            # CORREÇÃO PR#95 (09/01/2026): Suporte a primeiro deploy
            # Em primeiro deploy não existe versão anterior - apenas limpa
            # =================================================================
            echo "🔄 ROLLBACK CIRÚRGICO - Stack BACKUP"
            echo "========================================"
            
            # Determinar modo: MANUAL (versão específica), AUTO (versão anterior), ou CLEANUP (primeiro deploy)
            ROLLBACK_MODE="cleanup"  # Default para primeiro deploy
            TARGET_VERSION=""
            
            if [ "${IS_ROLLBACK}" = "true" ] && [ -n "${ROLLBACK_VERSION}" ]; then
              ROLLBACK_MODE="manual"
              TARGET_VERSION="${ROLLBACK_VERSION}"
              echo "📌 ROLLBACK MANUAL para versão: $TARGET_VERSION"
            elif [ -f /opt/alice/versions/backup.previous ]; then
              TARGET_VERSION=$(cat /opt/alice/versions/backup.previous)
              if [ -n "$TARGET_VERSION" ]; then
                ROLLBACK_MODE="auto"
                echo "📌 ROLLBACK AUTOMÁTICO para versão anterior: $TARGET_VERSION"
              fi
            fi
            
            if [ "$ROLLBACK_MODE" = "cleanup" ]; then
              echo "🧹 MODO CLEANUP - Primeiro deploy falhou, apenas limpando containers"
              echo "   (Não existe versão anterior para rollback)"
            fi
            
            echo ""
            cd /opt/alice/app/infra/docker/stacks
            
            # STAGE 1: Stop and Remove via Docker Compose
            echo "🛑 Stage 1: Stopping BACKUP stack containers..."
            docker compose -p alice-backup --env-file ../.env.prod \
                           -f docker-compose.base.yml \
                           -f docker-compose.backup.yml \
                           down --remove-orphans --timeout 30 2>&1 || true
            
            # STAGE 2: Force Remove All Containers
            echo ""
            echo "🧹 Stage 2: Force cleaning ALL BACKUP containers..."
            BACKUP_CONTAINERS=(
              "alice-pgbackrest"
            )
            
            REMOVED_COUNT=0
            for container in "${BACKUP_CONTAINERS[@]}"; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${container}$"; then
                echo "   🗑️  Removing: $container"
                docker rm -f "$container" 2>/dev/null || true
                REMOVED_COUNT=$((REMOVED_COUNT + 1))
              fi
            done
            echo "   ✅ Removed $REMOVED_COUNT containers"
            
            # STAGE 3: Validate clean state
            echo ""
            echo "🧪 Stage 3: Validating clean state..."
            REMAINING=0
            for container in "${BACKUP_CONTAINERS[@]}"; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${container}$"; then
                REMAINING=$((REMAINING + 1))
                echo "   ⚠️  Still present: $container"
              fi
            done
            
            if [ "$REMAINING" -eq 0 ]; then
              echo "   ✅ All BACKUP containers cleaned"
            else
              echo "   ⚠️  WARNING: $REMAINING BACKUP containers still present"
              echo "   🔄 Forcing removal..."
              docker rm -f alice-pgbackrest 2>/dev/null || true
            fi
            
            # STAGE 4: Deploy (apenas se não for cleanup mode)
            if [ "$ROLLBACK_MODE" != "cleanup" ]; then
              echo ""
              echo "========================================"
              echo "🐳 Deploying rollback version: $TARGET_VERSION"
              echo "========================================"
              
              IMAGE_TAG=$TARGET_VERSION docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.backup.yml pull
              IMAGE_TAG=$TARGET_VERSION docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.base.yml -f docker-compose.backup.yml up -d --remove-orphans
              
              echo "$TARGET_VERSION" > /opt/alice/versions/backup.current
              
              echo ""
              echo "✅ ROLLBACK CONCLUÍDO"
              echo "   Versão atual: $TARGET_VERSION"
            else
              echo ""
              echo "✅ CLEANUP CONCLUÍDO"
              echo "   Containers BACKUP removidos"
              echo "   Servidor limpo para nova tentativa de deploy"
              rm -f /opt/alice/versions/backup.current 2>/dev/null || true
            fi
            
            echo "⚠️  Outros stacks NÃO foram afetados"

  # ===========================================================================
  # Job Final: Notificação Consolidada e Relatório Enterprise
  # ===========================================================================
  
  notify:
    name: Notify & Report
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, prepare, deploy-infra, health-infra, drizzle-push, deploy-alice, deploy-observability, deploy-erpnext, deploy-backup, health-alice, health-observability, health-erpnext, health-backup, rollback-infra, rollback-alice, rollback-observability, rollback-erpnext, rollback-backup]
    if: always()
    timeout-minutes: 3
    
    steps:
      - name: Generate deployment report
        run: |
          set -euo pipefail
          
          echo "# 📊 Relatório de Deploy - Arquitetura Modular Enterprise" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Versão:** \`${{ needs.validate.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** \`${{ needs.validate.outputs.stack }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** \`deploy-stack-modular.yml\` (v3.0.0-modular)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📊 Database Schema Migration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          DRIZZLE_STATUS="${{ needs.drizzle-push.result || 'skipped' }}"
          if [ "$DRIZZLE_STATUS" = "success" ]; then
            echo "**Drizzle Push:** ✅ Schema aplicado com sucesso" >> $GITHUB_STEP_SUMMARY
          elif [ "$DRIZZLE_STATUS" = "skipped" ]; then
            echo "**Drizzle Push:** ⏭️ Skipped (banco já possui schema)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Drizzle Push:** ❌ FAILED - Schema não foi aplicado!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🎯 Status por Stack (Independente)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stack | Deploy | Health Check | Rollback | Status Final |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|--------------|----------|--------------|" >> $GITHUB_STEP_SUMMARY
          
          # INFRA
          INFRA_DEPLOY="${{ needs.deploy-infra.result || 'skipped' }}"
          INFRA_HEALTH="${{ needs.health-infra.result || 'skipped' }}"
          INFRA_ROLLBACK="${{ needs.rollback-infra.result || 'skipped' }}"
          if [ "$INFRA_HEALTH" = "success" ]; then
            INFRA_STATUS="✅ HEALTHY"
          elif [ "$INFRA_ROLLBACK" = "success" ]; then
            INFRA_STATUS="🔄 ROLLED BACK"
          elif [ "$INFRA_DEPLOY" = "skipped" ]; then
            INFRA_STATUS="⏭️ SKIPPED"
          else
            INFRA_STATUS="❌ FAILED"
          fi
          echo "| **INFRA** | $INFRA_DEPLOY | $INFRA_HEALTH | $INFRA_ROLLBACK | $INFRA_STATUS |" >> $GITHUB_STEP_SUMMARY
          
          # ALICE
          ALICE_DEPLOY="${{ needs.deploy-alice.result || 'skipped' }}"
          ALICE_HEALTH="${{ needs.health-alice.result || 'skipped' }}"
          ALICE_ROLLBACK="${{ needs.rollback-alice.result || 'skipped' }}"
          if [ "$ALICE_HEALTH" = "success" ]; then
            ALICE_STATUS="✅ HEALTHY"
          elif [ "$ALICE_ROLLBACK" = "success" ]; then
            ALICE_STATUS="🔄 ROLLED BACK"
          elif [ "$ALICE_DEPLOY" = "skipped" ]; then
            ALICE_STATUS="⏭️ SKIPPED"
          else
            ALICE_STATUS="❌ FAILED"
          fi
          echo "| **ALICE** | $ALICE_DEPLOY | $ALICE_HEALTH | $ALICE_ROLLBACK | $ALICE_STATUS |" >> $GITHUB_STEP_SUMMARY
          
          # OBSERVABILITY
          OBS_DEPLOY="${{ needs.deploy-observability.result || 'skipped' }}"
          OBS_HEALTH="${{ needs.health-observability.result || 'skipped' }}"
          OBS_ROLLBACK="${{ needs.rollback-observability.result || 'skipped' }}"
          if [ "$OBS_HEALTH" = "success" ]; then
            OBS_STATUS="✅ HEALTHY"
          elif [ "$OBS_ROLLBACK" = "success" ]; then
            OBS_STATUS="🔄 ROLLED BACK"
          elif [ "$OBS_DEPLOY" = "skipped" ]; then
            OBS_STATUS="⏭️ SKIPPED"
          else
            OBS_STATUS="❌ FAILED"
          fi
          echo "| **OBSERVABILITY** | $OBS_DEPLOY | $OBS_HEALTH | $OBS_ROLLBACK | $OBS_STATUS |" >> $GITHUB_STEP_SUMMARY
          
          # ERPNEXT
          ERP_DEPLOY="${{ needs.deploy-erpnext.result || 'skipped' }}"
          ERP_HEALTH="${{ needs.health-erpnext.result || 'skipped' }}"
          ERP_ROLLBACK="${{ needs.rollback-erpnext.result || 'skipped' }}"
          if [ "$ERP_HEALTH" = "success" ]; then
            ERP_STATUS="✅ HEALTHY"
          elif [ "$ERP_ROLLBACK" = "success" ]; then
            ERP_STATUS="🔄 ROLLED BACK"
          elif [ "$ERP_DEPLOY" = "skipped" ]; then
            ERP_STATUS="⏭️ SKIPPED"
          else
            ERP_STATUS="❌ FAILED (não afeta Alice)"
          fi
          echo "| **ERPNEXT** | $ERP_DEPLOY | $ERP_HEALTH | $ERP_ROLLBACK | $ERP_STATUS |" >> $GITHUB_STEP_SUMMARY
          
          # BACKUP
          BAK_DEPLOY="${{ needs.deploy-backup.result || 'skipped' }}"
          BAK_HEALTH="${{ needs.health-backup.result || 'skipped' }}"
          BAK_ROLLBACK="${{ needs.rollback-backup.result || 'skipped' }}"
          if [ "$BAK_HEALTH" = "success" ]; then
            BAK_STATUS="✅ HEALTHY"
          elif [ "$BAK_ROLLBACK" = "success" ]; then
            BAK_STATUS="🔄 ROLLED BACK"
          elif [ "$BAK_DEPLOY" = "skipped" ]; then
            BAK_STATUS="⏭️ SKIPPED"
          else
            BAK_STATUS="❌ FAILED"
