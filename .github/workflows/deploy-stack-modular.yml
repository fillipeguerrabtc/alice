  rollback-observability:
    name: Rollback OBSERVABILITY
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-observability, health-observability]
    if: failure() && needs.deploy-observability.result == 'success' && needs.health-observability.result == 'failure'
    timeout-minutes: 10
    
    steps:
      - name: Execute rollback cirúrgico
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          script_timeout: 10m
          script: |
            set -euo pipefail
            echo "🔄 Rollback OBSERVABILITY stack (CIRÚRGICO - não afeta outros stacks)..."
            
            if [ ! -f /opt/alice/versions/observability.previous ]; then
              echo "❌ ERRO: Nenhuma versão anterior encontrada para rollback"
              exit 1
            fi
            
            PREV_VERSION=$(cat /opt/alice/versions/observability.previous)
            echo "📌 Revertendo para versão anterior: $PREV_VERSION"
            
            # CRITICAL FIX (06/01/2026): Observability NÃO usa IMAGE_TAG (só imagens públicas)
            # Não há necessidade de modificar .env.prod ou passar IMAGE_TAG
            cd /opt/alice/app/infra/docker/stacks
            echo "🐳 Puxando imagens da versão $PREV_VERSION (hardcoded no compose)..."
            docker compose -p alice-observability --env-file ../.env.prod -f docker-compose.observability.yml pull
            
            echo "🚀 Deployando versão anterior..."
            docker compose -p alice-observability --env-file ../.env.prod -f docker-compose.observability.yml up -d --remove-orphans
            
            echo "$PREV_VERSION" > /opt/alice/versions/observability.current
            
            echo "✅ Rollback OBSERVABILITY concluído com sucesso"
            echo "⚠️ ATENÇÃO: Outros stacks NÃO foram afetados (rollback cirúrgico)"

  # ===========================================================================
  # ERPNEXT STACK - Deploy + Health + Rollback
  # Roda em PARALELO com alice e observability após infra
  # ===========================================================================
  
  deploy-erpnext:
    name: Deploy Stack ERPNEXT
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, prepare, health-infra, drizzle-push]
    # CRITICAL FIX (06/01/2026): Verificar health-infra para evitar deploy contra infra quebrada
    if: needs.validate.outputs.deploy_erpnext == 'true' && needs.prepare.result == 'success' && (needs.health-infra.result == 'success' || needs.health-infra.result == 'skipped') && (needs.drizzle-push.result == 'success' || needs.drizzle-push.result == 'skipped')
    timeout-minutes: 20
    
    steps:
      - name: Deploy stack erpnext via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          script_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/alice/app/infra/docker/stacks
            
            echo "🚀 Deploying ERPNEXT stack (mariadb, redis-cache, redis-queue, backend, frontend, workers)..."
            
            # Salvar versão anterior
            if [ -f /opt/alice/versions/erpnext.current ]; then
              cp /opt/alice/versions/erpnext.current /opt/alice/versions/erpnext.previous
            fi
            
            # Pull e deploy
            docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.erpnext.yml pull
            docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.erpnext.yml up -d --remove-orphans
            
            # Salvar versão atual
            echo "${{ needs.validate.outputs.version }}" > /opt/alice/versions/erpnext.current
            
            echo "✅ ERPNEXT stack deployed"

  health-erpnext:
    name: Health Check ERPNEXT
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-erpnext]
    if: needs.deploy-erpnext.result == 'success'
    timeout-minutes: 15
    
    steps:
      - name: Check health with retry logic
        id: check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          script_timeout: 15m
          script: |
            set -euo pipefail
            echo "🏥 Checking ERPNEXT stack health..."
            
            # CRITICAL FIX (06/01/2026): Adicionar todos os 10 containers com healthcheck
            # Faltavam: websocket (Socket.IO), scheduler (cron), workers (job queues)
            CONTAINERS="erpnext-mariadb erpnext-redis-cache erpnext-redis-queue erpnext-backend erpnext-frontend erpnext-websocket erpnext-scheduler erpnext-worker-default erpnext-worker-short erpnext-worker-long"
            MAX_RETRIES=45
            SLEEP_TIME=10
            
            for container in $CONTAINERS; do
              echo "Aguardando $container ficar healthy..."
              retry=0
              while [ $retry -lt $MAX_RETRIES ]; do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' $container 2>/dev/null || echo "not_found")
                if [ "$STATUS" = "healthy" ]; then
                  echo "✅ $container: healthy"
                  break
                elif [ "$STATUS" = "not_found" ]; then
                  echo "❌ $container: não encontrado"
                  exit 1
                else
                  echo "⏳ $container: $STATUS (tentativa $((retry+1))/$MAX_RETRIES)"
                  sleep $SLEEP_TIME
                  retry=$((retry+1))
                fi
              done
              
              if [ $retry -eq $MAX_RETRIES ]; then
                echo "❌ $container: timeout após $((MAX_RETRIES * SLEEP_TIME))s"
                exit 1
              fi
            done
            
            echo "✅ Todos os containers do ERPNEXT stack estão healthy"

  rollback-erpnext:
    name: Rollback ERPNEXT
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-erpnext, health-erpnext]
    if: failure() && needs.deploy-erpnext.result == 'success' && needs.health-erpnext.result == 'failure'
    timeout-minutes: 15
    
    steps:
      - name: Execute rollback cirúrgico
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          script_timeout: 15m
          script: |
            set -euo pipefail
            echo "🔄 Rollback ERPNEXT stack (CIRÚRGICO - não afeta outros stacks)..."
            echo "⚠️ ERPNext pode falhar SEM afetar Alice - design proposital"
            
            if [ ! -f /opt/alice/versions/erpnext.previous ]; then
              echo "❌ ERRO: Nenhuma versão anterior encontrada para rollback"
              exit 1
            fi
            
            PREV_VERSION=$(cat /opt/alice/versions/erpnext.previous)
            echo "📌 Revertendo para versão anterior: $PREV_VERSION"
            
            # CRITICAL FIX (06/01/2026): ERPNext NÃO usa IMAGE_TAG (só imagens públicas Frappe)
            # Não há necessidade de modificar .env.prod ou passar IMAGE_TAG
            cd /opt/alice/app/infra/docker/stacks
            echo "🐳 Puxando imagens da versão $PREV_VERSION (hardcoded no compose)..."
            docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.erpnext.yml pull
            
            echo "🚀 Deployando versão anterior..."
            docker compose -p alice-erpnext --env-file ../.env.prod -f docker-compose.erpnext.yml up -d --remove-orphans
            
            echo "$PREV_VERSION" > /opt/alice/versions/erpnext.current
            
            echo "✅ Rollback ERPNEXT concluído com sucesso"
            echo "⚠️ ATENÇÃO: Outros stacks NÃO foram afetados (rollback cirúrgico)"

  # ===========================================================================
  # BACKUP STACK - Deploy + Health + Rollback
  # Roda em PARALELO após infra
  # ===========================================================================
  
  deploy-backup:
    name: Deploy Stack BACKUP
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, prepare, health-infra, drizzle-push]
    # CRITICAL FIX (06/01/2026): Verificar health-infra para evitar deploy contra infra quebrada
    if: needs.validate.outputs.deploy_backup == 'true' && needs.prepare.result == 'success' && (needs.health-infra.result == 'success' || needs.health-infra.result == 'skipped') && (needs.drizzle-push.result == 'success' || needs.drizzle-push.result == 'skipped')
    timeout-minutes: 10
    
    steps:
      - name: Deploy stack backup via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          script_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/alice/app/infra/docker/stacks
            
            echo "🚀 Deploying BACKUP stack (pgbackrest)..."
            
            # Salvar versão anterior
            if [ -f /opt/alice/versions/backup.current ]; then
              cp /opt/alice/versions/backup.current /opt/alice/versions/backup.previous
            fi
            
            # Pull e deploy
            docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.backup.yml pull
            docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.backup.yml up -d --remove-orphans
            
            # Salvar versão atual
            echo "${{ needs.validate.outputs.version }}" > /opt/alice/versions/backup.current
            
            echo "✅ BACKUP stack deployed"

  health-backup:
    name: Health Check BACKUP
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-backup]
    if: needs.deploy-backup.result == 'success'
    timeout-minutes: 5
    
    steps:
      - name: Check health with retry logic
        id: check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          script_timeout: 5m
          script: |
            set -euo pipefail
            echo "🏥 Checking BACKUP stack health..."
            
            CONTAINER="alice-pgbackrest"
            MAX_RETRIES=15
            SLEEP_TIME=10
            
            echo "Aguardando $CONTAINER ficar healthy..."
            retry=0
            while [ $retry -lt $MAX_RETRIES ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' $CONTAINER 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ $CONTAINER: healthy"
                break
              elif [ "$STATUS" = "not_found" ]; then
                echo "❌ $CONTAINER: não encontrado"
                exit 1
              else
                echo "⏳ $CONTAINER: $STATUS (tentativa $((retry+1))/$MAX_RETRIES)"
                sleep $SLEEP_TIME
                retry=$((retry+1))
              fi
            done
            
            if [ $retry -eq $MAX_RETRIES ]; then
              echo "❌ $CONTAINER: timeout após $((MAX_RETRIES * SLEEP_TIME))s"
              exit 1
            fi
            
            echo "✅ BACKUP stack está healthy"

  rollback-backup:
    name: Rollback BACKUP
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, deploy-backup, health-backup]
    if: failure() && needs.deploy-backup.result == 'success' && needs.health-backup.result == 'failure'
    timeout-minutes: 5
    
    steps:
      - name: Execute rollback cirúrgico
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          script_timeout: 5m
          script: |
            set -euo pipefail
            echo "🔄 Rollback BACKUP stack (CIRÚRGICO - não afeta outros stacks)..."
            
            if [ ! -f /opt/alice/versions/backup.previous ]; then
              echo "❌ ERRO: Nenhuma versão anterior encontrada para rollback"
              exit 1
            fi
            
            PREV_VERSION=$(cat /opt/alice/versions/backup.previous)
            echo "📌 Revertendo para versão anterior: $PREV_VERSION"
            
            # CRITICAL FIX (06/01/2026): Passar IMAGE_TAG via env var para evitar race condition
            # Múltiplos rollbacks paralelos NÃO devem modificar o arquivo .env.prod compartilhado
            cd /opt/alice/app/infra/docker/stacks
            echo "🐳 Puxando imagens da versão $PREV_VERSION..."
            IMAGE_TAG=$PREV_VERSION docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.backup.yml pull
            
            echo "🚀 Deployando versão anterior..."
            IMAGE_TAG=$PREV_VERSION docker compose -p alice-backup --env-file ../.env.prod -f docker-compose.backup.yml up -d --remove-orphans
            
            echo "$PREV_VERSION" > /opt/alice/versions/backup.current
            
            echo "✅ Rollback BACKUP concluído com sucesso"
            echo "⚠️ ATENÇÃO: Outros stacks NÃO foram afetados (rollback cirúrgico)"

  # ===========================================================================
  # Job Final: Notificação Consolidada e Relatório Enterprise
  # ===========================================================================
  
  notify:
    name: Notify & Report
    runs-on: [self-hosted, linux, deploy]
    needs: [validate, prepare, deploy-infra, health-infra, drizzle-push, deploy-alice, deploy-observability, deploy-erpnext, deploy-backup, health-alice, health-observability, health-erpnext, health-backup, rollback-infra, rollback-alice, rollback-observability, rollback-erpnext, rollback-backup]
    if: always()
    timeout-minutes: 3
    
    steps:
      - name: Generate deployment report
        run: |
          set -euo pipefail
          
          echo "# 📊 Relatório de Deploy - Arquitetura Modular Enterprise" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Versão:** \`${{ needs.validate.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Stack:** \`${{ needs.validate.outputs.stack }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** \`deploy-stack-modular.yml\` (v3.0.0-modular)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📊 Database Schema Migration" >> $GITHUB_STEP_SUMMARY
