          echo "| Stack | Deploy | Health Check | Rollback | Status Final |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|--------------|----------|--------------|" >> $GITHUB_STEP_SUMMARY
          
          # INFRA
