name: build-media-images

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  GH_USER: fillipeguerrabtc
  # Checksums SHA256 dos modelos (supply chain security)
  WAV2LIP_CHECKPOINT_SHA256: ${{ secrets.WAV2LIP_CHECKPOINT_SHA256 }}
  S3FD_SHA256: ${{ secrets.S3FD_SHA256 }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - tts
          - talking-head
          - lip-sync
          - long-video
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push ${{ matrix.image }}
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.GH_USER }}/alice-${{ matrix.image }}:v1
          CONTEXT_DIR: docker/${{ matrix.image }}
        run: |
          BUILD_ARGS=""
          # lip-sync requer checksums dos modelos para supply chain security
          if [ "${{ matrix.image }}" = "lip-sync" ]; then
            if [ -z "$WAV2LIP_CHECKPOINT_SHA256" ]; then
              echo "::error::WAV2LIP_CHECKPOINT_SHA256 não configurado em Repository Variables"
              exit 1
            fi
            if [ -z "$S3FD_SHA256" ]; then
              echo "::error::S3FD_SHA256 não configurado em Repository Variables"
              exit 1
            fi
            BUILD_ARGS="--build-arg WAV2LIP_CHECKPOINT_SHA256=${WAV2LIP_CHECKPOINT_SHA256} --build-arg S3FD_SHA256=${S3FD_SHA256}"
          fi
          docker buildx build \
            --platform linux/amd64 \
            ${BUILD_ARGS} \
            -t "${IMAGE_NAME}" \
            --push \
            "${CONTEXT_DIR}"

      - name: Show digest ${{ matrix.image }}
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.GH_USER }}/alice-${{ matrix.image }}:v1
        run: |
          echo "Digest para $IMAGE_NAME:"
          docker buildx imagetools inspect "${IMAGE_NAME}" | grep -m1 digest
