name: build-media-images

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  GH_USER: fillipeguerrabtc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - tts
          - talking-head
          - lip-sync
          - long-video
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push ${{ matrix.image }}
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.GH_USER }}/alice-${{ matrix.image }}:v1
          CONTEXT_DIR: docker/${{ matrix.image }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE_NAME}" \
            --push \
            "${CONTEXT_DIR}"

      - name: Show digest ${{ matrix.image }}
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.GH_USER }}/alice-${{ matrix.image }}:v1
        run: |
          echo "Digest para $IMAGE_NAME:"
          docker buildx imagetools inspect "${IMAGE_NAME}" | grep -m1 digest
