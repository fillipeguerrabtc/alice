name: build-media-images

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  GH_USER: fillipeguerrabtc
  IMAGE_PREFIX: ghcr.io/fillipeguerrabtc/alice

jobs:
  # Job separado para calcular checksums dos modelos (supply chain security)
  # Apenas para lip-sync que é a única imagem que precisa dos checksums
  compute-checksums:
    runs-on: ubuntu-latest
    outputs:
      wav2lip_sha256: ${{ steps.checksums.outputs.wav2lip_sha256 }}
      s3fd_sha256: ${{ steps.checksums.outputs.s3fd_sha256 }}
    steps:
      - name: Calcular checksums dos modelos ML
        id: checksums
        run: |
          set -euo pipefail
          echo "🔐 Calculando checksums SHA256 dos modelos (supply chain security)..."
          
          # Wav2Lip GAN checkpoint (~400MB)
          echo "📦 Baixando wav2lip_gan.pth para calcular checksum..."
          WAV2LIP_FILE=$(mktemp)
          curl -fSL --retry 3 --retry-delay 5 -o "$WAV2LIP_FILE" \
            "https://huggingface.co/spaces/fffiloni/wav2lip/resolve/main/wav2lip_gan.pth"
          
          # Validar que o arquivo não está vazio
          if [ ! -s "$WAV2LIP_FILE" ]; then
            echo "::error::Download do wav2lip_gan.pth falhou ou arquivo vazio"
            exit 1
          fi
          
          WAV2LIP_SHA=$(sha256sum "$WAV2LIP_FILE" | cut -d' ' -f1)
          rm -f "$WAV2LIP_FILE"
          echo "wav2lip_sha256=${WAV2LIP_SHA}" >> $GITHUB_OUTPUT
          echo "✅ WAV2LIP_CHECKPOINT_SHA256=${WAV2LIP_SHA}"
          
          # S3FD face detection (~85MB)
          echo "📦 Baixando s3fd.pth para calcular checksum..."
          S3FD_FILE=$(mktemp)
          curl -fSL --retry 3 --retry-delay 5 -o "$S3FD_FILE" \
            "https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth"
          
          # Validar que o arquivo não está vazio
          if [ ! -s "$S3FD_FILE" ]; then
            echo "::error::Download do s3fd.pth falhou ou arquivo vazio"
            exit 1
          fi
          
          S3FD_SHA=$(sha256sum "$S3FD_FILE" | cut -d' ' -f1)
          rm -f "$S3FD_FILE"
          echo "s3fd_sha256=${S3FD_SHA}" >> $GITHUB_OUTPUT
          echo "✅ S3FD_SHA256=${S3FD_SHA}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: compute-checksums
    strategy:
      matrix:
        image:
          - tts
          - talking-head
          - lip-sync
          - long-video
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      # Preparar build-args apenas para lip-sync (única imagem que usa checksums)
      - name: Preparar build args
        id: build-args
        run: |
          if [ "${{ matrix.image }}" = "lip-sync" ]; then
            # Multiline output para build-args (usando heredoc EOF)
            {
              echo 'args<<EOF'
              echo "WAV2LIP_CHECKPOINT_SHA256=${{ needs.compute-checksums.outputs.wav2lip_sha256 }}"
              echo "S3FD_SHA256=${{ needs.compute-checksums.outputs.s3fd_sha256 }}"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      # Cache enterprise: mesmo padrão do deploy-production.yml
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:v1
          # Cache de registry enterprise (compartilhado entre builds)
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:cache,mode=max
          # Build args definidos no step anterior (vazios para imagens que não usam)
          build-args: ${{ steps.build-args.outputs.args }}

      - name: Show digest ${{ matrix.image }}
        run: |
          echo "📋 Digest para ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:v1:"
          docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:v1" | grep -m1 digest
