name: build-media-images

on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  GH_USER: fillipeguerrabtc
  IMAGE_PREFIX: ghcr.io/fillipeguerrabtc/alice

jobs:
  # Build das imagens que NÃO precisam de checksums
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - tts
          - talking-head
          - long-video
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      # Cache enterprise: mesmo padrão do deploy-production.yml
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: docker/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:v1
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:cache,mode=max

      - name: Show digest ${{ matrix.image }}
        run: |
          echo "📋 Digest para ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:v1:"
          digest_line=$(docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:v1" | grep -m1 digest || true)
          if [ -n "$digest_line" ]; then
            echo "$digest_line"
          else
            echo "::warning::Não foi possível capturar o digest (inspect/grep falhou). Build/push podem ter concluído; verifique manualmente o registry."
          fi

  # Build da imagem lip-sync (calcula checksums inline das fontes originais)
  build-and-push-lip-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GH_USER }}
          password: ${{ secrets.GH_PAT }}

      # Calcular checksums SHA256 dos modelos ML diretamente das fontes originais
      # Enterprise-grade: usa as mesmas URLs que o Dockerfile usa (HuggingFace + Adrian Bulat)
      # Token HuggingFace: usado em todos os downloads para garantir acesso confiável (rate limits, repositórios privados/gated)
      - name: Calcular checksums dos modelos ML (fontes originais)
        id: checksums
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔐 Calculando checksums SHA256 dos modelos (fontes originais)..."
          
          # Função helper para download com token (obrigatório se configurado)
          # Enterprise-grade: captura código HTTP mesmo em caso de erro (sem flag -f que aborta antes de capturar)
          download_with_token() {
            local URL="$1"
            local OUTPUT="$2"
            local TOKEN="${HUGGINGFACE_TOKEN:-}"
            
            if [ -n "$TOKEN" ]; then
              # Token configurado: usar OBRIGATORIAMENTE (sem fallback sem token)
              echo "🔐 Usando HUGGINGFACE_TOKEN para download autenticado..."
              # Remover flag -f para capturar código HTTP mesmo em erros 4xx/5xx
              # -L: follow redirects, -S: show errors, --retry: retry on transient errors
              HTTP_CODE=$(curl -SL --retry 3 --retry-delay 5 --max-time 300 -H "Authorization: Bearer ${TOKEN}" -w "%{http_code}" -o "$OUTPUT" "$URL" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ] && [ -s "$OUTPUT" ]; then
                return 0
              elif [ "$HTTP_CODE" = "401" ]; then
                echo "::error::401 Unauthorized - Token HuggingFace pode estar inválido ou expirado"
                return 1
              elif [ "$HTTP_CODE" = "403" ]; then
                echo "::error::403 Forbidden - Token HuggingFace não tem permissão para acessar este repositório"
                return 1
              else
                echo "::error::Download falhou com token (HTTP $HTTP_CODE)"
                return 1
              fi
            else
              # Token não configurado: tentar sem autenticação (repositórios públicos)
              echo "⚠️ HUGGINGFACE_TOKEN não configurado - tentando download público (pode falhar com 401)"
              # Remover flag -f para capturar código HTTP mesmo em erros 4xx/5xx
              HTTP_CODE=$(curl -SL --retry 3 --retry-delay 5 --max-time 300 -w "%{http_code}" -o "$OUTPUT" "$URL" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ] && [ -s "$OUTPUT" ]; then
                return 0
              elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
                echo "::error::Download requer autenticação (HTTP $HTTP_CODE) - configure HUGGINGFACE_TOKEN no GitHub Secrets"
                return 1
              else
                echo "::error::Download falhou (HTTP $HTTP_CODE)"
                return 1
              fi
            fi
          }
          
          if [ -n "${HUGGINGFACE_TOKEN:-}" ]; then
            echo "✅ Token HuggingFace configurado - será usado OBRIGATORIAMENTE em todos os downloads"
          else
            echo "⚠️ Token HuggingFace NÃO configurado - downloads podem falhar com 401/403"
            echo "⚠️ Configure HUGGINGFACE_TOKEN no GitHub Secrets para acesso confiável"
          fi
          
          # Wav2Lip GAN checkpoint (~400MB) - Enterprise-grade: múltiplas fontes com fallback + token
          # URL original do space fffiloni retorna 404, então usamos mirrors públicos do HuggingFace
          WAV2LIP_FILE=$(mktemp)
          WAV2LIP_DOWNLOADED=false
          
          # Lista de fontes (ordem de prioridade)
          WAV2LIP_SOURCES=(
            "https://huggingface.co/Nekochu/Wav2Lip/resolve/main/wav2lip_gan.pth|Nekochu/Wav2Lip"
            "https://huggingface.co/gmk123/wav2lip/resolve/main/wav2lip_gan.pth|gmk123/wav2lip"
            "https://huggingface.co/commanderx/Wav2Lip-HD/resolve/main/checkpoints/wav2lip_gan.pth|commanderx/Wav2Lip-HD"
            "https://huggingface.co/spaces/fffiloni/wav2lip/resolve/main/wav2lip_gan.pth|fffiloni/wav2lip (space - pode retornar 404)"
          )
          
          for SOURCE_INFO in "${WAV2LIP_SOURCES[@]}"; do
            IFS='|' read -r WAV2LIP_URL SOURCE_NAME <<< "$SOURCE_INFO"
            echo "📦 Tentando baixar wav2lip_gan.pth de ${SOURCE_NAME}..."
            
            if download_with_token "$WAV2LIP_URL" "$WAV2LIP_FILE"; then
              echo "✅ Download bem-sucedido de ${SOURCE_NAME}"
              WAV2LIP_DOWNLOADED=true
              break
            else
              echo "⚠️ Falha ao baixar de ${SOURCE_NAME}"
              rm -f "$WAV2LIP_FILE"
              WAV2LIP_FILE=$(mktemp)
            fi
          done
          
          if [ "$WAV2LIP_DOWNLOADED" != "true" ]; then
            echo "::error::Download de wav2lip_gan.pth falhou de todas as fontes"
            echo "::error::Configure HUGGINGFACE_TOKEN no GitHub Secrets (read-only token do HuggingFace) para acesso confiável"
            exit 1
          fi
          
          # Validação enterprise: verificar tamanho mínimo esperado (~400MB = 419430400 bytes)
          WAV2LIP_SIZE=$(stat -f%z "$WAV2LIP_FILE" 2>/dev/null || stat -c%s "$WAV2LIP_FILE" 2>/dev/null || echo "0")
          if [ "$WAV2LIP_SIZE" -lt 400000000 ]; then
            echo "::error::wav2lip_gan.pth parece estar corrompido (tamanho: ${WAV2LIP_SIZE} bytes, esperado: ~400MB)"
            exit 1
          fi
          WAV2LIP_SHA=$(sha256sum "$WAV2LIP_FILE" | cut -d' ' -f1)
          rm -f "$WAV2LIP_FILE"
          echo "wav2lip_sha256=${WAV2LIP_SHA}" >> $GITHUB_OUTPUT
          echo "✅ WAV2LIP_CHECKPOINT_SHA256=${WAV2LIP_SHA}"
          
          # S3FD face detection (~85MB) - Enterprise-grade: múltiplas fontes com fallback + token
          # URL original do Adrian Bulat retorna 401 Unauthorized, então usamos mirrors públicos do HuggingFace
          S3FD_FILE=$(mktemp)
          S3FD_DOWNLOADED=false
          
          # Lista de fontes (ordem de prioridade)
          S3FD_SOURCES=(
            "https://huggingface.co/gmk123/wav2lip/resolve/main/s3fd-619a316812.pth|gmk123/wav2lip"
            "https://huggingface.co/spaces/manavisrani07/gradio-lipsync-wav2lip/resolve/main/face_detection/detection/sfd/s3fd.pth|manavisrani07/gradio-lipsync-wav2lip"
            "https://huggingface.co/camenduru/Wav2Lip/resolve/main/checkpoints/s3fd-619a316812.pth|camenduru/Wav2Lip"
          )
          
          for SOURCE_INFO in "${S3FD_SOURCES[@]}"; do
            IFS='|' read -r S3FD_URL SOURCE_NAME <<< "$SOURCE_INFO"
            echo "📦 Tentando baixar s3fd.pth de ${SOURCE_NAME}..."
            
            if download_with_token "$S3FD_URL" "$S3FD_FILE"; then
              echo "✅ Download bem-sucedido de ${SOURCE_NAME}"
              S3FD_DOWNLOADED=true
              break
            else
              echo "⚠️ Falha ao baixar de ${SOURCE_NAME}"
              rm -f "$S3FD_FILE"
              S3FD_FILE=$(mktemp)
            fi
          done
          
          if [ "$S3FD_DOWNLOADED" != "true" ]; then
            echo "::error::Download de s3fd.pth falhou de todas as fontes"
            echo "::error::Configure HUGGINGFACE_TOKEN no GitHub Secrets (read-only token do HuggingFace) para acesso confiável"
            exit 1
          fi
          
          # Validação enterprise: verificar tamanho mínimo esperado (~85MB = 89128960 bytes)
          S3FD_SIZE=$(stat -f%z "$S3FD_FILE" 2>/dev/null || stat -c%s "$S3FD_FILE" 2>/dev/null || echo "0")
          if [ "$S3FD_SIZE" -lt 80000000 ]; then
            echo "::error::s3fd.pth parece estar corrompido (tamanho: ${S3FD_SIZE} bytes, esperado: ~85MB)"
            exit 1
          fi
          S3FD_SHA=$(sha256sum "$S3FD_FILE" | cut -d' ' -f1)
          rm -f "$S3FD_FILE"
          echo "s3fd_sha256=${S3FD_SHA}" >> $GITHUB_OUTPUT
          echo "✅ S3FD_SHA256=${S3FD_SHA}"

      - name: Build and push lip-sync
        uses: docker/build-push-action@v6
        with:
          context: docker/lip-sync
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-lip-sync:v1
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-lip-sync:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-lip-sync:cache,mode=max
          build-args: |
            WAV2LIP_CHECKPOINT_SHA256=${{ steps.checksums.outputs.wav2lip_sha256 }}
            S3FD_SHA256=${{ steps.checksums.outputs.s3fd_sha256 }}
          # Enterprise-grade: usar secrets ao invés de build-args para evitar exposição do token nos metadados da imagem
          # Secrets são montados via --mount=type=secret no Dockerfile e não aparecem no histórico/build
          secrets: |
            huggingface_token=${{ secrets.HUGGINGFACE_TOKEN }}

      - name: Show digest lip-sync
        run: |
          echo "📋 Digest para ${{ env.IMAGE_PREFIX }}-lip-sync:v1:"
          digest_line=$(docker buildx imagetools inspect "${{ env.IMAGE_PREFIX }}-lip-sync:v1" | grep -m1 digest || true)
          if [ -n "$digest_line" ]; then
            echo "$digest_line"
          else
            echo "::warning::Não foi possível capturar o digest (inspect/grep falhou). Build/push podem ter concluído; verifique manualmente o registry."
          fi
