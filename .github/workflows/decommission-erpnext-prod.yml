name: Decommission ERPNext (Production)

on:
  workflow_dispatch:
    inputs:
      confirm_phrase:
        description: "Type exactly: DECOMMISSION ERPNext PROD"
        required: true
        type: string
      dry_run:
        description: "Plan only (no deletions)"
        required: true
        type: boolean
        default: true
      project_label:
        description: "Compose project label to target"
        required: true
        type: string
        default: "erpnext"
      name_prefix:
        description: "Resource name prefix to target"
        required: true
        type: string
        default: "erpnext-"
      remove_networks:
        description: "Remove matching networks"
        required: true
        type: boolean
        default: true
      remove_images:
        description: "Remove images from targeted containers"
        required: true
        type: boolean
        default: false
      remove_volumes:
        description: "Remove matching volumes (destructive)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: decommission-erpnext-production
  cancel-in-progress: false

env:
  HETZNER_HOST: ${{ secrets.HETZNER_VM_HOST }}
  HETZNER_USER: ${{ secrets.HETZNER_VM_USER }}

jobs:
  validate-request:
    name: Validate Decommission Request
    runs-on: [self-hosted, linux, deploy]
    outputs:
      dry_run: ${{ steps.validate.outputs.dry_run }}
      project_label: ${{ steps.validate.outputs.project_label }}
      name_prefix: ${{ steps.validate.outputs.name_prefix }}
      remove_networks: ${{ steps.validate.outputs.remove_networks }}
      remove_images: ${{ steps.validate.outputs.remove_images }}
      remove_volumes: ${{ steps.validate.outputs.remove_volumes }}
    steps:
      - name: Validate confirmation and inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PHRASE="DECOMMISSION ERPNext PROD"
          if [ "${{ github.event.inputs.confirm_phrase }}" != "$EXPECTED_PHRASE" ]; then
            echo "❌ Invalid confirmation phrase."
            echo "Expected exactly: $EXPECTED_PHRASE"
            exit 1
          fi

          PROJECT_LABEL="${{ github.event.inputs.project_label }}"
          NAME_PREFIX="${{ github.event.inputs.name_prefix }}"

          if [ -z "$PROJECT_LABEL" ] || [ -z "$NAME_PREFIX" ]; then
            echo "❌ project_label and name_prefix are required."
            exit 1
          fi

          if ! [[ "$PROJECT_LABEL" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "❌ project_label has invalid characters."
            exit 1
          fi

          if ! [[ "$NAME_PREFIX" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "❌ name_prefix has invalid characters."
            exit 1
          fi

          echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          echo "project_label=$PROJECT_LABEL" >> "$GITHUB_OUTPUT"
          echo "name_prefix=$NAME_PREFIX" >> "$GITHUB_OUTPUT"
          echo "remove_networks=${{ github.event.inputs.remove_networks }}" >> "$GITHUB_OUTPUT"
          echo "remove_images=${{ github.event.inputs.remove_images }}" >> "$GITHUB_OUTPUT"
          echo "remove_volumes=${{ github.event.inputs.remove_volumes }}" >> "$GITHUB_OUTPUT"

      - name: Publish execution plan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# ERPNext Decommission Request"
            echo ""
            echo "- Host: \`${{ env.HETZNER_HOST }}\`"
            echo "- Dry run: \`${{ steps.validate.outputs.dry_run }}\`"
            echo "- project_label: \`${{ steps.validate.outputs.project_label }}\`"
            echo "- name_prefix: \`${{ steps.validate.outputs.name_prefix }}\`"
            echo "- remove_networks: \`${{ steps.validate.outputs.remove_networks }}\`"
            echo "- remove_images: \`${{ steps.validate.outputs.remove_images }}\`"
            echo "- remove_volumes: \`${{ steps.validate.outputs.remove_volumes }}\`"
            echo ""
            echo "Runbook: \`docs/DECOMMISSION-ERPNEXT-PROD.md\`"
          } >> "$GITHUB_STEP_SUMMARY"

  decommission:
    name: Decommission ERPNext Resources
    runs-on: [self-hosted, linux, deploy]
    needs: [validate-request]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Execute decommission over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROJECT_LABEL: ${{ needs.validate-request.outputs.project_label }}
          NAME_PREFIX: ${{ needs.validate-request.outputs.name_prefix }}
          DRY_RUN: ${{ needs.validate-request.outputs.dry_run }}
          REMOVE_NETWORKS: ${{ needs.validate-request.outputs.remove_networks }}
          REMOVE_IMAGES: ${{ needs.validate-request.outputs.remove_images }}
          REMOVE_VOLUMES: ${{ needs.validate-request.outputs.remove_volumes }}
        with:
          host: ${{ env.HETZNER_HOST }}
          username: ${{ env.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 40m
          envs: PROJECT_LABEL,NAME_PREFIX,DRY_RUN,REMOVE_NETWORKS,REMOVE_IMAGES,REMOVE_VOLUMES
          script: |
            set -euo pipefail

            log() { printf '%s %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$*"; }
            fail() { log "ERROR: $*"; exit 1; }

            bool_or_fail() {
              case "$1" in
                true|false) ;;
                *) fail "Invalid boolean value: $1" ;;
              esac
            }

            bool_or_fail "$DRY_RUN"
            bool_or_fail "$REMOVE_NETWORKS"
            bool_or_fail "$REMOVE_IMAGES"
            bool_or_fail "$REMOVE_VOLUMES"

            [ -n "$PROJECT_LABEL" ] || fail "PROJECT_LABEL is empty"
            [ -n "$NAME_PREFIX" ] || fail "NAME_PREFIX is empty"

            declare -A SEEN

            unique_push() {
              local item="$1"
              if [ -n "$item" ] && [ -z "${SEEN[$item]+x}" ]; then
                SEEN["$item"]=1
                printf '%s\n' "$item"
              fi
            }

            collect_containers() {
              local id
              SEEN=()
              while IFS= read -r id; do unique_push "$id"; done < <(docker ps -aq --filter "label=com.docker.compose.project=${PROJECT_LABEL}" || true)
              while IFS= read -r id; do unique_push "$id"; done < <(docker ps -aq --filter "name=${NAME_PREFIX}" || true)
            }

            collect_networks() {
              local name
              SEEN=()
              while IFS= read -r name; do unique_push "$name"; done < <(docker network ls --format '{{.Name}}' --filter "label=com.docker.compose.project=${PROJECT_LABEL}" || true)
              while IFS= read -r name; do
                [ -n "$name" ] || continue
                case "$name" in
                  ${NAME_PREFIX}*) unique_push "$name" ;;
                esac
              done < <(docker network ls --format '{{.Name}}' || true)
            }

            collect_volumes() {
              local name
              SEEN=()
              while IFS= read -r name; do unique_push "$name"; done < <(docker volume ls --format '{{.Name}}' --filter "label=com.docker.compose.project=${PROJECT_LABEL}" || true)
              while IFS= read -r name; do
                [ -n "$name" ] || continue
                case "$name" in
                  ${NAME_PREFIX}*) unique_push "$name" ;;
                esac
              done < <(docker volume ls --format '{{.Name}}' || true)
            }

            collect_images_from_containers() {
              local id img
              SEEN=()
              for id in "$@"; do
                img="$(docker inspect -f '{{.Config.Image}}' "$id" 2>/dev/null || true)"
                unique_push "$img" >/dev/null
              done
              for img in "${!SEEN[@]}"; do
                printf '%s\n' "$img"
              done | sort
            }

            readarray -t TARGET_CONTAINERS < <(collect_containers)
            readarray -t TARGET_NETWORKS < <(collect_networks)
            readarray -t TARGET_VOLUMES < <(collect_volumes)
            readarray -t TARGET_IMAGES < <(collect_images_from_containers "${TARGET_CONTAINERS[@]}")

            log "=== ERPNext Decommission Inventory ==="
            log "project_label=$PROJECT_LABEL"
            log "name_prefix=$NAME_PREFIX"
            log "dry_run=$DRY_RUN"
            log "remove_networks=$REMOVE_NETWORKS remove_images=$REMOVE_IMAGES remove_volumes=$REMOVE_VOLUMES"
            log "containers=${#TARGET_CONTAINERS[@]} networks=${#TARGET_NETWORKS[@]} volumes=${#TARGET_VOLUMES[@]} images=${#TARGET_IMAGES[@]}"

            for id in "${TARGET_CONTAINERS[@]}"; do
              name="$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null | sed 's#^/##' || true)"
              image="$(docker inspect -f '{{.Config.Image}}' "$id" 2>/dev/null || true)"
              status="$(docker inspect -f '{{.State.Status}}' "$id" 2>/dev/null || true)"
              log "container id=$id name=$name status=$status image=$image"
            done

            for n in "${TARGET_NETWORKS[@]}"; do log "network name=$n"; done
            for v in "${TARGET_VOLUMES[@]}"; do log "volume name=$v"; done
            for i in "${TARGET_IMAGES[@]}"; do log "image ref=$i"; done

            if [ "$DRY_RUN" = "true" ]; then
              log "DRY_RUN=true. No resources were removed."
              exit 0
            fi

            log "=== Stage 1: Stop and remove target containers ==="
            for id in "${TARGET_CONTAINERS[@]}"; do
              [ -n "$id" ] || continue
              if docker ps -q --no-trunc | grep -q "^$id$"; then
                docker stop -t 30 "$id" >/dev/null
              fi
              docker rm -f "$id" >/dev/null
              log "removed container id=$id"
            done

            log "=== Stage 2: Remove target networks (optional) ==="
            if [ "$REMOVE_NETWORKS" = "true" ]; then
              for net in "${TARGET_NETWORKS[@]}"; do
                [ -n "$net" ] || continue
                if ! docker network inspect "$net" >/dev/null 2>&1; then
                  continue
                fi
                attached="$(docker network inspect -f '{{len .Containers}}' "$net" 2>/dev/null || echo "0")"
                if [ "$attached" != "0" ]; then
                  fail "Network $net still has attached containers: $attached"
                fi
                docker network rm "$net" >/dev/null
                log "removed network name=$net"
              done
            else
              log "Skipping network removal."
            fi

            log "=== Stage 3: Remove target images (optional) ==="
            if [ "$REMOVE_IMAGES" = "true" ]; then
              for image in "${TARGET_IMAGES[@]}"; do
                [ -n "$image" ] || continue
                if ! docker image inspect "$image" >/dev/null 2>&1; then
                  continue
                fi
                in_use="$(docker ps -q --filter "ancestor=$image" | wc -l | tr -d ' ')"
                if [ "${in_use:-0}" != "0" ]; then
                  fail "Image still in use by running container(s): $image"
                fi
                docker image rm "$image" >/dev/null
                log "removed image ref=$image"
              done
            else
              log "Skipping image removal."
            fi

            log "=== Stage 4: Remove target volumes (optional, destructive) ==="
            if [ "$REMOVE_VOLUMES" = "true" ]; then
              for vol in "${TARGET_VOLUMES[@]}"; do
                [ -n "$vol" ] || continue
                if ! docker volume inspect "$vol" >/dev/null 2>&1; then
                  continue
                fi
                attached="$(docker ps -aq --filter "volume=$vol" | wc -l | tr -d ' ')"
                if [ "${attached:-0}" != "0" ]; then
                  fail "Volume still attached to container(s): $vol"
                fi
                docker volume rm "$vol" >/dev/null
                log "removed volume name=$vol"
              done
            else
              log "Skipping volume removal."
            fi

            log "=== Stage 5: Post-check ==="
            readarray -t REMAINING_CONTAINERS < <(collect_containers)
            if [ "${#REMAINING_CONTAINERS[@]}" -ne 0 ]; then
              fail "Remaining targeted containers found: ${#REMAINING_CONTAINERS[@]}"
            fi

            if [ "$REMOVE_NETWORKS" = "true" ]; then
              readarray -t REMAINING_NETWORKS < <(collect_networks)
              if [ "${#REMAINING_NETWORKS[@]}" -ne 0 ]; then
                fail "Remaining targeted networks found: ${#REMAINING_NETWORKS[@]}"
              fi
            fi

            if [ "$REMOVE_VOLUMES" = "true" ]; then
              readarray -t REMAINING_VOLUMES < <(collect_volumes)
              if [ "${#REMAINING_VOLUMES[@]}" -ne 0 ]; then
                fail "Remaining targeted volumes found: ${#REMAINING_VOLUMES[@]}"
              fi
            fi

            log "Decommission completed successfully."

      - name: Publish completion summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# ERPNext Decommission Result"
            echo ""
            echo "- Host: \`${{ env.HETZNER_HOST }}\`"
            echo "- Dry run: \`${{ needs.validate-request.outputs.dry_run }}\`"
            echo "- remove_networks: \`${{ needs.validate-request.outputs.remove_networks }}\`"
            echo "- remove_images: \`${{ needs.validate-request.outputs.remove_images }}\`"
            echo "- remove_volumes: \`${{ needs.validate-request.outputs.remove_volumes }}\`"
            echo ""
            echo "Validation and decommission completed. Review job logs for inventory and post-check details."
          } >> "$GITHUB_STEP_SUMMARY"
