# =============================================================================
# GitHub Actions Workflow - Sync Vendor Images to GHCR
# =============================================================================
# Descrição: Copia imagens de terceiros (Docker Hub) para GHCR da Alice
#
# PROBLEMA RESOLVIDO:
#   - Docker Hub rotaciona digests de imagens, quebrando deploys com pinagem SHA256
#   - Rate limits do Docker Hub (100 pulls/6h anônimo, 200 autenticado)
#   - Dependência de disponibilidade do Docker Hub em deploys críticos
#
# SOLUÇÃO ENTERPRISE (Best Practices 2025):
#   - Mirror de imagens de terceiros para GHCR privado
#   - Digests imutáveis sob controle da organização
#   - Zero dependência de Docker Hub em produção
#   - Supply chain security: imagens auditadas antes de uso
#
# EXECUÇÃO:
#   - Automática: Semanal (domingo 03:00 UTC)
#   - Manual: workflow_dispatch com opção de atualizar compose
#
# Author: Fillipe Guerra
# Data: 27 de Dezembro de 2025
# =============================================================================

name: Sync Vendor Images

on:
  schedule:
    # Semanal: Domingo 03:00 UTC (00:00 BRT)
    - cron: '0 3 * * 0'
  
  workflow_dispatch:
    inputs:
      update_compose:
        description: 'Atualizar docker-compose.prod.yml com novos digests?'
        type: boolean
        required: false
        default: true
      create_pr:
        description: 'Criar PR com mudanças (false = commit direto na branch)'
        type: boolean
        required: false
        default: true

concurrency:
  group: sync-vendor-images
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/alice-vendor

jobs:
  sync-images:
    name: Sync Vendor Images to GHCR
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 30
    
    outputs:
      images_synced: ${{ steps.sync.outputs.synced_count }}
      images_updated: ${{ steps.sync.outputs.updated_count }}
    
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Login no GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login no Docker Hub (para evitar rate limits)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Instalar skopeo (se não disponível)
        run: |
          if ! command -v skopeo &> /dev/null; then
            echo "Instalando skopeo..."
            sudo apt-get update && sudo apt-get install -y skopeo
          fi
          skopeo --version

      - name: Sync Vendor Images
        id: sync
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          echo "=============================================="
          echo "SYNC VENDOR IMAGES TO GHCR"
          echo "=============================================="
          
          # Imagens de terceiros para sincronizar
          # Formato: "source_image:tag|target_name"
          VENDOR_IMAGES=(
            "traefik:v$(jq -r '.traefik' .github/component-versions.json)|traefik"
            "prom/prometheus:v$(jq -r '.prometheus' .github/component-versions.json)|prometheus"
            "grafana/grafana-oss:$(jq -r '.grafana' .github/component-versions.json)|grafana"
            "grafana/loki:$(jq -r '.loki' .github/component-versions.json)|loki"
            "grafana/promtail:$(jq -r '.promtail' .github/component-versions.json)|promtail"
            "jaegertracing/jaeger:$(jq -r '.jaeger' .github/component-versions.json)|jaeger"
            "langfuse/langfuse:$(jq -r '.langfuse' .github/component-versions.json)|langfuse"
            "tecnativa/docker-socket-proxy:$(jq -r '.["docker-socket-proxy"]' .github/component-versions.json)|docker-socket-proxy"
            "busybox:$(jq -r '.busybox' .github/component-versions.json)|busybox"
            "redis:$(jq -r '.redis' .github/component-versions.json)|redis"
            "mariadb:$(jq -r '.mariadb' .github/component-versions.json)|mariadb"
            "pgvector/pgvector:$(jq -r '.pgvector' .github/component-versions.json)|pgvector"
            "qdrant/qdrant:v1.16.2|qdrant"
            "searxng/searxng:latest|searxng"
            "dperson/torproxy:latest|torproxy"
            "clickhouse/clickhouse-server:24.8|clickhouse"
            "otel/opentelemetry-collector-contrib:0.141.0|otel-collector"
            "prom/alertmanager:v0.27.0|alertmanager"
            "timberio/vector:0.51.1-alpine|vector"
            "prom/node-exporter:v1.8.2|node-exporter"
            "gcr.io/cadvisor/cadvisor:v0.49.1|cadvisor"
            "frappe/erpnext:v15.$(jq -r '.erpnext' .github/component-versions.json).3|erpnext"
          )
          
          SYNCED=0
          UPDATED=0
          DIGEST_MAP=""
          
          for entry in "${VENDOR_IMAGES[@]}"; do
            SOURCE="${entry%%|*}"
            TARGET_NAME="${entry##*|}"
            TARGET="${IMAGE_PREFIX}-${TARGET_NAME}:latest"
            
            echo ""
            echo "📦 Syncing: $SOURCE → $TARGET"
            
            # Obter digest da origem
            SOURCE_DIGEST=$(skopeo inspect "docker://${SOURCE}" 2>/dev/null | jq -r '.Digest' || echo "")
            
            if [ -z "$SOURCE_DIGEST" ]; then
              echo "⚠️ Não foi possível obter digest de $SOURCE - pulando"
              continue
            fi
            
            # Verificar se já existe no GHCR com mesmo digest
            TARGET_DIGEST=$(skopeo inspect "docker://${TARGET}" 2>/dev/null | jq -r '.Digest' || echo "")
            
            if [ "$SOURCE_DIGEST" = "$TARGET_DIGEST" ]; then
              echo "✅ Já sincronizado (digest: ${SOURCE_DIGEST:0:20}...)"
              SYNCED=$((SYNCED + 1))
            else
              echo "🔄 Copiando (novo digest: ${SOURCE_DIGEST:0:20}...)"
              
              # Copiar imagem para GHCR
              skopeo copy \
                --dest-creds="${{ github.actor }}:${GHCR_TOKEN}" \
                "docker://${SOURCE}" \
                "docker://${TARGET}"
              
              # Também criar tag com versão específica
              VERSION_TAG="${SOURCE##*:}"
              skopeo copy \
                --dest-creds="${{ github.actor }}:${GHCR_TOKEN}" \
                "docker://${SOURCE}" \
                "docker://${IMAGE_PREFIX}-${TARGET_NAME}:${VERSION_TAG}"
              
              echo "✅ Copiado com sucesso"
              SYNCED=$((SYNCED + 1))
              UPDATED=$((UPDATED + 1))
            fi
            
            # Armazenar mapping para atualização do compose
            DIGEST_MAP="${DIGEST_MAP}${TARGET_NAME}=${SOURCE_DIGEST}\n"
          done
          
          echo ""
          echo "=============================================="
          echo "RESUMO: ${SYNCED} imagens sincronizadas, ${UPDATED} atualizadas"
          echo "=============================================="
          
          echo "synced_count=${SYNCED}" >> $GITHUB_OUTPUT
          echo "updated_count=${UPDATED}" >> $GITHUB_OUTPUT
          
          # Salvar mapping para próximo step
          echo -e "$DIGEST_MAP" > /tmp/digest_map.txt

      - name: Atualizar docker-compose.prod.yml
        if: ${{ inputs.update_compose == true || github.event_name == 'schedule' }}
        id: update-compose
        run: |
          echo "📝 Atualizando referências no docker-compose.prod.yml..."
          
          # Este step é um placeholder - a atualização real do compose
          # requer parsing cuidadoso do YAML. Por segurança, criamos
          # apenas um relatório das mudanças necessárias.
          
          echo "## Imagens Vendor Sincronizadas" > /tmp/sync_report.md
          echo "" >> /tmp/sync_report.md
          echo "As seguintes imagens foram sincronizadas para o GHCR:" >> /tmp/sync_report.md
          echo "" >> /tmp/sync_report.md
          echo "| Imagem | GHCR Mirror |" >> /tmp/sync_report.md
          echo "|--------|-------------|" >> /tmp/sync_report.md
          
          while IFS='=' read -r name digest; do
            if [ -n "$name" ] && [ -n "$digest" ]; then
              echo "| ${name} | ${IMAGE_PREFIX}-${name}@${digest} |" >> /tmp/sync_report.md
            fi
          done < /tmp/digest_map.txt
          
          echo "" >> /tmp/sync_report.md
          echo "### Como usar" >> /tmp/sync_report.md
          echo "" >> /tmp/sync_report.md
          echo "Para usar as imagens do GHCR ao invés do Docker Hub, atualize o \`docker-compose.prod.yml\`:" >> /tmp/sync_report.md
          echo "" >> /tmp/sync_report.md
          echo '```yaml' >> /tmp/sync_report.md
          echo "# Antes (Docker Hub - sujeito a rate limits e digest rotation):" >> /tmp/sync_report.md
          echo "image: traefik:v3.6.4@sha256:..." >> /tmp/sync_report.md
          echo "" >> /tmp/sync_report.md
          echo "# Depois (GHCR - controle total):" >> /tmp/sync_report.md
          echo "image: ${IMAGE_PREFIX}-traefik:v3.6.4" >> /tmp/sync_report.md
          echo '```' >> /tmp/sync_report.md
          
          cat /tmp/sync_report.md
          
          echo "report_path=/tmp/sync_report.md" >> $GITHUB_OUTPUT

      - name: Criar Issue com Relatório
        if: ${{ steps.sync.outputs.updated_count > 0 && (inputs.create_pr == true || github.event_name == 'schedule') }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/sync_report.md', 'utf8');
            
            // Verificar se já existe issue aberta
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'vendor-images'
            });
            
            if (issues.length > 0) {
              // Atualizar issue existente
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: report + '\n\n---\n_Última atualização: ' + new Date().toISOString() + '_'
              });
              console.log(`Issue #${issues[0].number} atualizada`);
            } else {
              // Criar nova issue
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔄 Vendor Images Sincronizadas - Revisão Necessária',
                body: report + '\n\n---\n_Criado automaticamente em: ' + new Date().toISOString() + '_',
                labels: ['vendor-images', 'infrastructure']
              });
              console.log(`Issue #${issue.number} criada`);
            }

      - name: Resumo
        run: |
          echo "## 📦 Sync Vendor Images - Resumo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Imagens processadas | ${{ steps.sync.outputs.synced_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Imagens atualizadas | ${{ steps.sync.outputs.updated_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Registry: \`${{ env.IMAGE_PREFIX }}\`" >> $GITHUB_STEP_SUMMARY
