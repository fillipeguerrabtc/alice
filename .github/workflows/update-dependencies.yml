# =============================================================================
# GitHub Actions Workflow - Atualização Automática de Dependências
# =============================================================================
# Descrição: Verifica e atualiza automaticamente todas as dependências npm/pnpm
# Execução: Semanal (domingos às 02:00 UTC)
# REGRA 4: Aprovação obrigatória - cria PR, não faz push direto
# REGRA 6: Enterprise-grade - sem workarounds, validação completa
# REGRA 11: Melhores práticas GitHub Actions 2025
# =============================================================================

name: Update Dependencies

on:
  # Executar semanalmente (domingos às 02:00 UTC)
  schedule:
    - cron: '0 2 * * 0'  # Todo domingo às 02:00 UTC
  # Permitir execução manual
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Tipo de atualização (all, patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - all
          - patch
          - minor
          - major

concurrency:
  group: update-dependencies
  cancel-in-progress: false  # Não cancelar se já estiver rodando

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # pnpm v10+: permitir execução automática de scripts de build de dependências
  # NOTA (enterprise): NÃO definir NPM_CONFIG_* globalmente para evitar warnings do npm/npx.
  # Esta env é aplicada apenas nos steps que executam `pnpm install`.

jobs:
  # ===========================================================================
  # Job 1: Verificar Atualizações Disponíveis
  # ===========================================================================
  check_updates:
    name: Verificar Atualizações
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check_updates.outputs.has_updates }}
      updates_json: ${{ steps.check_updates.outputs.updates_json }}
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security (Regra 11)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # REGRA 6: Enterprise-grade - versionamento automático do Node.js LTS
      - name: Buscar versão LTS do Node.js
        id: node-version
        run: |
          echo "🔍 Buscando versão LTS mais recente do Node.js..."
          NODE_LTS_VERSION=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          if [ -z "$NODE_LTS_VERSION" ] || [ "$NODE_LTS_VERSION" = "null" ]; then
            if [ -f ".nvmrc" ]; then
              NODE_LTS_VERSION=$(cat .nvmrc | tr -d '[:space:]')
              echo "✅ Versão do Node.js lida do .nvmrc: $NODE_LTS_VERSION"
            else
              echo "::error::Arquivo .nvmrc não encontrado e API falhou!" >&2
              exit 1
            fi
          else
            echo "✅ Versão LTS do Node.js encontrada via API: $NODE_LTS_VERSION"
          fi
          
          if ! echo "$NODE_LTS_VERSION" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versão do Node.js em formato inválido: '$NODE_LTS_VERSION'. Deve ser X ou X.Y" >&2
            exit 1
          fi
          
          echo "version=$NODE_LTS_VERSION" >> $GITHUB_OUTPUT
          echo "NODE_VERSION=$NODE_LTS_VERSION" >> $GITHUB_ENV

      # SHA: actions/setup-node@v4.1.0 (2024-10-24) - Supply Chain Security (Regra 11)
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # REGRA 6: Enterprise-grade - versionamento automático do pnpm
      - name: Ler versão do pnpm do package.json
        id: pnpm-version
        run: |
          if [ ! -f "package.json" ]; then
            echo "::error::Arquivo package.json não encontrado!" >&2
            exit 1
          fi
          
          PNPM_VERSION=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          
          if [ -z "$PNPM_VERSION" ] || [ "$PNPM_VERSION" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!" >&2
            exit 1
          fi
          
          if ! echo "$PNPM_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão do pnpm em formato inválido: '$PNPM_VERSION'. Deve ser X.Y.Z" >&2
            exit 1
          fi
          
          echo "✅ Versão do pnpm lida do package.json: $PNPM_VERSION"
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "PNPM_VERSION=$PNPM_VERSION" >> $GITHUB_ENV

      # Best Practices 2025: pnpm/action-setup@v4 (Node.js 20, November 2025)
      # Nota: pnpm/action-setup não fornece SHA, mas v4 é a versão mais recente e estável
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        env:
          # pnpm v10+: permitir execução automática de scripts de build de dependências
          # APENAS durante `pnpm install` em CI (não aplicar localmente via .npmrc).
          NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'

      # REGRA 6: Enterprise-grade - verificar atualizações usando pnpm outdated
      - name: Verificar atualizações disponíveis
        id: check_updates
        run: |
          echo "🔍 Verificando atualizações disponíveis..."
          
          # pnpm outdated retorna lista de pacotes desatualizados
          # Formato: Package Name  Current  Wanted  Latest
          UPDATES=$(pnpm outdated --format json 2>/dev/null || echo "[]")
          
          if [ "$UPDATES" = "[]" ] || [ -z "$UPDATES" ]; then
            echo "✅ Nenhuma atualização disponível"
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "updates_json=[]" >> $GITHUB_OUTPUT
          else
            echo "📦 Atualizações encontradas:"
            echo "$UPDATES" | jq '.'
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "updates_json<<EOF" >> $GITHUB_OUTPUT
            echo "$UPDATES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # REGRA 6: Enterprise-grade - criar resumo das atualizações
      - name: Criar resumo das atualizações
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          echo "## 📦 Resumo de Atualizações Disponíveis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.check_updates.outputs.updates_json }}" | jq -r '.[] | "- **\(.name)**: \(.current) → \(.latest) (\(.type))**"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # REGRA 6: Enterprise-grade - usar aspas duplas para permitir expansão de variável GitHub Actions
          # Aspas simples impedem expansão, resultando em texto literal ${{ ... }}
          echo "Total de pacotes desatualizados: $(echo \"${{ steps.check_updates.outputs.updates_json }}\" | jq 'length')" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Atualizar Dependências e Criar PR
  # ===========================================================================
  update-and-pr:
    name: Atualizar Dependências e Criar PR
    needs: check_updates
    if: needs.check_updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security (Regra 11)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buscar versão LTS do Node.js
        id: node-version
        run: |
          NODE_LTS_VERSION=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          if [ -z "$NODE_LTS_VERSION" ] || [ "$NODE_LTS_VERSION" = "null" ]; then
            if [ -f ".nvmrc" ]; then
              NODE_LTS_VERSION=$(cat .nvmrc | tr -d '[:space:]')
            else
              echo "::error::Arquivo .nvmrc não encontrado e API falhou!" >&2
              exit 1
            fi
          fi
          
          if ! echo "$NODE_LTS_VERSION" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versão do Node.js em formato inválido: '$NODE_LTS_VERSION'. Deve ser X ou X.Y" >&2
            exit 1
          fi
          
          echo "version=$NODE_LTS_VERSION" >> $GITHUB_OUTPUT
          echo "NODE_VERSION=$NODE_LTS_VERSION" >> $GITHUB_ENV

      # SHA: actions/setup-node@v4.1.0 (2024-10-24) - Supply Chain Security (Regra 11)
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Ler versão do pnpm do package.json
        id: pnpm-version
        run: |
          PNPM_VERSION=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          if [ -z "$PNPM_VERSION" ] || [ "$PNPM_VERSION" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!" >&2
            exit 1
          fi
          if ! echo "$PNPM_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão do pnpm em formato inválido: '$PNPM_VERSION'. Deve ser X.Y.Z" >&2
            exit 1
          fi
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "PNPM_VERSION=$PNPM_VERSION" >> $GITHUB_ENV

      # Best Practices 2025: pnpm/action-setup@v4 (Node.js 20, November 2025)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # REGRA 4: Aprovação obrigatória - criar branch para PR
      # REGRA 6: Enterprise-grade - nome único para evitar colisões (timestamp + SHA curto)
      - name: Criar branch para atualizações
        run: |
          # REGRA 6: Enterprise-grade - nome único com timestamp e SHA para evitar colisões
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          SHA_SHORT="${GITHUB_SHA::8}"
          BRANCH_NAME="deps/update-${TIMESTAMP}-${SHA_SHORT}"
          
          # Verificar se branch já existe (fallback se houver colisão)
          if git show-ref --verify --quiet refs/heads/"$BRANCH_NAME"; then
            echo "⚠️ Branch já existe, adicionando sufixo sequencial..."
            COUNTER=1
            while git show-ref --verify --quiet refs/heads/"${BRANCH_NAME}-${COUNTER}"; do
              COUNTER=$((COUNTER + 1))
            done
            BRANCH_NAME="${BRANCH_NAME}-${COUNTER}"
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "✅ Branch criado: $BRANCH_NAME"

      # REGRA 6: Enterprise-grade - atualizar dependências baseado no tipo
      # REGRA 5: NÃO MENTIR - cada tipo deve ter comportamento distinto e bem documentado
      - name: Atualizar dependências
        env:
          # pnpm v10+: permitir execução automática de scripts de build de dependências
          # APENAS durante operações de resolução/atualização de dependências (pnpm update/install).
          # Necessário aqui porque este step executa `pnpm update` e `pnpm install --lockfile-only`.
          NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'
        run: |
          UPDATE_TYPE="${{ github.event.inputs.update_type || 'patch' }}"
          
          echo "📦 Atualizando dependências (tipo: $UPDATE_TYPE)..."
          
          # REGRA 5: NÃO MENTIR - garantir que cada tipo tenha comportamento distinto
          case "$UPDATE_TYPE" in
            "all")
              # REGRA 6: Enterprise-grade - atualizar TUDO incluindo workspaces recursivamente
              # Comando: pnpm update --latest --recursive
              # Comportamento: Atualiza todas as dependências (diretas e transitivas) e workspaces
              # para a versão mais recente disponível, ignorando ranges do package.json
              echo "🔄 Modo: ALL - Atualizando todas as dependências e workspaces recursivamente..."
              echo "   Comando: pnpm update --latest --recursive"
              pnpm update --latest --recursive
              ;;
            "major")
              # REGRA 6: Enterprise-grade - atualizar apenas dependências diretas (não workspaces)
              # Comando: pnpm update --latest
              # Comportamento: Atualiza apenas dependências diretas do package.json raiz
              # para a versão mais recente (major, minor, patch), ignorando ranges
              # NÃO atualiza workspaces nem dependências transitivas
              echo "🔄 Modo: MAJOR - Atualizando dependências diretas (major, minor, patch)..."
              echo "   Comando: pnpm update --latest"
              pnpm update --latest
              ;;
            "minor")
              # REGRA 6: Enterprise-grade - atualizar minor e patch, mas não major
              # Estratégia: Usar pnpm update com filtragem baseada em pnpm outdated
              # Comportamento: Atualiza apenas minor e patch (não major)
              echo "🔄 Modo: MINOR - Atualizando minor e patch (não major)..."
              echo "   Estratégia: pnpm outdated + filtragem semântica + pnpm update"
              
              # Obter lista de pacotes com atualizações minor/patch disponíveis
              # pnpm outdated retorna JSON com current, wanted, latest
              # wanted = versão dentro do range (minor/patch), latest = versão mais recente (pode incluir major)
              PACKAGES_TO_UPDATE=$(pnpm outdated --format json 2>/dev/null | \
                jq -r '.[] | select(.current != .wanted) | .name' | \
                tr '\n' ' ' || echo "")
              
              if [ -n "$PACKAGES_TO_UPDATE" ]; then
                echo "   Pacotes a atualizar (minor/patch): $PACKAGES_TO_UPDATE"
                # pnpm update sem --latest respeita ranges do package.json
                # Isso atualiza para 'wanted' (minor/patch), não 'latest' (que pode incluir major)
                pnpm update $PACKAGES_TO_UPDATE
              else
                echo "   Nenhum pacote com atualização minor/patch disponível"
              fi
              ;;
            *)
              # Padrão: apenas patch (mais seguro e conservador)
              # REGRA 6: Enterprise-grade - atualizar apenas patch, não minor nem major
              # Estratégia: Modificar temporariamente ranges para ~ (tilde) e depois restaurar
              echo "🔄 Modo: PATCH (padrão) - Atualizando apenas patches (não minor nem major)..."
              echo "   Estratégia: Backup package.json + conversão ranges para ~ + pnpm update + restore"
              
              # REGRA 6: Enterprise-grade - backup antes de modificar
              cp package.json package.json.backup
              
              # Converter ranges ^ (caret) para ~ (tilde) temporariamente
              # ^ permite minor e patch (^1.2.3 = >=1.2.3 <2.0.0)
              # ~ permite apenas patch (~1.2.3 = >=1.2.3 <1.3.0)
              # Isso garante que pnpm update só atualize patches
              sed -i 's/"\^/"\~/g' package.json
              
              # Atualizar apenas patches (respeitando ranges ~ agora)
              pnpm update
              
              # REGRA 6: Enterprise-grade - restaurar package.json original
              # Mantém os ranges originais ^, mas pnpm-lock.yaml foi atualizado com patches
              mv package.json.backup package.json
              
              # Executar pnpm install --lockfile-only para consolidar
              # Atualiza lock file com as versões patch instaladas, mantendo ranges originais
              pnpm install --lockfile-only
              
              echo "   ✅ Apenas patches atualizados, ranges originais (^) mantidos no package.json"
              ;;
          esac
          
          echo "✅ Dependências atualizadas"

      # REGRA 9: Validação contínua - testar após atualização
      - name: Instalar dependências atualizadas
        run: pnpm install
        env:
          # pnpm v10+: permitir execução automática de scripts de build de dependências
          # APENAS durante `pnpm install` em CI (não aplicar localmente via .npmrc).
          NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'

      - name: TypeScript Check
        run: pnpm run typecheck

      - name: Build packages
        run: pnpm run build:packages

      # REGRA 4: Aprovação obrigatória - criar commit e PR
      - name: Criar commit e PR
        if: success()
        run: |
          git add package.json pnpm-lock.yaml
          
          # Verificar se há mudanças
          if git diff --staged --quiet; then
            echo "⚠️ Nenhuma mudança detectada após atualização"
            exit 0
          fi
          
          # Criar commit
          COMMIT_MSG="chore(deps): atualizar dependências automaticamente

          - Atualização automática via GitHub Actions
          - Data: $(date +'%Y-%m-%d %H:%M:%S UTC')
          - Tipo: ${{ github.event.inputs.update_type || 'patch' }}
          
          [skip ci]"
          
          git commit -m "$COMMIT_MSG"
          
          # Push da branch
          git push origin "$BRANCH_NAME"
          
          # Criar PR usando GitHub CLI
          gh pr create \
            --title "chore(deps): Atualização automática de dependências" \
            --body "## 📦 Atualização Automática de Dependências
          
          Este PR foi criado automaticamente pelo workflow de atualização de dependências.
          
          ### Tipo de Atualização
          - **Tipo**: ${{ github.event.inputs.update_type || 'patch' }}
          - **Data**: $(date +'%Y-%m-%d %H:%M:%S UTC')
          
          ### Validações Realizadas
          - ✅ TypeScript check passou
          - ✅ Build de packages passou
          
          ### Próximos Passos
          1. Revisar as mudanças no \`package.json\` e \`pnpm-lock.yaml\`
          2. Executar testes localmente se necessário
          3. Aprovar e fazer merge após revisão
          
          ---
          *Este PR foi criado automaticamente. Por favor, revise antes de fazer merge.*
          " \
            --base main \
            --head "$BRANCH_NAME" \
            --label "dependencies,automated"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

