# =============================================================================
# GitHub Actions Workflow - CI Build & Test (OTIMIZADO)
# =============================================================================
# Descrição: Pipeline de integração contínua para Alice Enterprise Platform
#
# OTIMIZAÇÃO CRÍTICA (27/12/2025):
# - CONSOLIDAÇÃO: Builds de 8 serviços em 1 único job (era matrix → sequencial no runner único)
# - ELIMINAÇÃO: 8 setups redundantes → 1 setup único
# - RESULTADO: ~16min → ~4min (redução de 75%)
#
# REGRAS APLICADAS:
# - REGRA 6: PROIBIDO continue-on-error em steps críticos
# - REGRA 8: Qualidade obrigatória - TypeScript strict, zero any
# - REGRA 9: Validação contínua - pipeline DEVE falhar em qualquer erro
#
# SEGURANÇA (Best Practices 2025):
#   - GAP-GHACTIONS-001: Actions pinadas a SHA (supply chain security)
#   - GAP-GHACTIONS-003: Least privilege permissions
#
# Author: Fillipe Guerra
# Data: 27/12/2025
# =============================================================================

name: CI - Build & Test

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # ===========================================================================
  # Job 1: Detectar mudanças e calcular versões (SINGLE SOURCE OF TRUTH)
  # ===========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      services: ${{ steps.filter.outputs.services }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      node-version: ${{ steps.versions.outputs.node-version }}
      pnpm-version: ${{ steps.versions.outputs.pnpm-version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            services:
              - 'apps/api-gateway/**'
              - 'apps/auth-service/**'
              - 'apps/chat-service/**'
              - 'apps/gpu-manager-service/**'
              - 'apps/integrations-service/**'
              - 'apps/observability-service/**'
              - 'apps/rag-service/**'
              - 'apps/training-service/**'
            frontend:
              - 'apps/frontend-service/**'
              - 'client/**'
              - 'server/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

      - name: Calcular versões Node.js e pnpm
        id: versions
        run: |
          # Node.js LTS via API oficial (com fallback para .nvmrc)
          NODE_LTS=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          if [ -z "$NODE_LTS" ] || [ "$NODE_LTS" = "null" ]; then
            NODE_LTS=$(cat .nvmrc 2>/dev/null | tr -d '[:space:]' || echo "22")
          fi
          
          # pnpm via package.json (single source of truth)
          PNPM_VER=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          if [ -z "$PNPM_VER" ] || [ "$PNPM_VER" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!"
            exit 1
          fi
          
          echo "✅ Node.js: $NODE_LTS"
          echo "✅ pnpm: $PNPM_VER"
          echo "node-version=$NODE_LTS" >> $GITHUB_OUTPUT
          echo "pnpm-version=$PNPM_VER" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Job 2: Build, TypeCheck e Lint (CONSOLIDADO)
  # OTIMIZAÇÃO: Um único job faz tudo - elimina overhead de setup múltiplo
  # ===========================================================================
  build-and-check:
    name: Build & Typecheck
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 20
    permissions:
      contents: read
    needs: detect-changes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js e pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ needs.detect-changes.outputs.node-version }}
          pnpm-version: ${{ needs.detect-changes.outputs.pnpm-version }}
          install-dependencies: 'true'

      # Limpar artefatos de build antigos para evitar conflitos de tipos
      - name: Clean stale build artifacts
        run: |
          echo "Limpando artefatos de build antigos..."
          rm -rf packages/*/dist apps/*/dist
          rm -f packages/*/*.tsbuildinfo apps/*/*.tsbuildinfo

      # Build packages na ordem correta de dependências
      - name: Build shared packages (ordem de dependências)
        run: |
          set -e
          export NODE_OPTIONS="--max-old-space-size=8192"
          
          PACKAGES=("shared" "shared-utils" "config" "logger" "database")
          for pkg in "${PACKAGES[@]}"; do
            echo "--- Building @alice/$pkg ---"
            pushd "packages/$pkg" > /dev/null
            npx tsc -b --force
            popd > /dev/null
            test -f "packages/$pkg/dist/index.js" || (echo "ERRO: index.js não gerado" && exit 1)
          done
          echo "✅ Todos os packages buildados!"

      - name: Upload packages dist
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: packages-dist
          path: |
            packages/shared/dist
            packages/shared-utils/dist
            packages/config/dist
            packages/logger/dist
            packages/database/dist
          retention-days: 1

      - name: TypeScript Check
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

  # ===========================================================================
  # Job 3: Build de TODOS os serviços (CONSOLIDADO - runner único)
  # OTIMIZAÇÃO CRÍTICA: Era matrix de 8+1 jobs → agora 1 job único
  # Inclui: 8 microsserviços + Frontend (elimina overhead de setup duplo)
  # Best Practice 2025: Com runner único, consolidar builds maximiza eficiência
  # ===========================================================================
  build-all:
    name: Build All (Services + Frontend)
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [detect-changes, build-and-check]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js e pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ needs.detect-changes.outputs.node-version }}
          pnpm-version: ${{ needs.detect-changes.outputs.pnpm-version }}
          install-dependencies: 'true'

      - name: Download packages dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: packages-dist
          path: packages

      - name: Verify packages downloaded
        run: |
          set -e
          PACKAGES=("shared" "shared-utils" "config" "logger" "database")
          for pkg in "${PACKAGES[@]}"; do
            test -f "packages/$pkg/dist/index.js" || (echo "ERRO: $pkg não baixado" && exit 1)
          done

      # Build TODOS os microsserviços em sequência
      - name: Build all microservices
        run: |
          set -e
          export NODE_OPTIONS="--max-old-space-size=8192"
          
          SERVICES=(
            "api-gateway"
            "auth-service"
            "chat-service"
            "gpu-manager-service"
            "integrations-service"
            "observability-service"
            "rag-service"
            "training-service"
          )
          
          for service in "${SERVICES[@]}"; do
            echo ""
            echo "==========================================="
            echo "Building @alice/$service"
            echo "==========================================="
            pnpm --filter @alice/$service run build
            
            # Verificar se bundle foi gerado (exceto api-gateway e observability-service)
            if [ "$service" != "api-gateway" ] && [ "$service" != "observability-service" ]; then
              test -f "apps/$service/dist/bundle.js" || (echo "ERRO: bundle.js não gerado para $service" && exit 1)
            fi
            echo "✅ $service OK"
          done
          
          echo ""
          echo "✅ Todos os 8 microsserviços buildados!"

      # Build Frontend no mesmo job (elimina overhead de setup extra)
      - name: Build frontend
        run: |
          echo ""
          echo "==========================================="
          echo "Building Frontend"
          echo "==========================================="
          pnpm run build
          echo "✅ Frontend buildado!"
        env:
          VITE_API_URL: ""

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: frontend-dist
          path: |
            dist
            apps/frontend-service/dist
          retention-days: 1
          if-no-files-found: warn
      
      - name: Build Summary
        run: |
          echo ""
          echo "==========================================="
          echo "✅ BUILD COMPLETO - 8 serviços + Frontend"
          echo "==========================================="

  # ===========================================================================
  # Job 4: Security Scanning (Código Fonte)
  # OTIMIZAÇÃO: Trivy é binário Go - NÃO precisa de Node.js/pnpm
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    needs: detect-changes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          skip-dirs: 'node_modules/.cache,tests,docs,.git,attached_assets'
          skip-files: 'pnpm-lock.yaml,package-lock.json'

      - name: Ensure SARIF file exists
        id: ensure-sarif
        if: always()
        run: |
          if [ ! -f "trivy-results.sarif" ] || [ ! -s "trivy-results.sarif" ]; then
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.0.0"}},"results":[]}]}' > trivy-results.sarif
          fi
          jq empty trivy-results.sarif 2>/dev/null || exit 1
          echo "sarif_exists=true" >> $GITHUB_OUTPUT

      - name: Check if Code Scanning is enabled
        id: check-code-scanning
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const res = await github.request('GET /repos/{owner}/{repo}', {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const isPublic = res.data.visibility === 'public';
              let enabled = isPublic;
              if (!isPublic) {
                try {
                  await github.request('GET /repos/{owner}/{repo}/code-scanning/alerts', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    per_page: 1
                  });
                  enabled = true;
                } catch (e) {
                  enabled = false;
                }
              }
              core.setOutput('enabled', enabled ? 'true' : 'false');
            } catch (e) {
              core.setOutput('enabled', 'false');
            }

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        if: always() && steps.check-code-scanning.outputs.enabled == 'true' && steps.ensure-sarif.outputs.sarif_exists == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always()
        with:
          name: trivy-security-scan
          path: trivy-results.sarif
          retention-days: 30

  # ===========================================================================
  # Job 6: Enterprise Compliance Checks
  # OTIMIZAÇÃO: NÃO precisa de pnpm install - apenas verifica arquivos
  # ===========================================================================
  compliance-checks:
    name: Enterprise Compliance
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 5
    permissions:
      contents: read
    needs: detect-changes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check for hardcoded secrets
        run: |
          set -e
          echo "Verificando secrets hardcoded..."
          
          PATTERNS=(
            'password\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'api[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'secret[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'OPENAI_API_KEY\s*[=:]\s*["\047]sk-'
            'DATABASE_URL\s*[=:]\s*["\047]postgres://'
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" apps/ packages/ --include="*.ts" --include="*.js" 2>/dev/null | grep -v "node_modules" | grep -v ".test."; then
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            echo "ERRO: Secrets hardcoded detectados!"
            exit 1
          fi
          echo "✅ Nenhum secret hardcoded"

      - name: Verify RLS migrations exist
        run: |
          set -e
          test -f "migrations/0001_rls_security_enterprise.sql" || (echo "ERRO: Migração RLS não encontrada" && exit 1)
          grep -q "CREATE POLICY\|ENABLE ROW LEVEL SECURITY" migrations/0001_rls_security_enterprise.sql || \
            (echo "ERRO: Policies RLS não encontradas" && exit 1)
          echo "✅ Migrações RLS verificadas"

      - name: Verify Express hardening in all services
        run: |
          set -e
          SERVICES=(
            "apps/auth-service/src/index.ts"
            "apps/chat-service/src/index.ts"
            "apps/rag-service/src/index.ts"
            "apps/training-service/src/index.ts"
            "apps/integrations-service/src/index.ts"
            "apps/api-gateway/src/index.ts"
            "apps/observability-service/src/index.ts"
          )
          
          for service in "${SERVICES[@]}"; do
            if [ -f "$service" ]; then
              if ! grep -q "@alice/shared-utils" "$service" || ! grep -q "createSecurityMiddleware\|createRateLimiter" "$service"; then
                echo "ERRO: $service sem express-hardening!"
                exit 1
              fi
            fi
          done
          echo "✅ Express hardening verificado"

      - name: Verify server timeouts
        run: |
          set -e
          SERVICES=(
            "apps/auth-service/src/index.ts"
            "apps/chat-service/src/index.ts"
            "apps/rag-service/src/index.ts"
            "apps/training-service/src/index.ts"
            "apps/integrations-service/src/index.ts"
            "apps/api-gateway/src/index.ts"
            "apps/observability-service/src/index.ts"
          )
          
          for service in "${SERVICES[@]}"; do
            if [ -f "$service" ]; then
              if ! grep -q "server.timeout" "$service" || ! grep -q "keepAliveTimeout" "$service" || ! grep -q "headersTimeout" "$service"; then
                echo "ERRO: $service sem timeouts!"
                exit 1
              fi
            fi
          done
          echo "✅ Server timeouts verificados"

  # ===========================================================================
  # Job 7: Trigger Release Automático
  # OTIMIZAÇÃO: NÃO precisa de setup Node/pnpm - apenas usa git e GitHub API
  # ===========================================================================
  trigger-release:
    name: Trigger Release
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    needs: [build-and-check, build-all, security-scan, compliance-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-check.result == 'success' && needs.build-all.result == 'success' && needs.security-scan.result == 'success' && needs.compliance-checks.result == 'success'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Calcular proxima versao
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LAST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1 | grep -E '^[0-9]+$' || echo "0")
          MINOR=$(echo $VERSION | cut -d. -f2 | grep -E '^[0-9]+$' || echo "0")
          PATCH=$(echo $VERSION | cut -d. -f3 | cut -d- -f1 | grep -E '^[0-9]+$' || echo "0")
          NEW_PATCH=$((10#$PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Próxima versão: $NEW_VERSION"

      - name: Disparar Release Workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                version: '${{ steps.version.outputs.version }}',
                prerelease: 'false'
              }
            });
            console.log('🚀 Release ${{ steps.version.outputs.version }} disparado!');
