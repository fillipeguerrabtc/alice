# =============================================================================
# GitHub Actions Workflow - CI Build & Test
# =============================================================================
# Descrição: Pipeline de integração contínua para Alice Enterprise Platform
# Usa pnpm (pnpm-lock.yaml) para gerenciamento de dependências
# 
# REGRA 6 (replit.md): PROIBIDO continue-on-error em steps críticos
# REGRA 8: Qualidade obrigatória - TypeScript strict, zero any
# REGRA 9: Validação contínua - pipeline DEVE falhar em qualquer erro
# =============================================================================

name: CI - Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.12.4'
  # Aumentar memória do Node.js para evitar "JavaScript heap out of memory"
  # durante TypeScript compilation de monorepos grandes (8GB)
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # ===========================================================================
  # Job 1: Detectar mudanças para otimizar builds
  # ===========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      services: ${{ steps.filter.outputs.services }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            services:
              - 'apps/api-gateway/**'
              - 'apps/auth-service/**'
              - 'apps/chat-service/**'
              - 'apps/clip-inference-service/**'
              - 'apps/integrations-service/**'
              - 'apps/observability-service/**'
              - 'apps/rag-service/**'
              - 'apps/training-service/**'
            frontend:
              - 'apps/frontend-service/**'
              - 'client/**'
              - 'server/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  # ===========================================================================
  # Job 2: Build & TypeCheck (CRÍTICO - NÃO pode falhar silenciosamente)
  # ===========================================================================
  build-and-check:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Limpar artefatos de build antigos para evitar conflitos de tipos
      # CRÍTICO: Arquivos .d.ts compilados contra versões antigas do drizzle-orm
      # podem causar erros de tipos incompatíveis (shouldInlineParams)
      - name: Clean stale build artifacts
        run: |
          set -e
          echo "Limpando artefatos de build antigos..."
          rm -rf packages/*/dist apps/*/dist
          rm -f packages/*/*.tsbuildinfo apps/*/*.tsbuildinfo
          echo "Artefatos limpos com sucesso!"

      # Build packages na ordem correta de dependências
      # CRÍTICO: Sem isso, os microsserviços não conseguem importar @alice/*
      # NOTA: Usamos --force para garantir que .js sejam gerados mesmo se .tsbuildinfo existir
      # NOTA: NODE_OPTIONS aumenta memória para evitar heap out of memory em monorepos grandes
      - name: Build shared packages (ordem de dependências)
        run: |
          set -e
          export NODE_OPTIONS="--max-old-space-size=8192"
          
          echo "Limpando builds anteriores..."
          rm -rf packages/shared/dist packages/shared-utils/dist packages/config/dist packages/logger/dist packages/database/dist
          rm -f packages/*/tsconfig.tsbuildinfo packages/*/*.tsbuildinfo
          
          echo "Building packages na ordem correta (com --force, 4GB heap)..."
          
          # Build cada package individualmente com verificação de erro
          PACKAGES=("shared" "shared-utils" "config" "logger" "database")
          for pkg in "${PACKAGES[@]}"; do
            echo "--- Building @alice/$pkg ---"
            pushd "packages/$pkg" > /dev/null
            NODE_OPTIONS="--max-old-space-size=8192" npx tsc -b --force
            if [ $? -ne 0 ]; then
              echo "ERRO: Build de @alice/$pkg falhou!"
              exit 1
            fi
            popd > /dev/null
            
            # Verificar se .js foi gerado
            if [ ! -f "packages/$pkg/dist/index.js" ]; then
              echo "ERRO: packages/$pkg/dist/index.js não foi gerado!"
              exit 1
            fi
            echo "packages/$pkg/dist/index.js gerado com sucesso"
          done
          
          echo "Todos os packages buildados com sucesso!"

      # Upload artefatos dos packages para jobs subsequentes
      - name: Upload packages dist
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: |
            packages/shared/dist
            packages/shared-utils/dist
            packages/config/dist
            packages/logger/dist
            packages/database/dist
          retention-days: 1

      # TypeScript Check - DEVE falhar se houver erros
      # NOTA: NODE_OPTIONS aumenta memória para evitar heap out of memory
      - name: TypeScript Check
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run typecheck

      # ESLint - DEVE falhar se houver erros
      - name: ESLint
        run: pnpm run lint

  # ===========================================================================
  # Job 3: Build de microsserviços Node.js (MATRIX)
  # NOTA: clip-inference-service é Python e tem job separado
  # ===========================================================================
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-check
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - chat-service
          - integrations-service
          - observability-service
          - rag-service
          - training-service
      # CRÍTICO: fail-fast: true para parar imediatamente em erro
      fail-fast: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Download packages compilados do job anterior
      # NOTA: upload-artifact@v4 remove o prefixo comum (packages/) então baixamos em packages/
      # Estrutura no artefato: shared/dist/, shared-utils/dist/, etc.
      # Após download em packages/: packages/shared/dist/, packages/shared-utils/dist/, etc.
      - name: Download packages dist
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Verify packages downloaded
        run: |
          set -e
          echo "Verificando packages baixados..."
          
          # Listar estrutura para debug
          echo "Estrutura após download:"
          find packages -name "*.js" -type f 2>/dev/null | head -10 || echo "Nenhum .js encontrado em packages/"
          
          # Verificar arquivos necessários
          PACKAGES=("shared" "shared-utils" "config" "logger" "database")
          for pkg in "${PACKAGES[@]}"; do
            if [ ! -f "packages/$pkg/dist/index.js" ]; then
              echo "ERRO: packages/$pkg/dist/index.js não baixado!"
              echo "Conteúdo de packages/$pkg:"
              ls -la "packages/$pkg/" 2>/dev/null || echo "Diretório não existe"
              exit 1
            fi
            echo "packages/$pkg/dist/index.js OK"
          done

      # Build do serviço com esbuild - DEVE falhar se imports falharem
      - name: Build service bundle
        run: |
          set -e
          echo "Building ${{ matrix.service }}..."
          pnpm --filter @alice/${{ matrix.service }} run build
          
          # Verificar se bundle foi gerado (exceto api-gateway e observability que usam tsc)
          if [ "${{ matrix.service }}" != "api-gateway" ] && [ "${{ matrix.service }}" != "observability-service" ]; then
            echo "Verificando bundle gerado..."
            test -f apps/${{ matrix.service }}/dist/bundle.js || (echo "ERRO: bundle.js não gerado" && exit 1)
          fi
          echo "Build de ${{ matrix.service }} concluído com sucesso!"

  # ===========================================================================
  # Job 3b: Build de microsserviço Python (CLIP Inference)
  # ===========================================================================
  build-clip-inference:
    name: Build clip-inference-service (Python)
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/clip-inference-service/requirements.txt'

      - name: Install dependencies
        run: |
          set -e
          cd apps/clip-inference-service
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          set -e
          cd apps/clip-inference-service
          python -m py_compile server.py
          echo "clip-inference-service: Sintaxe Python válida!"

  # ===========================================================================
  # Job 4: Build Frontend
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build frontend - DEVE falhar se houver erros
      - name: Build frontend
        run: pnpm run build
        env:
          VITE_API_URL: ""

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            dist
            apps/frontend-service/dist
          retention-days: 1
          if-no-files-found: warn

  # ===========================================================================
  # Job 5: Security Scanning
  # CRÍTICO: exit-code: '1' para bloquear CI em vulnerabilidades CRITICAL/HIGH
  # Regra 6 (replit.md): PROIBIDO workarounds - vulnerabilidades devem ser corrigidas
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Ignorar diretórios que não vão para produção
          skip-dirs: 'node_modules/.cache,tests,docs,.git,attached_assets'
          # Ignorar arquivos de lock e configuração
          skip-files: 'pnpm-lock.yaml,package-lock.json'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ===========================================================================
  # Job 6: Enterprise Compliance Checks
  # ===========================================================================
  compliance-checks:
    name: Enterprise Compliance
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          set -e
          echo "Verificando secrets hardcoded..."
          
          PATTERNS=(
            'password\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'api[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'secret[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'OPENAI_API_KEY\s*[=:]\s*["\047]sk-'
            'DATABASE_URL\s*[=:]\s*["\047]postgres://'
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" apps/ packages/ --include="*.ts" --include="*.js" 2>/dev/null | grep -v "node_modules" | grep -v ".test."; then
              echo "ALERTA: Possível secret hardcoded encontrado!"
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            echo "ERRO: Secrets hardcoded detectados - favor remover!"
            exit 1
          else
            echo "Nenhum secret hardcoded detectado"
          fi

      - name: Verify RLS migrations exist
        run: |
          set -e
          echo "Verificando migrações RLS..."
          
          if [ -f "drizzle/migrations/0001_rls_security_enterprise.sql" ]; then
            echo "Migração RLS encontrada"
            if grep -q "CREATE POLICY\|ENABLE ROW LEVEL SECURITY" drizzle/migrations/0001_rls_security_enterprise.sql; then
              echo "Policies RLS configuradas corretamente"
            else
              echo "ERRO: Policies RLS não encontradas na migração"
              exit 1
            fi
          else
            echo "ERRO: Migração RLS não encontrada em drizzle/migrations/"
            exit 1
          fi

      - name: Verify Express hardening in all services
        run: |
          set -e
          echo "Verificando express-hardening em microsserviços..."
          
          SERVICES=(
            "apps/auth-service/src/index.ts"
            "apps/chat-service/src/index.ts"
            "apps/rag-service/src/index.ts"
            "apps/training-service/src/index.ts"
            "apps/integrations-service/src/index.ts"
            "apps/api-gateway/src/index.ts"
            "apps/observability-service/src/index.ts"
          )
          
          MISSING=0
          for service in "${SERVICES[@]}"; do
            if [ -f "$service" ]; then
              if grep -q "@alice/shared-utils" "$service" && grep -q "createSecurityMiddleware\|createRateLimiter" "$service"; then
                echo "$service: Express hardening configurado"
              else
                echo "ALERTA: $service sem express-hardening!"
                MISSING=1
              fi
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo "ERRO: Serviços sem express-hardening detectados"
            exit 1
          fi

      - name: Verify server timeouts
        run: |
          set -e
          echo "Verificando server timeouts (Node.js 20 LTS)..."
          
          SERVICES=(
            "apps/auth-service/src/index.ts"
            "apps/chat-service/src/index.ts"
            "apps/rag-service/src/index.ts"
            "apps/training-service/src/index.ts"
            "apps/integrations-service/src/index.ts"
            "apps/api-gateway/src/index.ts"
            "apps/observability-service/src/index.ts"
          )
          
          for service in "${SERVICES[@]}"; do
            if [ -f "$service" ]; then
              if grep -q "server.timeout" "$service" && grep -q "keepAliveTimeout" "$service" && grep -q "headersTimeout" "$service"; then
                echo "$service: Timeouts configurados"
              else
                echo "ALERTA: $service sem timeouts configurados!"
                exit 1
              fi
            fi
          done

  # ===========================================================================
  # Job 8: CI Final Status - VERIFICA TODOS OS JOBS
  # ===========================================================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build-and-check, build-services, build-clip-inference, build-frontend, security-scan, compliance-checks]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "=============================================="
          echo "Resumo do CI - Alice Enterprise Platform"
          echo "=============================================="
          echo "Build & Check:      ${{ needs.build-and-check.result }}"
          echo "Build Services:     ${{ needs.build-services.result }}"
          echo "Build CLIP (Python):${{ needs.build-clip-inference.result }}"
          echo "Build Frontend:     ${{ needs.build-frontend.result }}"
          echo "Security Scan:      ${{ needs.security-scan.result }}"
          echo "Compliance:         ${{ needs.compliance-checks.result }}"
          echo "=============================================="
          
          # CRÍTICO: Verificar TODOS os jobs obrigatórios
          if [[ "${{ needs.build-and-check.result }}" == "failure" ]]; then
            echo "ERRO: Build & Check falhou!"
            exit 1
          fi
          
          if [[ "${{ needs.build-services.result }}" == "failure" ]]; then
            echo "ERRO: Build Services (Node.js) falhou!"
            exit 1
          fi
          
          if [[ "${{ needs.build-clip-inference.result }}" == "failure" ]]; then
            echo "ERRO: Build CLIP Inference (Python) falhou!"
            exit 1
          fi
          
          if [[ "${{ needs.build-frontend.result }}" == "failure" ]]; then
            echo "ERRO: Build Frontend falhou!"
            exit 1
          fi
          
          if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "ERRO: Security Scan falhou!"
            exit 1
          fi
          
          if [[ "${{ needs.compliance-checks.result }}" == "failure" ]]; then
            echo "ERRO: Compliance Checks falhou!"
            exit 1
          fi
          
          echo "CI passou com sucesso!"
