# =============================================================================
# GitHub Actions Workflow - CI Build & Test
# =============================================================================
# Descrição: Pipeline de integração contínua para Alice Enterprise Platform
# Usa pnpm (pnpm-lock.yaml) para gerenciamento de dependências
# 
# REGRA 6 (CLAUDE.md): PROIBIDO continue-on-error em steps críticos
# REGRA 8: Qualidade obrigatória - TypeScript strict, zero any
# REGRA 9: Validação contínua - pipeline DEVE falhar em qualquer erro
#
# SEGURANÇA (Best Practices 2025):
#   - GAP-GHACTIONS-001: Actions pinadas a SHA (supply chain security)
#   - GAP-GHACTIONS-003: Least privilege permissions
# =============================================================================

name: CI - Build & Test

on:
  # Execução somente em push no main (fluxo sem PR)
  push:
    branches: [main]

# GAP-GHACTIONS-003: Least privilege - permissões definidas por job
# REGRA 14: Verificar secrets - cada job define apenas as permissões necessárias
# Isso elimina warnings do GitHub Actions sobre permissões globais excessivas

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # REGRA 6: Enterprise-grade - versionamento automático (não hardcoded)
  # NODE_VERSION será lido automaticamente do .nvmrc ou API do Node.js
  # PNPM_VERSION será lido automaticamente do package.json (packageManager field)
  # Aumentar memória do Node.js para evitar "JavaScript heap out of memory"
  # durante TypeScript compilation de monorepos grandes (8GB)
  NODE_OPTIONS: '--max-old-space-size=8192'
  # NOTA (enterprise): NÃO definir NPM_CONFIG_* globalmente para evitar warnings do npm/npx.
  # Esta env é aplicada apenas nos steps que executam `pnpm install`.

jobs:
  # ===========================================================================
  # Job 1: Detectar mudanças para otimizar builds
  # ===========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em problemas de rede
    timeout-minutes: 10
    # GAP-GHACTIONS-003: Least privilege - apenas permissões necessárias
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      services: ${{ steps.filter.outputs.services }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # SHA: dorny/paths-filter@v3.0.2 - Supply Chain Security
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
            services:
              - 'apps/api-gateway/**'
              - 'apps/auth-service/**'
              - 'apps/chat-service/**'
              - 'apps/gpu-manager-service/**'
              - 'apps/integrations-service/**'
              - 'apps/observability-service/**'
              - 'apps/rag-service/**'
              - 'apps/training-service/**'
            frontend:
              - 'apps/frontend-service/**'
              - 'client/**'
              - 'server/**'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  # ===========================================================================
  # Job 2: Build & TypeCheck (CRÍTICO - NÃO pode falhar silenciosamente)
  # ===========================================================================
  build-and-check:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em problemas de rede
    timeout-minutes: 20
    # GAP-GHACTIONS-003: Least privilege - apenas permissões necessárias
    permissions:
      contents: read
    needs: detect-changes
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Enterprise: Fallback automático para mirror se npm registry estiver instável (500/503)
      # Regra 16: Melhores práticas - resiliência com fallback automático
      - name: Configure npm registry fallback
        run: |
          echo "Verificando disponibilidade do npm registry..."
          if ! curl -sf --max-time 10 https://registry.npmjs.org/pnpm > /dev/null 2>&1; then
            echo "⚠️ npm registry instável, configurando mirror npmmirror.com..."
            npm config set registry https://registry.npmmirror.com/
            echo "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/" >> $GITHUB_ENV
          else
            echo "✅ npm registry oficial disponível"
          fi

      # REGRA 6: Enterprise-grade - versionamento automático do Node.js LTS
      # Buscar versão LTS mais recente via API oficial do Node.js
      # Fallback para .nvmrc se API falhar
      # REGRA 11: Melhores práticas GitHub Actions 2025 - versionamento automático
      - name: Buscar versão LTS do Node.js
        id: node-version
        run: |
          # REGRA 6: Enterprise-grade - buscar versão LTS mais recente via API oficial
          # API: https://nodejs.org/dist/index.json retorna todas as versões
          # Filtrar apenas versões LTS (lts !== null)
          echo "🔍 Buscando versão LTS mais recente do Node.js..."
          
          NODE_LTS_VERSION=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          # REGRA 6: Enterprise-grade - fallback para .nvmrc se API falhar
          if [ -z "$NODE_LTS_VERSION" ] || [ "$NODE_LTS_VERSION" = "null" ]; then
            echo "⚠️ AVISO: Falha ao buscar versão LTS da API, usando fallback do .nvmrc" >&2
            if [ -f ".nvmrc" ]; then
              NODE_LTS_VERSION=$(cat .nvmrc | tr -d '[:space:]')
              echo "✅ Versão do Node.js lida do .nvmrc: $NODE_LTS_VERSION"
            else
              echo "::error::Arquivo .nvmrc não encontrado e API falhou!" >&2
              exit 1
            fi
          else
            echo "✅ Versão LTS do Node.js encontrada via API: $NODE_LTS_VERSION"
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X ou X.Y)
          if ! echo "$NODE_LTS_VERSION" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versão do Node.js em formato inválido: '$NODE_LTS_VERSION'. Deve ser X ou X.Y" >&2
            exit 1
          fi
          
          echo "version=$NODE_LTS_VERSION" >> $GITHUB_OUTPUT
          echo "NODE_VERSION=$NODE_LTS_VERSION" >> $GITHUB_ENV

      # REGRA 6: Enterprise-grade - versionamento automático do pnpm
      # Ler versão do package.json (packageManager field) - single source of truth
      # REGRA 11: Melhores práticas GitHub Actions 2025 - versionamento automático
      - name: Ler versão do pnpm do package.json
        id: pnpm-version
        run: |
          # REGRA 6: Enterprise-grade - validar que package.json existe
          if [ ! -f "package.json" ]; then
            echo "::error::Arquivo package.json não encontrado!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - usar jq para parsing JSON (não grep regex)
          PNPM_VERSION=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          
          # REGRA 6: Enterprise-grade - validar que versão foi encontrada
          if [ -z "$PNPM_VERSION" ] || [ "$PNPM_VERSION" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X.Y.Z)
          if ! echo "$PNPM_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão do pnpm em formato inválido: '$PNPM_VERSION'. Deve ser X.Y.Z" >&2
            exit 1
          fi
          
          echo "✅ Versão do pnpm lida do package.json: $PNPM_VERSION"
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "PNPM_VERSION=$PNPM_VERSION" >> $GITHUB_ENV

      # pnpm/action-setup - organização oficial pnpm (verificada)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # SHA: actions/setup-node@v4.1.0 (2024-10-24) - Supply Chain Security
      # NOTA: Removido cache: 'pnpm' - usamos actions/cache explícito para melhor controle
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # Enterprise: Configurar store path explícito para cache consistente
      - name: Configurar pnpm store path
        id: pnpm_store_path
        run: |
          STORE_DIR="$HOME/.pnpm-store"
          echo "store-dir=$STORE_DIR" >> "$GITHUB_OUTPUT"
          pnpm config set store-dir "$STORE_DIR"

      # SHA: actions/cache@v4.2.0 - Cache explícito com restore-keys para fallback
      - name: Restaurar cache do pnpm
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ steps.pnpm_store_path.outputs.store-dir }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # pnpm v10+: permitir execução automática de scripts de build de dependências
          # APENAS durante `pnpm install` em CI (não aplicar localmente via .npmrc).
          NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'

      # Limpar artefatos de build antigos para evitar conflitos de tipos
      # CRÍTICO: Arquivos .d.ts compilados contra versões antigas do drizzle-orm
      # podem causar erros de tipos incompatíveis (shouldInlineParams)
      - name: Clean stale build artifacts
        run: |
          set -e
          echo "Limpando artefatos de build antigos..."
          rm -rf packages/*/dist apps/*/dist
          rm -f packages/*/*.tsbuildinfo apps/*/*.tsbuildinfo
          echo "Artefatos limpos com sucesso!"

      # Build packages na ordem correta de dependências
      # CRÍTICO: Sem isso, os microsserviços não conseguem importar @alice/*
      # NOTA: Usamos --force para garantir que .js sejam gerados mesmo se .tsbuildinfo existir
      # NOTA: NODE_OPTIONS aumenta memória para evitar heap out of memory em monorepos grandes
      - name: Build shared packages (ordem de dependências)
        run: |
          set -e
          export NODE_OPTIONS="--max-old-space-size=8192"
          
          echo "Limpando builds anteriores..."
          rm -rf packages/shared/dist packages/shared-utils/dist packages/config/dist packages/logger/dist packages/database/dist
          rm -f packages/*/tsconfig.tsbuildinfo packages/*/*.tsbuildinfo
          
          echo "Building packages na ordem correta (com --force, 4GB heap)..."
          
          # Build cada package individualmente com verificação de erro
          PACKAGES=("shared" "shared-utils" "config" "logger" "database")
          for pkg in "${PACKAGES[@]}"; do
            echo "--- Building @alice/$pkg ---"
            pushd "packages/$pkg" > /dev/null
            NODE_OPTIONS="--max-old-space-size=8192" npx tsc -b --force
            if [ $? -ne 0 ]; then
              echo "ERRO: Build de @alice/$pkg falhou!"
              exit 1
            fi
            popd > /dev/null
            
            # Verificar se .js foi gerado
            if [ ! -f "packages/$pkg/dist/index.js" ]; then
              echo "ERRO: packages/$pkg/dist/index.js não foi gerado!"
              exit 1
            fi
            echo "packages/$pkg/dist/index.js gerado com sucesso"
          done
          
          echo "Todos os packages buildados com sucesso!"

      # SHA: actions/upload-artifact@v4.6.0 (2024-12-18) - Supply Chain Security
      - name: Upload packages dist
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: packages-dist
          path: |
            packages/shared/dist
            packages/shared-utils/dist
            packages/config/dist
            packages/logger/dist
            packages/database/dist
          retention-days: 1

      # TypeScript Check - DEVE falhar se houver erros
      # NOTA: NODE_OPTIONS aumenta memória para evitar heap out of memory
      - name: TypeScript Check
        run: NODE_OPTIONS="--max-old-space-size=8192" pnpm run typecheck

      # ESLint - DEVE falhar se houver erros
      - name: ESLint
        run: pnpm run lint

  # ===========================================================================
  # Job 3: Build de microsserviços Node.js (MATRIX)
  # NOTA: clip-inference-service é Python e tem job separado
  # ===========================================================================
  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em problemas de rede
    timeout-minutes: 15
    # GAP-GHACTIONS-003: Least privilege - apenas permissões necessárias
    permissions:
      contents: read
    needs: build-and-check
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - chat-service
          - integrations-service
          - observability-service
          - rag-service
          - training-service
      # CRÍTICO: fail-fast: true para parar imediatamente em erro
      fail-fast: true
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Enterprise: Fallback automático para mirror se npm registry estiver instável (500/503)
      - name: Configure npm registry fallback
        run: |
          if ! curl -sf --max-time 10 https://registry.npmjs.org/pnpm > /dev/null 2>&1; then
            echo "⚠️ npm registry instável, usando mirror npmmirror.com"
            npm config set registry https://registry.npmmirror.com/
            echo "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/" >> $GITHUB_ENV
          fi

      # REGRA 6: Enterprise-grade - versionamento automático do Node.js LTS
      # Buscar versão LTS mais recente via API oficial do Node.js
      # Fallback para .nvmrc se API falhar
      - name: Buscar versão LTS do Node.js
        id: node-version
        run: |
          # REGRA 6: Enterprise-grade - buscar versão LTS mais recente via API oficial
          echo "🔍 Buscando versão LTS mais recente do Node.js..."
          
          NODE_LTS_VERSION=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          # REGRA 6: Enterprise-grade - fallback para .nvmrc se API falhar
          if [ -z "$NODE_LTS_VERSION" ] || [ "$NODE_LTS_VERSION" = "null" ]; then
            echo "⚠️ AVISO: Falha ao buscar versão LTS da API, usando fallback do .nvmrc" >&2
            if [ -f ".nvmrc" ]; then
              NODE_LTS_VERSION=$(cat .nvmrc | tr -d '[:space:]')
              echo "✅ Versão do Node.js lida do .nvmrc: $NODE_LTS_VERSION"
            else
              echo "::error::Arquivo .nvmrc não encontrado e API falhou!" >&2
              exit 1
            fi
          else
            echo "✅ Versão LTS do Node.js encontrada via API: $NODE_LTS_VERSION"
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X ou X.Y)
          if ! echo "$NODE_LTS_VERSION" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versão do Node.js em formato inválido: '$NODE_LTS_VERSION'. Deve ser X ou X.Y" >&2
            exit 1
          fi
          
          echo "version=$NODE_LTS_VERSION" >> $GITHUB_OUTPUT
          echo "NODE_VERSION=$NODE_LTS_VERSION" >> $GITHUB_ENV

      # REGRA 6: Enterprise-grade - usar versão do package.json (já lida no job build-and-check)
      # Reutilizar versão do job anterior via artifact ou ler novamente
      - name: Ler versão do pnpm do package.json
        id: pnpm-version
        run: |
          # REGRA 6: Enterprise-grade - validar que package.json existe
          if [ ! -f "package.json" ]; then
            echo "::error::Arquivo package.json não encontrado!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - usar jq para parsing JSON (não grep regex)
          PNPM_VERSION=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          
          # REGRA 6: Enterprise-grade - validar que versão foi encontrada
          if [ -z "$PNPM_VERSION" ] || [ "$PNPM_VERSION" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X.Y.Z)
          if ! echo "$PNPM_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão do pnpm em formato inválido: '$PNPM_VERSION'. Deve ser X.Y.Z" >&2
            exit 1
          fi
          
          echo "✅ Versão do pnpm lida do package.json: $PNPM_VERSION"
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "PNPM_VERSION=$PNPM_VERSION" >> $GITHUB_ENV

      # pnpm/action-setup - organização oficial pnpm (verificada)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # SHA: actions/setup-node@v4.1.0 (2024-10-24) - Supply Chain Security
      # NOTA: Removido cache: 'pnpm' - usamos actions/cache explícito para melhor controle
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # Enterprise: Configurar store path explícito para cache consistente
      - name: Configurar pnpm store path
        id: pnpm_store_path
        run: |
          STORE_DIR="$HOME/.pnpm-store"
          echo "store-dir=$STORE_DIR" >> "$GITHUB_OUTPUT"
          pnpm config set store-dir "$STORE_DIR"

      # SHA: actions/cache@v4.2.0 - Cache explícito com restore-keys para fallback
      - name: Restaurar cache do pnpm
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ steps.pnpm_store_path.outputs.store-dir }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # pnpm v10+: permitir execução automática de scripts de build de dependências
          # APENAS durante `pnpm install` em CI (não aplicar localmente via .npmrc).
          NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'

      # Download packages compilados do job anterior
      # NOTA: upload-artifact@v4 remove o prefixo comum (packages/) então baixamos em packages/
      # Estrutura no artefato: shared/dist/, shared-utils/dist/, etc.
      # Após download em packages/: packages/shared/dist/, packages/shared-utils/dist/, etc.
      # SHA: actions/download-artifact@v4.1.8 (2024-09-08) - Supply Chain Security
      - name: Download packages dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: packages-dist
          path: packages

      - name: Verify packages downloaded
        run: |
          set -e
          echo "Verificando packages baixados..."
          
          # Listar estrutura para debug
          echo "Estrutura após download:"
          find packages -name "*.js" -type f 2>/dev/null | head -10 || echo "Nenhum .js encontrado em packages/"
          
          # Verificar arquivos necessários
          PACKAGES=("shared" "shared-utils" "config" "logger" "database")
          for pkg in "${PACKAGES[@]}"; do
            if [ ! -f "packages/$pkg/dist/index.js" ]; then
              echo "ERRO: packages/$pkg/dist/index.js não baixado!"
              echo "Conteúdo de packages/$pkg:"
              ls -la "packages/$pkg/" 2>/dev/null || echo "Diretório não existe"
              exit 1
            fi
            echo "packages/$pkg/dist/index.js OK"
          done

      # Build do serviço com esbuild - DEVE falhar se imports falharem
      - name: Build service bundle
        run: |
          set -e
          echo "Building ${{ matrix.service }}..."
          pnpm --filter @alice/${{ matrix.service }} run build
          
          # Verificar se bundle foi gerado (exceto api-gateway e observability que usam tsc)
          if [ "${{ matrix.service }}" != "api-gateway" ] && [ "${{ matrix.service }}" != "observability-service" ]; then
            echo "Verificando bundle gerado..."
            test -f apps/${{ matrix.service }}/dist/bundle.js || (echo "ERRO: bundle.js não gerado" && exit 1)
          fi
          echo "Build de ${{ matrix.service }} concluído com sucesso!"

  # ===========================================================================
  # Job 4: Build Frontend
  # NOTA: clip-inference-service foi migrado 100% para Salad Cloud GPU (19/12/2025)
  # O processamento de embeddings de imagem agora usa OpenCLIP via Salad Cloud API
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em problemas de rede
    timeout-minutes: 15
    # GAP-GHACTIONS-003: Least privilege - apenas permissões necessárias
    permissions:
      contents: read
    needs: build-and-check
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Enterprise: Fallback automático para mirror se npm registry estiver instável (500/503)
      - name: Configure npm registry fallback
        run: |
          if ! curl -sf --max-time 10 https://registry.npmjs.org/pnpm > /dev/null 2>&1; then
            echo "⚠️ npm registry instável, usando mirror npmmirror.com"
            npm config set registry https://registry.npmmirror.com/
            echo "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/" >> $GITHUB_ENV
          fi

      # REGRA 6: Enterprise-grade - versionamento automático do Node.js LTS
      # Buscar versão LTS mais recente via API oficial do Node.js
      # Fallback para .nvmrc se API falhar
      - name: Buscar versão LTS do Node.js
        id: node-version
        run: |
          # REGRA 6: Enterprise-grade - buscar versão LTS mais recente via API oficial
          echo "🔍 Buscando versão LTS mais recente do Node.js..."
          
          NODE_LTS_VERSION=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          # REGRA 6: Enterprise-grade - fallback para .nvmrc se API falhar
          if [ -z "$NODE_LTS_VERSION" ] || [ "$NODE_LTS_VERSION" = "null" ]; then
            echo "⚠️ AVISO: Falha ao buscar versão LTS da API, usando fallback do .nvmrc" >&2
            if [ -f ".nvmrc" ]; then
              NODE_LTS_VERSION=$(cat .nvmrc | tr -d '[:space:]')
              echo "✅ Versão do Node.js lida do .nvmrc: $NODE_LTS_VERSION"
            else
              echo "::error::Arquivo .nvmrc não encontrado e API falhou!" >&2
              exit 1
            fi
          else
            echo "✅ Versão LTS do Node.js encontrada via API: $NODE_LTS_VERSION"
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X ou X.Y)
          if ! echo "$NODE_LTS_VERSION" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versão do Node.js em formato inválido: '$NODE_LTS_VERSION'. Deve ser X ou X.Y" >&2
            exit 1
          fi
          
          echo "version=$NODE_LTS_VERSION" >> $GITHUB_OUTPUT
          echo "NODE_VERSION=$NODE_LTS_VERSION" >> $GITHUB_ENV

      # REGRA 6: Enterprise-grade - usar versão do package.json (já lida no job build-and-check)
      # Reutilizar versão do job anterior via artifact ou ler novamente
      - name: Ler versão do pnpm do package.json
        id: pnpm-version
        run: |
          # REGRA 6: Enterprise-grade - validar que package.json existe
          if [ ! -f "package.json" ]; then
            echo "::error::Arquivo package.json não encontrado!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - usar jq para parsing JSON (não grep regex)
          PNPM_VERSION=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          
          # REGRA 6: Enterprise-grade - validar que versão foi encontrada
          if [ -z "$PNPM_VERSION" ] || [ "$PNPM_VERSION" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X.Y.Z)
          if ! echo "$PNPM_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão do pnpm em formato inválido: '$PNPM_VERSION'. Deve ser X.Y.Z" >&2
            exit 1
          fi
          
          echo "✅ Versão do pnpm lida do package.json: $PNPM_VERSION"
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "PNPM_VERSION=$PNPM_VERSION" >> $GITHUB_ENV

      # pnpm/action-setup - organização oficial pnpm (verificada)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # SHA: actions/setup-node@v4.1.0 (2024-10-24) - Supply Chain Security
      # NOTA: Removido cache: 'pnpm' - usamos actions/cache explícito para melhor controle
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # Enterprise: Configurar store path explícito para cache consistente
      - name: Configurar pnpm store path
        id: pnpm_store_path
        run: |
          STORE_DIR="$HOME/.pnpm-store"
          echo "store-dir=$STORE_DIR" >> "$GITHUB_OUTPUT"
          pnpm config set store-dir "$STORE_DIR"

      # SHA: actions/cache@v4.2.0 - Cache explícito com restore-keys para fallback
      - name: Restaurar cache do pnpm
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ steps.pnpm_store_path.outputs.store-dir }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # pnpm v10+: permitir execução automática de scripts de build de dependências
          # APENAS durante `pnpm install` em CI (não aplicar localmente via .npmrc).
          NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'

      # Build frontend - DEVE falhar se houver erros
      - name: Build frontend
        run: pnpm run build
        env:
          VITE_API_URL: ""

      # SHA: actions/upload-artifact@v4.6.0 (2024-12-18) - Supply Chain Security
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: frontend-dist
          path: |
            dist
            apps/frontend-service/dist
          retention-days: 1
          if-no-files-found: warn

  # ===========================================================================
  # Job 5: Security Scanning
  # CRÍTICO: exit-code: '1' para bloquear CI em vulnerabilidades CRITICAL/HIGH
  # Regra 6 (CLAUDE.md): PROIBIDO workarounds - vulnerabilidades devem ser corrigidas
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck (instala PyTorch, precisa de mais tempo)
    timeout-minutes: 25
    # GAP-GHACTIONS-003: Least privilege - permissões para upload de SARIF
    permissions:
      contents: read
      security-events: write
    needs: build-and-check
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # CRÍTICO: Limpar espaço em disco ANTES de instalar dependências
      # GitHub Actions runners têm ~14GB livres, mas caches podem consumir muito
      - name: Free disk space before install
        run: |
          echo "=== Liberando espaço em disco ==="
          echo "Espaço antes da limpeza:"
          df -h /
          
          # Limpar caches do sistema (NÃO limpar pip/pnpm - são gerenciados pelo GitHub Actions)
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          # Remover ferramentas pré-instaladas desnecessárias (economiza ~5GB)
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          
          echo "Espaço após limpeza:"
          df -h /

      # Enterprise: Fallback automático para mirror se npm registry estiver instável (500/503)
      - name: Configure npm registry fallback
        run: |
          if ! curl -sf --max-time 10 https://registry.npmjs.org/pnpm > /dev/null 2>&1; then
            echo "⚠️ npm registry instável, usando mirror npmmirror.com"
            npm config set registry https://registry.npmmirror.com/
            echo "NPM_CONFIG_REGISTRY=https://registry.npmmirror.com/" >> $GITHUB_ENV
          fi

      # Setup pnpm para instalar dependências Node.js (necessário para Trivy escanear)
      # REGRA 6: Enterprise-grade - usar versão do package.json (já lida no job build-and-check)
      # Reutilizar versão do job anterior via artifact ou ler novamente
      - name: Ler versão do pnpm do package.json
        id: pnpm-version
        run: |
          # REGRA 6: Enterprise-grade - validar que package.json existe
          if [ ! -f "package.json" ]; then
            echo "::error::Arquivo package.json não encontrado!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - usar jq para parsing JSON (não grep regex)
          PNPM_VERSION=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          
          # REGRA 6: Enterprise-grade - validar que versão foi encontrada
          if [ -z "$PNPM_VERSION" ] || [ "$PNPM_VERSION" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!" >&2
            exit 1
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X.Y.Z)
          if ! echo "$PNPM_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versão do pnpm em formato inválido: '$PNPM_VERSION'. Deve ser X.Y.Z" >&2
            exit 1
          fi
          
          echo "✅ Versão do pnpm lida do package.json: $PNPM_VERSION"
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT
          echo "PNPM_VERSION=$PNPM_VERSION" >> $GITHUB_ENV

      # REGRA 6: Enterprise-grade - versionamento automático do Node.js LTS
      # Buscar versão LTS mais recente via API oficial do Node.js
      # Fallback para .nvmrc se API falhar
      - name: Buscar versão LTS do Node.js
        id: node-version
        run: |
          # REGRA 6: Enterprise-grade - buscar versão LTS mais recente via API oficial
          echo "🔍 Buscando versão LTS mais recente do Node.js..."
          
          NODE_LTS_VERSION=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          # REGRA 6: Enterprise-grade - fallback para .nvmrc se API falhar
          if [ -z "$NODE_LTS_VERSION" ] || [ "$NODE_LTS_VERSION" = "null" ]; then
            echo "⚠️ AVISO: Falha ao buscar versão LTS da API, usando fallback do .nvmrc" >&2
            if [ -f ".nvmrc" ]; then
              NODE_LTS_VERSION=$(cat .nvmrc | tr -d '[:space:]')
              echo "✅ Versão do Node.js lida do .nvmrc: $NODE_LTS_VERSION"
            else
              echo "::error::Arquivo .nvmrc não encontrado e API falhou!" >&2
              exit 1
            fi
          else
            echo "✅ Versão LTS do Node.js encontrada via API: $NODE_LTS_VERSION"
          fi
          
          # REGRA 6: Enterprise-grade - validar formato da versão (X ou X.Y)
          if ! echo "$NODE_LTS_VERSION" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Versão do Node.js em formato inválido: '$NODE_LTS_VERSION'. Deve ser X ou X.Y" >&2
            exit 1
          fi
          
          echo "version=$NODE_LTS_VERSION" >> $GITHUB_OUTPUT
          echo "NODE_VERSION=$NODE_LTS_VERSION" >> $GITHUB_ENV

      # pnpm/action-setup - organização oficial pnpm (verificada)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # SHA: actions/setup-node@v4.1.0 (2024-10-24) - Supply Chain Security
      # NOTA: Removido cache: 'pnpm' - usamos actions/cache explícito para melhor controle
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # Enterprise: Configurar store path explícito para cache consistente
      - name: Configurar pnpm store path
        id: pnpm_store_path
        run: |
          STORE_DIR="$HOME/.pnpm-store"
          echo "store-dir=$STORE_DIR" >> "$GITHUB_OUTPUT"
          pnpm config set store-dir "$STORE_DIR"

      # SHA: actions/cache@v4.2.0 - Cache explícito com restore-keys para fallback
      - name: Restaurar cache do pnpm
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ steps.pnpm_store_path.outputs.store-dir }}
          key: pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ steps.pnpm-version.outputs.version }}-
            pnpm-store-${{ runner.os }}-

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile
        env:
          # pnpm v10+: permitir execução automática de scripts de build de dependências
          # APENAS durante `pnpm install` em CI (não aplicar localmente via .npmrc).
          NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'

      # NOTA: Instalação Python removida - serviços GPU migrados para Hetzner GPU GEX44 (25/12/2025)
      # O scan de segurança agora foca apenas em dependências Node.js (pnpm-lock.yaml)

      # SHA: aquasecurity/trivy-action@v0.28.0 (2024-10-15) - Supply Chain Security
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Ignorar diretórios que não vão para produção
          skip-dirs: 'node_modules/.cache,tests,docs,.git,attached_assets'
          # Ignorar arquivos de lock e configuração (Trivy deve escanear requirements.txt e package.json)
          skip-files: 'pnpm-lock.yaml,package-lock.json'

      # Garantir que arquivo SARIF existe mesmo se Trivy falhar
      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f "trivy-results.sarif" ]; then
            echo "Criando arquivo SARIF válido (Trivy não gerou output)..."
            # SARIF mínimo válido para evitar erros de parsing
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[]}' > trivy-results.sarif
          fi
          echo "✅ SARIF file ready:"
          ls -la trivy-results.sarif

      # Verificar se Code Scanning (Advanced Security) está habilitado para este repo
      # GitHub Advanced Security requer plano Enterprise ou repo público
      # SHA: actions/github-script@v7.0.1 (2024-11-18) - Supply Chain Security
      - name: Check if Code Scanning is enabled
        id: check-code-scanning
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              // Tentar obter informações do repositório
              const res = await github.request('GET /repos/{owner}/{repo}', {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              
              // Repos públicos sempre suportam Code Scanning gratuito
              const isPublic = res.data.visibility === 'public';
              
              // Para repos privados, verificar se Advanced Security está habilitado
              let advancedSecurityEnabled = false;
              if (!isPublic) {
                try {
                  const secRes = await github.request('GET /repos/{owner}/{repo}/code-scanning/alerts', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    per_page: 1
                  });
                  // Se a chamada não der erro, Code Scanning está habilitado
                  advancedSecurityEnabled = true;
                } catch (e) {
                  // 403 ou 404 significa que Code Scanning não está disponível
                  core.info('Code Scanning não disponível: ' + e.message);
                  advancedSecurityEnabled = false;
                }
              }
              
              const enabled = isPublic || advancedSecurityEnabled;
              core.info('Repository visibility: ' + res.data.visibility);
              core.info('Code Scanning enabled: ' + enabled);
              core.setOutput('enabled', enabled ? 'true' : 'false');
            } catch (e) {
              core.warning('Erro ao verificar Code Scanning: ' + e.message);
              core.setOutput('enabled', 'false');
            }

      # Upload para GitHub Security tab (APENAS se Code Scanning estiver habilitado)
      # REGRA 6: Enterprise-grade - fail-fast se upload falhar (não usar continue-on-error)
      # Justificativa: Se Code Scanning está habilitado, o upload DEVE funcionar.
      # Se falhar, é um problema que precisa ser investigado, não mascarado.
      # Os resultados do scan crítico já estão salvos como artifacts (step posterior).
      # GAP-GHACTIONS-001: SHA pinning para supply chain security
      # SHA: github/codeql-action@v3.27.0 (2024-11-05)
      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        if: always() && steps.check-code-scanning.outputs.enabled == 'true'
        with:
          sarif_file: 'trivy-results.sarif'

      # CRÍTICO: Salvar trivy-results.sarif como artifact para debug
      # Isso permite baixar e analisar as vulnerabilidades exatas detectadas
      # SHA: actions/upload-artifact@v4.6.0 (2024-12-18) - Supply Chain Security
      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always()
        with:
          name: trivy-security-scan
          path: trivy-results.sarif
          retention-days: 30

  # ===========================================================================
  # Job 6: Enterprise Compliance Checks
  # ===========================================================================
  compliance-checks:
    name: Enterprise Compliance
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em problemas de rede
    timeout-minutes: 10
    # GAP-GHACTIONS-003: Least privilege - apenas permissões necessárias
    permissions:
      contents: read
    needs: build-and-check
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check for hardcoded secrets
        run: |
          set -e
          echo "Verificando secrets hardcoded..."
          
          PATTERNS=(
            'password\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'api[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'secret[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'OPENAI_API_KEY\s*[=:]\s*["\047]sk-'
            'DATABASE_URL\s*[=:]\s*["\047]postgres://'
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" apps/ packages/ --include="*.ts" --include="*.js" 2>/dev/null | grep -v "node_modules" | grep -v ".test."; then
              echo "ALERTA: Possível secret hardcoded encontrado!"
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            echo "ERRO: Secrets hardcoded detectados - favor remover!"
            exit 1
          else
            echo "Nenhum secret hardcoded detectado"
          fi

      - name: Verify RLS migrations exist
        run: |
          set -e
          echo "Verificando migrações RLS..."
          
          # Caminho unificado conforme drizzle.config.ts (out: "./migrations")
          if [ -f "migrations/0001_rls_security_enterprise.sql" ]; then
            echo "Migração RLS encontrada"
            if grep -q "CREATE POLICY\|ENABLE ROW LEVEL SECURITY" migrations/0001_rls_security_enterprise.sql; then
              echo "Policies RLS configuradas corretamente"
            else
              echo "ERRO: Policies RLS não encontradas na migração"
              exit 1
            fi
          else
            echo "ERRO: Migração RLS não encontrada em migrations/"
            exit 1
          fi

      - name: Verify Express hardening in all services
        run: |
          set -e
          echo "Verificando express-hardening em microsserviços..."
          
          SERVICES=(
            "apps/auth-service/src/index.ts"
            "apps/chat-service/src/index.ts"
            "apps/rag-service/src/index.ts"
            "apps/training-service/src/index.ts"
            "apps/integrations-service/src/index.ts"
            "apps/api-gateway/src/index.ts"
            "apps/observability-service/src/index.ts"
          )
          
          MISSING=0
          for service in "${SERVICES[@]}"; do
            if [ -f "$service" ]; then
              if grep -q "@alice/shared-utils" "$service" && grep -q "createSecurityMiddleware\|createRateLimiter" "$service"; then
                echo "$service: Express hardening configurado"
              else
                echo "ALERTA: $service sem express-hardening!"
                MISSING=1
              fi
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo "ERRO: Serviços sem express-hardening detectados"
            exit 1
          fi

      - name: Verify server timeouts
        run: |
          set -e
          echo "Verificando server timeouts (Node.js 20 LTS)..."
          
          SERVICES=(
            "apps/auth-service/src/index.ts"
            "apps/chat-service/src/index.ts"
            "apps/rag-service/src/index.ts"
            "apps/training-service/src/index.ts"
            "apps/integrations-service/src/index.ts"
            "apps/api-gateway/src/index.ts"
            "apps/observability-service/src/index.ts"
          )
          
          for service in "${SERVICES[@]}"; do
            if [ -f "$service" ]; then
              if grep -q "server.timeout" "$service" && grep -q "keepAliveTimeout" "$service" && grep -q "headersTimeout" "$service"; then
                echo "$service: Timeouts configurados"
              else
                echo "ALERTA: $service sem timeouts configurados!"
                exit 1
              fi
            fi
          done

  # ===========================================================================
  # Job 8: Trigger Release Automático (apenas em push para main)
  # Best Practices 2025: CI passa -> Release automático -> Deploy automático
  # NOTA: needs apenas cria ordem; condição if garante todos success.
  # ===========================================================================
  trigger-release:
    name: Trigger Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    needs: [build-and-check, build-services, build-frontend, security-scan, compliance-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-check.result == 'success' && needs.build-services.result == 'success' && needs.build-frontend.result == 'success' && needs.security-scan.result == 'success' && needs.compliance-checks.result == 'success'
    steps:
      - name: Checkout codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Calcular proxima versao
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LAST_TAG#v}
          MAJOR_RAW=$(echo $VERSION | cut -d. -f1)
          MINOR_RAW=$(echo $VERSION | cut -d. -f2)
          PATCH_RAW=$(echo $VERSION | cut -d. -f3 | cut -d- -f1)
          MAJOR=${MAJOR_RAW:-0}
          MINOR=${MINOR_RAW:-0}
          PATCH=${PATCH_RAW:-0}
          SEMVER_REGEX='^(0|[1-9][0-9]*)$'
          if ! [[ "$MAJOR" =~ $SEMVER_REGEX ]] || ! [[ "$MINOR" =~ $SEMVER_REGEX ]] || ! [[ "$PATCH" =~ $SEMVER_REGEX ]]; then
            echo "⚠️ Tag '$LAST_TAG' inválida para semver. Usando v0.0.1"
            MAJOR=0
            MINOR=0
            PATCH=0
          fi
          NEW_PATCH=$((10#$PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Disparar Release Workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                version: '${{ steps.version.outputs.version }}',
                prerelease: 'false'
              }
            });
            console.log('🚀 Release ${{ steps.version.outputs.version }} disparado automaticamente!');
