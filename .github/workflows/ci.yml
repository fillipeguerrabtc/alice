# =============================================================================
# GitHub Actions Workflow - CI Validation (ULTRA-OTIMIZADO)
# =============================================================================
# Descrição: Pipeline de integração contínua para Alice Enterprise Platform
#
# PIPELINE ENTERPRISE (3 workflows separados por responsabilidade):
#   CI → Valida código (typecheck, lint, security, compliance)
#   Release → Builda imagens Docker + Cria GitHub Release
#   Deploy → Deploya para Hetzner + Health Check + Rollback
#
# OTIMIZAÇÃO CRÍTICA (27/12/2025):
# - REMOVIDO: build-all (redundante - Release já builda via Docker)
# - REMOVIDO: upload de artefatos packages-dist (não mais necessário)
# - CONSOLIDADO: security-scan + compliance-checks → 1 job único
# - RESULTADO: CI de ~20min → ~8min (redução de 60%)
#
# OTIMIZAÇÃO RECURSOS (27/12/2025):
# - Runner Hetzner CPX32: 4 vCPU AMD EPYC, 8GB RAM, 160GB SSD
# - NODE_OPTIONS: max-old-space-size=6144 (6GB - deixa 2GB para SO/Docker)
# - Timeouts: Otimizados para runner dedicado (sem fila de espera)
#
# REGRAS APLICADAS:
# - REGRA 6: PROIBIDO continue-on-error em steps críticos
# - REGRA 8: Qualidade obrigatória - TypeScript strict, zero any
# - REGRA 9: Validação contínua - pipeline DEVE falhar em qualquer erro
#
# SEGURANÇA (Best Practices 2025):
#   - GAP-GHACTIONS-001: Actions pinadas a SHA (supply chain security)
#   - GAP-GHACTIONS-003: Least privilege permissions
#
# ATUALIZAÇÃO (19/03/2026):
# - PRs usam validação incremental por escopo afetado
# - Pushes em main sempre executam os jobs principais para validar o commit publicado
# - docs-only/pipeline-only continuam sem release-eligible, mas não podem pular indevidamente a validação do push em main
# - CI concentra o gate de qualidade; Release não repete esse papel
#
# Author: Fillipe Guerra
# Data: 17/03/2026
# =============================================================================

name: CI - Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Detectar mudanças e calcular versões (SINGLE SOURCE OF TRUTH)
  # Timeout: 2min (runner dedicado, sem fila)
  # ===========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.versions.outputs.node-version }}
      pnpm-version: ${{ steps.versions.outputs.pnpm-version }}
      scope-mode: ${{ steps.scope.outputs.scope_mode }}
      scope-base-ref: ${{ steps.scope.outputs.scope_base_ref }}
      scope-head-ref: ${{ steps.scope.outputs.scope_head_ref }}
      docs-only: ${{ steps.scope.outputs.docs_only }}
      release-eligible: ${{ steps.scope.outputs.release_eligible }}
      release-pending: ${{ steps.scope.outputs.release_pending }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Calcular versões Node.js e pnpm
        id: versions
        run: |
          # Node.js LTS via API oficial (com fallback para .nvmrc)
          NODE_LTS=$(curl -s --max-time 10 "https://nodejs.org/dist/index.json" 2>/dev/null | \
            jq -r '[.[] | select(.lts) | .version] | first // empty' 2>/dev/null | \
            sed 's/^v//' | sed -E 's/^([0-9]+)(\.[0-9]+)?(\.[0-9]+)?.*$/\1\2/' | sed 's/\.$//')
          
          if [ -z "$NODE_LTS" ] || [ "$NODE_LTS" = "null" ]; then
            NODE_LTS=$(cat .nvmrc 2>/dev/null | tr -d '[:space:]' || echo "22")
          fi
          
          # pnpm via package.json (single source of truth)
          PNPM_VER=$(jq -r '.packageManager // empty' package.json | sed 's/^pnpm@//')
          if [ -z "$PNPM_VER" ] || [ "$PNPM_VER" = "null" ]; then
            echo "::error::Campo packageManager não encontrado em package.json!"
            exit 1
          fi
          
          echo "✅ Node.js: $NODE_LTS"
          echo "✅ pnpm: $PNPM_VER"
          echo "node-version=$NODE_LTS" >> $GITHUB_OUTPUT
          echo "pnpm-version=$PNPM_VER" >> $GITHUB_OUTPUT

      - name: Setup Node.js para resolver escopo
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ steps.versions.outputs.node-version }}

      - name: Fetch pull request base ref
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

      - name: Resolver escopo de validação, docs-only e elegibilidade de release
        id: scope
        env:
          ALICE_GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALICE_GITHUB_BASE_REF: ${{ github.base_ref }}
          ALICE_GITHUB_BEFORE: ${{ github.event.before }}
          ALICE_GITHUB_REF_NAME: ${{ github.ref_name }}
          ALICE_GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "$ALICE_GITHUB_EVENT_NAME" = "pull_request" ]; then
            SCOPE_MODE="scoped"
            SCOPE_BASE_REF="origin/$ALICE_GITHUB_BASE_REF"
          elif [ -n "${ALICE_GITHUB_BEFORE:-}" ] && [ "$ALICE_GITHUB_BEFORE" != "$ZERO_SHA" ]; then
            SCOPE_MODE="scoped"
            SCOPE_BASE_REF="$ALICE_GITHUB_BEFORE"
          else
            SCOPE_MODE="full"
            SCOPE_BASE_REF=""
          fi

          SCOPE_HEAD_REF="$ALICE_GITHUB_SHA"

          {
            echo "scope_mode=$SCOPE_MODE"
            echo "scope_base_ref=$SCOPE_BASE_REF"
            echo "scope_head_ref=$SCOPE_HEAD_REF"
          } >> "$GITHUB_OUTPUT"

          if [ "$SCOPE_MODE" = "full" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "release_eligible=true" >> "$GITHUB_OUTPUT"
            echo "release_pending=true" >> "$GITHUB_OUTPUT"
            echo "🔒 Fallback full habilitado: base ref indisponível para comparação segura."
            exit 0
          fi

          ALICE_SCOPE_BASE_REF="$SCOPE_BASE_REF" ALICE_SCOPE_HEAD_REF="$SCOPE_HEAD_REF" node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import {
            ROOT_DIR,
            detectChangedFiles,
            isDocumentationPath,
            isPipelineOnlyPath,
          } from './scripts/workspace-scope.mjs';

          function execGit(args) {
            return execFileSync('git', args, {
              cwd: ROOT_DIR,
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'pipe'],
            }).trim();
          }

          function hasReleaseEligibleFiles(filePaths) {
            return filePaths.some(filePath =>
              !isDocumentationPath(filePath) && !isPipelineOnlyPath(filePath),
            );
          }

          const changedFilesResult = detectChangedFiles({
            rootDir: ROOT_DIR,
            baseRef: process.env.ALICE_SCOPE_BASE_REF,
            headRef: process.env.ALICE_SCOPE_HEAD_REF,
          });

          if (!Array.isArray(changedFilesResult)) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'docs_only=false\n');
            console.log(`[alice-ci] ${changedFilesResult.reason}`);
            process.exit(0);
          }

          const docsOnly = changedFilesResult.length > 0
            && changedFilesResult.every(filePath => isDocumentationPath(filePath));
          const releaseEligible = hasReleaseEligibleFiles(changedFilesResult);
          let releasePending = releaseEligible;
          let releasePendingReason = releaseEligible
            ? 'O push atual ja contem mudanca elegivel para release.'
            : 'O push atual nao contem mudanca elegivel para release.';

          if (
            process.env.ALICE_GITHUB_EVENT_NAME === 'push'
            && process.env.ALICE_GITHUB_REF_NAME === 'main'
          ) {
            let latestTag = '';

            try {
              latestTag = execGit(['describe', '--tags', '--abbrev=0']);
            } catch {
              latestTag = '';
            }

            if (latestTag) {
              const unreleasedFilesResult = detectChangedFiles({
                rootDir: ROOT_DIR,
                baseRef: latestTag,
                headRef: process.env.ALICE_SCOPE_HEAD_REF,
              });

              if (Array.isArray(unreleasedFilesResult)) {
                releasePending = hasReleaseEligibleFiles(unreleasedFilesResult);
                releasePendingReason = releasePending
                  ? `Existe backlog de release desde ${latestTag}.`
                  : `Nao ha backlog elegivel para release desde ${latestTag}.`;
              } else {
                releasePendingReason = `${releasePendingReason} Falha ao calcular backlog desde a ultima tag; mantendo decisao pelo diff atual.`;
              }
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `docs_only=${docsOnly}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release_eligible=${releaseEligible}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `release_pending=${releasePending}\n`);

          console.log(`[alice-ci] Changed files (${changedFilesResult.length}):`);
          for (const filePath of changedFilesResult) {
            console.log(`  - ${filePath}`);
          }
          console.log(`[alice-ci] Docs only: ${docsOnly}`);
          console.log(`[alice-ci] Release eligible: ${releaseEligible}`);
          console.log(`[alice-ci] Release pending: ${releasePending}`);
          console.log(`[alice-ci] Release pending reason: ${releasePendingReason}`);
          EOF

  # ===========================================================================
  # Job 2: Build, TypeCheck, Lint e Testes
  # PR: escopo incremental por workspace/suite afetada
  # Push em main: o job sempre roda para validar o commit efetivamente publicado
  # Fallback full: apenas quando o commit-base não puder ser resolvido com segurança
  # Timeout: 25min
  # ===========================================================================
  build-and-check:
    name: Build & Typecheck
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 25
    permissions:
      contents: read
    needs: detect-changes
    if: ${{ github.event_name == 'push' || needs.detect-changes.outputs.release-eligible == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js e pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ needs.detect-changes.outputs.node-version }}
          pnpm-version: ${{ needs.detect-changes.outputs.pnpm-version }}
          install-dependencies: 'true'

      # Limpar artefatos de build antigos para evitar conflitos de tipos
      - name: Clean stale build artifacts
        run: |
          set -euo pipefail
          echo "Limpando artefatos de build antigos..."
          find packages apps -type d -name dist -prune -exec rm -rf {} +
          find packages apps -type f -name '*.tsbuildinfo' -delete
          rm -rf .cache/turbo .cache/typescript

      - name: Fetch pull request base ref
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

      - name: Log validation mode
        run: |
          set -euo pipefail
          if [ "${{ needs.detect-changes.outputs.scope-mode }}" = "scoped" ]; then
            echo "🔎 Modo de validação: scoped CI"
            echo "Base ref: ${{ needs.detect-changes.outputs.scope-base-ref }}"
            echo "Head ref: ${{ needs.detect-changes.outputs.scope-head-ref }}"
          else
            echo "🔒 Modo de validação: full fallback"
          fi

      - name: Scoped validation in CI
        if: ${{ needs.detect-changes.outputs.scope-mode == 'scoped' }}
        env:
          ALICE_SCOPE_BASE_REF: ${{ needs.detect-changes.outputs.scope-base-ref }}
          ALICE_SCOPE_HEAD_REF: ${{ needs.detect-changes.outputs.scope-head-ref }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          pnpm run typecheck
          pnpm test
          pnpm run lint
          pnpm run build

      - name: Full validation fallback in CI
        if: ${{ needs.detect-changes.outputs.scope-mode == 'full' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          pnpm run typecheck:full
          pnpm run test:full
          pnpm run lint:full
          pnpm run build:full

      - name: Skip enterprise governance validation for non-release-eligible push
        if: ${{ needs.detect-changes.outputs.release-eligible != 'true' }}
        run: |
          set -euo pipefail
          echo "ℹ️ Guardrail verify:enterprise-focus ignorado: commit atual sem release-eligible."

      - name: Enterprise governance validation
        if: ${{ needs.detect-changes.outputs.release-eligible == 'true' }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          pnpm run verify:enterprise-focus

  # ===========================================================================
  # Job 3: Security & Compliance (CONSOLIDADO)
  # OTIMIZAÇÃO: Trivy + Compliance em 1 único job (ambos não precisam de Node.js)
  # Push em main: o job sempre roda para validar o commit efetivamente publicado
  # Timeout: 8min (scan + verificações)
  # ===========================================================================
  security-and-compliance:
    name: Security & Compliance
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 8
    permissions:
      contents: read
      security-events: write
    needs: detect-changes
    if: ${{ github.event_name == 'push' || needs.detect-changes.outputs.release-eligible == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # -------------------------------------------------------------------------
      # SECURITY SCAN (Trivy - Código Fonte)
      # -------------------------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'
          skip-dirs: 'node_modules/.cache,tests,docs,.git,attached_assets'
          skip-files: 'pnpm-lock.yaml,package-lock.json'

      - name: Ensure SARIF file exists
        id: ensure-sarif
        if: always()
        run: |
          if [ ! -f "trivy-results.sarif" ] || [ ! -s "trivy-results.sarif" ]; then
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","version":"0.0.0"}},"results":[]}]}' > trivy-results.sarif
          fi
          jq empty trivy-results.sarif 2>/dev/null || exit 1
          echo "sarif_exists=true" >> $GITHUB_OUTPUT

      - name: Check if Code Scanning is enabled
        id: check-code-scanning
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            try {
              const res = await github.request('GET /repos/{owner}/{repo}', {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const isPublic = res.data.visibility === 'public';
              let enabled = isPublic;
              if (!isPublic) {
                try {
                  await github.request('GET /repos/{owner}/{repo}/code-scanning/alerts', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    per_page: 1
                  });
                  enabled = true;
                } catch (e) {
                  enabled = false;
                }
              }
              core.setOutput('enabled', enabled ? 'true' : 'false');
            } catch (e) {
              core.setOutput('enabled', 'false');
            }

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda
        if: always() && steps.check-code-scanning.outputs.enabled == 'true' && steps.ensure-sarif.outputs.sarif_exists == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always()
        with:
          name: trivy-security-scan
          path: trivy-results.sarif
          retention-days: 30

      # -------------------------------------------------------------------------
      # COMPLIANCE CHECKS (Enterprise)
      # -------------------------------------------------------------------------
      - name: Check for hardcoded secrets
        run: |
          set -e
          echo "Verificando secrets hardcoded..."
          
          PATTERNS=(
            'password\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'api[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'secret[_-]?key\s*[=:]\s*["\047][a-zA-Z0-9]+'
            'OPENAI_API_KEY\s*[=:]\s*["\047]sk-'
            'DATABASE_URL\s*[=:]\s*["\047]postgres://'
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" apps/ packages/ --include="*.ts" --include="*.js" 2>/dev/null | grep -v "node_modules" | grep -v ".test."; then
              FOUND=1
            fi
          done
          
          if [ $FOUND -eq 1 ]; then
            echo "ERRO: Secrets hardcoded detectados!"
            exit 1
          fi
          echo "✅ Nenhum secret hardcoded"

      - name: Verify RLS migrations exist
        run: |
          set -e
          test -f "migrations/0001_rls_security_enterprise.sql" || (echo "ERRO: Migração RLS não encontrada" && exit 1)
          grep -q "CREATE POLICY\|ENABLE ROW LEVEL SECURITY" migrations/0001_rls_security_enterprise.sql || \
            (echo "ERRO: Policies RLS não encontradas" && exit 1)
          echo "✅ Migrações RLS verificadas"

      - name: Verify Express hardening and server timeouts
        run: |
          set -e
          # Array unificado de todos os microsserviços Node.js (CLAUDE.md Regra 2)
          # Inclui: auth, chat, rag, training, integrations, api-gateway, observability, gpu-manager, llm-gateway
          # biometrics-service é Python (FastAPI) — não usa Express hardening
          SERVICE_SRC_DIRS=(
            "apps/auth-service/src"
            "apps/chat-service/src"
            "apps/llm-gateway-service/src"
            "apps/rag-service/src"
            "apps/training-service/src"
            "apps/integrations-service/src"
            "apps/api-gateway/src"
            "apps/observability-service/src"
            "apps/gpu-manager-service/src"
          )

          for service_dir in "${SERVICE_SRC_DIRS[@]}"; do
            if [ -d "$service_dir" ]; then
              # Verificar express hardening
              if ! grep -R -q --include='*.ts' "@alice/shared-utils" "$service_dir" || ! grep -R -E -q --include='*.ts' "createSecurityMiddleware|createRateLimiter" "$service_dir"; then
                echo "ERRO: $service_dir sem express-hardening!"
                exit 1
              fi
              # Verificar server timeouts
              if ! grep -R -q --include='*.ts' "server\\.timeout" "$service_dir" || ! grep -R -q --include='*.ts' "keepAliveTimeout" "$service_dir" || ! grep -R -q --include='*.ts' "headersTimeout" "$service_dir"; then
                echo "ERRO: $service_dir sem timeouts!"
                exit 1
              fi
            fi
          done
          echo "✅ Express hardening verificado"
          echo "✅ Server timeouts verificados"

      # Compliance summary removido (zero valor diagnóstico - CLAUDE.md Regra 6)

  # ===========================================================================
  # Job 4: Trigger Release Automático
  # OTIMIZAÇÃO: NÃO precisa de setup Node/pnpm - apenas usa git e GitHub API
  # Timeout: 2min (apenas API call)
  # ===========================================================================
  trigger-release:
    name: Trigger Release
    runs-on: [self-hosted, linux, deploy]
    timeout-minutes: 2
    permissions:
      contents: read
      actions: write
    needs: [detect-changes, build-and-check, security-and-compliance]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-changes.outputs.release-pending == 'true' && (needs.build-and-check.result == 'success' || needs.build-and-check.result == 'skipped') && (needs.security-and-compliance.result == 'success' || needs.security-and-compliance.result == 'skipped') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      # =======================================================================
      # SEMANTIC VERSIONING AUTOMÁTICO (Best Practices 2025)
      # Analisa Conventional Commits para determinar tipo de bump:
      # - BREAKING CHANGE: ou feat!/fix! → MAJOR (v2.0.0)
      # - feat: (sem !) → MINOR (v1.1.0)
      # - fix:/outros → PATCH (v1.0.1)
      # =======================================================================
      - name: Calcular proxima versao (Semantic Versioning)
        id: version
        run: |
          set -e
          
          # Obter última tag e versão atual
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LAST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1 | grep -E '^[0-9]+$' || echo "0")
          MINOR=$(echo $VERSION | cut -d. -f2 | grep -E '^[0-9]+$' || echo "0")
          PATCH=$(echo $VERSION | cut -d. -f3 | cut -d- -f1 | grep -E '^[0-9]+$' || echo "0")
          
          echo "📦 Versão atual: v${MAJOR}.${MINOR}.${PATCH}"
          
          # Analisar commits desde a última tag
          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges | head -100)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi
          
          # Determinar tipo de bump baseado em Conventional Commits
          BUMP_TYPE="patch"
          
          # Verificar BREAKING CHANGES (MAJOR bump)
          # Conventional Commits 1.0.0: QUALQUER tipo pode usar ! para breaking change
          # Exemplos válidos: feat!:, fix!:, chore!:, refactor!:, docs!:, perf!:, etc.
          if echo "$COMMITS" | grep -qE "^[a-z]+(\(.+\))?!:|BREAKING CHANGE:"; then
            BUMP_TYPE="major"
            echo "⚠️ Breaking change detectado → MAJOR bump"
          # Verificar features (MINOR bump)
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP_TYPE="minor"
            echo "✨ Feature detectada → MINOR bump"
          else
            echo "🔧 Apenas fixes/outros → PATCH bump"
          fi
          
          # Calcular nova versão
          case $BUMP_TYPE in
            major)
              NEW_MAJOR=$((10#$MAJOR + 1))
              NEW_VERSION="v${NEW_MAJOR}.0.0"
              ;;
            minor)
              NEW_MINOR=$((10#$MINOR + 1))
              NEW_VERSION="v${MAJOR}.${NEW_MINOR}.0"
              ;;
            patch)
              NEW_PATCH=$((10#$PATCH + 1))
              NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              ;;
          esac
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "✅ Nova versão: $NEW_VERSION ($BUMP_TYPE bump)"

      # GH_PAT necessário para createWorkflowDispatch - token automático
      # (GITHUB_TOKEN) pode não conseguir disparar workflow_dispatch em
      # outro workflow. GH_PAT (PAT) garante permissão explícita.
      - name: Disparar Release Workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                target_sha: '${{ github.sha }}',
                version: '${{ steps.version.outputs.version }}',
                prerelease: 'false'  // String 'false' - GitHub Actions inputs são ALWAYS strings
              }
            });
            console.log('🚀 Release ${{ steps.version.outputs.version }} disparado para o commit ${{ github.sha }}!');
