# =============================================================================
# GitHub Actions Workflow - Atualização de Pacotes do Sistema (Hetzner)
# =============================================================================
# Descrição: Atualiza pacotes do sistema (apt) no servidor Hetzner
# Execução: Semanal (domingos às 03:00 UTC)
# REGRA 4: Aprovação obrigatória - cria issue com resumo, não atualiza automaticamente
# REGRA 6: Enterprise-grade - backup antes de atualizar, validação completa
# REGRA 11: Melhores práticas GitHub Actions 2025
# REGRA 16: Health checks após atualização
# =============================================================================

name: Update System Packages (Hetzner)

on:
  # Executar semanalmente (domingos às 03:00 UTC)
  schedule:
    - cron: '0 3 * * 0'  # Todo domingo às 03:00 UTC
  # Permitir execução manual
  workflow_dispatch:
    inputs:
      auto_update:
        description: 'Atualizar automaticamente (true) ou apenas verificar (false)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: update-system-packages
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # ===========================================================================
  # Job 1: Verificar Atualizações Disponíveis no Servidor Hetzner
  # ===========================================================================
  check-updates:
    name: Verificar Atualizações no Servidor
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em problemas de rede
    timeout-minutes: 10
    outputs:
      has_updates: ${{ steps.parse-status.outputs.has_updates }}
      updates_count: ${{ steps.parse-status.outputs.updates_count }}
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security (Regra 11)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # REGRA 6: Enterprise-grade - verificar atualizações sem instalar
      # SHA: appleboy/ssh-action@v1.2.0 (2024-09-16) - Supply Chain Security (Regra 11)
      - name: Verificar atualizações disponíveis
        id: check-updates
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            echo "🔍 Verificando atualizações disponíveis..."
            
            # Atualizar lista de pacotes (não instalar)
            apt update -qq
            
            # Verificar atualizações disponíveis
            UPDATES=$(apt list --upgradable 2>/dev/null | grep -c "upgradable" || echo "0")
            
            if [ "$UPDATES" -eq 0 ]; then
              echo "✅ Nenhuma atualização disponível"
              echo "HAS_UPDATES=false" > /tmp/updates_status.txt
              echo "UPDATES_COUNT=0" >> /tmp/updates_status.txt
            else
              echo "📦 $UPDATES pacotes podem ser atualizados"
              
              # Listar pacotes que serão atualizados
              apt list --upgradable 2>/dev/null | grep -v "Listing..." > /tmp/upgradable_packages.txt || true
              
              echo "HAS_UPDATES=true" > /tmp/updates_status.txt
              echo "UPDATES_COUNT=$UPDATES" >> /tmp/updates_status.txt
            fi
            
            # Verificar versão do kernel
            CURRENT_KERNEL=$(uname -r)
            AVAILABLE_KERNEL=$(apt list --upgradable 2>/dev/null | grep -i "linux-image" | head -1 | cut -d'/' -f1 || echo "none")
            
            echo "current_kernel=$CURRENT_KERNEL" >> /tmp/updates_status.txt
            echo "available_kernel=$AVAILABLE_KERNEL" >> /tmp/updates_status.txt
            
            # Verificar versão do Docker
            DOCKER_VERSION=$(docker --version 2>/dev/null || echo "not installed")
            echo "docker_version=$DOCKER_VERSION" >> /tmp/updates_status.txt
            
            # Verificar versão do Docker Compose
            DOCKER_COMPOSE_VERSION=$(docker compose version 2>/dev/null || echo "not installed")
            echo "docker_compose_version=$DOCKER_COMPOSE_VERSION" >> /tmp/updates_status.txt
            
            # Criar resumo
            cat /tmp/updates_status.txt
            if [ -f /tmp/upgradable_packages.txt ]; then
              echo "--- Pacotes que serão atualizados ---"
              cat /tmp/upgradable_packages.txt
            fi

      # REGRA 6: Enterprise-grade - definir outputs do job baseado no resultado SSH
      # Como appleboy/ssh-action não exporta stdout como output reutilizável,
      # vamos usar um step que lê o arquivo de status diretamente via SSH e define outputs
      - name: Definir outputs do job
        id: parse-status
        run: |
          # REGRA 6: Enterprise-grade - ler arquivo de status via SSH e definir outputs
          # Como não podemos acessar stdout do step SSH anterior diretamente,
          # vamos usar ssh diretamente para ler o arquivo de status criado no servidor
          SSH_KEY_FILE=$(mktemp)
          # REGRA 6: Enterprise-grade - garantir que chave SSH seja sempre removida, mesmo em caso de erro
          # Segurança crítica: chave privada não pode permanecer no disco
          trap 'rm -f "$SSH_KEY_FILE"' EXIT ERR
          
          echo "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          
          # Ler arquivo de status via SSH
          # REGRA 6: Enterprise-grade - fallback deve usar mesmo formato do arquivo (newline-separated)
          # O arquivo /tmp/updates_status.txt usa formato newline-separated (linhas 73-74, 81-82)
          # Fallback deve usar mesmo formato para que o parsing funcione corretamente
          STATUS_CONTENT=$(ssh -i "$SSH_KEY_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${{ secrets.HETZNER_VM_HOST }} "cat /tmp/updates_status.txt 2>/dev/null || echo -e 'HAS_UPDATES=false\nUPDATES_COUNT=0'")
          
          # Parsear valores
          if echo "$STATUS_CONTENT" | grep -q "HAS_UPDATES=true"; then
            HAS_UPDATES="true"
            UPDATES_COUNT=$(echo "$STATUS_CONTENT" | grep "UPDATES_COUNT=" | cut -d'=' -f2 | head -1 || echo "0")
          else
            HAS_UPDATES="false"
            UPDATES_COUNT="0"
          fi
          
          echo "has_updates=$HAS_UPDATES" >> $GITHUB_OUTPUT
          echo "updates_count=$UPDATES_COUNT" >> $GITHUB_OUTPUT
          
          echo "✅ Outputs definidos: has_updates=$HAS_UPDATES, updates_count=$UPDATES_COUNT"

  # ===========================================================================
  # Job 2: Criar Issue com Resumo (se houver atualizações)
  # ===========================================================================
  create-issue:
    name: Criar Issue com Resumo
    needs: check-updates
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em problemas de rede
    timeout-minutes: 5
    # REGRA 6: Enterprise-grade - criar issue apenas se houver atualizações
    # REGRA 5: NÃO MENTIR - só criar issue se realmente houver atualizações disponíveis
    if: needs.check-updates.result == 'success' && needs.check-updates.outputs.has_updates == 'true'
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security (Regra 11)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # REGRA 6: Enterprise-grade - buscar lista de pacotes via SSH
      # SHA: appleboy/ssh-action@v1.2.0 (2024-09-16) - Supply Chain Security (Regra 11)
      # REGRA 6: Enterprise-grade - salvar lista em arquivo para leitura posterior
      - name: Buscar lista de pacotes para atualização
        id: fetch-packages
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            # Atualizar lista e buscar pacotes
            apt update -qq > /dev/null 2>&1
            apt list --upgradable 2>/dev/null | grep -v "Listing..." | head -50 > /tmp/upgradable_packages_list.txt || echo "" > /tmp/upgradable_packages_list.txt
            cat /tmp/upgradable_packages_list.txt

      # REGRA 4: Aprovação obrigatória - criar issue para revisão manual
      # SHA: actions/github-script@v7.0.1 (2024-11-18) - Supply Chain Security (Regra 11)
      # REGRA 6: Enterprise-grade - passar secrets como variáveis de ambiente para o script
      - name: Criar issue com resumo de atualizações
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          HETZNER_VM_HOST: ${{ secrets.HETZNER_VM_HOST }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'system-updates'
            });
            
            // Verificar se já existe issue aberta
            const existingIssue = issues.find(issue => 
              issue.title.includes('Atualização de Pacotes do Sistema') &&
              issue.created_at > new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString()
            );
            
            if (existingIssue) {
              console.log(`Issue já existe: #${existingIssue.number}`);
              return;
            }
            
            // Extrair informações dos outputs do job anterior
            const updatesCount = '${{ needs.check-updates.outputs.updates_count }}';
            
            // REGRA 6: Enterprise-grade - ler lista de pacotes via SSH
            // Como appleboy/ssh-action não exporta stdout, vamos ler o arquivo diretamente via SSH
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            
            let packagesList = 'Nenhum pacote listado';
            let sshKeyFile = null;
            try {
              // REGRA 6: Enterprise-grade - ler arquivo de pacotes via SSH
              sshKeyFile = path.join(process.env.RUNNER_TEMP || '/tmp', 'ssh_key_' + crypto.randomBytes(8).toString('hex'));
              const sshKey = process.env.HETZNER_SSH_PRIVATE_KEY || '';
              const sshHost = process.env.HETZNER_VM_HOST || '';
              
              if (!sshKey || !sshHost) {
                throw new Error('HETZNER_SSH_PRIVATE_KEY ou HETZNER_VM_HOST não configurados');
              }
              
              fs.writeFileSync(sshKeyFile, sshKey, { mode: 0o600 });
              
              const packagesContent = execSync(
                `ssh -i "${sshKeyFile}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${sshHost} "cat /tmp/upgradable_packages_list.txt 2>/dev/null || echo ''"`,
                { encoding: 'utf-8', maxBuffer: 10 * 1024 * 1024 }
              );
              
              packagesList = packagesContent
                .split('\n')
                .filter(line => line.trim() && !line.includes('Listing') && line.length > 0)
                .slice(0, 50)
                .join('\n') || 'Nenhum pacote listado';
            } catch (error) {
              console.warn('Erro ao ler lista de pacotes:', error.message);
              packagesList = 'Erro ao buscar lista de pacotes. Verifique manualmente via SSH: `ssh alice-hetzner` e execute `apt list --upgradable`.';
            } finally {
              // REGRA 6: Enterprise-grade - garantir que chave SSH seja sempre removida, mesmo em caso de erro
              // Segurança crítica: chave privada não pode permanecer no disco
              if (sshKeyFile && fs.existsSync(sshKeyFile)) {
                try {
                  fs.unlinkSync(sshKeyFile);
                } catch (unlinkError) {
                  console.warn('Erro ao remover arquivo de chave SSH:', unlinkError.message);
                }
              }
            }
            
            const issueBody = `## 📦 Atualização de Pacotes do Sistema - Hetzner
            
            Este issue foi criado automaticamente pelo workflow de atualização de pacotes do sistema.
            
            ### 📊 Resumo das Atualizações
            
            - **Total de pacotes:** ${updatesCount}
            - **Data da verificação:** ${new Date().toISOString()}
            
            ### 📦 Pacotes que serão atualizados
            
            \`\`\`
            ${packagesList || 'Nenhum pacote listado'}
            \`\`\`
            
            ### ⚠️ Ação Necessária
            
            **REGRAS:**
            - ✅ Backup completo antes de atualizar (Regra 6)
            - ✅ Atualizar em janela de manutenção (Regra 4)
            - ✅ Health checks após atualização (Regra 16)
            
            ### 📋 Próximos Passos
            
            1. **Revisar atualizações disponíveis**
               - Conectar ao servidor: \`ssh alice-hetzner\`
               - Verificar: \`apt list --upgradable\`
            
            2. **Fazer backup completo**
               - Backup PostgreSQL: \`docker compose exec postgres pg_dumpall > backup.sql\`
               - Backup volumes: \`docker compose down\` + backup de \`/opt/alice\`
            
            3. **Atualizar pacotes**
               - \`apt update && apt upgrade -y\`
               - Verificar serviços: \`systemctl status docker\`
            
            4. **Health checks**
               - Verificar containers: \`docker ps\`
               - Verificar logs: \`docker compose logs --tail=100\`
               - Testar endpoints: \`curl https://yesyoudeserve.duckdns.org/api/health\`
            
            5. **Fechar este issue após conclusão**
            
            ---
            *Issue criada automaticamente em ${new Date().toISOString()}*
            `;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📦 Atualização de Pacotes do Sistema - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['system-updates', 'maintenance']
            });
            
            console.log(`Issue criada: #${issue.data.number}`);

  # ===========================================================================
  # Job 3: Atualizar Pacotes (apenas se auto_update=true)
  # ===========================================================================
  update-packages:
    name: Atualizar Pacotes do Sistema
    needs: check-updates
    # REGRA 6: Enterprise-grade - atualizar apenas se houver atualizações disponíveis
    if: |
      github.event.inputs.auto_update == 'true' &&
      needs.check-updates.result == 'success' &&
      needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    # CRÍTICO: timeout para evitar jobs stuck em atualizações lentas
    timeout-minutes: 30
    
    steps:
      # SHA: actions/checkout@v4.2.2 (2024-10-23) - Supply Chain Security (Regra 11)
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # REGRA 6: Enterprise-grade - backup antes de atualizar
      # SHA: appleboy/ssh-action@v1.2.0 (2024-09-16) - Supply Chain Security (Regra 11)
      - name: Backup antes de atualizar
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            echo "💾 Criando backup antes de atualizar..."
            
            BACKUP_DIR="/opt/alice/backups/system-update-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            
            # Backup de configurações importantes
            cp -r /etc/apt/sources.list* "$BACKUP_DIR/" 2>/dev/null || true
            cp -r /etc/docker "$BACKUP_DIR/" 2>/dev/null || true
            
            # Backup de status dos containers
            docker ps -a > "$BACKUP_DIR/containers_before.txt" 2>/dev/null || true
            docker images > "$BACKUP_DIR/images_before.txt" 2>/dev/null || true
            
            echo "✅ Backup criado em: $BACKUP_DIR"

      # REGRA 6: Enterprise-grade - atualizar pacotes
      # SHA: appleboy/ssh-action@v1.2.0 (2024-09-16) - Supply Chain Security (Regra 11)
      - name: Atualizar pacotes do sistema
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            echo "📦 Atualizando pacotes do sistema..."
            
            # Atualizar lista de pacotes
            apt update -y
            
            # Atualizar pacotes (sem atualizar kernel automaticamente - requer reboot)
            DEBIAN_FRONTEND=noninteractive apt upgrade -y -o Dpkg::Options::="--force-confold"
            
            # Limpar pacotes órfãos
            apt autoremove -y
            apt autoclean
            
            echo "✅ Pacotes atualizados com sucesso"

      # REGRA 16: Health checks após atualização
      # SHA: appleboy/ssh-action@v1.2.0 (2024-09-16) - Supply Chain Security (Regra 11)
      - name: Health checks após atualização
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            echo "🏥 Executando health checks..."
            
            # Verificar Docker
            if ! systemctl is-active --quiet docker; then
              echo "❌ Docker não está rodando!"
              systemctl status docker
              exit 1
            fi
            echo "✅ Docker está rodando"
            
            # Verificar containers
            CONTAINERS_RUNNING=$(docker ps -q | wc -l)
            echo "📦 Containers rodando: $CONTAINERS_RUNNING"
            
            # Verificar se containers críticos estão rodando
            if ! docker ps --format '{{.Names}}' | grep -q "alice-postgres"; then
              echo "⚠️ AVISO: Container alice-postgres não está rodando"
            fi
            
            # Verificar espaço em disco
            DISK_USAGE=$(df -h / | tail -1 | awk '{print $5}' | sed 's/%//')
            if [ "$DISK_USAGE" -gt 90 ]; then
              echo "⚠️ AVISO: Uso de disco acima de 90%: ${DISK_USAGE}%"
            else
              echo "✅ Uso de disco: ${DISK_USAGE}%"
            fi
            
            echo "✅ Health checks concluídos"

